<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>統計検定1級 必勝暗記 V4.1 (完全版)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
    <style>
        .card-flip {
            perspective: 1000px;
        }

        .card-inner {
            transition: transform 0.4s;
            transform-style: preserve-3d;
            cursor: pointer;
        }

        .card-inner.is-flipped {
            transform: rotateY(180deg);
        }

        .card-front,
        .card-back {
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            border-radius: 1.5rem;
        }

        .card-back {
            transform: rotateY(180deg);
        }

        .math-tight .katex-display {
            margin: 0.3em 0;
        }

        .tap-highlight-none {
            -webkit-tap-highlight-color: transparent;
        }

        @keyframes pop {
            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.02);
            }

            100% {
                transform: scale(1);
            }
        }

        .animate-pop {
            animation: pop 0.3s ease-out;
        }

        .modal-overlay {
            background-color: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(4px);
        }

        /* Custom Scrollbar */
        .custom-scroll::-webkit-scrollbar {
            width: 6px;
        }

        .custom-scroll::-webkit-scrollbar-track {
            background: #f1f5f9;
        }

        .custom-scroll::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }

        .custom-scroll::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
    </style>
</head>

<body class="bg-slate-50 text-slate-800 min-h-screen font-sans selection:bg-indigo-100 selection:text-indigo-900">

    <div class="max-w-xl mx-auto px-4 py-6">
        <!-- Progress Header -->
        <header
            class="bg-white rounded-3xl shadow-sm p-6 mb-6 text-center border border-slate-100 relative overflow-hidden">
            <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-indigo-500 via-purple-500 to-pink-500">
            </div>
            <h1 class="text-xl font-black text-slate-800 mb-1 tracking-tight">統計検定1級 究極暗記マスター</h1>
            <p class="text-[10px] text-slate-400 font-bold uppercase tracking-widest mb-4">Complete Edition V4.1</p>

            <div class="flex flex-col items-center">
                <div class="text-4xl font-mono font-black text-indigo-600 tracking-tighter" id="progress-ratio">0 / 0
                </div>
                <div class="text-[9px] text-slate-400 font-bold uppercase tracking-widest mt-1">Mastered / Total in
                    Scope</div>
                <div class="w-full bg-slate-100 h-3 rounded-full mt-4 overflow-hidden ring-1 ring-slate-200">
                    <div id="progress-bar"
                        class="bg-gradient-to-r from-indigo-500 to-purple-600 h-full transition-all duration-700 ease-out"
                        style="width: 0%"></div>
                </div>
            </div>
        </header>

        <!-- Category Selector -->
        <section class="bg-white rounded-3xl shadow-sm p-5 mb-6 border border-slate-100">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-[10px] font-bold text-slate-400 uppercase tracking-widest flex items-center">
                    <span class="w-2 h-2 bg-indigo-500 rounded-full mr-2"></span>Target Scope
                </h2>
                <div class="flex gap-2">
                    <button onclick="toggleListView()"
                        class="text-[10px] text-indigo-600 font-bold px-3 py-1.5 rounded-full bg-indigo-50 hover:bg-indigo-100 transition-colors">全リスト表示</button>
                    <button onclick="resetAll()"
                        class="text-[10px] text-rose-500 font-bold px-3 py-1.5 rounded-full bg-rose-50 hover:bg-rose-100 transition-colors">リセット</button>
                </div>
            </div>
            <div id="category-filters" class="grid grid-cols-2 sm:grid-cols-3 gap-2">
                <!-- JS Generated -->
            </div>
        </section>

        <!-- Flashcard Area -->
        <div id="deck-container" class="relative z-10">
            <div id="card-area" class="card-flip w-full h-[580px] mb-8 tap-highlight-none">
                <div id="flashcard"
                    class="card-inner relative w-full h-full shadow-2xl bg-white rounded-[2rem] border border-slate-200/60 group">
                    <!-- Front -->
                    <div
                        class="card-front absolute inset-0 p-8 flex flex-col items-center justify-center text-center bg-white rounded-[2rem]">
                        <span id="card-category"
                            class="absolute top-6 left-6 text-[10px] font-black px-3 py-1 bg-slate-100 text-slate-500 rounded-full uppercase tracking-tighter">CATEGORY</span>
                        <div class="flex-1 flex items-center justify-center w-full">
                            <div id="card-question"
                                class="text-2xl font-bold leading-relaxed text-slate-800 break-words w-full">
                                読み込み中...
                            </div>
                        </div>
                        <p
                            class="absolute bottom-8 text-[10px] text-slate-300 font-bold tracking-[0.2em] uppercase animate-pulse">
                            Tap to Flip</p>
                    </div>
                    <!-- Back -->
                    <div
                        class="card-back absolute inset-0 p-6 flex flex-col items-center justify-start text-center bg-gradient-to-br from-indigo-50 to-white rounded-[2rem] overflow-hidden">
                        <div
                            class="w-full h-full overflow-y-auto custom-scroll pr-1 flex flex-col items-center pt-8 pb-16">
                            <div id="card-answer"
                                class="text-lg leading-relaxed text-indigo-900 w-full math-tight text-left px-2 mb-8">
                                ANSWER
                            </div>
                            <button id="exp-btn"
                                class="w-full bg-white border border-indigo-100 text-indigo-600 text-xs font-bold px-6 py-4 rounded-xl shadow-sm hover:shadow-md hover:border-indigo-300 transition-all flex items-center justify-center gap-2 group">
                                <span>📚 解説と覚え方を見る</span>
                                <span class="group-hover:translate-x-1 transition-transform">→</span>
                            </button>
                        </div>
                        <p class="absolute bottom-4 text-[9px] text-indigo-200 font-bold tracking-widest uppercase">Tap
                            to return</p>
                    </div>
                </div>
            </div>

            <!-- Complete State -->
            <div id="complete-view"
                class="hidden w-full h-[500px] bg-white rounded-[2rem] shadow-xl flex flex-col items-center justify-center text-center p-8 border-4 border-dashed border-indigo-100">
                <div class="text-7xl mb-6">🎉</div>
                <h2 class="text-3xl font-black text-slate-800 mb-2">コンプリート！</h2>
                <p class="text-sm text-slate-500 mb-8 font-medium">選択した範囲の公式をすべて習得しました。</p>
                <button onclick="resetCurrentScope()"
                    class="bg-indigo-600 text-white px-10 py-4 rounded-full font-bold shadow-lg shadow-indigo-200 hover:bg-indigo-700 hover:scale-105 active:scale-95 transition-all">
                    この範囲を復習する
                </button>
            </div>
        </div>

        <!-- Decision Buttons -->
        <div id="action-buttons" class="grid grid-cols-2 gap-4 max-w-lg mx-auto">
            <button id="wrong-btn"
                class="bg-white border-2 border-slate-200 text-slate-500 py-5 rounded-2xl font-black shadow-sm active:scale-95 transition-all hover:bg-slate-50 hover:border-slate-300 flex flex-col items-center justify-center gap-1">
                <span class="text-lg">✕</span>
                <span class="text-[10px] uppercase tracking-wider">Review Later</span>
            </button>
            <button id="correct-btn"
                class="bg-indigo-600 text-white py-5 rounded-2xl font-black shadow-xl shadow-indigo-200 active:scale-95 transition-all hover:bg-indigo-700 flex flex-col items-center justify-center gap-1">
                <span class="text-lg">◯</span>
                <span class="text-[10px] uppercase tracking-wider opacity-80">Mastered</span>
            </button>
        </div>
    </div>

    <!-- Explanation Modal -->
    <div id="exp-modal" class="fixed inset-0 z-[100] hidden modal-overlay flex items-center justify-center p-4">
        <div
            class="bg-white w-full max-w-xl max-h-[85vh] rounded-[2rem] shadow-2xl flex flex-col relative overflow-hidden ring-1 ring-black/5">
            <div class="p-6 border-b border-slate-100 bg-white sticky top-0 z-10 flex justify-between items-center">
                <h3 class="text-lg font-black text-slate-800 flex items-center gap-2">
                    <span class="text-indigo-500">⚡</span>数式の徹底解剖
                </h3>
                <button onclick="closeExpModal()"
                    class="w-8 h-8 rounded-full bg-slate-100 text-slate-500 flex items-center justify-center hover:bg-slate-200 transition-colors font-bold">&times;</button>
            </div>
            <div id="exp-content" class="flex-1 overflow-y-auto p-6 space-y-6 custom-scroll bg-slate-50/50">
                <!-- JS Injected -->
            </div>
            <div class="p-4 bg-white border-t border-slate-100 sticky bottom-0 z-10">
                <button onclick="closeExpModal()"
                    class="w-full bg-indigo-600 text-white py-4 rounded-xl font-bold active:scale-[0.98] transition-transform shadow-lg shadow-indigo-100">
                    理解した！
                </button>
            </div>
        </div>
    </div>

    <!-- List View Modal -->
    <div id="list-view-modal" class="fixed inset-0 z-[100] hidden modal-overlay flex items-center justify-center p-4">
        <div
            class="bg-white w-full max-w-3xl h-[90vh] rounded-[2rem] shadow-2xl flex flex-col overflow-hidden relative">
            <header class="p-6 border-b border-slate-100 bg-white flex justify-between items-center sticky top-0 z-10">
                <div>
                    <h2 class="font-black text-xl text-slate-800">全暗記項目リスト</h2>
                    <p class="text-[10px] text-slate-400 font-bold mt-1">COMPLETE LIST</p>
                </div>
                <button onclick="toggleListView()"
                    class="w-10 h-10 rounded-full bg-slate-100 text-slate-500 flex items-center justify-center hover:bg-slate-200 transition-colors text-xl font-bold">&times;</button>
            </header>
            <div id="list-content" class="flex-1 overflow-y-auto p-6 space-y-4 bg-slate-50 custom-scroll"></div>
        </div>
    </div>

    <script>
        // --- 究極の暗記データセット (画像内容完全網羅 + 詳細解説) ---
        let masterData = [];
        let learnedIds = new Set();
        let currentDeck = [];
        let currentIndex = 0;
        let selectedCategories = new Set();

        const cardElement = document.getElementById('flashcard');
        const cardArea = document.getElementById('card-area');
        const completeView = document.getElementById('complete-view');
        const actionButtons = document.getElementById('action-buttons');
        const progressRatio = document.getElementById('progress-ratio');
        const progressBar = document.getElementById('progress-bar');
        const listModal = document.getElementById('list-view-modal');
        const listContent = document.getElementById('list-content');
        const expModal = document.getElementById('exp-modal');
        const expContent = document.getElementById('exp-content');

        async function init() {
            try {
                const response = await fetch('data.json');
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                masterData = await response.json();

                // Initialize selectedCategories only after data is loaded
                selectedCategories = new Set(masterData.map(d => d.cat));

                const container = document.getElementById('category-filters');
                const cats = [...new Set(masterData.map(d => d.cat))].sort((a, b) => {
                    const getNum = s => parseInt(s.match(/^\d+/)?.[0] || 99);
                    return getNum(a) - getNum(b);
                });

                container.innerHTML = '';
                cats.forEach(cat => {
                    const label = document.createElement('label');
                    label.className = "flex items-center space-x-2 text-[10px] bg-slate-50 border border-slate-100 p-2 rounded-lg cursor-pointer shadow-sm hover:bg-white active:bg-slate-100 transition-all select-none";

                    const cb = document.createElement('input');
                    cb.type = 'checkbox';
                    cb.checked = true;
                    cb.className = "w-3 h-3 rounded text-indigo-600 focus:ring-indigo-500 border-gray-300";
                    cb.onchange = (e) => {
                        if (e.target.checked) selectedCategories.add(cat);
                        else selectedCategories.delete(cat);
                        refreshDeck();
                    };

                    const span = document.createElement('span');
                    span.textContent = cat;
                    span.className = "font-bold text-slate-600 truncate";

                    label.appendChild(cb);
                    label.appendChild(span);
                    container.appendChild(label);
                });
                refreshDeck();
            } catch (error) {
                console.error("Failed to load data:", error);
                document.getElementById('card-area').innerHTML = `<p class="text-red-500 p-4">データの読み込みに失敗しました。<br>${error.message}</p>`;
            }
        }

        function refreshDeck() {
            const inScope = masterData.filter(d => selectedCategories.has(d.cat));
            currentDeck = inScope.filter(d => !learnedIds.has(d.id));

            const n = inScope.length;
            const m = n - currentDeck.length;

            progressRatio.textContent = `${m} / ${n}`;
            progressBar.style.width = n > 0 ? `${(m / n) * 100}%` : '0%';

            if (currentDeck.length > 0 && (currentIndex >= currentDeck.length || currentIndex < 0)) {
                currentIndex = 0;
                currentDeck.sort(() => Math.random() - 0.5);
            }

            displayCard();
        }

        function displayCard() {
            if (currentDeck.length === 0) {
                cardArea.classList.add('hidden');
                completeView.classList.remove('hidden');
                actionButtons.classList.add('opacity-20', 'pointer-events-none');
                return;
            }
            cardArea.classList.remove('hidden');
            completeView.classList.add('hidden');
            actionButtons.classList.remove('opacity-20', 'pointer-events-none');

            // Reset flip state
            document.getElementById('flashcard').classList.remove('is-flipped');

            const item = currentDeck[currentIndex];

            // Update content
            setTimeout(() => {
                document.getElementById('card-category').textContent = item.cat;
                document.getElementById('card-question').innerHTML = item.q.replace(/\n/g, '<br>');
                document.getElementById('card-answer').innerHTML = item.a.replace(/\n/g, '<br>');
                renderMath();
            }, 100);
        }

        function showExplanation(e) {
            e.stopPropagation();
            const item = currentDeck[currentIndex];
            expContent.innerHTML = `
                <div class="mb-6 p-5 bg-gradient-to-br from-indigo-50 to-white border border-indigo-100 rounded-2xl text-indigo-900 shadow-sm">
                    <div class="text-[10px] font-black text-indigo-400 uppercase tracking-widest mb-3 flex items-center">
                        <span class="w-1.5 h-1.5 bg-indigo-500 rounded-full mr-2 animate-pulse"></span>Target Formula
                    </div>
                    <div class="math-tight overflow-x-auto text-lg py-2">${item.a.replace(/\n/g, '<br>')}</div>
                </div>
                
                <div class="space-y-6">
                    <div class="bg-amber-50 p-5 rounded-2xl border border-amber-100 shadow-sm relative overflow-hidden group hover:shadow-md transition-shadow">
                        <div class="absolute -right-4 -top-4 opacity-10 text-6xl group-hover:scale-110 transition-transform">💡</div>
                        <div class="text-amber-800 font-bold text-xs mb-2 flex items-center tracking-wider uppercase">
                            覚え方・ショートカット
                        </div>
                        <div class="text-amber-900 font-black text-base leading-relaxed pl-1 border-l-4 border-amber-300">
                            「${item.mnem}」
                        </div>
                    </div>
                    
                    <div class="bg-white p-5 rounded-2xl border border-slate-100 shadow-sm leading-relaxed text-slate-700">
                        <div class="text-indigo-600 font-bold text-xs mb-4 tracking-wider uppercase border-b border-indigo-50 pb-2 flex items-center">
                            <span class="mr-2">📖</span>詳細解説（読み・意味・深掘り）
                        </div>
                        <div class="prose prose-sm prose-slate max-w-none">
                            ${item.exp.replace(/\n/g, '<br>')}
                        </div>
                    </div>
                </div>
            `;
            expModal.classList.remove('hidden');
            renderMath();
        }

        function closeExpModal() { expModal.classList.add('hidden'); }

        function toggleListView() {
            const modal = document.getElementById('list-view-modal');
            if (modal.classList.contains('hidden')) {
                renderListView();
                modal.classList.remove('hidden');
            } else {
                modal.classList.add('hidden');
            }
        }

        function renderListView() {
            const inScope = masterData.filter(d => selectedCategories.has(d.cat));
            const listContainer = document.getElementById('list-content');

            if (inScope.length === 0) {
                listContainer.innerHTML = '<div class="text-center text-slate-400 py-10 font-bold">カテゴリを選択してください</div>';
                return;
            }

            listContainer.innerHTML = inScope.map(item => `
                <div class="bg-white p-6 rounded-[1.5rem] shadow-sm border border-slate-100 relative overflow-hidden group hover:border-indigo-100 transition-colors">
                    <span class="absolute top-5 right-5 text-[9px] font-black px-2 py-1 bg-slate-100 text-slate-500 rounded-full uppercase tracking-tighter group-hover:bg-indigo-50 group-hover:text-indigo-500 transition-colors">${item.cat}</span>
                    
                    <h3 class="font-black text-slate-800 mb-4 pr-20 text-lg">${item.q.replace(/\n/g, '<br>')}</h3>
                    
                    <div class="p-5 bg-indigo-50/50 text-indigo-900 rounded-2xl math-tight mb-5 border border-indigo-50 overflow-x-auto">
                        ${item.a.replace(/\n/g, '<br>')}
                    </div>
                    
                    <div class="grid md:grid-cols-3 gap-4">
                        <div class="md:col-span-1 bg-amber-50 p-4 rounded-xl border border-amber-100 text-xs text-amber-900 font-bold flex items-center">
                            <div><span class="block text-[9px] text-amber-600 uppercase mb-1">Mnemonic</span>${item.mnem}</div>
                        </div>
                        <div class="md:col-span-2 text-xs text-slate-500 leading-relaxed bg-white p-4 rounded-xl border border-slate-100">
                            <div class="font-bold text-indigo-400 text-[9px] mb-2 border-b border-indigo-50 pb-1">ANALYSIS</div>
                            ${item.exp.replace(/\n/g, '<br>')}
                        </div>
                    </div>
                </div>
            `).join('');
            renderMath();
        }

        function renderMath() {
            renderMathInElement(document.body, {
                delimiters: [{ left: '$$', right: '$$', display: true }, { left: '$', right: '$', display: false }],
                throwOnError: false
            });
        }

        function handleCorrect() {
            if (currentDeck.length === 0) return;
            learnedIds.add(currentDeck[currentIndex].id);
            cardArea.classList.add('animate-pop');
            setTimeout(() => cardArea.classList.remove('animate-pop'), 300);
            refreshDeck();
        }

        function handleWrong() {
            if (currentDeck.length === 0) return;
            // シャッフルして後回し
            currentDeck.sort(() => Math.random() - 0.5);
            // currentIndexは0のまま（シャッフルされた新しい先頭を表示）
            displayCard();
        }

        function resetAll() {
            if (confirm("学習履歴をリセットしますか？")) {
                learnedIds.clear();
                refreshDeck();
            }
        }

        function resetCurrentScope() {
            const inScope = masterData.filter(d => selectedCategories.has(d.cat));
            inScope.forEach(d => learnedIds.delete(d.id));
            refreshDeck();
        }

        // --- Event Listeners ---
        document.getElementById('flashcard').onclick = (e) => {
            // モーダルが開いているときはフリップしない
            if (!document.getElementById('exp-modal').classList.contains('hidden')) return;
            document.getElementById('flashcard').classList.toggle('is-flipped');
        };
        document.getElementById('exp-btn').onclick = showExplanation;
        document.getElementById('correct-btn').onclick = (e) => { e.stopPropagation(); handleCorrect(); };
        document.getElementById('wrong-btn').onclick = (e) => { e.stopPropagation(); handleWrong(); };

        // Start
        window.onload = init;
    </script>
</body>

</html>
