<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ギター指板：全キー対応・縦ペンタ vs 横ペンタ</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel (for JSX) -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            touch-action: manipulation;
            overscroll-behavior: none;
            background-color: #f3f4f6;
        }
        .fretboard-bg {
            background-color: #d4a373; /* メイプル風単色 */
        }
        /* 弦の影をつけて立体感を出す */
        .string-line {
            box-shadow: 0 1px 2px rgba(0,0,0,0.4);
        }
        @keyframes pop-in {
            0% { transform: scale(0); opacity: 0; }
            70% { transform: scale(1.2); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }
        .animate-pop-in { animation: pop-in 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        .animate-shake { animation: shake 0.3s ease-in-out; }
        .animate-fade-in { animation: pop-in 0.5s ease-out forwards; }
        
        /* カスタムスクロールバー（横スクロール用） */
        .scrollbar-hide::-webkit-scrollbar {
            display: none;
        }
        .scrollbar-hide {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo, useEffect, useCallback, useRef } = React;

        // --- Constants & Data ---

        const KEYS = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];

        // 6弦上のルート位置（0〜11フレット）E=0
        const ROOT_FRETS_ON_6 = {
            'E': 0, 'F': 1, 'F#': 2, 'G': 3, 'G#': 4, 
            'A': 5, 'A#': 6, 'B': 7, 
            'C': 8, 'C#': 9, 'D': 10, 'D#': 11
        };

        // 各弦の開放弦における、6弦(E)からの半音差オフセット
        const STRING_OFFSETS = { 6: 0, 5: 5, 4: 10, 3: 15, 2: 19, 1: 24 };

        // パターン定義
        const PATTERN_DEFS = {
            vertical1: {
                name: 'Box 1',
                group: 'vertical',
                description: '【基本】最も有名なポジション。6弦・1弦にルートがあります。',
                notes: [
                    { s: 6, off: 0, degree: 'R', type: 'root' }, { s: 6, off: 3, degree: 'b3' },
                    { s: 5, off: 0, degree: '4' }, { s: 5, off: 2, degree: '5' },
                    { s: 4, off: 0, degree: 'b7' }, { s: 4, off: 2, degree: 'R', type: 'root' },
                    { s: 3, off: 0, degree: 'b3' }, { s: 3, off: 2, degree: '4' },
                    { s: 2, off: 0, degree: '5' }, { s: 2, off: 3, degree: 'b7' },
                    { s: 1, off: 0, degree: 'R', type: 'root' }, { s: 1, off: 3, degree: 'b3' },
                ]
            },
            vertical2: {
                name: 'Box 2',
                group: 'vertical',
                description: '【メジャー型】Box 1の右隣。4弦にルートがあり、メジャーペンタの基本形としても有名。',
                notes: [
                    { s: 6, off: 3, degree: 'b3' }, { s: 6, off: 5, degree: '4' },
                    { s: 5, off: 2, degree: '5' }, { s: 5, off: 5, degree: 'b7' },
                    { s: 4, off: 2, degree: 'R', type: 'root' }, { s: 4, off: 5, degree: 'b3' },
                    { s: 3, off: 2, degree: '4' }, { s: 3, off: 4, degree: '5' },
                    { s: 2, off: 3, degree: 'b7' }, { s: 2, off: 5, degree: 'R', type: 'root' },
                    { s: 1, off: 3, degree: 'b3' }, { s: 1, off: 5, degree: '4' },
                ]
            },
            vertical3: {
                name: 'Box 3',
                group: 'vertical',
                description: '【中間】5弦と2弦にルートがあります。少しストレッチする箇所があります。',
                notes: [
                    { s: 6, off: 5, degree: '4' }, { s: 6, off: 7, degree: '5' },
                    { s: 5, off: 5, degree: 'b7' }, { s: 5, off: 7, degree: 'R', type: 'root' },
                    { s: 4, off: 5, degree: 'b3' }, { s: 4, off: 7, degree: '4' },
                    { s: 3, off: 4, degree: '5' }, { s: 3, off: 7, degree: 'b7' },
                    { s: 2, off: 5, degree: 'R', type: 'root' }, { s: 2, off: 8, degree: 'b3' },
                    { s: 1, off: 5, degree: '4' }, { s: 1, off: 7, degree: '5' },
                ]
            },
            vertical4: {
                name: 'Box 4',
                group: 'vertical',
                description: '【高音域への入り口】Box 3の右隣。5弦と3弦にルートがあります。',
                notes: [
                    { s: 6, off: 7, degree: '5' }, { s: 6, off: 10, degree: 'b7' },
                    { s: 5, off: 7, degree: 'R', type: 'root' }, { s: 5, off: 10, degree: 'b3' },
                    { s: 4, off: 7, degree: '4' }, { s: 4, off: 9, degree: '5' },
                    { s: 3, off: 7, degree: 'b7' }, { s: 3, off: 9, degree: 'R', type: 'root' },
                    { s: 2, off: 8, degree: 'b3' }, { s: 2, off: 10, degree: '4' },
                    { s: 1, off: 7, degree: '5' }, { s: 1, off: 10, degree: 'b7' },
                ]
            },
            vertical5: {
                name: 'Box 5',
                group: 'vertical',
                description: '【Box 1の手前】Box 1の左隣にある形。6弦と3弦にルートがあります。',
                notes: [
                    { s: 6, off: -2, degree: 'b7' }, { s: 6, off: 0, degree: 'R', type: 'root' },
                    { s: 5, off: -2, degree: 'b3' }, { s: 5, off: 0, degree: '4' },
                    { s: 4, off: -3, degree: '5' }, { s: 4, off: 0, degree: 'b7' },
                    { s: 3, off: -3, degree: 'R', type: 'root' }, { s: 3, off: 0, degree: 'b3' },
                    { s: 2, off: -2, degree: '4' }, { s: 2, off: 0, degree: '5' },
                    { s: 1, off: -2, degree: 'b7' }, { s: 1, off: 0, degree: 'R', type: 'root' }
                ]
            },
            horizontal_root6: {
                name: '横ペンタ (6弦ルート)',
                group: 'horizontal',
                description: '【6弦発進】Box 5〜1〜2〜3を連結。低音からスムーズに上昇する定番パターン。',
                notes: [
                    { s: 6, off: -2, degree: 'b7' }, { s: 6, off: 0, degree: 'R', type: 'root' },
                    { s: 5, off: -2, degree: 'b3' }, { s: 5, off: 0, degree: '4' }, { s: 5, off: 2, degree: '5', technique: 'slide' },
                    { s: 4, off: 0, degree: 'b7' }, { s: 4, off: 2, degree: 'R', type: 'root' },
                    { s: 3, off: 0, degree: 'b3' }, { s: 3, off: 2, degree: '4' }, { s: 3, off: 4, degree: '5', technique: 'slide' },
                    { s: 2, off: 3, degree: 'b7' }, { s: 2, off: 5, degree: 'R', type: 'root' },
                    { s: 1, off: 3, degree: 'b3' }, { s: 1, off: 5, degree: '4' }, { s: 1, off: 7, degree: '5', technique: 'slide' },
                ]
            },
            horizontal_root5: {
                name: '横ペンタ (5弦ルート)',
                group: 'horizontal',
                description: '【5弦発進】Box 3から入り、高音域を一気に駆け上がるダイナミックなパターン。',
                notes: [
                    { s: 6, off: 5, degree: '4' }, { s: 6, off: 7, degree: '5' },
                    { s: 5, off: 5, degree: 'b7' }, { s: 5, off: 7, degree: 'R', type: 'root' },
                    { s: 4, off: 5, degree: 'b3' }, { s: 4, off: 7, degree: '4' }, { s: 4, off: 9, degree: '5', technique: 'slide' },
                    { s: 3, off: 7, degree: 'b7' }, { s: 3, off: 9, degree: 'R', type: 'root' },
                    { s: 2, off: 8, degree: 'b3' }, { s: 2, off: 10, degree: '4' }, { s: 2, off: 12, degree: '5', technique: 'slide' },
                    { s: 1, off: 10, degree: 'b7' }, { s: 1, off: 12, degree: 'R', type: 'root' },
                ]
            }
        };

        const getNoteName = (stringNum, fretNum) => {
            const stringOpenNotes = ['E', 'B', 'G', 'D', 'A', 'E']; // 1 to 6
            const openNote = stringOpenNotes[stringNum - 1];
            const chromatic = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
            const openIndex = chromatic.indexOf(openNote);
            return chromatic[(openIndex + fretNum) % 12];
        };

        // --- Components ---

        const FretboardUI = ({ 
            notes, 
            displayMode, // 'note' | 'degree'
            onFretClick,
            highlightShake
        }) => {
            const frets = Array.from({ length: 19 }, (_, i) => i);
            
            // ポジションマーク
            const isFretMarker = (fret) => [3, 5, 7, 9, 15, 17].includes(fret);
            const isDoubleMarker = (fret) => fret === 12;

            const getNoteAtPosition = (stringNum, fretNum) => {
                if (!notes) return null;
                return notes.find(n => n.s === stringNum && n.fret === fretNum);
            };

            const containerClass = `relative overflow-x-auto w-full max-w-5xl pb-10 px-2 transition-transform duration-300 ${highlightShake ? 'animate-shake' : ''}`;

            return (
                <div className={containerClass}>
                    {/* 指板全体を囲むコンテナ */}
                    <div className="bg-[#222222] p-2 pl-4 rounded-lg shadow-2xl relative select-none" style={{ minWidth: '980px', border: '4px solid #1a1a1a' }}>
                        
                        {/* 指板本体 */}
                        <div className="fretboard-bg relative rounded-md h-40 overflow-visible"> 
                            
                            {/* 背景レイヤー：フレット線、インレイ */}
                            <div className="absolute inset-0 flex z-0 pointer-events-none">
                                {frets.map(fret => (
                                    <div key={fret} 
                                         className={`${fret === 0 ? 'w-10 flex-none rounded-l-md' : 'flex-1'} ${fret === 18 ? 'rounded-r-md' : ''} flex items-center justify-center h-full relative`} 
                                         style={{ 
                                             backgroundColor: fret === 0 ? '#262626' : 'transparent',
                                             borderRight: fret === 0 ? '6px solid #e5e5e5' : '2px solid #b0b0b0',
                                             borderColor: fret === 0 ? '#e5e5e5' : '#b0b0b0',
                                             boxSizing: 'border-box'
                                         }}>
                                        {fret > 0 && (
                                            <div className="absolute inset-0 flex flex-col justify-center items-center opacity-80">
                                                {isFretMarker(fret) && (
                                                    <div className="w-4 h-4 rounded-full bg-[#8d6e63] shadow-inner"></div>
                                                )}
                                                {isDoubleMarker(fret) && (
                                                    <div className="flex flex-col gap-8">
                                                        <div className="w-4 h-4 rounded-full bg-[#8d6e63] shadow-inner"></div>
                                                        <div className="w-4 h-4 rounded-full bg-[#8d6e63] shadow-inner"></div>
                                                    </div>
                                                )}
                                            </div>
                                        )}
                                    </div>
                                ))}
                            </div>

                            {/* メインレイヤー：弦と音符 */}
                            <div className="absolute inset-0 flex flex-col justify-between py-1 z-10">
                                {[1, 2, 3, 4, 5, 6].map((stringNum) => (
                                    <div key={stringNum} className="flex-1 w-full relative flex items-center">
                                        
                                        {/* 弦 */}
                                        <div 
                                            className="absolute w-full bg-[#d1d1d1] string-line z-0" 
                                            style={{ 
                                                height: `${Math.max(2, stringNum * 0.8)}px`,
                                                boxShadow: '0 1px 1px rgba(0,0,0,0.3)'
                                            }} 
                                        />

                                        {/* 音符配置エリア */}
                                        <div className="relative w-full h-full flex z-10">
                                            {frets.map((fretNum) => {
                                                const note = getNoteAtPosition(stringNum, fretNum);
                                                return (
                                                    <div 
                                                        key={fretNum} 
                                                        className={`${fretNum === 0 ? 'w-10 flex-none' : 'flex-1'} h-full flex items-center justify-center cursor-pointer hover:bg-white/10 active:bg-white/20 transition-colors z-20`}
                                                        onClick={() => onFretClick && onFretClick(stringNum, fretNum)}
                                                    >
                                                        {note && note.isVisible && (
                                                            <div 
                                                                className={`
                                                                    relative z-30 w-6 h-6 rounded-full flex items-center justify-center text-[10px] font-bold shadow-lg animate-pop-in
                                                                    ${note.type === 'root' 
                                                                        ? 'bg-red-600/95 text-white ring-2 ring-red-300 shadow-[0_2px_5px_rgba(0,0,0,0.4)]' 
                                                                        : 'bg-blue-600/95 text-white shadow-[0_2px_5px_rgba(0,0,0,0.4)]'}
                                                                    ${note.technique === 'slide' ? 'ring-2 ring-yellow-400' : ''}
                                                                `}
                                                            >
                                                                {displayMode === 'degree' ? note.degree : getNoteName(stringNum, fretNum)}
                                                                {note.technique === 'slide' && (
                                                                    <span className="absolute -top-3 -right-3 bg-yellow-400 text-black text-[9px] px-1 rounded shadow">Slide</span>
                                                                )}
                                                            </div>
                                                        )}
                                                    </div>
                                                );
                                            })}
                                        </div>
                                    </div>
                                ))}
                            </div>

                        </div>

                        {/* Fret Numbers */}
                        <div className="flex pl-[8px] text-gray-400 text-xs font-mono mt-1">
                            {frets.map(fret => (
                                <div key={fret} className={`${fret === 0 ? 'w-10 flex-none' : 'flex-1'} text-center`}>
                                    {fret > 0 ? fret : ''}
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            );
        };


        // Main App Component
        const App = () => {
            const [appMode, setAppMode] = useState('viewer'); // 'viewer' | 'training'
            const [selectedKey, setSelectedKey] = useState('C'); // Default to C
            const [selectedScaleType, setSelectedScaleType] = useState('Major'); // Default to Major
            const [activePatternKey, setActivePatternKey] = useState('vertical1');
            const [displayMode, setDisplayMode] = useState('note');

            // Training State: Type 'block' added
            const [trainingConfig, setTrainingConfig] = useState({ key: 'C', scaleType: 'Major', type: 'vertical', level: 1 }); 
            const [trainingStatus, setTrainingStatus] = useState('idle');
            const [currentQuestion, setCurrentQuestion] = useState(null); 
            
            const [feedback, setFeedback] = useState(null);

            const patternQueue = useRef([]);

            // Helper: 平行調のマイナーキーを取得 (Major Key -> Relative Minor Key)
            const getRelativeMinorKey = (majorKey) => {
                const idx = KEYS.indexOf(majorKey);
                // メジャーキーの3半音下（-3 or +9）が平行調マイナー
                const minorIdx = (idx - 3 + 12) % 12;
                return KEYS[minorIdx];
            };

            // Helper: 度数変換 (Minor Degree -> Major Degree)
            const convertToMajorDegree = (minorDegree) => {
                const map = {
                    'R': '6',
                    'b3': 'R', // メジャーのRoot
                    '4': '2',
                    '5': '3',
                    'b7': '5'
                };
                return map[minorDegree] || minorDegree;
            };

            // Helper: パターンシフト (Box 1 -> Box 2 etc. for Major)
            const shiftPatternKeyForMajor = (patternKey) => {
                const verticalOrder = ['vertical1', 'vertical2', 'vertical3', 'vertical4', 'vertical5'];
                const idx = verticalOrder.indexOf(patternKey);
                if (idx !== -1) {
                    const newIdx = (idx + 1) % 5;
                    return verticalOrder[newIdx];
                }
                return patternKey;
            };

            // Helper: Generate Block Notes
            // Generates 4 notes forming a block based on string pair and start degree
            const generateBlockNotes = (key, scaleType, lowString, startDegree, rootFret) => {
                // 1. Define Degrees based on ScaleType
                const minorDegrees = ['R', 'b3', '4', '5', 'b7'];
                const majorDegrees = ['R', '2', '3', '5', '6'];
                const degrees = scaleType === 'Major' ? majorDegrees : minorDegrees;
                
                // 2. Find index of start degree
                const startIndex = degrees.indexOf(startDegree);
                if (startIndex === -1) return [];

                // 3. Get 4 consecutive degrees (cycling)
                const targetDegrees = [];
                for (let i = 0; i < 4; i++) {
                    targetDegrees.push(degrees[(startIndex + i) % degrees.length]);
                }

                // 4. Find frets for these degrees on LowString and HighString (LowString - 1)
                const highString = lowString - 1;
                const generatedNotes = [];
                
                // Helper to get degree of a fret on a string
                const getDegreeAt = (s, f) => {
                    const noteVal = (STRING_OFFSETS[s] + f) % 12;
                    const rootVal = (STRING_OFFSETS[6] + rootFret) % 12;
                    let semitones = (noteVal - rootVal + 12) % 12;
                    
                    // Map semitones to degrees (Minor base)
                    const semitoneToMinorDegree = {
                        0: 'R', 3: 'b3', 5: '4', 7: '5', 10: 'b7'
                    };
                    let deg = semitoneToMinorDegree[semitones];
                    
                    if (scaleType === 'Major') {
                        const minRelToMajDeg = {
                            3: 'R', 5: '2', 7: '3', 10: '5', 0: '6'
                        };
                        deg = minRelToMajDeg[semitones];
                    }
                    return deg;
                };

                // Search for the pattern
                for (let f = 0; f <= 15; f++) {
                    if (getDegreeAt(lowString, f) === targetDegrees[0]) {
                        let f2 = -1;
                        for (let k = 1; k <= 4; k++) { 
                            if (getDegreeAt(lowString, f + k) === targetDegrees[1]) {
                                f2 = f + k;
                                break;
                            }
                        }
                        
                        if (f2 !== -1) {
                            let f3 = -1;
                            for (let k = -1; k <= 4; k++) {
                                if (getDegreeAt(highString, f + k) === targetDegrees[2]) {
                                    f3 = f + k;
                                    break;
                                }
                            }
                            
                            if (f3 !== -1) {
                                let f4 = -1;
                                for (let k = 1; k <= 4; k++) {
                                    if (getDegreeAt(highString, f3 + k) === targetDegrees[3]) {
                                        f4 = f3 + k;
                                        break;
                                    }
                                }
                                
                                if (f4 !== -1) {
                                    generatedNotes.push(
                                        { s: lowString, fret: f, degree: targetDegrees[0], type: targetDegrees[0]==='R'?'root':'scale' },
                                        { s: lowString, fret: f2, degree: targetDegrees[1], type: targetDegrees[1]==='R'?'root':'scale' },
                                        { s: highString, fret: f3, degree: targetDegrees[2], type: targetDegrees[2]==='R'?'root':'scale' },
                                        { s: highString, fret: f4, degree: targetDegrees[3], type: targetDegrees[3]==='R'?'root':'scale' }
                                    );
                                    return generatedNotes;
                                }
                            }
                        }
                    }
                }
                return [];
            };

            // Note Calculation with robust shift logic
            const calculatePatternNotes = useCallback((key, scaleType, patternKey, specificBlockConfig = null) => {
                let calcKey = key;
                let calcPatternKey = patternKey;

                // Major Mode Logic
                if (scaleType === 'Major') {
                    calcKey = getRelativeMinorKey(key);
                    if (patternKey && patternKey.startsWith('vertical') && !specificBlockConfig) {
                         calcPatternKey = shiftPatternKeyForMajor(patternKey);
                    }
                }

                const rootFret = ROOT_FRETS_ON_6[calcKey];

                // Special handling for Block Quiz
                if (specificBlockConfig) {
                    const blockNotes = generateBlockNotes(key, scaleType, specificBlockConfig.lowString, specificBlockConfig.startDegree, rootFret);
                    return blockNotes.map((n, idx) => ({
                        ...n,
                        id: `block-${n.s}-${n.fret}-${idx}`,
                        isVisible: true 
                    }));
                }

                // Normal Pattern Logic
                const def = PATTERN_DEFS[calcPatternKey];
                
                let notes = def.notes.map((n, idx) => {
                    let degree = n.degree;
                    let type = n.type;

                    if (scaleType === 'Major') {
                        degree = convertToMajorDegree(n.degree);
                        type = (degree === 'R') ? 'root' : 'scale'; 
                    }

                    return { 
                        ...n, 
                        id: `${n.s}-${n.off}-${idx}`,
                        fret: n.off + rootFret,
                        degree,
                        type,
                        isVisible: true
                    };
                });
                
                const minFret = Math.min(...notes.map(n => n.fret));
                let shift = 0;
                
                if (minFret >= 12) {
                    shift = -12;
                } else if (minFret < 0) {
                    shift = 12;
                }
                
                notes = notes.map(n => ({ ...n, fret: n.fret + shift }));
                return notes.filter(n => n.fret >= 0 && n.fret <= 18);
            }, []);

            // Viewer Notes
            const viewerNotes = useMemo(() => 
                calculatePatternNotes(selectedKey, selectedScaleType, activePatternKey), 
                [selectedKey, selectedScaleType, activePatternKey, calculatePatternNotes]
            );

            // --- Training Logic ---

            const refillQueue = (type) => {
                let candidates = [];
                if (type === 'vertical') {
                    candidates = Object.keys(PATTERN_DEFS).filter(k => PATTERN_DEFS[k].group === 'vertical');
                } else if (type === 'horizontal') {
                    candidates = Object.keys(PATTERN_DEFS).filter(k => PATTERN_DEFS[k].group === 'horizontal');
                } else if (type === 'block') {
                    const lowStrings = [6, 5, 4, 3, 2];
                    const degrees = trainingConfig.scaleType === 'Major' 
                        ? ['R', '2', '3', '5', '6'] 
                        : ['R', 'b3', '4', '5', 'b7'];
                    
                    for (let s of lowStrings) {
                        for (let d of degrees) {
                            candidates.push({ lowString: s, startDegree: d, isBlock: true });
                        }
                    }
                }
                
                for (let i = candidates.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [candidates[i], candidates[j]] = [candidates[j], candidates[i]];
                }
                patternQueue.current = candidates;
            };

            const getNextTargetDegree = (notes, revealedSet) => {
                const hiddenNotes = notes.filter(n => !revealedSet.has(n.id));
                if (hiddenNotes.length === 0) return null; 
                const availableDegrees = [...new Set(hiddenNotes.map(n => n.degree))];
                const randomIndex = Math.floor(Math.random() * availableDegrees.length);
                return availableDegrees[randomIndex];
            };

            const startTraining = useCallback(() => {
                if (patternQueue.current.length === 0) {
                    refillQueue(trainingConfig.type);
                }
                
                const nextItem = patternQueue.current.pop();
                
                let notes = [];
                let patternName = "";
                let message = "";
                let initialRevealed = new Set();
                let initialTarget = 'R';

                if (nextItem.isBlock) {
                    // Block Quiz Setup
                    patternName = `Block (${nextItem.lowString}-${nextItem.lowString-1}弦)`;
                    notes = calculatePatternNotes(trainingConfig.key, trainingConfig.scaleType, null, nextItem);
                    
                    if (notes.length > 0) {
                        initialRevealed.add(notes[0].id);
                    }
                    
                    initialTarget = 'ANY_BLOCK'; 
                    message = `先頭は "${nextItem.startDegree}" だよ。残りのブロック音をなぞろう！`;

                } else {
                    // Normal Pattern Quiz Setup
                    const nextPatternKey = nextItem;
                    patternName = PATTERN_DEFS[nextPatternKey].name;
                    notes = calculatePatternNotes(trainingConfig.key, trainingConfig.scaleType, nextPatternKey);

                    if (trainingConfig.level === 1) {
                        message = "Root (R) をすべて探そう！";
                    } else if (trainingConfig.level === 2) {
                        initialTarget = 'ANY'; 
                        message = "スケールの形をすべてなぞって表示させよう。";
                    } else if (trainingConfig.level === 3) {
                        notes.forEach(n => {
                            if (n.type === 'root') initialRevealed.add(n.id);
                        });
                        initialTarget = getNextTargetDegree(notes, initialRevealed);
                        if (!initialTarget) initialTarget = 'R'; 
                        message = `度数 "${initialTarget}" を探そう！`;
                    }
                }

                setCurrentQuestion({
                    patternKey: nextItem.isBlock ? null : nextItem,
                    blockConfig: nextItem.isBlock ? nextItem : null,
                    patternName: patternName,
                    revealedNoteIds: initialRevealed,
                    targetDegree: initialTarget,
                    message: message,
                    mistake: false,
                    showHint: false
                });
                setTrainingStatus('playing');
                setFeedback(null);
            }, [trainingConfig, calculatePatternNotes]);

            // Config change -> Queue reset
            useEffect(() => {
                patternQueue.current = [];
            }, [trainingConfig.type]);

            const getHintText = () => {
                if (!currentQuestion) return "";
                
                // Block Quiz Hint: Show contained degrees
                if (currentQuestion.blockConfig) {
                    const notes = calculatePatternNotes(trainingConfig.key, trainingConfig.scaleType, null, currentQuestion.blockConfig);
                    // notes are generated in order: LowString[0], LowString[1], HighString[0], HighString[1]
                    const degrees = notes.map(n => n.degree).join('、');
                    return `ヒント: 含まれる度数は ${degrees} だよ`;
                }
                
                // Normal Hint
                const notes = calculatePatternNotes(trainingConfig.key, trainingConfig.scaleType, currentQuestion.patternKey);
                const rootStrings = [...new Set(notes.filter(n => n.type === 'root').map(n => n.s))].sort((a,b) => a-b);
                return `ヒント: Rootは ${rootStrings.join(', ')}弦 にあるよ`;
            };

            const handleGiveUp = () => {
                if (!currentQuestion) return;
                const notes = currentQuestion.blockConfig 
                    ? calculatePatternNotes(trainingConfig.key, trainingConfig.scaleType, null, currentQuestion.blockConfig)
                    : calculatePatternNotes(trainingConfig.key, trainingConfig.scaleType, currentQuestion.patternKey);
                
                const allNoteIds = new Set(notes.map(n => n.id));
                
                setCurrentQuestion(prev => ({
                    ...prev,
                    revealedNoteIds: allNoteIds,
                    message: "正解(全構成音)を表示しました",
                    showHint: false
                }));
                setTrainingStatus('cleared');
            };

            const handleTrainingClick = (stringNum, fretNum) => {
                if (trainingStatus !== 'playing' || !currentQuestion) return;

                // Recalculate notes to check against
                const notes = currentQuestion.blockConfig 
                    ? calculatePatternNotes(trainingConfig.key, trainingConfig.scaleType, null, currentQuestion.blockConfig)
                    : calculatePatternNotes(trainingConfig.key, trainingConfig.scaleType, currentQuestion.patternKey);

                const clickedNote = notes.find(n => n.s === stringNum && n.fret === fretNum);

                if (!clickedNote) {
                    triggerMistake("そこには音がないよ");
                    return;
                }

                if (currentQuestion.revealedNoteIds.has(clickedNote.id)) {
                    return;
                }

                // Check logic based on level / mode
                let isCorrect = false;

                if (currentQuestion.blockConfig) {
                    // Block Quiz: Any note in the generated block is correct
                    isCorrect = true;
                } else if (trainingConfig.level === 1) {
                    isCorrect = (clickedNote.degree === 'R');
                } else if (trainingConfig.level === 2) {
                    isCorrect = true;
                } else if (trainingConfig.level === 3) {
                    isCorrect = (clickedNote.degree === currentQuestion.targetDegree);
                }

                if (isCorrect) {
                    const newRevealed = new Set(currentQuestion.revealedNoteIds);
                    newRevealed.add(clickedNote.id);
                    
                    const allNoteIds = notes.map(n => n.id);
                    const isAllRevealed = allNoteIds.every(id => newRevealed.has(id));

                    if (isAllRevealed) {
                        setCurrentQuestion(prev => ({ ...prev, revealedNoteIds: newRevealed, message: "クリア！", showHint: false }));
                        setTrainingStatus('cleared');
                        return;
                    }

                    // Partial correct feedback
                    if (currentQuestion.blockConfig) {
                        setCurrentQuestion(prev => ({ ...prev, revealedNoteIds: newRevealed, mistake: false }));
                    } else if (trainingConfig.level === 1) {
                        const allRoots = notes.filter(n => n.degree === 'R');
                        const foundRoots = allRoots.filter(n => newRevealed.has(n.id));
                        if (foundRoots.length === allRoots.length) {
                             setCurrentQuestion(prev => ({ ...prev, revealedNoteIds: newRevealed, message: "クリア！", showHint: false }));
                             setTrainingStatus('cleared');
                             return;
                        } else {
                            setCurrentQuestion(prev => ({ ...prev, revealedNoteIds: newRevealed, mistake: false }));
                        }
                    } else if (trainingConfig.level === 2) {
                        setCurrentQuestion(prev => ({ ...prev, revealedNoteIds: newRevealed, mistake: false }));
                    } else if (trainingConfig.level === 3) {
                        const currentDegree = currentQuestion.targetDegree;
                        const remainingForDegree = notes.filter(n => n.degree === currentDegree && !newRevealed.has(n.id));
                        
                        if (remainingForDegree.length > 0) {
                            setCurrentQuestion(prev => ({ 
                                ...prev, 
                                revealedNoteIds: newRevealed, 
                                message: `正解！まだ "${currentDegree}" があるよ！`, 
                                mistake: false 
                            }));
                        } else {
                            const nextTarget = getNextTargetDegree(notes, newRevealed);
                            
                            if (!nextTarget) {
                                 setCurrentQuestion(prev => ({ ...prev, revealedNoteIds: newRevealed, message: "クリア！", showHint: false }));
                                 setTrainingStatus('cleared');
                                 return;
                            }

                            setCurrentQuestion(prev => ({ 
                                ...prev, 
                                revealedNoteIds: newRevealed, 
                                targetDegree: nextTarget,
                                message: `Excellent! 次は "${nextTarget}" を探そう！`,
                                mistake: false
                            }));
                        }
                    }

                } else {
                    triggerMistake("不正解...");
                }
            };

            const triggerMistake = (msg) => {
                setFeedback(msg);
                setCurrentQuestion(prev => ({ ...prev, mistake: true }));
                setTimeout(() => {
                    setFeedback(null);
                    setCurrentQuestion(prev => ({ ...prev, mistake: false }));
                }, 800);
            };

            const getTrainingNotes = () => {
                if (!currentQuestion) return [];
                // For Block, recalculate to get specific block notes
                if (currentQuestion.blockConfig) {
                     const notes = calculatePatternNotes(trainingConfig.key, trainingConfig.scaleType, null, currentQuestion.blockConfig);
                     return notes.map(n => ({
                        ...n,
                        isVisible: currentQuestion.revealedNoteIds.has(n.id)
                    }));
                }
                // Normal
                const notes = calculatePatternNotes(trainingConfig.key, trainingConfig.scaleType, currentQuestion.patternKey);
                return notes.map(n => ({
                    ...n,
                    isVisible: currentQuestion.revealedNoteIds.has(n.id)
                }));
            };

            return (
                <div className="flex flex-col items-center p-4 min-h-screen font-sans text-gray-800">
                    <div className="w-full max-w-4xl flex justify-between items-center mb-6 border-b border-gray-300 pb-4 sticky top-0 bg-[#f3f4f6] z-50 pt-2">
                        <h1 className="text-xl font-bold text-gray-800">🎸 ペンタトレーニング</h1>
                        <div className="flex bg-gray-200 rounded-lg p-1">
                            <button 
                                onClick={() => setAppMode('viewer')}
                                className={`px-4 py-1.5 rounded-md text-sm font-bold transition-all ${appMode === 'viewer' ? 'bg-white shadow text-blue-600' : 'text-gray-500'}`}
                            >
                                閲覧
                            </button>
                            <button 
                                onClick={() => setAppMode('training')}
                                className={`px-4 py-1.5 rounded-md text-sm font-bold transition-all ${appMode === 'training' ? 'bg-white shadow text-green-600' : 'text-gray-500'}`}
                            >
                                特訓
                            </button>
                        </div>
                    </div>

                    {appMode === 'viewer' && (
                        <div className="w-full flex flex-col items-center">
                            <div className="bg-white p-3 rounded-xl shadow-sm border mb-4 w-full max-w-3xl flex flex-col gap-4 items-center justify-center">
                                <div className="flex flex-wrap items-center justify-center gap-4">
                                    <div className="flex items-center gap-2">
                                        <span className="text-xs font-bold text-gray-500 uppercase">Key</span>
                                        <select 
                                            value={selectedKey} 
                                            onChange={(e) => setSelectedKey(e.target.value)}
                                            className="p-1 border rounded font-bold"
                                        >
                                            {KEYS.map(k => <option key={k} value={k}>{k}</option>)}
                                        </select>
                                    </div>
                                    <div className="flex items-center gap-2">
                                        <span className="text-xs font-bold text-gray-500 uppercase">Scale</span>
                                        <div className="flex bg-gray-100 rounded p-0.5">
                                            <button 
                                                onClick={() => setSelectedScaleType('Minor')}
                                                className={`px-3 py-1 text-sm rounded ${selectedScaleType === 'Minor' ? 'bg-white shadow font-bold text-blue-600' : 'text-gray-500'}`}
                                            >
                                                Minor
                                            </button>
                                            <button 
                                                onClick={() => setSelectedScaleType('Major')}
                                                className={`px-3 py-1 text-sm rounded ${selectedScaleType === 'Major' ? 'bg-white shadow font-bold text-orange-600' : 'text-gray-500'}`}
                                            >
                                                Major
                                            </button>
                                        </div>
                                    </div>
                                    <div className="flex bg-gray-100 p-1 rounded shrink-0">
                                        <button onClick={() => setDisplayMode('note')} className={`px-2 py-1 text-xs rounded ${displayMode==='note'?'bg-white shadow':''}`}>音名</button>
                                        <button onClick={() => setDisplayMode('degree')} className={`px-2 py-1 text-xs rounded ${displayMode==='degree'?'bg-white shadow':''}`}>度数</button>
                                    </div>
                                </div>
                                <div className="flex items-center gap-2 overflow-x-auto max-w-full pb-1 scrollbar-hide">
                                    {Object.entries(PATTERN_DEFS).map(([key, pattern]) => (
                                        <button
                                            key={key}
                                            onClick={() => setActivePatternKey(key)}
                                            className={`whitespace-nowrap px-3 py-1 rounded-full text-xs font-bold border ${
                                                activePatternKey === key
                                                    ? 'bg-blue-600 text-white border-blue-600'
                                                    : 'bg-white text-gray-600 border-gray-200'
                                            }`}
                                        >
                                            {pattern.name}
                                        </button>
                                    ))}
                                </div>
                            </div>

                            <div className="text-sm text-blue-800 bg-blue-50 p-3 rounded mb-4 max-w-2xl w-full text-center">
                                {PATTERN_DEFS[activePatternKey].description}
                            </div>
                            <FretboardUI 
                                notes={viewerNotes} 
                                displayMode={displayMode}
                            />
                        </div>
                    )}

                    {appMode === 'training' && (
                        <div className="w-full flex flex-col items-center">
                            {trainingStatus === 'idle' && (
                                <div className="bg-white p-6 rounded-xl shadow-lg border w-full max-w-md">
                                    <h2 className="text-lg font-bold mb-4 text-center border-b pb-2">トレーニング設定</h2>
                                    
                                    <div className="space-y-4">
                                        <div className="flex justify-between items-center">
                                            <label className="font-bold text-gray-600">Key</label>
                                            <div className="flex gap-2">
                                                <select 
                                                    value={trainingConfig.key}
                                                    onChange={(e) => setTrainingConfig({...trainingConfig, key: e.target.value})}
                                                    className="border p-2 rounded w-20 font-bold"
                                                >
                                                    {KEYS.map(k => <option key={k} value={k}>{k}</option>)}
                                                </select>
                                                <select 
                                                    value={trainingConfig.scaleType}
                                                    onChange={(e) => setTrainingConfig({...trainingConfig, scaleType: e.target.value})}
                                                    className={`border p-2 rounded font-bold ${trainingConfig.scaleType === 'Major' ? 'text-orange-600' : 'text-blue-600'}`}
                                                >
                                                    <option value="Minor">Minor</option>
                                                    <option value="Major">Major</option>
                                                </select>
                                            </div>
                                        </div>

                                        <div className="flex justify-between items-center">
                                            <label className="font-bold text-gray-600">Type</label>
                                            <div className="flex gap-1">
                                                <button 
                                                    onClick={() => setTrainingConfig({...trainingConfig, type: 'vertical'})}
                                                    className={`px-2 py-2 rounded text-xs font-bold border ${trainingConfig.type === 'vertical' ? 'bg-blue-600 text-white' : 'bg-gray-100'}`}
                                                >
                                                    縦ペンタ
                                                </button>
                                                <button 
                                                    onClick={() => setTrainingConfig({...trainingConfig, type: 'horizontal'})}
                                                    className={`px-2 py-2 rounded text-xs font-bold border ${trainingConfig.type === 'horizontal' ? 'bg-blue-600 text-white' : 'bg-gray-100'}`}
                                                >
                                                    横ペンタ
                                                </button>
                                                 <button 
                                                    onClick={() => setTrainingConfig({...trainingConfig, type: 'block'})}
                                                    className={`px-2 py-2 rounded text-xs font-bold border ${trainingConfig.type === 'block' ? 'bg-pink-500 text-white' : 'bg-gray-100'}`}
                                                >
                                                    Block
                                                </button>
                                            </div>
                                        </div>

                                        {!trainingConfig.type.includes('block') && (
                                            <div className="flex justify-between items-center">
                                                <label className="font-bold text-gray-600">Level</label>
                                                <div className="flex gap-1">
                                                    <button 
                                                        onClick={() => setTrainingConfig({...trainingConfig, level: 1})}
                                                        className={`px-2 py-2 rounded text-xs font-bold border ${trainingConfig.level === 1 ? 'bg-green-600 text-white' : 'bg-gray-100'}`}
                                                    >
                                                        Lv.1 (Root)
                                                    </button>
                                                    <button 
                                                        onClick={() => setTrainingConfig({...trainingConfig, level: 2})}
                                                        className={`px-2 py-2 rounded text-xs font-bold border ${trainingConfig.level === 2 ? 'bg-purple-600 text-white' : 'bg-gray-100'}`}
                                                    >
                                                        Lv.2 (全音)
                                                    </button>
                                                    <button 
                                                        onClick={() => setTrainingConfig({...trainingConfig, level: 3})}
                                                        className={`px-2 py-2 rounded text-xs font-bold border ${trainingConfig.level === 3 ? 'bg-orange-600 text-white' : 'bg-gray-100'}`}
                                                    >
                                                        Lv.3 (度数)
                                                    </button>
                                                </div>
                                            </div>
                                        )}
                                    </div>

                                    <button 
                                        onClick={startTraining}
                                        className="w-full mt-6 bg-gray-800 text-white py-3 rounded-lg font-bold hover:bg-black transition-all"
                                    >
                                        START
                                    </button>
                                </div>
                            )}

                            {trainingStatus !== 'idle' && currentQuestion && (
                                <div className="w-full flex flex-col items-center">
                                    <div className="flex gap-4 mb-4 items-center">
                                        <div className="bg-white px-6 py-2 rounded-full shadow border border-gray-200 flex items-center gap-2">
                                            <span className="text-xs font-bold text-gray-500">KEY</span>
                                            <span className="text-2xl font-black text-gray-800">{trainingConfig.key}<span className="text-sm font-normal text-gray-500 ml-1">{trainingConfig.scaleType}</span></span>
                                        </div>
                                        <div className="bg-white px-6 py-2 rounded-full shadow border border-gray-200 flex items-center gap-2">
                                            <span className="text-xs font-bold text-gray-500">PATTERN</span>
                                            <span className="text-lg font-bold text-gray-800">{currentQuestion.patternName}</span>
                                        </div>
                                    </div>

                                    <div className={`
                                        mb-4 px-8 py-4 rounded-xl text-xl font-bold shadow-md transition-all duration-300 text-center min-w-[300px] relative overflow-hidden
                                        ${trainingStatus === 'cleared' ? 'bg-yellow-500 text-white scale-110' : 'bg-blue-600 text-white'}
                                    `}>
                                        <div className="relative z-10">
                                            {currentQuestion.message}
                                        </div>
                                        {feedback && (
                                            <div className="absolute inset-0 bg-red-600 flex items-center justify-center z-20 animate-pop-in">
                                                {feedback}
                                            </div>
                                        )}
                                    </div>

                                    {trainingStatus !== 'cleared' && (
                                        <div className="mb-4 h-8 flex gap-4 items-center">
                                            {currentQuestion.showHint ? (
                                                <span className="text-blue-600 font-bold bg-blue-100 px-3 py-1 rounded animate-pop-in">
                                                    {getHintText()}
                                                </span>
                                            ) : (
                                                <button 
                                                    onClick={() => setCurrentQuestion(prev => ({...prev, showHint: true}))}
                                                    className="text-xs text-gray-500 underline hover:text-blue-500"
                                                >
                                                    💡 ヒントを見る
                                                </button>
                                            )}
                                            <div className="w-px h-4 bg-gray-300"></div>
                                            <button 
                                                onClick={handleGiveUp}
                                                className="text-xs text-red-400 underline hover:text-red-600"
                                            >
                                                🏳️ 諦める
                                            </button>
                                        </div>
                                    )}

                                    {trainingStatus === 'cleared' && (
                                        <div className="mb-4 h-8 animate-pop-in">
                                            <button 
                                                onClick={startTraining}
                                                className="bg-green-600 text-white px-6 py-1 rounded-full font-bold shadow hover:bg-green-700"
                                            >
                                                次へ進む ▶ (Space)
                                            </button>
                                        </div>
                                    )}

                                    <FretboardUI 
                                        notes={getTrainingNotes()}
                                        displayMode="degree"
                                        onFretClick={handleTrainingClick}
                                        highlightShake={currentQuestion.mistake}
                                    />
                                    
                                    <button 
                                        onClick={() => setTrainingStatus('idle')}
                                        className="mt-8 text-gray-400 text-sm hover:text-gray-600 underline"
                                    >
                                        設定に戻る
                                    </button>
                                </div>
                            )}
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
