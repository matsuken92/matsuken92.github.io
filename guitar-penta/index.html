<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ギター指板：全キー対応・縦ペンタ vs 横ペンタ</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel (for JSX) -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo } = React;

        // --- Constants & Data ---

        const KEYS = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];

        // 6弦上のルート位置（0〜11フレット）
        const ROOT_FRETS = {
            'E': 0, 'F': 1, 'F#': 2, 'G': 3, 'G#': 4, 
            'A': 5, 'A#': 6, 'B': 7, 
            'C': 8, 'C#': 9, 'D': 10, 'D#': 11
        };

        // パターン定義
        const PATTERN_DEFS = {
            vertical1: {
                name: 'Box 1 (基本形)',
                description: '【基本】6弦ルートのポジション。まずはここから覚えましょう。',
                notes: [
                    { s: 6, off: 0, type: 'root' }, { s: 6, off: 3 },
                    { s: 5, off: 0 }, { s: 5, off: 2 },
                    { s: 4, off: 0 }, { s: 4, off: 2, type: 'root' },
                    { s: 3, off: 0 }, { s: 3, off: 2 },
                    { s: 2, off: 0 }, { s: 2, off: 3 },
                    { s: 1, off: 0, type: 'root' }, { s: 1, off: 3 },
                ]
            },
            vertical2: {
                name: 'Box 2 (メジャー型)',
                description: '【メジャー型】Box 1の右隣。メジャーペンタの基本形と同じ形です。',
                notes: [
                    { s: 6, off: 3 }, { s: 6, off: 5 },
                    { s: 5, off: 2 }, { s: 5, off: 5 },
                    { s: 4, off: 2, type: 'root' }, { s: 4, off: 5 },
                    { s: 3, off: 2 }, { s: 3, off: 4 },
                    { s: 2, off: 3 }, { s: 2, off: 5, type: 'root' },
                    { s: 1, off: 3 }, { s: 1, off: 5 },
                ]
            },
            vertical3: {
                name: 'Box 3',
                description: '【中間】5弦と2弦にルートがあります。少しストレッチする箇所があります。',
                notes: [
                    { s: 6, off: 5 }, { s: 6, off: 7 },
                    { s: 5, off: 5 }, { s: 5, off: 7, type: 'root' },
                    { s: 4, off: 5 }, { s: 4, off: 7 },
                    { s: 3, off: 4 }, { s: 3, off: 7 },
                    { s: 2, off: 5, type: 'root' }, { s: 2, off: 8 },
                    { s: 1, off: 5 }, { s: 1, off: 7 },
                ]
            },
            vertical4: {
                name: 'Box 4',
                description: '【高音域への入り口】5弦ルートのコード(Em型)に関連するポジションです。',
                notes: [
                    { s: 6, off: 7 }, { s: 6, off: 10 },
                    { s: 5, off: 7, type: 'root' }, { s: 5, off: 10 },
                    { s: 4, off: 7 }, { s: 4, off: 9 },
                    { s: 3, off: 7 }, { s: 3, off: 9, type: 'root' },
                    { s: 2, off: 8 }, { s: 2, off: 10 },
                    { s: 1, off: 7 }, { s: 1, off: 10 },
                ]
            },
            vertical5: {
                name: 'Box 5',
                description: '【Box 1の手前】Box 1の左隣にある形。Gメジャーコードのフォームに関連します。',
                notes: [
                    // AmのキーでBox5の位置関係になるよう調整済みのオフセット
                    { s: 6, off: -2 }, { s: 6, off: 0, type: 'root' },
                    { s: 5, off: -2 }, { s: 5, off: 0 },
                    { s: 4, off: -3 }, { s: 4, off: 0 },
                    { s: 3, off: -3, type: 'root' }, { s: 3, off: 0 },
                    { s: 2, off: -2 }, { s: 2, off: 0 },
                    { s: 1, off: -2 }, { s: 1, off: 0, type: 'root' }
                ]
            },
            horizontal_root6: {
                name: '横ペンタ (6弦ルート)',
                description: '【6弦発進】Box 5〜1〜2〜3を連結。低音からスムーズに上昇する定番パターン。',
                notes: [
                    { s: 6, off: -2 }, { s: 6, off: 0, type: 'root' },
                    { s: 5, off: -2 }, { s: 5, off: 0 }, { s: 5, off: 2, technique: 'slide' },
                    { s: 4, off: 0 }, { s: 4, off: 2, type: 'root' },
                    { s: 3, off: 0 }, { s: 3, off: 2 }, { s: 3, off: 4, technique: 'slide' },
                    { s: 2, off: 3 }, { s: 2, off: 5, type: 'root' },
                    { s: 1, off: 3 }, { s: 1, off: 5 }, { s: 1, off: 7, technique: 'slide' },
                ]
            },
            horizontal_root5: {
                name: '横ペンタ (5弦ルート)',
                description: '【5弦発進】Box 3から入り、高音域を一気に駆け上がるダイナミックなパターン。',
                notes: [
                    { s: 6, off: 5 }, { s: 6, off: 7 },
                    { s: 5, off: 5 }, { s: 5, off: 7, type: 'root' },
                    { s: 4, off: 5 }, { s: 4, off: 7 }, { s: 4, off: 9, technique: 'slide' },
                    { s: 3, off: 7 }, { s: 3, off: 9, type: 'root' },
                    { s: 2, off: 8 }, { s: 2, off: 10 }, { s: 2, off: 12, technique: 'slide' },
                    { s: 1, off: 10 }, { s: 1, off: 12, type: 'root' },
                ]
            }
        };


        const Fretboard = () => {
            const [selectedKey, setSelectedKey] = useState('A');
            const [activePatternKey, setActivePatternKey] = useState('vertical1');

            // Calculate notes based on selection
            const patternNotes = useMemo(() => {
                const rootFret = ROOT_FRETS[selectedKey];
                const def = PATTERN_DEFS[activePatternKey];
                
                // 1. Calculate raw frets
                let notes = def.notes.map(n => ({ ...n, fret: n.off + rootFret }));
                
                // 2. Determine best octave shift
                // Calculate average fret to see if it's too high or too low
                const avgFret = notes.reduce((sum, n) => sum + n.fret, 0) / notes.length;
                
                let shift = 0;
                if (avgFret > 13) shift = -12; // If pattern centers around 14+, shift down
                else if (avgFret < 2) shift = 12; // If pattern centers around 0 or negative, shift up
                
                // Apply shift
                notes = notes.map(n => ({
                    ...n,
                    fret: n.fret + shift
                }));

                // 3. Filter out of bounds (0 to 18)
                return notes.filter(n => n.fret >= 0 && n.fret <= 18);
            }, [selectedKey, activePatternKey]);

            // View Helpers
            const frets = Array.from({ length: 19 }, (_, i) => i);
            const isFretMarker = (fret) => [3, 5, 7, 9, 15, 17].includes(fret);
            const isDoubleMarker = (fret) => fret === 12;

            const getNoteAtPosition = (stringNum, fretNum) => {
                return patternNotes.find(n => n.s === stringNum && n.fret === fretNum);
            };

            const getNoteName = (stringNum, fretNum) => {
                const stringOpenNotes = ['E', 'B', 'G', 'D', 'A', 'E']; // 1 to 6
                const openNote = stringOpenNotes[stringNum - 1];
                const chromatic = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
                const openIndex = chromatic.indexOf(openNote);
                return chromatic[(openIndex + fretNum) % 12];
            };

            return (
                <div className="flex flex-col items-center p-4 bg-gray-50 min-h-screen font-sans text-gray-800">
                    <h1 className="text-2xl font-bold mb-2">ギター指板：全キー対応・縦ペンタ vs 横ペンタ</h1>
                    <p className="text-sm text-gray-600 mb-6 text-center max-w-lg">
                        キーを選択し、ポジションごとの変化を確認してください。<br/>
                        <span className="text-red-500 font-bold">赤丸</span>はルート音({selectedKey})、<span className="text-blue-500 font-bold">青丸</span>は構成音です。
                    </p>

                    {/* Key Selector */}
                    <div className="flex items-center gap-2 mb-6 bg-white p-2 rounded-lg shadow-sm border border-gray-200">
                        <span className="font-bold text-gray-700">Key (Minor):</span>
                        <select 
                            value={selectedKey} 
                            onChange={(e) => setSelectedKey(e.target.value)}
                            className="p-2 border rounded hover:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-200 cursor-pointer font-mono font-bold"
                        >
                            {KEYS.map(k => {
                                const majorKey = KEYS[(KEYS.indexOf(k) + 3) % 12];
                                return <option key={k} value={k}>{k}m ({majorKey})</option>;
                            })}
                        </select>
                    </div>

                    {/* Pattern Buttons */}
                    <div className="flex flex-wrap justify-center gap-2 mb-8 w-full max-w-3xl">
                        {Object.entries(PATTERN_DEFS).map(([key, pattern]) => (
                            <button
                                key={key}
                                onClick={() => setActivePatternKey(key)}
                                className={`px-4 py-2 rounded-full text-sm font-semibold transition-all shadow-sm ${
                                    activePatternKey === key
                                        ? 'bg-blue-600 text-white ring-2 ring-blue-300 ring-offset-2'
                                        : 'bg-white text-gray-700 hover:bg-gray-100 border border-gray-300'
                                }`}
                            >
                                {pattern.name}
                            </button>
                        ))}
                    </div>

                    {/* Description */}
                    <div className="bg-white p-4 rounded-lg shadow-sm border border-gray-200 mb-8 max-w-2xl w-full">
                        <h3 className="font-bold text-lg mb-1 flex items-center gap-2">
                            {PATTERN_DEFS[activePatternKey].name}
                        </h3>
                        <p className="text-gray-600 leading-relaxed">
                            {PATTERN_DEFS[activePatternKey].description}
                        </p>
                    </div>

                    {/* Fretboard */}
                    <div className="relative overflow-x-auto w-full max-w-5xl pb-10 px-2">
                        <div className="bg-[#2a2a2a] p-1 pt-12 rounded-lg shadow-xl relative select-none" style={{ minWidth: '950px' }}>
                            
                            {/* Strings */}
                            <div className="relative flex flex-col justify-between h-48 mb-6 relative z-10">
                                {[1, 2, 3, 4, 5, 6].map((stringNum) => (
                                    <div key={stringNum} className="relative w-full h-full flex items-center">
                                        {/* String Line */}
                                        <div 
                                            className="absolute w-full bg-[#a0a0a0]" 
                                            style={{ 
                                                height: `${Math.max(1, stringNum * 0.7)}px`,
                                                boxShadow: '0 1px 2px rgba(0,0,0,0.5)'
                                            }} 
                                        />
                                        
                                        {/* Frets */}
                                        <div className="absolute inset-0 flex">
                                            {frets.map((fretNum) => {
                                                const note = getNoteAtPosition(stringNum, fretNum);
                                                
                                                return (
                                                    <div 
                                                        key={fretNum} 
                                                        className="flex-1 border-r border-gray-500 h-full relative flex items-center justify-center"
                                                        style={{ 
                                                            borderColor: fretNum === 0 ? '#ddd' : '#666',
                                                            borderRightWidth: fretNum === 0 ? '6px' : '2px'
                                                        }}
                                                    >
                                                        {/* Note Bubble */}
                                                        {note && (
                                                            <div 
                                                                className={`
                                                                    relative z-20 w-8 h-8 rounded-full flex items-center justify-center text-xs font-bold shadow-md transition-all duration-300
                                                                    ${note.type === 'root' ? 'bg-red-500 text-white ring-2 ring-red-300' : 'bg-blue-500 text-white'}
                                                                    ${note.technique === 'slide' ? 'ring-2 ring-yellow-400' : ''}
                                                                `}
                                                            >
                                                                {getNoteName(stringNum, fretNum)}
                                                                {note.technique === 'slide' && (
                                                                    <span className="absolute -top-3 -right-3 bg-yellow-400 text-black text-[9px] px-1 rounded">Slide</span>
                                                                )}
                                                            </div>
                                                        )}
                                                    </div>
                                                );
                                            })}
                                        </div>
                                    </div>
                                ))}
                            </div>

                            {/* Markers */}
                            <div className="absolute inset-0 pointer-events-none flex pt-12 pb-6 px-1 z-0">
                                {frets.map(fret => (
                                    <div key={fret} className="flex-1 flex items-center justify-center h-full">
                                        {isFretMarker(fret) && <div className="w-4 h-4 bg-gray-400 rounded-full opacity-30"></div>}
                                        {isDoubleMarker(fret) && (
                                            <div className="flex flex-col gap-8 opacity-30">
                                                <div className="w-4 h-4 bg-gray-400 rounded-full"></div>
                                                <div className="w-4 h-4 bg-gray-400 rounded-full"></div>
                                            </div>
                                        )}
                                    </div>
                                ))}
                            </div>

                            {/* Numbers */}
                            <div className="flex pl-1 text-gray-400 text-xs font-mono mt-2">
                                {frets.map(fret => (
                                    <div key={fret} className="flex-1 text-center">{fret}</div>
                                ))}
                            </div>

                        </div>
                    </div>
                    
                    <div className="mt-8 text-center text-xs text-gray-400">
                        ※ 選択したキーに合わせて、自動的に見やすいオクターブ位置（0〜18F）に調整されます。
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<Fretboard />);
    </script>
</body>
</html>
