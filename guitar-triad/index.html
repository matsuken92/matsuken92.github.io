<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ギター指板：トライアド・マスター (Triad Trainer)</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel (for JSX) -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            touch-action: manipulation;
            overscroll-behavior: none;
            background-color: #f3f4f6;
            user-select: none;
            -webkit-user-select: none;
        }
        .fretboard-bg {
            background-color: #d4a373; /* メイプル風単色 */
        }
        /* 弦の影をつけて立体感を出す */
        .string-line {
            box-shadow: 0 1px 2px rgba(0,0,0,0.4);
        }
        @keyframes pop-in {
            0% { transform: scale(0); opacity: 0; }
            70% { transform: scale(1.2); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }
        .animate-pop-in { animation: pop-in 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        .animate-shake { animation: shake 0.3s ease-in-out; }
        .animate-fade-in { animation: pop-in 0.5s ease-out forwards; }
        
        /* カスタムスクロールバー（横スクロール用） */
        .scrollbar-hide::-webkit-scrollbar {
            display: none;
        }
        .scrollbar-hide {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* ドラッグ中の要素が他の要素のイベントを邪魔しないように */
        .pointer-events-none {
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo, useEffect, useCallback, useRef } = React;

        // --- Constants & Data ---

        const KEYS = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];

        // 表示用ラベル変換 (Enharmonic)
        const formatKeyLabel = (key) => {
            const map = {
                'C#': 'D♭',
                'D#': 'E♭',
                'F#': 'G♭',
                'G#': 'A♭',
                'A#': 'B♭'
            };
            return map[key] || key;
        };

        const DIATONIC_INTERVALS = [
            { degreeName: 'I',   offset: 0,  type: 'Major' },
            { degreeName: 'ii',  offset: 2,  type: 'Minor' },
            { degreeName: 'iii', offset: 4,  type: 'Minor' },
            { degreeName: 'IV',  offset: 5,  type: 'Major' },
            { degreeName: 'V',   offset: 7,  type: 'Major' },
            { degreeName: 'vi',  offset: 9,  type: 'Minor' },
            { degreeName: 'vii°', offset: 11, type: 'Diminished' }
        ];

        // 6弦上のルート位置（0〜11フレット）E=0
        const ROOT_FRETS_ON_6 = {
            'E': 0, 'F': 1, 'F#': 2, 'G': 3, 'G#': 4, 
            'A': 5, 'A#': 6, 'B': 7, 
            'C': 8, 'C#': 9, 'D': 10, 'D#': 11
        };

        // 各弦の開放弦における、6弦(E)からの半音差オフセット
        const STRING_OFFSETS = { 6: 0, 5: 5, 4: 10, 3: 15, 2: 19, 1: 24 };

        // トライアドシェイプ定義
        const TRIAD_SHAPES = {
            // --- Set 1 (Strings 1, 2, 3) ---
            'Set1_Maj_R3': { name: 'Set 1 (Root 3弦)', strings: [3, 2, 1], offsets: [0, 0, -2], degrees: ['R', '3', '5'], type: 'Major' }, 
            'Set1_Maj_R2': { name: 'Set 1 (Root 2弦)', strings: [3, 2, 1], offsets: [-1, 0, -1], degrees: ['5', 'R', '3'], type: 'Major' }, 
            'Set1_Maj_R1': { name: 'Set 1 (Root 1弦)', strings: [3, 2, 1], offsets: [1, 0, 0], degrees: ['3', '5', 'R'], type: 'Major' }, 

            'Set1_Min_R3': { name: 'Set 1 (Root 3弦)', strings: [3, 2, 1], offsets: [0, -1, -2], degrees: ['R', 'b3', '5'], type: 'Minor' },
            'Set1_Min_R2': { name: 'Set 1 (Root 2弦)', strings: [3, 2, 1], offsets: [-1, 0, -2], degrees: ['5', 'R', 'b3'], type: 'Minor' }, 
            'Set1_Min_R1': { name: 'Set 1 (Root 1弦)', strings: [3, 2, 1], offsets: [0, 0, 0], degrees: ['b3', '5', 'R'], type: 'Minor' }, 

            'Set1_Dim_R3': { name: 'Set 1 (Root 3弦)', strings: [3, 2, 1], offsets: [0, -1, -3], degrees: ['R', 'b3', 'b5'], type: 'Diminished' },
            'Set1_Dim_R2': { name: 'Set 1 (Root 2弦)', strings: [3, 2, 1], offsets: [-2, 0, -2], degrees: ['b5', 'R', 'b3'], type: 'Diminished' }, 
            'Set1_Dim_R1': { name: 'Set 1 (Root 1弦)', strings: [3, 2, 1], offsets: [0, -1, 0], degrees: ['b3', 'b5', 'R'], type: 'Diminished' }, 

            // --- Set 2 (Strings 2, 3, 4) ---
            'Set2_Maj_R4': { name: 'Set 2 (Root 4弦)', strings: [4, 3, 2], offsets: [0, -1, -2], degrees: ['R', '3', '5'], type: 'Major' },
            'Set2_Maj_R3': { name: 'Set 2 (Root 3弦)', strings: [4, 3, 2], offsets: [0, 0, 0], degrees: ['5', 'R', '3'], type: 'Major' },
            'Set2_Maj_R2': { name: 'Set 2 (Root 2弦)', strings: [4, 3, 2], offsets: [1, -1, 0], degrees: ['3', '5', 'R'], type: 'Major' },

            'Set2_Min_R4': { name: 'Set 2 (Root 4弦)', strings: [4, 3, 2], offsets: [0, -2, -2], degrees: ['R', 'b3', '5'], type: 'Minor' },
            'Set2_Min_R3': { name: 'Set 2 (Root 3弦)', strings: [4, 3, 2], offsets: [0, 0, -1], degrees: ['5', 'R', 'b3'], type: 'Minor' },
            'Set2_Min_R2': { name: 'Set 2 (Root 2弦)', strings: [4, 3, 2], offsets: [0, -1, 0], degrees: ['b3', '5', 'R'], type: 'Minor' },

            'Set2_Dim_R4': { name: 'Set 2 (Root 4弦)', strings: [4, 3, 2], offsets: [0, -2, -3], degrees: ['R', 'b3', 'b5'], type: 'Diminished' },
            'Set2_Dim_R3': { name: 'Set 2 (Root 3弦)', strings: [4, 3, 2], offsets: [-1, 0, -1], degrees: ['b5', 'R', 'b3'], type: 'Diminished' },
            'Set2_Dim_R2': { name: 'Set 2 (Root 2弦)', strings: [4, 3, 2], offsets: [0, -1, -1], degrees: ['b3', 'b5', 'R'], type: 'Diminished' },

            // --- Set 3 (Strings 3, 4, 5) ---
            'Set3_Maj_R5': { name: 'Set 3 (Root 5弦)', strings: [5, 4, 3], offsets: [0, -1, -3], degrees: ['R', '3', '5'], type: 'Major' },
            'Set3_Maj_R4': { name: 'Set 3 (Root 4弦)', strings: [5, 4, 3], offsets: [0, 0, -1], degrees: ['5', 'R', '3'], type: 'Major' },
            'Set3_Maj_R3': { name: 'Set 3 (Root 3弦)', strings: [5, 4, 3], offsets: [2, 0, 0], degrees: ['3', '5', 'R'], type: 'Major' },

            'Set3_Min_R5': { name: 'Set 3 (Root 5弦)', strings: [5, 4, 3], offsets: [0, -2, -3], degrees: ['R', 'b3', '5'], type: 'Minor' },
            'Set3_Min_R4': { name: 'Set 3 (Root 4弦)', strings: [5, 4, 3], offsets: [0, 0, -2], degrees: ['5', 'R', 'b3'], type: 'Minor' },
            'Set3_Min_R3': { name: 'Set 3 (Root 3弦)', strings: [5, 4, 3], offsets: [1, 0, 0], degrees: ['b3', '5', 'R'], type: 'Minor' },

            'Set3_Dim_R5': { name: 'Set 3 (Root 5弦)', strings: [5, 4, 3], offsets: [0, -2, -4], degrees: ['R', 'b3', 'b5'], type: 'Diminished' },
            'Set3_Dim_R4': { name: 'Set 3 (Root 4弦)', strings: [5, 4, 3], offsets: [-1, 0, -2], degrees: ['b5', 'R', 'b3'], type: 'Diminished' },
            'Set3_Dim_R3': { name: 'Set 3 (Root 3弦)', strings: [5, 4, 3], offsets: [1, -1, 0], degrees: ['b3', 'b5', 'R'], type: 'Diminished' },

            // --- Set 4 (Strings 4, 5, 6) ---
            'Set4_Maj_R6': { name: 'Set 4 (Root 6弦)', strings: [6, 5, 4], offsets: [0, -1, -3], degrees: ['R', '3', '5'], type: 'Major' },
            'Set4_Maj_R5': { name: 'Set 4 (Root 5弦)', strings: [6, 5, 4], offsets: [0, 0, -1], degrees: ['5', 'R', '3'], type: 'Major' },
            'Set4_Maj_R4': { name: 'Set 4 (Root 4弦)', strings: [6, 5, 4], offsets: [2, 0, 0], degrees: ['3', '5', 'R'], type: 'Major' },

            'Set4_Min_R6': { name: 'Set 4 (Root 6弦)', strings: [6, 5, 4], offsets: [0, -2, -3], degrees: ['R', 'b3', '5'], type: 'Minor' },
            'Set4_Min_R5': { name: 'Set 4 (Root 5弦)', strings: [6, 5, 4], offsets: [0, 0, -2], degrees: ['5', 'R', 'b3'], type: 'Minor' },
            'Set4_Min_R4': { name: 'Set 4 (Root 4弦)', strings: [6, 5, 4], offsets: [1, 0, 0], degrees: ['b3', '5', 'R'], type: 'Minor' },

            'Set4_Dim_R6': { name: 'Set 4 (Root 6弦)', strings: [6, 5, 4], offsets: [0, -2, -4], degrees: ['R', 'b3', 'b5'], type: 'Diminished' },
            'Set4_Dim_R5': { name: 'Set 4 (Root 5弦)', strings: [6, 5, 4], offsets: [-1, 0, -2], degrees: ['b5', 'R', 'b3'], type: 'Diminished' },
            'Set4_Dim_R4': { name: 'Set 4 (Root 4弦)', strings: [6, 5, 4], offsets: [1, -1, 0], degrees: ['b3', 'b5', 'R'], type: 'Diminished' },
        };

        const getNoteName = (stringNum, fretNum) => {
            const stringOpenNotes = ['E', 'B', 'G', 'D', 'A', 'E']; // 1 to 6
            const openNote = stringOpenNotes[stringNum - 1];
            const chromatic = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
            const openIndex = chromatic.indexOf(openNote);
            return chromatic[(openIndex + fretNum) % 12];
        };

        const getShiftedNote = (rootNote, semitones) => {
            const chromatic = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
            const idx = chromatic.indexOf(rootNote);
            return chromatic[(idx + semitones) % 12];
        };

        // --- Components ---

        const FretboardUI = ({ 
            notes, 
            displayMode, // 'note' | 'degree'
            onFretClick,
            highlightShake,
            activeSetStrings // [1,2,3] etc. to highlight background of active strings
        }) => {
            const frets = Array.from({ length: 16 }, (_, i) => i); // 0-15F
            
            // ポジションマーク
            const isFretMarker = (fret) => [3, 5, 7, 9, 15].includes(fret);
            const isDoubleMarker = (fret) => fret === 12;

            const getNoteAtPosition = (stringNum, fretNum) => {
                if (!notes) return null;
                return notes.find(n => n.s === stringNum && n.fret === fretNum);
            };

            const containerClass = `relative overflow-x-auto w-full max-w-5xl pb-10 px-2 transition-transform duration-300 ${highlightShake ? 'animate-shake' : ''}`;

            return (
                <div className={containerClass}>
                    <div className="bg-[#222222] p-2 pl-4 rounded-lg shadow-2xl relative select-none" style={{ minWidth: '850px', border: '4px solid #1a1a1a' }}>
                        
                        <div className="fretboard-bg relative rounded-md h-44 overflow-visible"> 
                            
                            {/* 背景レイヤー */}
                            <div className="absolute inset-0 flex z-0 pointer-events-none">
                                {frets.map(fret => (
                                    <div key={fret} 
                                         className={`${fret === 0 ? 'w-10 flex-none rounded-l-md' : 'flex-1'} ${fret === 15 ? 'rounded-r-md' : ''} flex items-center justify-center h-full relative`} 
                                         style={{ 
                                             backgroundColor: fret === 0 ? '#262626' : 'transparent',
                                             borderRight: fret === 0 ? '6px solid #e5e5e5' : '2px solid #b0b0b0',
                                             borderColor: fret === 0 ? '#e5e5e5' : '#b0b0b0',
                                             boxSizing: 'border-box'
                                         }}>
                                        {fret > 0 && (
                                            <div className="absolute inset-0 flex flex-col justify-center items-center opacity-80">
                                                {isFretMarker(fret) && (
                                                    <div className="w-4 h-4 rounded-full bg-[#8d6e63] shadow-inner"></div>
                                                )}
                                                {isDoubleMarker(fret) && (
                                                    <div className="flex flex-col gap-8">
                                                        <div className="w-4 h-4 rounded-full bg-[#8d6e63] shadow-inner"></div>
                                                        <div className="w-4 h-4 rounded-full bg-[#8d6e63] shadow-inner"></div>
                                                    </div>
                                                )}
                                            </div>
                                        )}
                                    </div>
                                ))}
                            </div>

                            {/* メインレイヤー */}
                            <div className="absolute inset-0 flex flex-col justify-between py-2 z-10">
                                {[1, 2, 3, 4, 5, 6].map((stringNum) => {
                                    const isSetString = activeSetStrings ? activeSetStrings.includes(stringNum) : true;
                                    
                                    return (
                                    <div key={stringNum} className={`flex-1 w-full relative flex items-center ${!isSetString && activeSetStrings ? 'opacity-30' : 'opacity-100'}`}>
                                        
                                        {/* 弦 */}
                                        <div 
                                            className="absolute w-full bg-[#d1d1d1] string-line z-0" 
                                            style={{ 
                                                height: `${Math.max(2, stringNum * 0.8)}px`,
                                                boxShadow: '0 1px 1px rgba(0,0,0,0.3)'
                                            }} 
                                        />

                                        {/* 音符エリア */}
                                        <div className="relative w-full h-full flex z-10">
                                            {frets.map((fretNum) => {
                                                const note = getNoteAtPosition(stringNum, fretNum);
                                                return (
                                                    <div 
                                                        key={fretNum} 
                                                        className={`${fretNum === 0 ? 'w-10 flex-none' : 'flex-1'} h-full flex items-center justify-center cursor-pointer transition-colors z-20`}
                                                        // data-s と data-f はドラッグ＆ドロップ判定に使用
                                                        data-s={stringNum}
                                                        data-f={fretNum}
                                                        onClick={() => onFretClick && onFretClick(stringNum, fretNum)}
                                                    >
                                                        {note && note.isVisible && (
                                                            <div 
                                                                className={`
                                                                    relative z-30 w-7 h-7 rounded-full flex items-center justify-center text-[10px] font-bold shadow-lg animate-pop-in pointer-events-none
                                                                    ${note.degree === 'R' 
                                                                        ? 'bg-red-600/95 text-white ring-2 ring-red-300 shadow-[0_2px_5px_rgba(0,0,0,0.4)]' 
                                                                        : note.type === 'Major' 
                                                                            ? 'bg-orange-500/95 text-white' 
                                                                            : note.type === 'Minor' ? 'bg-blue-500/95 text-white' : 'bg-purple-600/95 text-white'}
                                                                `}
                                                            >
                                                                {displayMode === 'degree' ? note.degree : getNoteName(stringNum, fretNum)}
                                                            </div>
                                                        )}
                                                    </div>
                                                );
                                            })}
                                        </div>
                                    </div>
                                )})}
                            </div>

                        </div>

                        <div className="flex pl-[8px] text-gray-400 text-xs font-mono mt-1">
                            {frets.map(fret => (
                                <div key={fret} className={`${fret === 0 ? 'w-10 flex-none' : 'flex-1'} text-center`}>
                                    {fret > 0 ? fret : ''}
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            );
        };

        const App = () => {
            // Chromatic Mode State
            const [targetKeys, setTargetKeys] = useState(new Set(['C', 'G', 'D', 'A', 'E'])); 
            const [randomCount, setRandomCount] = useState(4);

            // Diatonic Mode State
            const [diatonicKey, setDiatonicKey] = useState('C');
            const [targetDegrees, setTargetDegrees] = useState(new Set(DIATONIC_INTERVALS.map(d => d.degreeName)));

            const [trainingStatus, setTrainingStatus] = useState('idle');
            const [currentQuestion, setCurrentQuestion] = useState(null); 
            const [feedback, setFeedback] = useState(null);
            const [isSpeedMode, setIsSpeedMode] = useState(false);

            // Settings
            const [settings, setSettings] = useState({
                targetSets: { 1: true, 2: true, 3: true, 4: true },
                targetTypes: { 'Major': true, 'Minor': true, 'Diminished': true },
                level: 1, // 1: Position, 2: Degree Drag, 3: NoteName Drag
                mode: 'diatonic' // 'chromatic' | 'diatonic'
            });

            // Question Queue for Shuffled Deck Logic
            const questionQueue = useRef([]);

            // --- Drag & Drop State for Level 2 & 3 ---
            const [dragState, setDragState] = useState({
                isDragging: false,
                degree: null, // Lv2: 'R', '3'... / Lv3: 'C', 'C#'...
                label: null, // Display label like 'D♭'
                x: 0,
                y: 0
            });
            const draggedElementRef = useRef(null);

            // --- Key Selection Helpers (Chromatic) ---
            const toggleKey = (key) => {
                const newSet = new Set(targetKeys);
                if (newSet.has(key)) newSet.delete(key);
                else newSet.add(key);
                setTargetKeys(newSet);
            };
            const selectAllKeys = () => setTargetKeys(new Set(KEYS));
            const deselectAllKeys = () => setTargetKeys(new Set());
            const selectRandomKeys = () => {
                const shuffled = [...KEYS].sort(() => 0.5 - Math.random());
                const count = Math.max(1, Math.min(12, randomCount));
                const selected = shuffled.slice(0, count);
                setTargetKeys(new Set(selected));
            };

            // --- Degree Selection Helpers (Diatonic) ---
            const toggleDegree = (degreeName) => {
                const newSet = new Set(targetDegrees);
                if (newSet.has(degreeName)) newSet.delete(degreeName);
                else newSet.add(degreeName);
                setTargetDegrees(newSet);
            };
            const selectAllDegrees = () => setTargetDegrees(new Set(DIATONIC_INTERVALS.map(d => d.degreeName)));
            const deselectAllDegrees = () => setTargetDegrees(new Set());
            const selectRandomDegrees = () => {
                const allDegrees = DIATONIC_INTERVALS.map(d => d.degreeName);
                const shuffled = [...allDegrees].sort(() => 0.5 - Math.random());
                const selected = shuffled.slice(0, 4);
                setTargetDegrees(new Set(selected));
            };

            // Queue Reset on Setting Change
            useEffect(() => {
                questionQueue.current = [];
            }, [settings, targetKeys, diatonicKey, targetDegrees]);

            // Helper: Find fret for a given string that matches the root note
            const getRootFretOnString = (stringNum, noteName) => {
                const chromatic = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
                const openStringNoteIndex = chromatic.indexOf(getNoteName(stringNum, 0));
                const targetNoteIndex = chromatic.indexOf(noteName);
                let fret = (targetNoteIndex - openStringNoteIndex + 12) % 12;
                if (fret < 2) fret += 12;
                if (fret > 14) fret -= 12; 
                return fret;
            };

            const calculateTriadNotes = useCallback((key, shapeKey) => {
                if (!shapeKey) return [];
                const shape = TRIAD_SHAPES[shapeKey];
                const rootStringIndex = shape.degrees.indexOf('R'); 
                const rootStringNum = shape.strings[rootStringIndex];
                const rootFret = getRootFretOnString(rootStringNum, key);

                return shape.strings.map((strNum, idx) => {
                    const offset = shape.offsets[idx];
                    return {
                        s: strNum,
                        fret: rootFret + offset,
                        degree: shape.degrees[idx],
                        type: shape.type,
                        id: `${strNum}-${rootFret + offset}`,
                        isVisible: true
                    };
                });
            }, []);

            // Generate Queue based on current settings
            const generateQueue = useCallback(() => {
                let questions = [];

                if (settings.mode === 'diatonic') {
                    // Diatonic Mode Generation
                    const availableIntervals = DIATONIC_INTERVALS.filter(d => targetDegrees.has(d.degreeName));
                    if (availableIntervals.length === 0) return [];

                    availableIntervals.forEach(interval => {
                         const targetRoot = getShiftedNote(diatonicKey, interval.offset);
                         const targetType = interval.type;
                         
                         // Find available shapes for this type
                         const shapes = Object.entries(TRIAD_SHAPES).filter(([key, shape]) => {
                             const setNum = key.startsWith('Set1') ? 1 : key.startsWith('Set2') ? 2 : key.startsWith('Set3') ? 3 : 4;
                             if (!settings.targetSets[setNum]) return false;
                             return shape.type === targetType;
                         });

                         shapes.forEach(([shapeKey, shapeDef]) => {
                             questions.push({
                                 targetRoot,
                                 targetType,
                                 targetDegreeName: interval.degreeName,
                                 centerKey: diatonicKey,
                                 shapeKey,
                                 shapeDef
                             });
                         });
                    });

                } else {
                    // Chromatic Mode Generation
                    const activeTypes = Object.keys(settings.targetTypes).filter(t => settings.targetTypes[t]);
                    const keysArray = Array.from(targetKeys);
                    if (activeTypes.length === 0 || keysArray.length === 0) return [];

                    keysArray.forEach(key => {
                        activeTypes.forEach(type => {
                            // Find shapes
                            const shapes = Object.entries(TRIAD_SHAPES).filter(([k, shape]) => {
                                 const setNum = k.startsWith('Set1') ? 1 : k.startsWith('Set2') ? 2 : k.startsWith('Set3') ? 3 : 4;
                                 if (!settings.targetSets[setNum]) return false;
                                 return shape.type === type;
                             });
                             
                             shapes.forEach(([shapeKey, shapeDef]) => {
                                 questions.push({
                                     targetRoot: key,
                                     targetType: type,
                                     targetDegreeName: '',
                                     centerKey: null,
                                     shapeKey,
                                     shapeDef
                                 });
                             });
                        });
                    });
                }

                // Shuffle (Fisher-Yates)
                for (let i = questions.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [questions[i], questions[j]] = [questions[j], questions[i]];
                }
                
                return questions;
            }, [settings, targetKeys, diatonicKey, targetDegrees]);

            const startTraining = useCallback(() => {
                // Initial Validations
                if (settings.mode === 'chromatic' && targetKeys.size === 0) {
                    alert("キーを少なくとも1つ選択してください。");
                    return;
                }
                if (settings.mode === 'diatonic' && targetDegrees.size === 0) {
                    alert("出題対象のコード(度数)を少なくとも1つ選択してください。");
                    return;
                }

                // Check and refill queue if needed
                if (questionQueue.current.length === 0) {
                    const newQueue = generateQueue();
                    if (newQueue.length === 0) {
                        alert("有効な問題パターンがありません。設定（セットやタイプ）を確認してください。");
                        return;
                    }
                    questionQueue.current = newQueue;
                }

                // Pop next question
                const q = questionQueue.current.pop();
                
                const setName = `Set ${q.shapeKey.charAt(3)} (${q.shapeDef.strings[2]}-${q.shapeDef.strings[0]}弦)`;
                const rootStringIdx = q.shapeDef.degrees.indexOf('R');
                const rootString = q.shapeDef.strings[rootStringIdx];
                
                let message = "";
                if (settings.level === 3) {
                    message = `[Lv.3] 正しい音名をドラッグして配置しよう`;
                } else if (settings.level === 2) {
                    message = `[Lv.2] 正しい度数をドラッグして配置しよう`;
                } else {
                    if (settings.mode === 'diatonic') {
                         message = `Key ${formatKeyLabel(q.centerKey)} の ${q.targetDegreeName} (${formatKeyLabel(q.targetRoot)} ${q.targetType==='Diminished'?'dim':q.targetType}) - ${setName}`;
                    } else {
                         message = `${formatKeyLabel(q.targetRoot)} ${q.targetType==='Diminished'?'dim':q.targetType} - ${setName}, Root ${rootString}弦`;
                    }
                }

                const question = {
                    key: q.targetRoot,
                    centerKey: q.centerKey,
                    degreeName: q.targetDegreeName,
                    shapeKey: q.shapeKey,
                    type: q.shapeDef.type, 
                    setName: setName,
                    rootString: rootString,
                    message: message,
                    targetNotes: calculateTriadNotes(q.targetRoot, q.shapeKey),
                    revealedNoteIds: new Set(),
                    mistake: false,
                    showHint: false,
                    remainingCount: questionQueue.current.length 
                };

                setCurrentQuestion(question);
                setTrainingStatus('playing');
                setFeedback(null);
            }, [settings, targetKeys, diatonicKey, targetDegrees, calculateTriadNotes, generateQueue]);

            // Space key for next
            useEffect(() => {
                if (trainingStatus !== 'cleared') return;
                const handleKeyDown = (e) => {
                    if (e.code === 'Space') {
                        e.preventDefault();
                        startTraining();
                    }
                };
                window.addEventListener('keydown', handleKeyDown);
                return () => window.removeEventListener('keydown', handleKeyDown);
            }, [trainingStatus, startTraining]);

            // --- Click Handler (Level 1) ---
            const handleFretClick = (stringNum, fretNum) => {
                if (trainingStatus !== 'playing' || !currentQuestion) return;
                if (settings.level !== 1) return; // Only Level 1 allows clicks

                const clickedNote = currentQuestion.targetNotes.find(n => n.s === stringNum && n.fret === fretNum);

                if (clickedNote) {
                    processCorrectAnswer(clickedNote);
                } else {
                    processMistake();
                }
            };

            // --- Drag & Drop Logic (Level 2 & 3) ---
            const handlePointerDown = (e, degree, label) => {
                if (trainingStatus !== 'playing' || settings.level === 1) return;
                e.preventDefault();
                // マウス/タッチ座標を取得
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;

                setDragState({
                    isDragging: true,
                    degree: degree, // Internal value (e.g. 'C#', 'R', '3')
                    label: label,   // Display label (e.g. 'D♭', 'R', '3')
                    x: clientX,
                    y: clientY
                });
            };

            const handlePointerMove = (e) => {
                if (!dragState.isDragging) return;
                e.preventDefault();
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                setDragState(prev => ({ ...prev, x: clientX, y: clientY }));
            };

            const handlePointerUp = (e) => {
                if (!dragState.isDragging) return;
                e.preventDefault();

                // 座標取得
                let clientX = 0;
                let clientY = 0;

                if (e.changedTouches && e.changedTouches.length > 0) {
                     clientX = e.changedTouches[0].clientX;
                     clientY = e.changedTouches[0].clientY;
                } else {
                     clientX = e.clientX;
                     clientY = e.clientY;
                }

                // ドロップ位置の要素を特定
                const element = document.elementFromPoint(clientX, clientY);
                const fretCell = element?.closest('[data-s]');
                
                if (fretCell) {
                    const stringNum = parseInt(fretCell.getAttribute('data-s'));
                    const fretNum = parseInt(fretCell.getAttribute('data-f'));
                    const targetNote = currentQuestion.targetNotes.find(n => n.s === stringNum && n.fret === fretNum);
                    
                    if (targetNote) {
                        let isCorrect = false;
                        if (settings.level === 2) {
                            // Check Degree ('R', '3', etc.)
                            isCorrect = (targetNote.degree === dragState.degree);
                        } else if (settings.level === 3) {
                            // Check Note Name ('C', 'C#', etc.)
                            const actualNote = getNoteName(stringNum, fretNum);
                            isCorrect = (actualNote === dragState.degree);
                        }

                        if (isCorrect) {
                            processCorrectAnswer(targetNote);
                        } else {
                            processMistake(settings.level === 3 ? "音が違うよ！" : "度数が違うよ！");
                        }
                    } else {
                        processMistake();
                    }
                }

                setDragState({ isDragging: false, degree: null, label: null, x: 0, y: 0 });
            };

            // --- Common Success/Fail Logic ---
            const processCorrectAnswer = (note) => {
                if (currentQuestion.revealedNoteIds.has(note.id)) return;

                const newRevealed = new Set(currentQuestion.revealedNoteIds);
                newRevealed.add(note.id);

                const allIds = currentQuestion.targetNotes.map(n => n.id);
                const isComplete = allIds.every(id => newRevealed.has(id));

                if (isComplete) {
                    setCurrentQuestion(prev => ({ 
                        ...prev, 
                        revealedNoteIds: newRevealed, 
                        message: "Excellent! クリア！",
                        mistake: false
                    }));
                    setTrainingStatus('cleared');

                    if (isSpeedMode) {
                        setTimeout(() => startTraining(), 400);
                    }
                } else {
                    setCurrentQuestion(prev => ({ 
                        ...prev, 
                        revealedNoteIds: newRevealed, 
                        mistake: false 
                    }));
                }
            };

            const processMistake = (msg = "不正解...") => {
                setFeedback(msg);
                setCurrentQuestion(prev => ({ ...prev, mistake: true }));
                setTimeout(() => {
                    setFeedback(null);
                    setCurrentQuestion(prev => ({ ...prev, mistake: false }));
                }, 800);
            };

            // Effect for global pointer events during drag
            useEffect(() => {
                if (dragState.isDragging) {
                    window.addEventListener('mousemove', handlePointerMove);
                    window.addEventListener('mouseup', handlePointerUp);
                    window.addEventListener('touchmove', handlePointerMove, { passive: false });
                    window.addEventListener('touchend', handlePointerUp);
                }
                return () => {
                    window.removeEventListener('mousemove', handlePointerMove);
                    window.removeEventListener('mouseup', handlePointerUp);
                    window.removeEventListener('touchmove', handlePointerMove);
                    window.removeEventListener('touchend', handlePointerUp);
                };
            }, [dragState.isDragging]);

            const toggleSet = (num) => setSettings(prev => ({ ...prev, targetSets: { ...prev.targetSets, [num]: !prev.targetSets[num] } }));
            const toggleType = (type) => setSettings(prev => ({ ...prev, targetTypes: { ...prev.targetTypes, [type]: !prev.targetTypes[type] } }));

            const getDisplayNotes = () => {
                if (!currentQuestion) return [];
                return currentQuestion.targetNotes.map(n => ({
                    ...n,
                    isVisible: currentQuestion.revealedNoteIds.has(n.id) || trainingStatus === 'cleared'

            const activeStrings = useMemo(() => {
                if (!currentQuestion) return null;
                const shape = TRIAD_SHAPES[currentQuestion.shapeKey];
                return shape ? shape.strings : null;

            // Level 2 & 3 Draggable Tokens
            const getDraggableTokens = () => {

                    return KEYS.map(note => ({

                        tokens.push({ value: '3', label: '3', colorClass: 'bg-orange-500' });
                        tokens.push({ value: '5', label: '5', colorClass: 'bg-orange-500' });
                    } else if (currentQuestion.type === 'Minor') {
                        tokens.push({ value: 'b3', label: 'b3', colorClass: 'bg-blue-500' });
                        tokens.push({ value: '5', label: '5', colorClass: 'bg-blue-500' });
                    } else if (currentQuestion.type === 'Diminished') {
                        tokens.push({ value: 'b3', label: 'b3', colorClass: 'bg-purple-600' });
                        tokens.push({ value: 'b5', label: 'b5', colorClass: 'bg-purple-600' });
                    }
                    return tokens;
                }
                return [];
            };

            return (
                <div className="flex flex-col items-center p-4 min-h-screen font-sans text-gray-800">
                    <div className="w-full max-w-4xl flex justify-between items-center mb-6 border-b border-gray-300 pb-4 sticky top-0 bg-[#f3f4f6] z-50 pt-2">
                        <h1 className="text-xl font-bold text-gray-800 tracking-tight">🎸 トライアド・マスター</h1>
                    </div>

                    <div className="w-full flex flex-col items-center max-w-5xl relative">
                        
                        {/* Settings Panel */}
                        {trainingStatus === 'idle' && (
                            <div className="bg-white p-6 rounded-2xl shadow-xl border w-full max-w-lg animate-pop-in">
                                <h2 className="text-xl font-black mb-6 text-center text-gray-700 flex items-center justify-center gap-2">
                                    <span>⚙️</span> トレーニング設定
                                </h2>
                                
                                <div className="space-y-6">
                                    
                                    {/* Mode Selection */}
                                    <div className="bg-blue-50 p-3 rounded-xl border border-blue-200">

                                        <div className="flex gap-2">
                                            <button 
                                                onClick={() => setSettings(s => ({...s, mode: 'diatonic'}))}
                                                className={`flex-1 py-2 px-3 rounded-lg text-sm font-bold transition-all ${
                                                    settings.mode === 'diatonic' ? 'bg-blue-600 text-white shadow-md' : 'bg-white text-gray-500 border'

                                            >

                                                className={`flex-1 py-2 px-3 rounded-lg text-sm font-bold transition-all ${
                                                    settings.mode === 'chromatic' ? 'bg-gray-600 text-white shadow-md' : 'bg-white text-gray-500 border'

                                            >
                                                Chromatic (ランダム)

                                                <div className="grid grid-cols-4 gap-2">
                                                    {DIATONIC_INTERVALS.map(d => (

                                                                    ? (d.type === 'Major' ? 'bg-orange-50 border-orange-400 text-orange-700' : d.type === 'Minor' ? 'bg-blue-50 border-blue-400 text-blue-700' : 'bg-purple-50 border-purple-400 text-purple-700')
                                                                    : 'bg-white border-gray-200 text-gray-400 opacity-60'

                                                        >
                                                            <span className="font-bold text-sm">{d.degreeName}</span>
                                                            <span className="text-[10px] opacity-70">{d.type === 'Diminished' ? 'dim' : d.type}</span>
                                                        </button>
                                                    ))}
                                                </div>
                                            </div>
                                        </>
                                    )}

                                    {/* --- CHROMATIC MODE SPECIFIC UI --- */}
                                    {settings.mode === 'chromatic' && (
                                        <>
                                            <div>
                                                <div className="flex justify-between items-end mb-3">
                                                    <label className="text-xs font-bold text-gray-400 uppercase tracking-wider">Target Roots (Multiple)</label>
                                                    <div className="flex gap-2 items-center">
                                                        <div className="flex items-center bg-gray-50 rounded border border-gray-200 px-1 py-0.5">
                                                            <input

                                                                onChange={(e) => setRandomCount(parseInt(e.target.value) || 4)}

                                                            <button onClick={selectRandomKeys} className="text-xs font-bold text-blue-600 px-2 py-1 hover:bg-blue-100 rounded transition-colors">
                                                                ランダム

                                                <div className="grid grid-cols-4 gap-2">
                                                    {KEYS.map(k => (
                                                        <button
                                                            key={k}

                                                            className={`py-2 rounded-lg border flex items-center justify-center gap-2 transition-all active:scale-95 ${
                                                                targetKeys.has(k) 
                                                                    ? 'bg-blue-50 border-blue-500 text-blue-700 font-bold shadow-sm' 
                                                                    : 'bg-white border-gray-200 text-gray-500 hover:bg-gray-50'
                                                            }`}
                                                        >
                                                            <div className={`w-4 h-4 rounded border flex items-center justify-center transition-colors ${
                                                                targetKeys.has(k) ? 'bg-blue-500 border-blue-500' : 'border-gray-300 bg-white'
                                                            }`}>
                                                                {targetKeys.has(k) && <svg className="w-3 h-3 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={3} d="M5 13l4 4L19 7" /></svg>}
                                                            </div>

                                                                settings.targetTypes[type]
                                                                    ? (type === 'Major' ? 'border-orange-500 bg-orange-50 text-orange-600' : type === 'Minor' ? 'border-blue-500 bg-blue-50 text-blue-600' : 'border-purple-500 bg-purple-50 text-purple-600')
                                                                    : 'border-gray-200 text-gray-400'
                                                            }`}
                                                        >
                                                            {settings.targetTypes[type] && '✓ '}{type}
                                                        </button>
                                                    ))}
                                                </div>
                                            </div>

                                    )}

                                    <div className="h-px bg-gray-100 w-full my-4"></div>

                                    <div>

                                        <div className="grid grid-cols-2 gap-3">

                                    {/* Speed Mode Toggle */}

                                            >
                                                次へ (Space)
                                            </button>
                                        )
                                    ) : (
                                        <>
                                            <button 
                                                onClick={() => {
                                                    const allIds = currentQuestion.targetNotes.map(n => n.id);
                                                    setCurrentQuestion(prev => ({ ...prev, revealedNoteIds: new Set(allIds), message: "答え", showHint: false }));
                                                    setTrainingStatus('cleared');
                                                }}
                                                className="text-gray-400 text-sm font-bold hover:text-red-500 transition-colors"
                                            >
                                                ギブアップ
                                            </button>
                                        </>
                                    )}
                                </div>

                                {/* Fretboard */}
                                <div className="relative">
                                    <FretboardUI 
                                        notes={getDisplayNotes()}
                                        displayMode="degree"
                                        onFretClick={handleFretClick}
                                        highlightShake={currentQuestion.mistake}
                                        activeSetStrings={activeStrings}
                                    />

                                    {/* Draggable Tokens Panel (Lv.2 & Lv.3) */}
                                    {settings.level > 1 && trainingStatus !== 'cleared' && (
                                        <div className="mt-8 flex flex-wrap justify-center gap-4 animate-fade-in p-4 bg-gray-100 rounded-xl shadow-inner border border-gray-200 select-none max-w-4xl">
                                            {/* Degrees/Notes to drag */}
                                            {getDraggableTokens().map(token => (
                                                <div 
                                                    key={token.label}
                                                    className="flex flex-col items-center gap-2 cursor-grab active:cursor-grabbing"
                                                    onMouseDown={(e) => handlePointerDown(e, token.value, token.label)}
                                                    onTouchStart={(e) => handlePointerDown(e, token.value, token.label)}
                                                >
                                                    <div className={`
                                                        w-12 h-12 rounded-full flex items-center justify-center text-lg font-black text-white shadow-lg transform transition-transform hover:scale-110
                                                        ${token.colorClass}
                                                    `}>
                                                        {token.label}
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    )}
                                </div>
                                
                                <button 
                                    onClick={() => setTrainingStatus('idle')}
                                    className="mt-10 text-gray-400 text-sm font-bold hover:text-gray-600 underline"
                                >
                                    設定に戻る
                                </button>
                            </div>
                        )}

                        {/* Dragging Preview (Floating Element) */}
                        {dragState.isDragging && (
                            <div 
                                className="fixed w-12 h-12 rounded-full flex items-center justify-center text-lg font-black text-white shadow-2xl z-50 pointer-events-none"
                                style={{ 
                                    left: dragState.x, 
                                    top: dragState.y, 
                                    transform: 'translate(-50%, -50%)',
                                    backgroundColor: settings.level === 3 ? '#4f46e5' : dragState.degree === 'R' ? '#dc2626' : '#f97316'
                                }}
                            >
                                {dragState.label}
                            </div>
                        )}

                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
