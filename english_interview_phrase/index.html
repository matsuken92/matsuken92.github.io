<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>英語面接フレーズ暗記トレーナー</title>
<style>
  :root {
    --bg: #f4f6fa;
    --card-bg: #ffffff;
    --text: #1a2233;
    --sub: #6b7280;
    --accent: #2563eb;
    --green: #16a34a;
    --red: #dc2626;
    --border: #e2e8f0;
    --shadow: 0 4px 16px rgba(20, 30, 60, .08);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, system-ui, sans-serif;
    background: var(--bg); color: var(--text);
    min-height: 100vh;
  }
  .container { max-width: 640px; margin: 0 auto; padding: 16px 16px 48px; }

  header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  header h1 { font-size: 1.05rem; font-weight: 700; }
  nav { display: flex; gap: 6px; margin-bottom: 16px; }
  nav button {
    flex: 1; padding: 9px 0; border: 1px solid var(--border); background: var(--card-bg);
    border-radius: 8px; font-size: .9rem; cursor: pointer; color: var(--sub); font-weight: 600;
  }
  nav button.active { background: var(--accent); color: #fff; border-color: var(--accent); }

  /* ---- study ---- */
  .filters { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
  .filters select, .filters label {
    font-size: .85rem; padding: 7px 10px; border: 1px solid var(--border); border-radius: 8px;
    background: var(--card-bg); color: var(--text);
  }
  .filters select { flex: 1; min-width: 200px; }
  .filters label { display: flex; align-items: center; gap: 6px; cursor: pointer; user-select: none; }
  #chunkBar button {
    font-size: .82rem; padding: 7px 12px; border: 1px solid var(--border); border-radius: 8px;
    background: var(--card-bg); cursor: pointer; color: var(--sub); font-weight: 600;
  }

  #card {
    background: var(--card-bg); border-radius: 16px; box-shadow: var(--shadow);
    min-height: 260px; display: flex; flex-direction: column; justify-content: center;
    padding: 28px 24px; cursor: pointer; position: relative; border: 1px solid var(--border);
  }
  #card .cat { position: absolute; top: 14px; left: 18px; font-size: .72rem; color: var(--sub);
    background: var(--bg); padding: 3px 10px; border-radius: 999px; }
  #card .star { position: absolute; top: 11px; right: 16px; font-size: 1rem; color: #f59e0b; }
  #card .level { position: absolute; bottom: 12px; right: 16px; font-size: .72rem; color: var(--sub); }
  #card .front { font-size: 1.25rem; font-weight: 700; line-height: 1.7; text-align: center; }
  #card .back {
    margin-top: 20px; padding-top: 20px; border-top: 1px dashed var(--border);
    font-size: 1.2rem; line-height: 1.6; text-align: center; color: var(--accent); font-weight: 600;
    font-family: Georgia, "Times New Roman", serif;
  }
  #card .hint { margin-top: 24px; text-align: center; font-size: .8rem; color: var(--sub); }

  .answer-btns { display: flex; gap: 12px; margin-top: 16px; }
  .answer-btns button {
    flex: 1; padding: 16px 0; font-size: 1rem; font-weight: 700; border: none;
    border-radius: 12px; cursor: pointer; color: #fff; box-shadow: var(--shadow);
  }
  .answer-btns .ok { background: var(--green); }
  .answer-btns .ng { background: var(--red); }
  .answer-btns button:disabled { opacity: .35; cursor: default; }
  .answer-btns button:active:not(:disabled) { transform: scale(.97); }

  .study-actions { display: flex; justify-content: center; margin-top: 10px; }
  .study-actions button {
    padding: 9px 14px; font-size: .82rem; font-weight: 600; color: var(--sub);
    border: 1px solid var(--border); border-radius: 9px; background: var(--card-bg);
    cursor: pointer;
  }
  .study-actions button:hover:not(:disabled) { color: var(--red); border-color: var(--red); }
  .study-actions button:disabled { opacity: .35; cursor: default; }

  .session-bar { margin-top: 14px; font-size: .82rem; color: var(--sub); text-align: center; }
  .session-bar b.g { color: var(--green); } .session-bar b.r { color: var(--red); }

  /* ---- stats ---- */
  .panel { background: var(--card-bg); border-radius: 14px; border: 1px solid var(--border);
    box-shadow: var(--shadow); padding: 18px; margin-bottom: 14px; }
  .panel h2 { font-size: .95rem; margin-bottom: 12px; }
  .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .kpi { text-align: center; background: var(--bg); border-radius: 10px; padding: 10px 4px; }
  .kpi .v { font-size: 1.25rem; font-weight: 800; }
  .kpi .l { font-size: .68rem; color: var(--sub); margin-top: 2px; }
  table { width: 100%; border-collapse: collapse; font-size: .82rem; }
  th, td { padding: 7px 6px; border-bottom: 1px solid var(--border); text-align: left; }
  th { color: var(--sub); font-weight: 600; font-size: .75rem; }
  td.num, th.num { text-align: right; }
  .bar-bg { background: var(--bg); border-radius: 4px; height: 8px; overflow: hidden; width: 100%; }
  .bar-fg { height: 100%; background: var(--green); border-radius: 4px; }
  .cardlist-item { padding: 9px 0; border-bottom: 1px solid var(--border); font-size: .84rem; }
  .cardlist-item .en { color: var(--accent); font-size: .8rem; margin-top: 2px; }
  .cardlist-item .meta { color: var(--sub); font-size: .72rem; margin-top: 2px; }

  /* ---- hidden cards ---- */
  .hidden-panel-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
  .hidden-panel-head h2 { margin-bottom: 0; }
  .restore-all-btn, .restore-btn {
    padding: 7px 11px; font-size: .78rem; font-weight: 600; border: 1px solid var(--accent);
    border-radius: 8px; background: var(--card-bg); color: var(--accent); cursor: pointer;
  }
  .restore-all-btn:disabled { opacity: .35; cursor: default; }
  .hidden-card-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .hidden-card-item:last-child { border-bottom: none; }
  .hidden-card-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
  .hidden-card-text { min-width: 0; flex: 1; }
  .hidden-card-item .jp { font-size: .86rem; line-height: 1.5; }
  .hidden-card-item .en { color: var(--accent); font-size: .82rem; line-height: 1.45; margin-top: 4px;
    font-family: Georgia, "Times New Roman", serif; }
  .hidden-card-item .meta { color: var(--sub); font-size: .7rem; margin-top: 5px; }

  /* ---- log ---- */
  .log-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
  .log-actions button, .log-actions label.filebtn {
    padding: 9px 14px; font-size: .84rem; border: 1px solid var(--border); border-radius: 8px;
    background: var(--card-bg); cursor: pointer; font-weight: 600; color: var(--text);
  }
  .log-actions .primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .log-actions .danger { color: var(--red); border-color: var(--red); }
  .log-entry { display: flex; justify-content: space-between; gap: 10px; padding: 8px 2px;
    border-bottom: 1px solid var(--border); font-size: .8rem; }
  .log-entry .res-ok { color: var(--green); font-weight: 700; }
  .log-entry .res-ng { color: var(--red); font-weight: 700; }
  .log-entry .t { color: var(--sub); white-space: nowrap; }
  .muted { color: var(--sub); font-size: .82rem; text-align: center; padding: 20px 0; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>🎤 英語面接フレーズ暗記トレーナー</h1>
  </header>

  <nav>
    <button id="tab-study" class="active">学習</button>
    <button id="tab-stats">統計</button>
    <button id="tab-hidden">非表示</button>
    <button id="tab-log">ログ</button>
  </nav>

  <!-- ============ 学習 ============ -->
  <section id="view-study">
    <div class="filters" id="modeRow" style="margin-bottom:8px">
      <label><input type="radio" name="qmode" value="all">全体から出題</label>
      <label><input type="radio" name="qmode" value="chunk">チャンクレッスン(5個ずつ)</label>
    </div>
    <div class="filters" id="deckFilters" style="margin-bottom:8px"></div>
    <div class="filters">
      <select id="sectionFilter" class="hidden"><option value="">すべてのセクション</option></select>
      <select id="catFilter"><option value="">すべてのカテゴリ</option></select>
      <label><input type="checkbox" id="starOnly">★のみ</label>
      <label><input type="checkbox" id="weakOnly">苦手のみ</label>
    </div>
    <div class="filters hidden" id="chunkBar">
      <select id="chunkSelect" style="flex:1;min-width:0"></select>
      <button id="chunkReset">進捗リセット</button>
    </div>

    <div id="card">
      <span class="cat" id="cardCat"></span>
      <span class="star" id="cardStar"></span>
      <div class="front" id="cardFront"></div>
      <div class="back hidden" id="cardBack"></div>
      <div class="hint" id="cardHint">タップして英語を表示</div>
      <span class="level" id="cardLevel"></span>
    </div>

    <div class="answer-btns">
      <button class="ng" id="btnNg" disabled>✗ 間違えた</button>
      <button class="ok" id="btnOk" disabled>✓ 覚えた</button>
    </div>
    <div class="study-actions">
      <button id="btnHideCard" disabled>🚫 この問題を今後出題しない</button>
    </div>

    <div class="session-bar" id="sessionBar"></div>
  </section>

  <!-- ============ 統計 ============ -->
  <section id="view-stats" class="hidden">
    <div class="panel">
      <h2>全体サマリー</h2>
      <div class="kpis">
        <div class="kpi"><div class="v" id="kpiTotal">0</div><div class="l">総回答数</div></div>
        <div class="kpi"><div class="v" id="kpiAcc">-</div><div class="l">正答率</div></div>
        <div class="kpi"><div class="v" id="kpiMastered">0</div><div class="l">習得済み</div></div>
        <div class="kpi"><div class="v" id="kpiUnseen">0</div><div class="l">未学習</div></div>
      </div>
    </div>
    <div class="panel">
      <h2>カテゴリ別</h2>
      <table id="catTable">
        <thead><tr><th>カテゴリ</th><th class="num">回答</th><th class="num">正答率</th><th style="width:30%">習得度</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
    <div class="panel">
      <h2>苦手フレーズ(間違いが多い順)</h2>
      <div id="weakList"></div>
    </div>
  </section>

  <!-- ============ 非表示カード ============ -->
  <section id="view-hidden" class="hidden">
    <div class="panel">
      <div class="hidden-panel-head">
        <h2>非表示の問題 <span id="hiddenCount" style="color:var(--sub);font-weight:400;font-size:.8rem"></span></h2>
        <button id="btnRestoreAll" class="restore-all-btn" disabled>すべて戻す</button>
      </div>
      <div id="hiddenList"></div>
    </div>
  </section>

  <!-- ============ ログ ============ -->
  <section id="view-log" class="hidden">
    <div class="log-actions">
      <button class="primary" id="btnExport">📤 書き出し (JSON)</button>
      <label class="filebtn">📥 読み込み<input type="file" id="importFile" accept=".json" style="display:none"></label>
      <button class="danger" id="btnReset">🗑 全データ削除</button>
    </div>
    <div class="panel">
      <h2>学習履歴 <span id="logCount" style="color:var(--sub);font-weight:400;font-size:.8rem"></span></h2>
      <div id="logList"></div>
    </div>
  </section>
</div>

CARDS2.forEach(c => c.deck = "deck2");
CARDS3.forEach(c => c.deck = "deck3");
const CARDS = [...CARDS1, ...CARDS2, ...CARDS3];

/* ================= 永続化 ================= */
const STORE_KEY = "phrase_trainer_v1";
const MAX_BOX = 5;

function defaultState() {
  return { version: 1, deck: "english_interview_survival_phrases", cards: {}, log: [] };
}
function loadState() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) {
      const s = JSON.parse(raw);
      if (s && typeof s === "object" && s.cards) return Object.assign(defaultState(), s);
    }
  } catch (e) { console.warn("state load failed", e); }
  return defaultState();
}
function saveState() { localStorage.setItem(STORE_KEY, JSON.stringify(state)); }

let state = loadState();

/* ================= デッキ選択 (チェックボックス) ================= */
const DECK_KEY = "phrase_trainer_decks_v1";
function loadDeckSel() {
  const sel = {};
  DECKS.forEach(d => sel[d.id] = true);
  try {
    const raw = localStorage.getItem(DECK_KEY);
    if (raw) {
      const saved = JSON.parse(raw);
      DECKS.forEach(d => { if (typeof saved[d.id] === "boolean") sel[d.id] = saved[d.id]; });
    }
  } catch (e) { /* デフォルトのまま */ }
  return sel;
}
let deckSel = loadDeckSel();
function saveDeckSel() { localStorage.setItem(DECK_KEY, JSON.stringify(deckSel)); }
function activeCards() { return CARDS.filter(c => deckSel[c.deck]); }
function isHiddenCard(c) {
  const s = state.cards[c.id];
  return !!(s && s.hidden);
}
function visibleActiveCards() { return activeCards().filter(c => !isHiddenCard(c)); }
function sectionCards() {
  const sec = document.getElementById("sectionFilter").value;
  return visibleActiveCards().filter(c => !sec || c.section === sec);
}

/* ================= 出題モード (全体ランダム / チャンクレッスン) ================= */
const MODE_KEY = "phrase_trainer_mode_v1";
const CHUNK_SIZE = 5;
function loadMode() {
  try {
    const m = JSON.parse(localStorage.getItem(MODE_KEY));
    if (m && (m.mode === "all" || m.mode === "chunk")) return { mode: m.mode, chunkIdx: m.chunkIdx | 0 };
  } catch (e) { /* デフォルトのまま */ }
  return { mode: "all", chunkIdx: 0 };
}
let qmode = loadMode();
function saveMode() { localStorage.setItem(MODE_KEY, JSON.stringify(qmode)); }

function cardStat(id) {
  if (!state.cards[id]) state.cards[id] = { ok: 0, ng: 0, box: 0, last: null };
  return state.cards[id];
}

/* ================= 出題ロジック =================
   box = 連続正解レベル (0〜5)。覚えた→+1、間違えた→0にリセット。
   出題重み = 0.5^box。つまり覚えるほど出題確率が下がる (box5で1/32)。
   間違いが多いカードはさらに重みを加算。直前のカードは連続出題しない。 */
let currentCard = null;
let revealed = false;
let session = { ok: 0, ng: 0 };

function eligibleCards() {
  const cat = document.getElementById("catFilter").value;
  const starOnly = document.getElementById("starOnly").checked;
  const weakOnly = document.getElementById("weakOnly").checked;
  return sectionCards().filter(c => {
    if (cat && c.cat !== cat) return false;
    if (starOnly && !c.star) return false;
    if (weakOnly) {
      const s = state.cards[c.id];
      if (!s || s.ng === 0 || s.box >= 3) return false;
    }
    return true;
  });
}

function weightOf(c) {
  const s = state.cards[c.id] || { ok: 0, ng: 0, box: 0 };
  let w = Math.pow(0.5, Math.min(s.box, MAX_BOX));
  if (s.ok + s.ng === 0) w *= 1.5;               // 未学習カードを優先
  w *= 1 + Math.min(s.ng, 5) * 0.3;              // 間違いが多いほど出やすく
  return w;
}

function pickAllCard() {
  let pool = eligibleCards();
  if (pool.length === 0) return null;
  if (pool.length > 1 && currentCard) pool = pool.filter(c => c.id !== currentCard.id);
  const total = pool.reduce((a, c) => a + weightOf(c), 0);
  let r = Math.random() * total;
  for (const c of pool) { r -= weightOf(c); if (r <= 0) return c; }
  return pool[pool.length - 1];
}

/* ---- チャンクレッスン: 5枚ずつのセクションに分割し、
   セクション内の全カードを「覚えた」(✓)にしたら次のセクションへ進む ---- */
function chunkPools() {
  const pool = eligibleCards();
  const out = [];
  for (let i = 0; i < pool.length; i += CHUNK_SIZE) out.push(pool.slice(i, i + CHUNK_SIZE));
  return out;
}
function isCleared(c) { const s = state.cards[c.id]; return !!(s && s.cc); }
function clearedIn(chunk) { return chunk.filter(isCleared).length; }
function firstIncompleteChunk(chunks) {
  const i = chunks.findIndex(ch => ch.some(c => !isCleared(c)));
  return i === -1 ? 0 : i;
}

function pickChunkCard() {
  const chunks = chunkPools();
  if (chunks.length === 0) return null;
  qmode.chunkIdx = Math.min(qmode.chunkIdx, chunks.length - 1);
  const chunk = chunks[qmode.chunkIdx];
  const remaining = chunk.filter(c => !isCleared(c));
  if (remaining.length === 0) return "COMPLETE";
  if (currentCard) {
    const i = remaining.findIndex(c => c.id === currentCard.id);
    if (i >= 0 && remaining.length > 1) return remaining[(i + 1) % remaining.length];
    if (i < 0) {
      // 直前のカードはクリア済み → チャンク内の順序で次の未クリアカードへ
      const after = chunk.findIndex(c => c.id === currentCard.id);
      for (let k = 1; k <= chunk.length; k++) {
        const cand = chunk[(after + k) % chunk.length];
        if (!isCleared(cand)) return cand;
      }
    }
  }
  return remaining[0];
}

function pickCard() {
  return qmode.mode === "chunk" ? pickChunkCard() : pickAllCard();
}

/* ================= 学習画面 ================= */
const $ = id => document.getElementById(id);

let chunkDone = false;

function showCard(c) {
  chunkDone = c === "COMPLETE";
  currentCard = chunkDone ? null : c;
  revealed = false;
  if (chunkDone) {
    const anyLeft = chunkPools().some(ch => ch.some(x => !isCleared(x)));
    $("cardCat").textContent = "チャンクレッスン";
    $("cardStar").textContent = "";
    $("cardFront").textContent = anyLeft
      ? `🎉 セクション ${qmode.chunkIdx + 1} 完了!`
      : "🏆 全セクション習得済み!";
    $("cardBack").classList.add("hidden");
    $("cardHint").textContent = anyLeft
      ? "タップで次のセクションへ進みます"
      : "「進捗リセット」で最初からやり直せます";
    $("cardLevel").textContent = "";
  } else if (!c) {
    $("cardCat").textContent = "";
    $("cardStar").textContent = "";
    $("cardFront").textContent = "該当するカードがありません";
    $("cardBack").classList.add("hidden");
    $("cardHint").textContent = "デッキまたはフィルタ条件を確認してください";
    $("cardLevel").textContent = "";
  } else {
    const s = state.cards[c.id];
    $("cardCat").textContent = c.section ? `${c.section}｜${c.cat}` : c.cat;
    $("cardStar").textContent = c.star ? "★" : "";
    $("cardFront").textContent = c.front;
    $("cardBack").textContent = c.back;
    $("cardBack").classList.add("hidden");
    $("cardHint").textContent = "タップして英語を表示";
    $("cardLevel").textContent = "習得Lv " + (s ? s.box : 0) + "/" + MAX_BOX;
  }
  $("btnOk").disabled = true;
  $("btnNg").disabled = true;
  $("btnHideCard").disabled = !currentCard;
  updateChunkUI();
  updateSessionBar();
}

function advanceChunk() {
  const chunks = chunkPools();
  const next = chunks.findIndex(ch => ch.some(c => !isCleared(c)));
  if (next >= 0) { qmode.chunkIdx = next; saveMode(); }
  currentCard = null;
  showCard(pickCard());
}

function reveal() {
  if (chunkDone) { advanceChunk(); return; }
  if (!currentCard || revealed) return;
  revealed = true;
  $("cardBack").classList.remove("hidden");
  $("cardHint").textContent = "覚えていたら「覚えた」、出てこなかったら「間違えた」";
  $("btnOk").disabled = false;
  $("btnNg").disabled = false;
}

function answer(ok) {
  if (!currentCard || !revealed) return;
  const s = cardStat(currentCard.id);
  if (ok) { s.ok++; s.box = Math.min(s.box + 1, MAX_BOX); session.ok++; if (qmode.mode === "chunk") s.cc = true; }
  else    { s.ng++; s.box = 0; session.ng++; s.cc = false; }
  s.last = new Date().toISOString();
  state.log.push({ t: s.last, id: currentCard.id, r: ok ? "ok" : "ng" });
  if (state.log.length > 5000) state.log = state.log.slice(-5000);
  saveState();
  showCard(pickCard());
}

function hideCurrentCard() {
  if (!currentCard) return;
  const s = cardStat(currentCard.id);
  s.hidden = true;
  s.hiddenAt = new Date().toISOString();
  saveState();
  currentCard = null;
  rebuildSectionOptions();
  rebuildCatOptions();
  if (qmode.mode === "chunk") {
    qmode.chunkIdx = Math.min(qmode.chunkIdx, Math.max(chunkPools().length - 1, 0));
    saveMode();
  }
  showCard(pickCard());
}

function restoreCard(id) {
  const s = state.cards[id];
  if (!s) return;
  s.hidden = false;
  delete s.hiddenAt;
  // チャンク学習に戻した際、再び出題対象になるようにする
  s.cc = false;
  saveState();
  rebuildSectionOptions();
  rebuildCatOptions();
  renderHidden();
}

function updateChunkUI() {
  $("chunkBar").classList.toggle("hidden", qmode.mode !== "chunk");
  if (qmode.mode !== "chunk") return;
  const chunks = chunkPools();
  const sel = $("chunkSelect");
  sel.innerHTML = "";
  if (chunks.length === 0) {
    const o = document.createElement("option");
    o.textContent = "カードなし";
    sel.appendChild(o);
    return;
  }
  qmode.chunkIdx = Math.min(qmode.chunkIdx, chunks.length - 1);
  chunks.forEach((ch, i) => {
    const done = clearedIn(ch);
    const o = document.createElement("option");
    o.value = i;
    o.textContent = `セクション ${i + 1} (${done}/${ch.length})` + (done === ch.length ? " ✓" : "");
    sel.appendChild(o);
  });
  sel.value = qmode.chunkIdx;
}

function updateSessionBar() {
  const n = session.ok + session.ng;
  $("sessionBar").innerHTML = n === 0
    ? "今回のセッション: まだ回答なし"
    : `今回のセッション: ${n}問 — <b class="g">覚えた ${session.ok}</b> / <b class="r">間違えた ${session.ng}</b>`;
}

/* ================= 統計画面 ================= */
function renderStats() {
  const cards = visibleActiveCards();
  let total = 0, ok = 0, mastered = 0, unseen = 0;
  const byCat = {};
  for (const c of cards) {
    const s = state.cards[c.id];
    const n = s ? s.ok + s.ng : 0;
    total += n; ok += s ? s.ok : 0;
    if (s && s.box >= MAX_BOX) mastered++;
    if (n === 0) unseen++;
    if (!byCat[c.cat]) byCat[c.cat] = { n: 0, ok: 0, boxSum: 0, cards: 0 };
    const b = byCat[c.cat];
    b.n += n; b.ok += s ? s.ok : 0; b.boxSum += s ? s.box : 0; b.cards++;
  }
  $("kpiTotal").textContent = total;
  $("kpiAcc").textContent = total ? Math.round(ok / total * 100) + "%" : "-";
  $("kpiMastered").textContent = mastered + "/" + cards.length;
  $("kpiUnseen").textContent = unseen;

  const tbody = $("catTable").querySelector("tbody");
  tbody.innerHTML = "";
  for (const [cat, b] of Object.entries(byCat)) {
    const acc = b.n ? Math.round(b.ok / b.n * 100) + "%" : "-";
    const mastery = Math.round(b.boxSum / (b.cards * MAX_BOX) * 100);
    const tr = document.createElement("tr");
    tr.innerHTML = `<td>${cat}</td><td class="num">${b.n}</td><td class="num">${acc}</td>
      <td><div class="bar-bg"><div class="bar-fg" style="width:${mastery}%"></div></div></td>`;
    tbody.appendChild(tr);
  }

  const weak = cards
    .map(c => ({ c, s: state.cards[c.id] }))
    .filter(x => x.s && x.s.ng > 0)
    .sort((a, b) => b.s.ng - a.s.ng || a.s.box - b.s.box)
    .slice(0, 10);
  $("weakList").innerHTML = weak.length === 0
    ? '<div class="muted">間違えたカードはまだありません</div>'
    : weak.map(x => `<div class="cardlist-item">
        <div>${x.c.front}</div>
        <div class="en">${x.c.back}</div>
        <div class="meta">✗ ${x.s.ng}回 / ✓ ${x.s.ok}回 — 習得Lv ${x.s.box}/${MAX_BOX}</div>
      </div>`).join("");
}

/* ================= 非表示カード画面 ================= */
const deckTitleById = Object.fromEntries(DECKS.map(d => [d.id, d.title]));

function renderHidden() {
  const cards = CARDS
    .filter(isHiddenCard)
    .sort((a, b) => {
      const ta = state.cards[a.id]?.hiddenAt || "";
      const tb = state.cards[b.id]?.hiddenAt || "";
      return tb.localeCompare(ta);
    });

  $("hiddenCount").textContent = `(${cards.length}件)`;
  $("btnRestoreAll").disabled = cards.length === 0;
  $("hiddenList").innerHTML = cards.length === 0
    ? '<div class="muted">非表示にした問題はありません</div>'
    : cards.map(c => {
        const section = c.section ? ` / ${c.section}` : "";
        return `<div class="hidden-card-item">
          <div class="hidden-card-top">
            <div class="hidden-card-text">
              <div class="jp">${c.front}</div>
              <div class="en">${c.back}</div>
              <div class="meta">${deckTitleById[c.deck] || c.deck}${section} / ${c.cat}</div>
            </div>
            <button class="restore-btn" data-card-id="${c.id}">出題に戻す</button>
          </div>
        </div>`;
      }).join("");

  $("hiddenList").querySelectorAll(".restore-btn").forEach(btn => {
    btn.onclick = () => restoreCard(btn.dataset.cardId);
  });
}

/* ================= ログ画面 ================= */
const cardById = Object.fromEntries(CARDS.map(c => [c.id, c]));

function fmtTime(iso) {
  const d = new Date(iso);
  const p = n => String(n).padStart(2, "0");
  return `${d.getFullYear()}/${p(d.getMonth()+1)}/${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}

function renderLog() {
  const entries = state.log.slice(-300).reverse();
  $("logCount").textContent = `(全${state.log.length}件、最新300件を表示)`;
  $("logList").innerHTML = entries.length === 0
    ? '<div class="muted">まだ学習履歴がありません</div>'
    : entries.map(e => {
        const c = cardById[e.id];
        return `<div class="log-entry">
          <span class="${e.r === "ok" ? "res-ok" : "res-ng"}">${e.r === "ok" ? "✓" : "✗"}</span>
          <span style="flex:1">${c ? c.front : e.id}</span>
          <span class="t">${fmtTime(e.t)}</span>
        </div>`;
      }).join("");
}

function exportData() {
  const blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  const d = new Date();
  const p = n => String(n).padStart(2, "0");
  a.href = URL.createObjectURL(blob);
  a.download = `phrase_trainer_log_${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}.json`;
  a.click();
  URL.revokeObjectURL(a.href);
}

function importData(file) {
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const s = JSON.parse(reader.result);
      if (!s || typeof s !== "object" || !s.cards || !Array.isArray(s.log)) {
        alert("ファイル形式が正しくありません。"); return;
      }
      if (!confirm(`読み込んだデータ(回答ログ ${s.log.length}件)で現在のデータを置き換えます。よろしいですか?`)) return;
      state = Object.assign(defaultState(), s);
      saveState();
      rebuildSectionOptions(); rebuildCatOptions();
      renderLog(); renderStats(); renderHidden(); showCard(pickCard());
      alert("読み込みました。");
    } catch (e) { alert("読み込みに失敗しました: " + e.message); }
  };
  reader.readAsText(file);
}

/* ================= タブ・イベント ================= */
function switchTab(name) {
  for (const t of ["study", "stats", "hidden", "log"]) {
    $("tab-" + t).classList.toggle("active", t === name);
    $("view-" + t).classList.toggle("hidden", t !== name);
  }
  if (name === "stats") renderStats();
  if (name === "hidden") renderHidden();
  if (name === "log") renderLog();
}

$("tab-study").onclick = () => switchTab("study");
$("tab-stats").onclick = () => switchTab("stats");
$("tab-hidden").onclick = () => switchTab("hidden");
$("tab-log").onclick = () => switchTab("log");

$("card").onclick = reveal;
$("btnOk").onclick = () => answer(true);
$("btnNg").onclick = () => answer(false);
$("btnHideCard").onclick = hideCurrentCard;
$("btnRestoreAll").onclick = () => {
  const hidden = CARDS.filter(isHiddenCard);
  if (hidden.length === 0) return;
  if (!confirm(`非表示の問題 ${hidden.length}件をすべて出題対象に戻します。よろしいですか?`)) return;
  for (const c of hidden) {
    const s = state.cards[c.id];
    s.hidden = false;
    delete s.hiddenAt;
    s.cc = false;
  }
  saveState();
  rebuildSectionOptions();
  rebuildCatOptions();
  renderHidden();
};

document.addEventListener("keydown", e => {
  if (!$("view-study").classList.contains("hidden")) {
    if (e.code === "Space" || e.code === "Enter") { e.preventDefault(); reveal(); }
    if (e.key === "1" || e.key === "j") answer(false);
    if (e.key === "2" || e.key === "k") answer(true);
  }
});

$("sectionFilter").onchange = () => {
  rebuildCatOptions();
  currentCard = null;
  showCard(pickCard());
};
$("catFilter").onchange = () => { currentCard = null; showCard(pickCard()); };
$("starOnly").onchange = () => { currentCard = null; showCard(pickCard()); };
$("weakOnly").onchange = () => { currentCard = null; showCard(pickCard()); };

document.querySelectorAll('input[name="qmode"]').forEach(r => {
  r.checked = r.value === qmode.mode;
  r.onchange = () => {
    if (!r.checked) return;
    qmode.mode = r.value;
    if (qmode.mode === "chunk") qmode.chunkIdx = firstIncompleteChunk(chunkPools());
    saveMode();
    currentCard = null;
    showCard(pickCard());
  };
});

$("chunkSelect").onchange = e => {
  qmode.chunkIdx = parseInt(e.target.value, 10) || 0;
  saveMode();
  currentCard = null;
  showCard(pickCard());
};

$("chunkReset").onclick = () => {
  if (!confirm("チャンクレッスンの習得チェック(✓)をすべてリセットします。回答回数や習得レベルは消えません。よろしいですか?")) return;
  for (const id of Object.keys(state.cards)) state.cards[id].cc = false;
  saveState();
  qmode.chunkIdx = 0;
  saveMode();
  currentCard = null;
  showCard(pickCard());
};

$("btnExport").onclick = exportData;
$("importFile").onchange = e => { if (e.target.files[0]) importData(e.target.files[0]); e.target.value = ""; };
$("btnReset").onclick = () => {
  if (!confirm("すべての学習データとログを削除します。よろしいですか?")) return;
  state = defaultState();
  session = { ok: 0, ng: 0 };
  saveState();
  rebuildSectionOptions(); rebuildCatOptions();
  renderLog(); renderStats(); renderHidden(); showCard(pickCard());
};

/* ================= 初期化 ================= */
function rebuildSectionOptions() {
  const sel = $("sectionFilter");
  const prev = sel.value;
  const sections = [...new Set(visibleActiveCards().map(c => c.section).filter(Boolean))];
  sel.innerHTML = '<option value="">すべてのセクション</option>';
  for (const section of sections) {
    const o = document.createElement("option");
    o.value = section; o.textContent = section;
    sel.appendChild(o);
  }
  sel.value = sections.includes(prev) ? prev : "";
  sel.classList.toggle("hidden", sections.length === 0);
}

function rebuildCatOptions() {
  const sel = $("catFilter");
  const prev = sel.value;
  const cats = [...new Set(sectionCards().map(c => c.cat))];
  sel.innerHTML = '<option value="">すべてのカテゴリ</option>';
  for (const cat of cats) {
    const o = document.createElement("option");
    o.value = cat; o.textContent = cat;
    sel.appendChild(o);
  }
  sel.value = cats.includes(prev) ? prev : "";
}

(function init() {
  const box = $("deckFilters");
  for (const d of DECKS) {
    const label = document.createElement("label");
    const cb = document.createElement("input");
    cb.type = "checkbox";
    cb.checked = deckSel[d.id];
    cb.onchange = () => {
      deckSel[d.id] = cb.checked;
      saveDeckSel();
      rebuildSectionOptions();
      rebuildCatOptions();
      currentCard = null;
      showCard(pickCard());
    };
    label.appendChild(cb);
    label.appendChild(document.createTextNode(d.title));
    box.appendChild(label);
  }
  rebuildSectionOptions();
  rebuildCatOptions();
  renderHidden();
  showCard(pickCard());
})();
</script>
</body>
</html>
