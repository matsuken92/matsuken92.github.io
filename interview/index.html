{c:"genai",t:{ja:"LLMに信頼性の高い構造化出力をさせるにはどうしますか。",en:"How do you get reliable structured output from an LLM?"},p:{ja:"下流システムに繋ぐJSON出力を想定し、多層の防御を説明してください。",en:"Assume JSON feeding downstream systems; describe layered safeguards."},f:{ja:"スキーマ定義 → 制約付き生成/function calling → バリデーションとリトライ → フォールバック → 監視。",en:"Schema definition → constrained generation / function calling → validation and retries → fallbacks → monitoring."},a:{ja:"まず出力スキーマを明確に定義し、可能ならAPIの構造化出力機能（function calling／JSONスキーマ強制）を使います。これは文法レベルで保証されるため最も確実です。使えない場合もスキーマと例をプロンプトに示し、「JSONのみ出力、説明文なし」を明示します。その上で防御層として、①パース＋スキーマバリデーション（型・必須項目・値域）、②失敗時はエラー内容を添えて再生成させるリトライ（回数上限付き）、③それでも失敗する場合のフォールバック（デフォルト値、人間キュー行き）、④semanticな妥当性チェック（合計が100%になるか等のビジネスルール）を実装します。本番ではパース失敗率・リトライ率を監視し、上昇はプロンプトやモデルの変更検知として扱います。「LLMの出力は信頼できない外部入力として扱う」という設計原則が全体を貫きます。",en:"First define the schema precisely and use API-native structured output (function calling / JSON schema enforcement) when available — grammar-level guarantees are the most reliable. Otherwise, show the schema and examples in the prompt and demand JSON only, no prose. Then layer defenses: (1) parsing plus schema validation (types, required fields, ranges); (2) retry on failure, feeding the error back for regeneration with a capped count; (3) fallbacks — defaults or a human queue; (4) semantic validity checks (business rules like shares summing to 100%). In production, monitor parse-failure and retry rates as change detectors for prompts or models. The governing principle: treat LLM output as untrusted external input."},r:{ja:["スキーマ強制機能の活用","バリデーション＋リトライ","フォールバック設計","失敗率の監視"],en:["Used schema enforcement","Validation + retries","Fallback design","Failure-rate monitoring"]}},
{c:"genai",case:true,t:{ja:"経営陣に「GenAIで何をすべきか」と聞かれたら、ユースケースのROI評価をどう行いますか。",en:"Executives ask 'what should we do with GenAI?' — how do you evaluate use case ROI?"},p:{ja:"流行に流されない評価フレームワークと、価値実現までの落とし穴を含めてください。",en:"Provide a hype-resistant framework and the pitfalls between pilot and realized value."},f:{ja:"業務インベントリから機会抽出 → 価値の型（効率化/品質/収益） → 実現性（データ・リスク・統合） → ポートフォリオ → パイロット→価値計測の設計。",en:"Opportunity scan from task inventory → value types (efficiency/quality/revenue) → feasibility (data, risk, integration) → portfolio → pilot-to-value measurement design."},a:{ja:"まず「GenAIで何ができるか」ではなく「どの業務のどの作業に時間とコストが掛かっているか」から出発します。文書作成・要約・検索・問い合わせ対応・コード作成など、言語処理が本質の作業を業務インベントリから洗い出し、各ユースケースを、価値（工数削減、品質向上、収益機会）、実現性（データの有無、精度要件、既存システム統合の難度）、リスク（誤り時の影響、規制、レピュテーション）で採点します。ROI試算で重要なのは、時間削減が自動で利益にならないことです。「削減時間が何に再配分されるか」まで設計し、パイロットでは満足度でなく業務KPI（処理時間、一次解決率）を計測します。落とし穴は、デモの成功と業務プロセスへの定着の間のギャップ、利用率の低迷、そして保守・評価の運用コストの過小見積りです。提案は3〜5個のポートフォリオにし、quick win（社内効率化）で組織の学習を作りながら、差別化に繋がる本命（顧客対応、ナレッジ活用）に投資する構成にします。",en:"Start not from 'what can GenAI do' but from where the business spends time and money. Scan the task inventory for language-native work — drafting, summarization, search, inquiries, coding — and score each use case on value (hours saved, quality, revenue), feasibility (data availability, accuracy requirements, systems integration), and risk (cost of errors, regulation, reputation). The crucial point in ROI math: time saved does not automatically become profit — design what the freed hours are redeployed into, and measure pilots on operational KPIs (handle time, first-contact resolution), not satisfaction scores. The pitfalls live between demo and adoption: workflow integration gaps, low usage, and underestimated ongoing costs of maintenance and evaluation. Propose a portfolio of 3-5: quick wins in internal efficiency to build organizational learning, funding the differentiating bets in customer operations and knowledge leverage."},r:{ja:["業務起点の機会抽出","価値×実現性×リスクの採点","時間削減≠利益の指摘","パイロットのKPI設計"],en:["Task-based opportunity scan","Value × feasibility × risk scoring","Time saved ≠ profit","Pilot KPI design"]}},
{c:"genai",t:{ja:"GenAIツールの社内展開で利用が定着しない場合、どう診断し改善しますか。",en:"An internal GenAI tool is not getting adopted — how do you diagnose and fix it?"},p:{ja:"技術以外の要因（業務フロー、インセンティブ、信頼）を中心に答えてください。",en:"Focus on non-technical factors: workflow, incentives, trust."},f:{ja:"利用データで現状把握 → 品質か、フローか、信頼か、インセンティブか → ユーザー観察 → チャンピオン育成と再設計 → 定着の計測。",en:"Usage data first → quality, workflow, trust, or incentives? → user observation → champions and redesign → adoption measurement."},a:{ja:"まず利用ログで「誰が・どの機能を・どれだけ使い、どこで離脱するか」を見ます。原因は大きく4系統です。①品質: 自分の業務では精度が足りない、的外れな回答が数回続くと二度と使われない。②フロー: 業務システムと別画面でコピペが必要、使う場面が業務手順に組み込まれていない。③信頼: 誤りの責任が自分に来る不安、「AIに仕事を奪われる」懸念、データの扱いへの不信。④インセンティブ: 使っても評価されず、生産性向上が本人の利益にならない。診断はログに加えて実ユーザーの横で業務を観察するのが最速です。改善は、精度の閾値を超えるまでユースケースを絞る、既存ツール（メール、CRM）への埋め込み、現場のチャンピオンユーザーの育成、成功事例の共有、管理職の巻き込み、そして「削減時間をどう使ってよいか」の明確化です。定着は初回利用率でなく週次アクティブ率と業務KPIで測ります。",en:"Start with usage logs: who uses which features how often, and where they drop off. Causes fall into four buckets: (1) quality — accuracy insufficient for their specific work; a few irrelevant answers and users never return; (2) workflow — a separate screen requiring copy-paste, not embedded where the task happens; (3) trust — fear of owning AI mistakes, job displacement anxiety, data handling concerns; (4) incentives — no recognition for using it, productivity gains not benefiting the user. The fastest diagnosis is sitting beside real users as they work, alongside the logs. Fixes: narrow use cases until quality crosses the threshold, embed into existing tools (email, CRM), cultivate champions, share wins, engage managers, and clarify what freed time may be used for. Measure adoption as weekly active usage and operational KPIs, not first-try counts."},r:{ja:["利用データからの診断","4系統の原因分解","ユーザー観察","定着指標の設計"],en:["Diagnosis from usage data","Four cause categories","User observation","Adoption metric design"]}},
{c:"genai",t:{ja:"LLMアプリケーションの本番監視（LLMOps）には何が必要ですか。",en:"What does production monitoring for LLM applications (LLMOps) require?"},p:{ja:"従来のMLOps監視との違いを明確にしてください。",en:"Make clear how it differs from traditional MLOps monitoring."},f:{ja:"従来監視との差分 → 品質の自動評価（サンプリング＋judge） → コスト/レイテンシ/安全性 → 変更管理（プロンプトのバージョン） → フィードバックループ。",en:"Delta from traditional monitoring → automated quality evaluation (sampling + judge) → cost/latency/safety → change management (prompt versioning) → feedback loops."},a:{ja:"従来のMLOpsとの本質的な違いは、①正解ラベルが本番でほぼ得られない自由記述出力を扱う、②モデルを自分で更新しなくてもプロバイダ側の変更で挙動が変わる、③プロンプトという新しい変更管理対象がある、の3点です。監視項目は、システム面（レイテンシ、エラー率、トークンコストの急増）、品質面（本番トラフィックからサンプリングしてLLM-judgeで採点するfaithfulness・関連性、ユーザーフィードバック率、会話の言い直し率のようなproxy）、安全性面（インジェクション検知、PII漏洩、不適切出力）、そして分布面（入力クエリの傾向変化、想定外ユースケースの出現）です。変更管理として、プロンプト・モデルバージョン・RAGインデックスをすべてバージョン管理し、変更前に評価セットでリグレッションテストを通します。ユーザーフィードバックと失敗事例を評価セットへ還流させる仕組みまで作って、初めて「運用」と呼べます。",en:"Three essential differences from traditional MLOps: free-form outputs with almost no production ground truth; behavior shifting through provider-side model changes even if you deploy nothing; and prompts as a new change-management artifact. Monitor: system health (latency, error rates, token cost spikes); quality (sampled production traffic scored by LLM judges for faithfulness and relevance, user feedback rates, proxies like rephrase rates); safety (injection detection, PII leakage, inappropriate content); and distribution (query trend shifts, unforeseen use cases emerging). For change management, version prompts, model versions, and RAG indexes together, gating changes on eval-set regression tests. It only counts as operations once user feedback and failure cases flow back into the eval set."},r:{ja:["従来MLOpsとの3つの差分","品質のサンプリング評価","安全性と分布の監視","プロンプトの変更管理"],en:["Three deltas from MLOps","Sampled quality evaluation","Safety and distribution monitoring","Prompt change management"]}},
{c:"genai",t:{ja:"ドメイン特化LLMを構築すべきか、汎用モデル＋RAGで済ませるべきかをどう判断しますか。",en:"When should you build a domain-specific LLM vs use a general model with RAG?"},p:{ja:"continued pretraining、PEFT、汎用モデル活用のコスト構造を比較してください。",en:"Compare the cost structures of continued pretraining, PEFT, and leveraging general models."},f:{ja:"デフォルトは汎用＋RAG → 不足の証拠を集める → PEFTで振る舞い適応 → continued pretrainingの条件 → 総保有コストと陳腐化リスク。",en:"Default to general + RAG → gather evidence of insufficiency → PEFT for behavioral adaptation → conditions for continued pretraining → TCO and obsolescence risk."},a:{ja:"デフォルトは最新の汎用モデル＋RAG＋プロンプトです。フロンティアモデルの進化が速く、自前モデルは作った瞬間から陳腐化リスクを負うためです。判断は証拠ベースで進めます。まず汎用モデルを自社タスクの評価セットで測り、不足が具体的にどこかを特定します。用語や形式への不適応ならPEFT（LoRA）で数千件規模のデータから改善でき、コストも限定的です。continued pretraining（ドメインコーパスでの追加事前学習）が正当化されるのは、専門言語が特殊で（法務・医療・金融の非公開文書）、大量のドメインコーパスがあり、API利用が規制・機密上不可能で、かつ長期に渡り大量利用するため償却が効く場合に限られます。総保有コストには学習だけでなく、評価基盤、安全性対応、モデル更新の追随、MLエンジニアの人件費を含めます。多くの企業にとって合理的なのは「モデルではなく、データ・評価セット・業務統合に投資する」戦略だと添えます。",en:"Default to the latest general model plus RAG and prompting — frontier models improve fast, and a proprietary model starts depreciating the day it is built. Proceed evidence-based: benchmark the general model on your task eval set and localize the gaps. If the gap is terminology or format adaptation, PEFT (LoRA) fixes it with thousands of examples at modest cost. Continued pretraining on a domain corpus is justified only when the language is genuinely specialized (non-public legal, medical, financial text), a large corpus exists, API use is barred by regulation or confidentiality, and sustained high volume amortizes the investment. Total cost of ownership includes evaluation infrastructure, safety work, keeping pace with model generations, and ML engineering headcount — not just training. For most enterprises the rational strategy is investing in data, eval sets, and workflow integration rather than the model itself."},r:{ja:["汎用＋RAGをデフォルトに","証拠ベースの判断手順","PEFTと追加事前学習の条件","総保有コストと陳腐化"],en:["General + RAG as default","Evidence-based procedure","PEFT vs continued pretraining conditions","TCO and obsolescence"]}},
{c:"genai",t:{ja:"マルチモーダルLLMの業務ユースケースと導入時の注意点を説明してください。",en:"Describe business use cases for multimodal LLMs and adoption caveats."},p:{ja:"文書画像・図表・現場写真など、コンサル案件で実際に価値が出る場面を想定してください。",en:"Ground it in consulting-relevant scenarios: document images, charts, field photos."},f:{ja:"モダリティ統合の価値 → 具体ユースケース → 精度の非対称性（OCR的タスクvs推論） → 評価の難しさ → リスクと段階導入。",en:"Value of modality integration → concrete use cases → accuracy asymmetry (OCR-like vs reasoning) → evaluation difficulty → risks and staged adoption."},a:{ja:"価値が出やすいのは、これまで人手でしか処理できなかった非構造画像情報の取り込みです。具体例は、帳票・請求書・契約書スキャンの構造化抽出（従来OCR＋テンプレートより柔軟）、設備点検写真からの異常記録、小売の棚割り写真の遵守チェック、保険の損害写真の一次査定、社内資料の図表を含めた検索・要約です。注意点として、性能はタスクによる非対称性が大きく、印刷文書の読み取りは強い一方、細かい数値の読み取り、複雑な図表の推論、位置関係の正確な把握はまだ誤りが出ます。数値を扱う業務では抽出結果の検証層（合計チェック、原本との突合サンプリング）が必須です。評価はテキスト以上に難しく、自社の実データでの評価セット構築が先決です。導入は「人間の確認付きの下書き・一次スクリーニング」から始め、精度実績を測ってから自動化率を上げる段階設計を提案します。",en:"The value concentrates where unstructured visual information previously required human processing: structured extraction from scanned forms, invoices, and contracts (more flexible than OCR plus templates), anomaly logging from equipment inspection photos, retail shelf-compliance checks, first-pass insurance damage assessment, and search/summarization over documents including their charts. The caveat is strong task asymmetry: printed text reading is good, but fine-grained numbers, complex chart reasoning, and precise spatial relationships still err. For numeric workflows, a verification layer is mandatory — sum checks, sampled reconciliation against originals. Evaluation is even harder than for text, so building an eval set on your real documents comes first. Adopt in stages: human-verified drafting and first-pass screening, raising automation rates only as measured accuracy allows."},r:{ja:["具体ユースケースを複数","精度の非対称性","検証層の必須性","段階導入の設計"],en:["Multiple concrete use cases","Accuracy asymmetry","Mandatory verification layer","Staged adoption design"]}},
{c:"genai",t:{ja:"GenAIプロジェクトのPoCが本番化しない「PoC地獄」をどう防ぎますか。",en:"How do you prevent 'PoC purgatory' where GenAI projects never reach production?"},p:{ja:"PoC設計の時点で本番化を担保する要素を具体的に挙げてください。",en:"Name the elements that must be designed into the PoC itself to secure the path to production."},f:{ja:"PoCの目的定義（本番判断の材料） → 本番条件での検証 → 業務オーナーの巻き込み → 成功基準と撤退基準 → 本番化の予算・体制を事前合意。",en:"Define PoC purpose (evidence for a production decision) → test under production conditions → business owner engagement → success and kill criteria → pre-agree production budget and team."},a:{ja:"PoC地獄の根本原因は、PoCが「動くことの確認」になっていて「本番判断の材料集め」になっていないことです。防ぐには設計段階で、①成功基準と撤退基準を数値で事前合意する（精度X%以上かつ処理時間Y%削減なら本番化、未達なら撤退）、②本番に近い条件で検証する: きれいなサンプルでなく実データ、実ユーザー、権限・セキュリティ制約込み、③技術検証と同時に業務検証を行う: 業務オーナーをPoCのオーナーにし、業務フローの変更案まで作る、④本番化のコスト（システム統合、評価・監視基盤、保守体制）をPoC結果と一緒に提示できるよう準備する、⑤本番化の予算と意思決定者をPoC開始前に特定しておく、です。また、PoCを乱立させず、経営アジェンダに紐づく少数に絞ること自体が最大の防御です。「このPoCが成功したら、誰が、いつ、何を決めるのか」に答えられないPoCは始めるべきではありません。",en:"The root cause of PoC purgatory is PoCs designed to prove something works rather than to gather evidence for a production decision. Prevent it at design time: (1) pre-agree numeric success and kill criteria (production if accuracy ≥ X% and handle time −Y%, otherwise stop); (2) test under production-like conditions — real messy data, real users, security and permission constraints included; (3) validate the workflow alongside the tech: make the business owner the PoC owner and draft the process change; (4) prepare production cost estimates (integration, evaluation and monitoring infrastructure, support) to present with the results; (5) identify the production budget and decision-maker before the PoC starts. Above all, run few PoCs tied to executive agenda items rather than many scattered ones. A PoC that cannot answer 'if this succeeds, who decides what, and when' should not begin."},r:{ja:["PoCの目的の再定義","数値の成功/撤退基準","本番条件での検証","予算と意思決定者の事前特定"],en:["Redefined PoC purpose","Numeric success/kill criteria","Production-condition testing","Pre-identified budget and decider"]}},
{c:"llm",t:{ja:"トークン化とは何で、なぜLLMにとって重要ですか。",en:"What does tokenization entail, and why is it critical for LLMs?"},p:{ja:"サブワード分割の仕組みと、実務への影響（コスト・多言語・数値処理）まで話してください。",en:"Cover subword mechanics and practical impacts: cost, multilinguality, number handling."},f:{ja:"テキスト→トークン列 → BPE等のサブワード → 語彙サイズのトレードオフ → コスト/多言語への実務影響。",en:"Text → token sequence → subword methods like BPE → vocabulary size trade-offs → practical impact on cost and languages."},a:{ja:"トークン化はテキストをモデルが扱う最小単位（トークン）に分割する処理で、現代のLLMはBPEなどのサブワード方式を使います。頻出語は1トークン、稀な語は複数トークンに分割されるため、未知語問題を回避しつつ語彙サイズを抑えられます。実務上は、API課金・コンテキスト長・レイテンシがすべてトークン数で決まること、日本語は英語より1文字あたりのトークン効率が悪いことが多いこと、数値や日付が不自然に分割され算術ミスの一因になることを知っておくべきです。",en:"Tokenization splits text into the model's atomic units; modern LLMs use subword methods like BPE. Frequent words become single tokens while rare words split into pieces, avoiding out-of-vocabulary failures with a bounded vocabulary. Practically, API billing, context limits, and latency are all denominated in tokens; Japanese is often less token-efficient than English; and numbers or dates can split awkwardly, contributing to arithmetic errors."},r:{ja:["サブワードの仕組み","語彙とOOVのトレードオフ","コスト/コンテキストへの影響","多言語・数値の注意点"],en:["Subword mechanics","Vocabulary/OOV trade-off","Cost/context implications","Multilingual and numeric caveats"]}},
{c:"llm",t:{ja:"Transformerのattention機構はどのように機能しますか。",en:"How does the attention mechanism function in transformer models?"},p:{ja:"Query/Key/Valueの役割を直感的に説明し、RNNに対する利点も述べてください。",en:"Explain Query/Key/Value intuitively and the advantages over RNNs."},f:{ja:"Q/K/Vの直感 → 類似度による重み付け → 並列処理と長距離依存 → RNNとの対比。",en:"Q/K/V intuition → similarity-weighted mixing → parallelism and long-range dependencies → contrast with RNNs."},a:{ja:"attentionは「各トークンが他のどのトークンに注目すべきか」を学習する仕組みです。各トークンからQuery（何を探すか）、Key（自分は何者か）、Value（何を提供するか）を作り、QueryとKeyの内積で関連度を計算、softmaxで正規化した重みでValueを加重平均します。これにより文中の離れた単語同士の関係（代名詞と先行詞など）を直接結べます。RNNのような逐次処理が不要なため並列計算でき、距離によらず情報が届くことが、大規模化を可能にした本質的な理由です。",en:"Attention learns which other tokens each token should attend to. Each token produces a Query (what it seeks), Key (what it is), and Value (what it offers); relevance is the dot product of Query and Key, normalized by softmax into weights that average the Values. This directly connects distant words — pronouns to antecedents — without recurrence. Because it removes sequential processing, it parallelizes fully and passes information regardless of distance, which is fundamentally what made scaling to LLMs possible."},r:{ja:["Q/K/Vの役割","重み付けの計算手順","長距離依存の解決","並列化の利点"],en:["Roles of Q/K/V","Weighting computation","Long-range dependency handling","Parallelization benefit"]}},
{c:"llm",t:{ja:"LLMのコンテキストウィンドウとは何で、なぜ重要ですか。",en:"What is the context window in LLMs, and why does it matter?"},p:{ja:"長コンテキストの実務的な制約（コスト・lost in the middle）にも触れてください。",en:"Touch on practical constraints of long context: cost and lost-in-the-middle."},f:{ja:"定義 → 計算量とコストの制約 → 長文中間の情報が弱い問題 → RAG/要約との使い分け。",en:"Definition → compute and cost constraints → weak middle-of-context recall → trade-offs vs RAG/summarization."},a:{ja:"コンテキストウィンドウは、モデルが一度に処理できるトークン数の上限で、プロンプト・会話履歴・RAG文書・出力のすべてがこの中に収まる必要があります。attentionの計算量は系列長に対して二乗で増えるため、長コンテキストはコストとレイテンシに直結します。また、ウィンドウに入ってさえいれば使われるわけではなく、長い文脈の中間にある情報は見落とされやすい「lost in the middle」現象が知られています。実務では「全部入れる」より、RAGで関連部分だけ取得する、履歴を要約する、重要情報を冒頭・末尾に置く、といった設計が有効です。",en:"The context window is the maximum tokens the model processes at once — prompt, conversation history, RAG documents, and output must all fit. Attention scales quadratically with sequence length, so long context costs money and latency. And fitting is not the same as being used: information buried mid-context is prone to being missed (lost in the middle). Practically, retrieving only relevant passages via RAG, summarizing history, and placing key information at the start or end beats stuffing everything in."},r:{ja:["定義と含まれる要素","計算量/コストへの言及","lost in the middle","RAG等との使い分け"],en:["Definition and what it holds","Compute/cost implications","Lost in the middle","Trade-offs vs RAG"]}},
{c:"llm",t:{ja:"LoRAとQLoRAの違いを説明してください。",en:"What distinguishes LoRA from QLoRA in fine-tuning LLMs?"},p:{ja:"なぜ低ランク行列で済むのかの直感と、QLoRAの量子化の意味を含めてください。",en:"Include the intuition for why low-rank updates suffice and what QLoRA's quantization adds."},f:{ja:"full fine-tuningの問題 → LoRA（低ランク差分の学習） → QLoRA（4bit量子化ベース＋LoRA） → 実務の使い分け。",en:"Full fine-tuning problems → LoRA (low-rank delta learning) → QLoRA (4-bit quantized base + LoRA) → practical selection."},a:{ja:"full fine-tuningは全パラメータを更新するためGPUメモリと保存コストが膨大です。LoRAは元の重みを凍結し、重み更新分を2つの小さな低ランク行列の積で近似して学習します。タスク適応に必要な変化は低次元で表現できるという経験則に基づき、学習パラメータを数百分の一に減らせ、タスクごとに小さなアダプタを差し替える運用もできます。QLoRAはさらにベースモデルを4bitに量子化してメモリに載せ、その上でLoRAを学習する手法で、大型モデルのfine-tuningを単一GPUでも可能にしました。品質はfull fine-tuningに近いことが多く、実務のfine-tuningはまずLoRA/QLoRAから検討するのが標準です。",en:"Full fine-tuning updates every parameter, demanding huge GPU memory and storage. LoRA freezes the base weights and learns the update as a product of two small low-rank matrices — resting on the observation that task adaptation lives in a low-dimensional subspace — cutting trainable parameters by orders of magnitude and enabling swappable per-task adapters. QLoRA additionally quantizes the frozen base model to 4-bit precision and trains LoRA on top, making large-model fine-tuning feasible on a single GPU. Quality is often close to full fine-tuning, so LoRA/QLoRA is the standard starting point in practice."},r:{ja:["fullFTの課題","低ランク近似の直感","QLoRAの量子化","実務での使い分け"],en:["Full fine-tuning pain points","Low-rank intuition","QLoRA quantization","Practical selection"]}},
{c:"llm",t:{ja:"beam searchはgreedyデコーディングと比べて何を改善しますか。",en:"How does beam search improve text generation compared to greedy decoding?"},p:{ja:"仕組みの違いと、対話生成でbeam searchが使われにくい理由も述べてください。",en:"Explain the mechanics and why beam search is rarely used for open-ended dialogue."},f:{ja:"greedyの近視眼性 → 複数候補の保持 → 系列全体の尤度最適化 → 翻訳・要約向き、対話では単調 → sampling系との使い分け。",en:"Greedy myopia → keeping multiple hypotheses → sequence-level likelihood → good for translation/summarization, bland for dialogue → vs sampling."},a:{ja:"greedyデコーディングは各ステップで最も確率の高いトークンを選びますが、局所最適の連鎖が系列全体としては低品質になることがあります。beam searchは上位k個の候補系列を並行して保持し、系列全体の累積尤度が高いものを選ぶことで、この近視眼性を緩和します。翻訳や要約のように「正解に近い一つの出力」が求められるタスクで有効です。一方、尤度最大の文は安全で単調になりやすく、繰り返しも生じるため、対話や創作のようなオープンエンド生成ではtemperatureやtop-p samplingが好まれます。タスクの性質でデコーディング戦略を選ぶ、という視点が重要です。",en:"Greedy decoding picks the highest-probability token each step, but locally optimal choices can compound into a poor overall sequence. Beam search keeps the top-k partial hypotheses in parallel and selects by cumulative sequence likelihood, easing that myopia. It suits tasks with a near-unique correct output — translation, summarization. But maximum-likelihood text tends to be safe, bland, and repetitive, so open-ended generation like dialogue favors temperature and top-p sampling instead. The takeaway: decoding strategy should match the task."},r:{ja:["greedyの限界","beamの仕組み","有効なタスク","対話でsamplingを選ぶ理由"],en:["Greedy limitation","Beam mechanics","Where it helps","Why dialogue uses sampling"]}},
{c:"llm",t:{ja:"temperatureはLLMの出力をどう制御しますか。",en:"What role does temperature play in controlling LLM output?"},p:{ja:"数式的な効果と、タスク別の設定指針を含めてください。",en:"Include the mathematical effect and task-specific settings."},f:{ja:"softmax前のlogitsをスケール → 低温=確定的/高温=多様 → タスク別指針 → 幻覚との関係の誤解に注意。",en:"Scales logits before softmax → low = deterministic, high = diverse → task guidance → note misconceptions about hallucination."},a:{ja:"temperatureはsoftmaxに入れる前のlogitsをTで割るパラメータで、T<1では分布が尖って高確率トークンがさらに選ばれやすくなり、T>1では分布が平坦化して多様な出力になります。T→0はgreedyと同等です。実務指針として、コード生成・抽出・分類など正確性重視は低温（0〜0.3）、ブレストや創作は高温（0.7〜1.0）が目安です。注意すべき誤解として、低温にしても幻覚はなくなりません。モデルが自信を持って間違えている場合、低温はむしろその誤りを安定して出力します。また評価・テストでは再現性のため低温か固定シードを使います。",en:"Temperature divides the logits before softmax: T<1 sharpens the distribution, making high-probability tokens even likelier; T>1 flattens it for diversity; T→0 approximates greedy decoding. Practical guidance: low (0-0.3) for accuracy-critical tasks like code, extraction, classification; higher (0.7-1.0) for brainstorming and creative writing. A key misconception: low temperature does not eliminate hallucination — when the model is confidently wrong, low temperature reproduces the error more consistently. For evaluation, use low temperature or fixed seeds for reproducibility."},r:{ja:["logitsスケーリングの説明","低温/高温の効果","タスク別の指針","幻覚に関する誤解の訂正"],en:["Logit-scaling explanation","Low vs high temperature effects","Task-specific guidance","Corrected hallucination misconception"]}},
{c:"llm",t:{ja:"masked language modeling（MLM）とは何で、事前学習にどう役立ちますか。",en:"What is masked language modeling, and how does it aid pretraining?"},p:{ja:"BERT系の学習方式として説明し、生成系（自己回帰）との違いに触れてください。",en:"Frame it as BERT-style pretraining and contrast with autoregressive approaches."},f:{ja:"マスクして復元するタスク → 双方向文脈の学習 → ラベル不要の自己教師あり → 理解系タスク向き。",en:"Mask-and-recover task → bidirectional context → self-supervised without labels → suited to understanding tasks."},a:{ja:"MLMは入力の一部トークン（BERTでは約15%）をマスクし、前後両方の文脈から元のトークンを予測させる事前学習方式です。ラベルなしテキストから自己教師ありで学習でき、左右双方向の文脈を同時に使える表現が得られるため、分類・固有表現抽出・検索など「理解」系タスクへのfine-tuningに強い基盤になります。一方、テキストを左から右に生成する能力は直接学習しないため、生成タスクには自己回帰型（GPT系）が使われます。現在のLLMブームは自己回帰型が主役ですが、embeddingモデルや分類器の世界ではMLM系の系譜が今も現役です。",en:"MLM masks a portion of input tokens (about 15% in BERT) and trains the model to recover them from context on both sides. It is self-supervised on unlabeled text and yields bidirectional representations, making a strong foundation for understanding tasks — classification, NER, retrieval. It does not directly learn left-to-right generation, which is why generative tasks use autoregressive models (GPT lineage). Autoregressive models dominate today's LLM era, but MLM descendants remain the workhorses of embedding models and classifiers."},r:{ja:["マスク復元の仕組み","双方向文脈の利点","自己教師あり学習","生成系との使い分け"],en:["Mask-recovery mechanics","Bidirectional advantage","Self-supervision","Contrast with generative models"]}},
{c:"llm",t:{ja:"sequence-to-sequenceモデルとは何で、どこに使われますか。",en:"What are sequence-to-sequence models, and where are they applied?"},p:{ja:"encoder-decoder構造と代表的な応用を説明してください。",en:"Explain the encoder-decoder structure and representative applications."},f:{ja:"系列→系列の変換 → encoder-decoder構造 → 応用（翻訳・要約・音声） → decoder-onlyとの関係。",en:"Sequence-to-sequence mapping → encoder-decoder structure → applications (translation, summarization, speech) → relation to decoder-only."},a:{ja:"seq2seqは入力系列を別の系列に変換するモデルの総称で、入力を表現に圧縮するencoderと、そこから出力系列を生成するdecoderで構成されます。機械翻訳が原点で、要約、音声認識、コード変換などに使われてきました。入力と出力が明確に分かれ長さも異なるタスクに自然な構造で、T5やBARTが代表です。現在の主流LLMはdecoder-onlyですが、これは「入力も出力も一つの系列として扱うseq2seqの特殊形」と見ることができ、encoder-decoder型は翻訳・要約特化モデルや埋め込み計算で今も使われています。",en:"Seq2seq models transform an input sequence into another sequence, via an encoder that compresses the input into representations and a decoder that generates the output from them. Born in machine translation, they power summarization, speech recognition, and code conversion — natural for tasks where input and output are distinct and differ in length; T5 and BART are canonical. Today's mainstream LLMs are decoder-only, which can be viewed as treating input and output as one stream; encoder-decoder models still serve translation/summarization specialists and embedding computation."},r:{ja:["encoder/decoderの役割","代表的応用","向いているタスク構造","decoder-onlyとの関係"],en:["Encoder/decoder roles","Representative applications","Suitable task structure","Relation to decoder-only"]}},
{c:"llm",t:{ja:"自己回帰モデルとマスク型モデルはLLM学習でどう異なりますか。",en:"How do autoregressive and masked models differ in LLM training?"},p:{ja:"学習目的関数の違いが、得意なタスクの違いにどう繋がるかを説明してください。",en:"Connect the difference in training objectives to the difference in task strengths."},f:{ja:"次トークン予測 vs マスク復元 → 単方向 vs 双方向 → 生成 vs 理解 → 現在の主流と理由。",en:"Next-token prediction vs mask recovery → unidirectional vs bidirectional → generation vs understanding → current mainstream and why."},a:{ja:"自己回帰モデル（GPT系）は「過去の文脈から次のトークンを予測する」目的で学習し、生成がそのまま学習タスクなので、テキスト生成・対話・few-shot学習に強い。マスク型（BERT系）は文中のマスクを両側の文脈から復元する目的で学習し、双方向の豊かな表現が得られるため、分類・抽出・類似度計算に強い。生成能力とスケーリングの相性、プロンプトによる万能インターフェース化が効いて、汎用LLMは自己回帰型に収斂しました。実務では「生成はGPT系、軽量な理解・埋め込みはBERT系」という住み分けがまだ有効で、コスト最適化の文脈で問われることがあります。",en:"Autoregressive models (GPT lineage) train on next-token prediction from left context — generation is the training task itself — so they excel at text generation, dialogue, and few-shot learning. Masked models (BERT lineage) train on recovering masked tokens from both sides, yielding rich bidirectional representations that excel at classification, extraction, and similarity. Generation's synergy with scaling and the universal prompt interface drove general-purpose LLMs to converge on autoregression. Practically, the division of labor persists: GPT-style for generation, BERT-style for lightweight understanding and embeddings — a useful point in cost optimization discussions."},r:{ja:["目的関数の違い","方向性の違い","得意タスクへの接続","主流化の理由"],en:["Objective difference","Directionality difference","Mapping to task strengths","Why one became mainstream"]}},
{c:"llm",t:{ja:"embeddingとは何で、LLMではどう初期化されますか。",en:"What are embeddings, and how are they initialized in LLMs?"},p:{ja:"埋め込みの直感と、学習によって意味構造が生まれる過程を説明してください。",en:"Give the intuition and how semantic structure emerges through training."},f:{ja:"トークン→密ベクトル → ランダム初期化から学習 → 意味的近さがベクトル近さに → 文書embeddingとRAGへの接続。",en:"Token → dense vector → random initialization then learning → semantic proximity as vector proximity → connection to document embeddings and RAG."},a:{ja:"embeddingはトークンや文書を意味を反映した密な数値ベクトルに写像したものです。LLMの入力層にはトークンごとの埋め込み行列があり、通常は小さな乱数で初期化され、事前学習を通じて「似た文脈に現れる語が近いベクトルになる」構造が自然に獲得されます。事前学習済み埋め込みを引き継ぐ場合もあります。この性質を文・文書レベルに拡張したのがembeddingモデルで、意味検索・クラスタリング・RAGの基盤になります。「学習の副産物として意味の幾何学が生まれる」という直感と、実務ではRAGの検索品質を左右する要素だという接続を話せると良いです。",en:"Embeddings map tokens or documents to dense vectors that reflect meaning. An LLM's input layer holds an embedding matrix per token, typically initialized with small random values; through pretraining, words appearing in similar contexts naturally acquire nearby vectors. Some setups inherit pretrained embeddings. Extending this to sentences and documents gives embedding models — the foundation of semantic search, clustering, and RAG. The interview-worthy framing: a geometry of meaning emerges as a byproduct of training, and in practice it is the component that determines RAG retrieval quality."},r:{ja:["密ベクトルの直感","初期化と学習過程","意味構造の獲得","RAG等への応用"],en:["Dense-vector intuition","Initialization and training","Emergence of semantic structure","Applications like RAG"]}},
{c:"llm",t:{ja:"next sentence prediction（NSP）とは何で、LLMをどう強化しますか。",en:"What is next sentence prediction, and how does it enhance LLMs?"},p:{ja:"BERTでの役割と、後続研究での評価も含めて答えてください。",en:"Cover its role in BERT and how later research assessed it."},f:{ja:"文ペアの連続性判定 → 文間関係の学習が狙い → RoBERTa等での再評価 → 現代での位置づけ。",en:"Sentence-pair continuity classification → aims to learn inter-sentence relations → reassessment by RoBERTa etc. → modern standing."},a:{ja:"NSPはBERTの事前学習で使われた補助タスクで、2つの文が実際に連続しているか、ランダムに組み合わされたかを判定させ、文間関係の理解を促す狙いがありました。質問応答や自然言語推論のような文ペアタスクに効くと期待されましたが、後続のRoBERTaはNSPを外しても性能が落ちない（むしろ向上する）ことを示し、タスクが簡単すぎたことなどが指摘されました。現代の大規模自己回帰モデルは長い連続テキストの次トークン予測だけで文間関係も暗黙に学習しています。「提案された工夫が後で不要と判明する」research歴史の好例として、批判的に説明できると良い問題です。",en:"NSP was an auxiliary pretraining task in BERT: classify whether two sentences are actually consecutive or randomly paired, intended to teach inter-sentence relationships for tasks like QA and NLI. Follow-up work — notably RoBERTa — showed removing NSP did not hurt and often helped, suggesting the task was too easy to be informative. Modern large autoregressive models learn discourse relationships implicitly through next-token prediction over long contiguous text. It is a nice example of a plausible training trick later shown unnecessary — worth explaining with that critical framing."},r:{ja:["タスクの内容","当初の狙い","後続研究での再評価","現代での位置づけ"],en:["What the task is","Original motivation","Later reassessment","Modern standing"]}},
{c:"llm",t:{ja:"top-kサンプリングとtop-pサンプリングの違いを説明してください。",en:"How do top-k and top-p sampling differ in text generation?"},p:{ja:"それぞれの候補絞り込み方と、top-pが好まれる理由を説明してください。",en:"Explain each truncation strategy and why top-p is often preferred."},f:{ja:"top-k=固定数で足切り → top-p=累積確率で足切り → 分布の形に適応するのがtop-p → 実務設定。",en:"Top-k = fixed-count cutoff → top-p = cumulative-probability cutoff → top-p adapts to distribution shape → practical settings."},a:{ja:"どちらも低確率トークンを除外してからサンプリングする手法です。top-kは確率上位k個に候補を固定的に絞ります。しかし分布が尖っている（ほぼ次の1語が確定）場面ではkが大きすぎ、平坦な場面ではkが小さすぎる、という不適応が起きます。top-p（nucleus sampling）は累積確率がpに達するまでの最小集合を候補にするため、分布が尖れば少数、平坦なら多数と、文脈ごとに候補数が自動調整されます。この適応性からtop-pが好まれることが多く、temperatureと組み合わせて使います。両方を同時に強く効かせると意図が読みにくくなるため、どちらかを主に調整するのが実務的です。",en:"Both truncate low-probability tokens before sampling. Top-k keeps a fixed number of top candidates — but when the distribution is peaked (next word nearly certain) k is too many, and when flat, too few. Top-p (nucleus sampling) keeps the smallest set whose cumulative probability reaches p, so the candidate count adapts per context: few when peaked, many when flat. That adaptivity is why top-p is generally preferred, used together with temperature. Tuning both aggressively at once obscures behavior, so in practice adjust one as the primary knob."},r:{ja:["各手法の仕組み","top-kの不適応問題","top-pの適応性","実務での組み合わせ方"],en:["Mechanics of each","Top-k maladaptation","Top-p adaptivity","Practical combination"]}},
{c:"llm",t:{ja:"なぜプロンプトエンジニアリングはLLMの性能にとって重要なのですか。",en:"Why is prompt engineering crucial for LLM performance?"},p:{ja:"「おまじない」ではなく、体系的な技術として説明してください。",en:"Explain it as a systematic discipline, not incantations."},f:{ja:"same model, 大きな性能差 → 主要技法（明確な指示・few-shot・CoT・役割/形式指定） → 体系化（評価セットで反復） → 限界。",en:"Same model, large performance gaps → key techniques (clear instructions, few-shot, CoT, role/format) → systematization (iterate against eval sets) → limits."},a:{ja:"同じモデルでもプロンプト次第でタスク精度が大きく変わります。fine-tuning不要で即座に適用でき、コストもゼロに近いため、性能改善の第一手段です。主要技法は、曖昧さのない指示と成功基準の明示、few-shot例示（形式と質が重要）、chain-of-thoughtによる推論の引き出し、役割・出力形式の指定、入力を構造化して区切ることなどです。重要なのは「書き方のコツ」で終わらせず、評価セットに対してプロンプトをバージョン管理しながら反復改善する、エンジニアリングとしての体系化です。限界も理解すべきで、プロンプトで直せない知識不足はRAG、安定しない振る舞いはfine-tuningの領域です。",en:"The same model varies enormously in task accuracy depending on the prompt. Since prompting needs no fine-tuning, applies instantly, and costs almost nothing, it is the first lever for performance. Core techniques: unambiguous instructions with explicit success criteria, few-shot examples (format and quality matter), chain-of-thought to elicit reasoning, role and output-format specification, and structured, delimited inputs. What elevates it to engineering is systematization: version-controlled prompts iterated against an evaluation set. Know the limits too — knowledge gaps need RAG, and persistently unstable behavior is fine-tuning territory."},r:{ja:["性能差の大きさ","主要技法を複数","評価セットでの体系化","限界とRAG/FTへの接続"],en:["Magnitude of performance gaps","Multiple key techniques","Systematization with eval sets","Limits and RAG/FT boundaries"]}},
{c:"llm",t:{ja:"fine-tuning中の破滅的忘却をどう防ぎますか。",en:"How can LLMs avoid catastrophic forgetting during fine-tuning?"},p:{ja:"忘却が起きる仕組みと、実務的な防止策を説明してください。",en:"Explain why forgetting happens and practical preventions."},f:{ja:"新タスクへの過適応で汎用能力が劣化 → 低学習率/少エポック → PEFT（元重みを凍結） → データ混合 → 汎用ベンチでの監視。",en:"Overfitting to new tasks degrades general abilities → low LR / few epochs → PEFT (frozen base) → data mixing → monitoring on general benchmarks."},a:{ja:"破滅的忘却は、新しいタスクに合わせて重みを更新するうちに、事前学習で得た汎用能力が上書きされて劣化する現象です。防止策は、①学習率を低く、エポックを少なくして更新量自体を抑える、②LoRA等のPEFTを使う（元の重みを凍結して差分だけ学習するため、忘却への構造的な耐性がある。アダプタを外せば元に戻せる）、③fine-tuningデータに汎用データを混ぜて分布の偏りを緩和する、④正則化的手法（元モデルとのKL制約など）です。実務で最も重要なのは検知で、対象タスクの精度だけでなく、汎用能力・安全性のベンチマークをfine-tuning前後で比較し、劣化をリリース基準に含めることです。",en:"Catastrophic forgetting is the degradation of pretrained general abilities as weights are overwritten during task adaptation. Preventions: (1) low learning rates and few epochs to limit update magnitude; (2) PEFT like LoRA — the frozen base weights give structural resistance, and removing the adapter restores the original; (3) mixing general data into the fine-tuning set to soften distribution skew; (4) regularization such as KL constraints against the base model. Most important in practice is detection: benchmark general capabilities and safety before and after fine-tuning, not just target-task accuracy, and make non-regression a release criterion."},r:{ja:["忘却の仕組み","PEFTの構造的利点","データ混合等の対策","前後比較での検知"],en:["Mechanism of forgetting","Structural benefit of PEFT","Data mixing and other measures","Detection via before/after benchmarks"]}},
{c:"llm",t:{ja:"モデル蒸留とは何で、LLMにどんな利益をもたらしますか。",en:"What is model distillation, and how does it benefit LLMs?"},p:{ja:"teacher-studentの仕組みと、実務での使いどころを説明してください。",en:"Explain the teacher-student mechanism and practical applications."},f:{ja:"大モデル（teacher）の知識を小モデル（student）へ → soft targets/生成データでの学習 → コスト・レイテンシ削減 → タスク特化蒸留が実務の主戦場。",en:"Transfer teacher knowledge into a smaller student → soft targets / generated data → cost and latency reduction → task-specific distillation as the practical sweet spot."},a:{ja:"蒸留は大きなteacherモデルの能力を小さなstudentモデルに移す技術です。古典的にはteacherの出力確率分布（soft targets）を教師信号にすることで、正解ラベルだけより豊かな情報（クラス間の類似構造）を学べます。LLMの実務では、teacherに大量の入出力例を生成させ、それでstudentをfine-tuningする形が一般的です。利点は推論コスト・レイテンシの大幅削減で、特に「汎用能力は不要で、特定タスク（分類、抽出、定型応答）だけ高品質にこなしたい」場面で、上位モデルの品質を保ちながら1〜2桁安いモデルで代替できます。注意点は、studentはteacherの誤りやバイアスも継承すること、蒸留データの品質管理と評価が成否を決めること、商用APIの利用規約で他モデル学習への利用が制限される場合があることです。",en:"Distillation transfers a large teacher model's capabilities into a smaller student. Classically the teacher's output distribution (soft targets) serves as the training signal, conveying richer information than hard labels — the similarity structure between classes. In LLM practice, the common form is generating large input-output datasets with the teacher and fine-tuning the student on them. The payoff is order-of-magnitude cost and latency reduction, especially when you need high quality on one narrow task (classification, extraction, templated response) rather than general ability. Caveats: students inherit the teacher's errors and biases; distillation-data quality control and evaluation decide success; and commercial API terms may restrict training other models on outputs."},r:{ja:["teacher-studentの仕組み","soft targetsの意味","コスト削減の使いどころ","誤り継承と規約の注意"],en:["Teacher-student mechanism","Meaning of soft targets","Cost-reduction applications","Error inheritance and ToS caveats"]}},
{c:"llm",t:{ja:"LLMは語彙外（OOV）の単語をどう扱いますか。",en:"How do LLMs manage out-of-vocabulary (OOV) words?"},p:{ja:"サブワードトークン化がOOV問題をどう解消するかを中心に答えてください。",en:"Center the answer on how subword tokenization dissolves the OOV problem."},f:{ja:"従来のUNK問題 → サブワード分割で任意文字列を表現 → 未知語は細かく分割される → 実務への影響（造語・コード・多言語）。",en:"The legacy UNK problem → subwords represent any string → unknown words split finely → practical impact (neologisms, code, multilingual)."},a:{ja:"従来の単語単位の語彙では、辞書にない単語はUNKトークンに潰れて情報が失われました。現代LLMはBPE等のサブワードトークン化により、どんな文字列も既知のサブワード（最終的には文字・バイト）の組み合わせに分解できるため、真の意味でのOOVはほぼ存在しません。新語・固有名詞・タイポも複数のサブワードとして表現され、モデルは構成要素から意味をある程度推測できます。ただし細かく分割された語はトークン数を消費し、表現も不安定になりがちで、ドメイン固有語が多い分野では、トークン効率の悪化がコストと精度に影響します。これがドメイン特化トークナイザやfine-tuningを検討する一因になります。",en:"Legacy word-level vocabularies collapsed unseen words into an UNK token, destroying information. Modern LLMs use subword tokenization (BPE and kin), decomposing any string into known subwords — ultimately characters or bytes — so true OOV essentially does not exist. Neologisms, proper nouns, and typos become multiple subwords whose meaning the model can partially infer from the pieces. However, finely split words consume more tokens and get less stable representations; in jargon-heavy domains, poor token efficiency affects both cost and accuracy — one motivation for domain-specific tokenizers or fine-tuning."},r:{ja:["UNK問題の説明","サブワードによる解消","未知語の表現のされ方","トークン効率の実務影響"],en:["The UNK problem","Subword resolution","How unknowns are represented","Token-efficiency implications"]}},
{c:"llm",t:{ja:"Transformerは従来のseq2seqモデルの何を改善しましたか。",en:"How do transformers improve on traditional Seq2Seq models?"},p:{ja:"RNNベースseq2seqのボトルネックと、Transformerの解決策を対比してください。",en:"Contrast RNN-based seq2seq bottlenecks with the transformer's solutions."},f:{ja:"RNNの逐次処理と固定長ボトルネック → attentionで全位置参照 → 並列学習 → スケーラビリティが本質。",en:"RNN sequential processing and fixed-length bottleneck → attention over all positions → parallel training → scalability as the essence."},a:{ja:"RNNベースのseq2seqには2つの本質的な限界がありました。第一に、入力全体を固定長ベクトルに圧縮するため長文で情報が失われる（attention追加で部分的に緩和）。第二に、逐次処理のため学習を並列化できず、長距離依存も勾配消失で捉えにくい。Transformerは再帰を排してself-attentionだけで系列を処理し、全トークン間の関係を距離によらず直接計算し、学習を完全に並列化しました。この並列性がGPUと巨大データによる事前学習を現実的にし、スケーリング則に沿った大規模化、つまり現在のLLMを可能にした、という点が最重要です。位置情報は再帰の代わりに位置エンコーディングで注入します。",en:"RNN-based seq2seq had two fundamental limits: compressing the whole input into a fixed-length vector loses information on long sequences (partially eased by adding attention), and sequential processing prevents parallel training while vanishing gradients hamper long-range dependencies. Transformers drop recurrence entirely, processing sequences with self-attention that connects all token pairs regardless of distance, and train fully in parallel. That parallelism is the crucial point — it made pretraining on massive data with GPUs feasible, enabling scaling laws and hence today's LLMs. Positional encodings inject order information in place of recurrence."},r:{ja:["RNNの2つの限界","attentionによる解決","並列化とスケーリング","位置エンコーディングへの言及"],en:["Two RNN limitations","Attention as the solution","Parallelism and scaling","Mentioned positional encoding"]}},
{c:"llm",t:{ja:"LLMにおける過学習とは何で、どう緩和しますか。",en:"What is overfitting, and how can it be mitigated in LLMs?"},p:{ja:"一般的なMLの過学習との共通点と、LLM特有の現れ方（記憶・汚染）を区別してください。",en:"Distinguish general ML overfitting from LLM-specific manifestations: memorization and contamination."},f:{ja:"一般論（訓練特化） → LLM特有（訓練データの記憶、ベンチ汚染、fine-tuningでの過適合） → 対策（正則化・早期終了・データ多様性） → 評価の汚染チェック。",en:"General story (training-set specialization) → LLM-specific (verbatim memorization, benchmark contamination, fine-tuning overfit) → mitigations (regularization, early stopping, data diversity) → contamination checks in evaluation."},a:{ja:"一般論としての過学習は訓練データに特化して汎化が落ちる現象で、正則化・早期終了・データ拡張で対処します。LLMでは特有の形で現れます。①訓練データの逐語的記憶（個人情報や著作物の再生リスク）、②ベンチマーク汚染: 評価データが事前学習コーパスに混入し、能力を過大評価する、③fine-tuning時の過適合: 少量データで数エポック回すと形式は覚えるが汎化しない、です。対策は、事前学習では重複除去とデータ多様性、fine-tuningでは低学習率・早期終了・評価セットの厳格な分離です。実務家として特に重要なのは評価側で、公開ベンチのスコアを鵜呑みにせず、自社の新規データで検証する姿勢です。",en:"Generic overfitting is specializing to training data at the cost of generalization, addressed by regularization, early stopping, and augmentation. In LLMs it takes specific forms: verbatim memorization of training data (risking PII and copyrighted reproduction); benchmark contamination, where eval data leaks into the pretraining corpus and inflates measured ability; and fine-tuning overfit, where a few epochs on small data teach the format but not the skill. Mitigations: deduplication and data diversity in pretraining; low learning rates, early stopping, and strict eval separation in fine-tuning. For practitioners the evaluation side matters most — do not take public benchmark scores at face value; validate on fresh, private data."},r:{ja:["一般論の説明","記憶・汚染などLLM特有の形","対策を複数","評価汚染への姿勢"],en:["General explanation","LLM-specific forms","Multiple mitigations","Stance on eval contamination"]}},
{c:"llm",t:{ja:"NLPにおける生成モデルと識別モデルの違いは何ですか。",en:"What are generative versus discriminative models in NLP?"},p:{ja:"確率論的な定義と、NLPでの具体例を対応させてください。",en:"Pair the probabilistic definitions with concrete NLP examples."},f:{ja:"P(x,y)/P(x) vs P(y|x) → 生成=データ分布そのものを学ぶ → NLP例（GPT vs 分類ヘッド付きBERT） → 使い分け。",en:"P(x,y)/P(x) vs P(y|x) → generative learns the data distribution → NLP examples (GPT vs BERT with a classification head) → when to use which."},a:{ja:"識別モデルは入力から出力への条件付き分布P(y|x)を直接学び、分類境界に集中します。生成モデルはデータの分布そのものP(x)や同時分布P(x,y)をモデル化し、新しいサンプルを生成できます。NLPでの対応例は、スパム分類器やBERT＋分類ヘッドが識別的、次トークン予測で文章分布を学ぶGPT系LLMが生成的です。純粋な分類タスクでは識別モデルの方がデータ効率が良いことが多い一方、生成モデルは分布全体を学ぶため、生成・補完・few-shot適応など汎用性で勝ります。LLM時代の面白い転回は、生成モデルにプロンプトで分類をさせる使い方が実務で普通になったことで、少データではLLM、確立した大量データのタスクでは軽量な識別モデル、という使い分けがコスト面から合理的です。",en:"Discriminative models learn the conditional P(y|x) directly, focusing on decision boundaries. Generative models learn the data distribution P(x) or joint P(x,y) and can produce new samples. NLP mapping: spam classifiers and BERT-plus-head are discriminative; GPT-style LLMs learning the text distribution via next-token prediction are generative. Discriminative models are usually more data-efficient for pure classification, while generative models, learning the whole distribution, win on versatility — generation, completion, few-shot adaptation. The interesting modern twist: using generative LLMs as classifiers via prompts is now routine, and the rational cost-based split is LLMs for low-data tasks, lightweight discriminative models for established high-volume ones."},r:{ja:["確率論的な定義","NLPの具体例","データ効率と汎用性の対比","現代的な使い分け"],en:["Probabilistic definitions","Concrete NLP examples","Efficiency vs versatility","Modern selection logic"]}},
{c:"llm",t:{ja:"GPT-4はGPT-3から何が進化しましたか。世代間の能力向上を一般化して説明してください。",en:"How did GPT-4 advance beyond GPT-3? Generalize what improves across model generations."},p:{ja:"個別製品の暗記でなく、モデル世代で何が向上するかの枠組みで答えてください。",en:"Answer as a framework for generational improvement, not product trivia."},f:{ja:"規模＋データ＋RLHFの複合 → 推論・指示追従・安全性の向上 → マルチモーダル化 → 実務含意（世代交代への追随設計）。",en:"Scale + data + RLHF compounding → gains in reasoning, instruction-following, safety → multimodality → practical implication: design for generational churn."},a:{ja:"GPT-3からGPT-4への進化は、①複雑な推論・多段の指示追従の大幅な改善、②事実性の向上と幻覚の減少（ゼロにはならない）、③RLHF等による対話能力・安全性の向上、④画像入力などマルチモーダル化、⑤コンテキスト長の拡大、に整理できます。背景はパラメータ規模だけでなく、データ品質、学習手法（RLHF）、推論時の工夫の複合です。面接でより重要なのは一般化で、モデル世代はこの方向（推論力・信頼性・モダリティ・コンテキスト・コスト効率）で継続的に向上しており、実務のシステム設計は特定モデルへの過剰最適化を避け、評価セットを整備してモデル差し替えを低コストにしておくべき、という含意を語れることです。",en:"GPT-3 to GPT-4 brought: much stronger complex reasoning and multi-step instruction following; better factuality with reduced (not eliminated) hallucination; improved dialogue and safety via RLHF; multimodality (image input); and longer context. The drivers were not just parameter count but data quality, training methods like RLHF, and inference-time techniques combined. The more interview-worthy generalization: generations keep improving along these axes — reasoning, reliability, modality, context, cost-efficiency — so production systems should avoid over-optimizing for one model and instead maintain evaluation sets that make swapping models cheap."},r:{ja:["主要な向上軸を列挙","向上の要因","マルチモーダル/コンテキスト","世代交代への設計含意"],en:["Listed improvement axes","Drivers of improvement","Multimodality/context","Design implication for churn"]}},
{c:"llm",t:{ja:"位置エンコーディングとは何で、なぜ使われますか。",en:"What are positional encodings, and why are they used?"},p:{ja:"attentionの順序不変性という前提から説明してください。",en:"Start from attention's permutation invariance."},f:{ja:"attentionは語順を知らない → 位置情報の注入 → 正弦波/学習型/相対位置（RoPE等） → 長文外挿との関係。",en:"Attention is order-blind → injecting position → sinusoidal / learned / relative (RoPE etc.) → relation to long-context extrapolation."},a:{ja:"self-attentionは全トークン対の関係を対称に計算するため、それ自体は語順を区別できません。「犬が人を噛む」と「人が犬を噛む」を区別するには位置情報を明示的に注入する必要があり、これが位置エンコーディングです。原論文は正弦波関数で各位置に固有のパターンを与え、学習型埋め込みを使うモデルもあります。現代の主流は相対位置方式、特にRoPE（回転位置埋め込み）で、トークン間の相対距離をattention計算に直接織り込みます。位置エンコーディングの設計は学習時より長い系列への外挿性能を左右し、長コンテキスト対応の鍵になっている、という現代的な接続まで話せると差がつきます。",en:"Self-attention computes relations over all token pairs symmetrically, so by itself it cannot distinguish word order — 'dog bites man' vs 'man bites dog' requires explicitly injected position information, which is what positional encodings provide. The original transformer used sinusoidal patterns unique to each position; some models use learned embeddings. The modern mainstream is relative schemes, especially RoPE (rotary position embeddings), which weave relative distances directly into the attention computation. A differentiating point: positional encoding design governs extrapolation to sequences longer than those seen in training, making it a key enabler of long-context models."},r:{ja:["順序不変性の前提","注入の必要性","方式の変遷（正弦波→RoPE）","長文外挿への接続"],en:["Permutation-invariance premise","Need for injection","Evolution (sinusoidal → RoPE)","Link to long-context extrapolation"]}},
{c:"llm",t:{ja:"multi-head attentionとは何で、なぜLLMを強化しますか。",en:"What is multi-head attention, and how does it enhance LLMs?"},p:{ja:"単一headとの違いと、複数headが捉える多様な関係を説明してください。",en:"Explain the difference from a single head and the diverse relations multiple heads capture."},f:{ja:"attentionを複数並列に → 各headが異なる部分空間で異なる関係を学習 → 表現の多様性 → 効率化の派生（MQA/GQA）。",en:"Parallel attention heads → each learns different relations in different subspaces → representational diversity → efficiency descendants (MQA/GQA)."},a:{ja:"multi-head attentionは、Q/K/Vを複数の低次元部分空間に射影し、それぞれで独立にattentionを計算して結果を結合する仕組みです。単一のattentionでは1種類の重み付けしかできませんが、複数headにより、あるheadは構文的関係、別のheadは共参照、また別のheadは近傍の局所関係、というように異なる種類の依存関係を同時に捉えられます。計算量は全体の次元を分割するため単一の大きなheadとほぼ同等です。推論効率の文脈では、KVキャッシュを削減するためにKey/Valueをhead間で共有するMulti-Query AttentionやGrouped-Query Attentionが実用モデルで広く使われている、という発展まで触れられると良いです。",en:"Multi-head attention projects Q/K/V into multiple lower-dimensional subspaces, runs attention independently in each, and concatenates the results. A single head can express only one weighting pattern; multiple heads simultaneously capture different dependency types — one syntactic, another coreference, another local adjacency. Compute stays comparable to one large head since dimensions are split. A good extension: for inference efficiency, Multi-Query and Grouped-Query Attention share Keys/Values across heads to shrink the KV cache, and are widely used in production models."},r:{ja:["仕組みの説明","多様な関係の同時学習","計算量の性質","MQA/GQAへの発展"],en:["Mechanics","Diverse relations in parallel","Compute properties","MQA/GQA extension"]}},
{c:"llm",t:{ja:"attention機構でsoftmax関数はどう使われますか。",en:"How is the softmax function applied in attention mechanisms?"},p:{ja:"スコアを確率的重みに変換する役割と、スケーリングの理由を説明してください。",en:"Explain converting scores to probabilistic weights and why scaling is needed."},f:{ja:"QKスコア→softmaxで正規化 → 重みの合計1（加重平均として解釈） → √d_kスケーリングの理由 → 温度との類似。",en:"QK scores → softmax normalization → weights summing to 1 (weighted average) → why scale by √d_k → analogy to temperature."},a:{ja:"attentionではQueryとKeyの内積で得た生スコアをsoftmaxに通し、合計1の非負の重みに正規化します。これによりValueの加重平均という明確な解釈が生まれ、「どのトークンにどれだけ注目したか」を確率分布として扱えます。重要な細部が√d_kによるスケーリングで、次元が大きいと内積の分散が大きくなり、softmaxが飽和して勾配がほぼゼロになるため、事前にスコアを√d_kで割って安定させます。softmaxの指数関数は大きいスコア差を強調するため、コントラストを強める効果もあります。これはtemperatureによる生成制御と同じ数学であり、両者を繋げて説明できると理解の深さを示せます。",en:"In attention, raw Query-Key dot-product scores pass through softmax, normalizing them into non-negative weights summing to 1. This gives the clean interpretation of a weighted average over Values — attention as a probability distribution over tokens. The important detail is scaling by √d_k: with large dimensions, dot-product variance grows, softmax saturates, and gradients vanish, so scores are divided by √d_k first. Softmax's exponential also sharpens contrast between scores. It is the same mathematics as temperature in generation control — connecting the two shows depth."},r:{ja:["正規化の役割","加重平均としての解釈","√d_kスケーリングの理由","温度との接続"],en:["Normalization role","Weighted-average interpretation","Why √d_k scaling","Connection to temperature"]}},
{c:"llm",t:{ja:"内積はself-attentionにどう寄与しますか。",en:"How does the dot product contribute to self-attention?"},p:{ja:"内積が「類似度」を測る意味と、計算効率上の利点を説明してください。",en:"Explain the dot product as similarity and its computational advantages."},f:{ja:"QとKの内積=関連度スコア → 類似方向のベクトルが高スコア → 行列積として一括計算可能 → 二乗コストの限界と派生研究。",en:"Q·K dot product = relevance score → aligned vectors score high → computable as one matrix multiply → quadratic cost limits and derivative research."},a:{ja:"self-attentionでは、あるトークンのQueryと各トークンのKeyの内積が「どれだけ関連するか」のスコアになります。内積はベクトルが同じ方向を向くほど大きくなるため、学習を通じて「関連すべきトークン同士のQとKが揃う」ように表現が形成されます。実装上の本質的な利点は、全トークン対のスコア計算が単一の行列積QK^Tで書け、GPUで極めて効率的に実行できることです。これがTransformerのスケーラビリティの計算面の基盤です。一方で系列長nに対しO(n²)のコストが長文の壁となり、FlashAttention（メモリアクセス最適化）や線形attention、sparse attentionなどの派生研究を生んでいます。",en:"In self-attention, the dot product between one token's Query and each token's Key scores their relevance. Dot products grow when vectors align, so training shapes representations such that Q and K of related tokens point the same way. The essential implementation advantage: all pairwise scores are a single matrix multiplication QKᵀ, which GPUs execute extremely efficiently — the computational bedrock of transformer scalability. The flip side is O(n²) cost in sequence length, the long-context wall motivating FlashAttention (memory-access optimization), linear attention, and sparse attention research."},r:{ja:["内積=類似度の直感","学習による表現整列","行列積としての効率","O(n²)と派生研究"],en:["Dot product as similarity","Representation alignment via training","Matrix-multiply efficiency","O(n²) and follow-on research"]}},
{c:"llm",t:{ja:"なぜ言語モデリングでcross-entropy損失が使われるのですか。",en:"Why is cross-entropy loss used in language modeling?"},p:{ja:"確率分布のマッチングとしての解釈と、perplexityとの関係を含めてください。",en:"Include the distribution-matching interpretation and the relation to perplexity."},f:{ja:"次トークン予測=分類問題 → 正解トークンの対数尤度を最大化 → 最尤推定/KLとの等価性 → perplexityとの関係 → 実務含意。",en:"Next-token prediction as classification → maximizing log-likelihood of the true token → equivalence to MLE/KL minimization → relation to perplexity → practical implications."},a:{ja:"言語モデリングは各ステップで語彙全体からの分類問題であり、cross-entropyは「正解トークンに割り当てた確率の対数」にペナルティを課します。これは最尤推定そのものであり、経験分布とモデル分布のKLダイバージェンス最小化と等価です。つまり「モデルの確率分布を実際の言語の分布に近づける」という目標を直接表現しています。微分可能でsoftmaxとの相性が良く（勾配が予測確率−正解の形になり数値的に安定）、自信を持った誤りに大きなペナルティを与える性質も学習を効率化します。評価指標のperplexityはcross-entropyの指数であり、「モデルが平均していくつの選択肢で迷っているか」という直感的解釈を与えます。",en:"Language modeling is a classification over the vocabulary at each step, and cross-entropy penalizes the log-probability assigned to the true token. This is exactly maximum likelihood estimation, equivalent to minimizing KL divergence between the empirical and model distributions — directly expressing the goal of matching the model's distribution to real language. It is differentiable and pairs cleanly with softmax (the gradient reduces to predicted probability minus one-hot truth, numerically stable), and it punishes confident mistakes heavily, which speeds learning. Perplexity, the exponential of cross-entropy, gives the intuitive reading of 'how many options the model is effectively torn between.'"},r:{ja:["分類問題としての定式化","最尤推定/KLとの等価性","数値的・学習上の利点","perplexityとの関係"],en:["Framing as classification","Equivalence to MLE/KL","Numerical/learning advantages","Relation to perplexity"]}},
{c:"llm",t:{ja:"LLMのembedding層の勾配はどう計算されますか。",en:"How are gradients computed for embeddings in LLMs?"},p:{ja:"埋め込み行列も学習対象であること、スパースな更新という特徴を説明してください。",en:"Explain that the embedding matrix is trained too, and the sparse-update characteristic."},f:{ja:"embedding=検索可能な重み行列 → 逆伝播が埋め込みベクトルまで到達 → 出現トークンの行だけ更新 → tied embeddingsなどの周辺知識。",en:"Embeddings as a lookup weight matrix → backprop reaches the embedding vectors → only rows of tokens present get updated → related knowledge like tied embeddings."},a:{ja:"embedding層は「トークンID→ベクトル」の検索テーブルですが、実体は学習対象の重み行列です。順伝播ではIDに対応する行が取り出され、逆伝播では損失から各層を遡った勾配がその行に伝わり、他の重みと同様に更新されます。特徴的なのは更新のスパース性で、そのバッチに出現したトークンの行だけが勾配を受け取ります。頻出トークンは頻繁に更新され、稀なトークンの表現は洗練されにくい、という頻度による表現品質の差もここから生じます。周辺知識として、入力埋め込みと出力（softmax前）の射影行列を共有するweight tyingという省パラメータ手法があること、fine-tuningで埋め込み層を凍結する選択があることに触れられると良いです。",en:"The embedding layer is a lookup table from token IDs to vectors, but it is really a trainable weight matrix. The forward pass fetches the row for each ID; the backward pass propagates gradients from the loss back to exactly those rows, updated like any other weights. The distinctive property is sparsity: only rows for tokens present in the batch receive gradients — frequent tokens get updated often while rare tokens' representations stay coarse, one source of frequency-dependent representation quality. Useful adjacent knowledge: weight tying shares the input embedding with the output projection to save parameters, and freezing embeddings is an option during fine-tuning."},r:{ja:["学習対象の行列と説明","逆伝播の到達","スパース更新の特徴","tied embeddings等の周辺"],en:["Framed as trainable matrix","Backprop reaching it","Sparse-update property","Tied embeddings context"]}},
{c:"llm",t:{ja:"Transformerの逆伝播でヤコビ行列はどんな役割を果たしますか。",en:"What is the Jacobian matrix's role in transformer backpropagation?"},p:{ja:"多変数関数の微分としてのヤコビアンと、逆伝播＝ヤコビアンとベクトルの積の連鎖という見方を説明してください。",en:"Explain Jacobians as derivatives of vector functions and backprop as chained vector-Jacobian products."},f:{ja:"ベクトル→ベクトル関数の全偏微分 → 各層の局所ヤコビアン → 逆伝播はvector-Jacobian積の連鎖 → 行列を陽に作らない実装。",en:"All partial derivatives of vector-to-vector maps → local Jacobian per layer → backprop as chained vector-Jacobian products → implementations never materialize the matrix."},a:{ja:"ヤコビ行列は、ベクトルを入力しベクトルを出力する関数の全偏微分を並べた行列で、「入力の各成分を微小に動かすと出力の各成分がどう動くか」を表します。Transformerの各構成要素（線形層、attention、layer norm）はすべてベクトル値関数なので、それぞれ局所的なヤコビアンを持ち、連鎖律により全体の勾配は各層のヤコビアンの積として書けます。逆伝播の実装は、この巨大な行列を陽に作るのではなく、上流から来た勾配ベクトルとのvector-Jacobian積を各層が効率的に計算する形で行われます（自動微分の本質）。概念としてのヤコビアン＝感度の写像、実装としてのVJP、という2層で答えられると数学と工学の両方の理解を示せます。",en:"A Jacobian is the matrix of all partial derivatives of a vector-to-vector function — how each output component responds to each input component. Every transformer building block (linear layers, attention, layer norm) is such a function with a local Jacobian, and by the chain rule the end-to-end gradient is a product of these Jacobians. Implementations never materialize the enormous matrices: each layer efficiently computes a vector-Jacobian product with the incoming gradient — the essence of reverse-mode automatic differentiation. Answering on both levels — Jacobian as sensitivity map conceptually, VJP as the implementation — shows both the math and the engineering."},r:{ja:["ヤコビアンの定義","層ごとの局所ヤコビアン","連鎖律との関係","VJPという実装の実際"],en:["Defined the Jacobian","Per-layer local Jacobians","Chain-rule relation","VJP as the real implementation"]}},
{c:"llm",t:{ja:"固有値と固有ベクトルは次元削減とどう関係しますか。",en:"How do eigenvalues and eigenvectors relate to dimensionality reduction?"},p:{ja:"PCAを例に、固有値分解が「情報を保つ方向」をどう見つけるかを説明してください。",en:"Using PCA, explain how eigendecomposition finds the directions that preserve information."},f:{ja:"固有ベクトル=変換で向きが変わらない方向 → 共分散行列の固有ベクトル=分散最大の方向 → 固有値=その方向の分散量 → 上位成分で圧縮 → LLM文脈への接続。",en:"Eigenvectors = directions unchanged by a transform → covariance eigenvectors = max-variance directions → eigenvalues = variance along them → compress with top components → connection to LLM contexts."},a:{ja:"固有ベクトルは線形変換を施しても方向が変わらないベクトルで、固有値はその方向の伸縮率です。PCAではデータの共分散行列を固有値分解します。共分散行列の固有ベクトルは「データが最も散らばる直交方向」を、対応する固有値は「その方向の分散の大きさ」を与えるため、固有値の大きい上位k方向にデータを射影すれば、情報（分散）を最大限保ちながら次元を削減できます。累積寄与率でkを選びます。LLMの文脈では、埋め込みベクトルの可視化・圧縮・ノイズ除去に使われるほか、埋め込み空間の異方性の分析や、LoRAの根底にある「重み更新は低ランクで十分」という発想も、行列の主要な方向に情報が集中するという同じ直感に繋がっています。",en:"Eigenvectors are directions a linear transform does not rotate; eigenvalues are the stretch factors along them. PCA eigendecomposes the data's covariance matrix: its eigenvectors are the orthogonal directions of greatest spread, and eigenvalues measure the variance along each, so projecting onto the top-k eigenvectors reduces dimensions while preserving maximal variance — with k chosen by cumulative explained variance. In LLM contexts this appears in embedding visualization, compression, and denoising, in analyses of embedding-space anisotropy, and conceptually in LoRA's premise that weight updates are effectively low-rank — the same intuition that information concentrates in a few principal directions."},r:{ja:["固有値/固有ベクトルの定義","共分散行列との関係","分散最大方向への射影","LLM文脈への接続"],en:["Definitions","Relation to covariance matrix","Projection onto max-variance directions","LLM connections"]}},
{c:"llm",t:{ja:"KLダイバージェンスとは何で、LLMではどう使われますか。",en:"What is KL divergence, and how is it used in LLMs?"},p:{ja:"分布間の「距離もどき」としての性質と、RLHFでの役割を含めてください。",en:"Cover its nature as an asymmetric quasi-distance and its role in RLHF."},f:{ja:"定義（分布PをQで近似する非効率） → 非対称性 → cross-entropyとの関係 → RLHFのKLペナルティ → 蒸留での利用。",en:"Definition (inefficiency of approximating P with Q) → asymmetry → relation to cross-entropy → KL penalty in RLHF → use in distillation."},a:{ja:"KLダイバージェンスは2つの確率分布の乖離を測る量で、「真の分布Pから見て、近似分布Qがどれだけ非効率か」を表します。距離のように使われますが非対称（KL(P‖Q)≠KL(Q‖P)）で、対称性が要る場面ではJS divergenceを使います。言語モデルの学習損失であるcross-entropyの最小化は、経験分布とのKL最小化と本質的に同じです。LLMで最も重要な応用はRLHFで、報酬最大化だけを追うとモデルが崩壊的に偏るため、「元のモデル分布から離れすぎない」KLペナルティを制約として入れ、報酬ハッキングと言語能力の劣化を防ぎます。蒸留でもteacherとstudentの出力分布を近づける損失としてKLが標準的に使われます。",en:"KL divergence measures the discrepancy between two distributions — the inefficiency of approximating a true distribution P with Q. It behaves like a distance but is asymmetric (KL(P‖Q) ≠ KL(Q‖P)); use JS divergence when symmetry matters. Minimizing cross-entropy in language model training is essentially minimizing KL to the empirical distribution. The headline LLM application is RLHF: chasing reward alone collapses the model, so a KL penalty keeps the policy near the original model's distribution, curbing reward hacking and language degradation. Distillation likewise uses KL to pull the student's output distribution toward the teacher's."},r:{ja:["定義と直感","非対称性","RLHFでの役割","蒸留・学習損失との関係"],en:["Definition and intuition","Asymmetry","Role in RLHF","Relation to distillation and training loss"]}},
{c:"llm",t:{ja:"ReLUの微分は何で、なぜ重要ですか。",en:"What is the derivative of the ReLU function, and why is it significant?"},p:{ja:"単純な形が学習の安定性・効率にどう効くかを説明してください。",en:"Explain how its simple form drives training stability and efficiency."},f:{ja:"f(x)=max(0,x)、微分は0/1 → 勾配消失の緩和 → 計算の軽さとスパース性 → dying ReLUと後継（GELU等）。",en:"f(x)=max(0,x), derivative 0 or 1 → mitigates vanishing gradients → cheap compute and sparsity → dying ReLU and successors (GELU)."},a:{ja:"ReLUはf(x)=max(0,x)で、微分は正の領域で1、負の領域で0（x=0では慣習的に0か1を割り当て）です。この「正なら勾配をそのまま通す」性質が本質で、sigmoidやtanhのように微分が最大でも小さく飽和で消える活性化関数と違い、深いネットワークでも勾配が減衰せずに流れます。これが深層学習の実用化を支えた一因です。計算も比較演算だけと極めて軽く、負の入力を0にすることで表現のスパース性も生みます。弱点は、負領域に落ちたユニットの勾配が0になり永久に更新されないdying ReLU問題で、Leaky ReLUが緩和策です。現代のTransformerでは滑らかなGELUやゲート付きのSwiGLUが主流ですが、思想はReLUの延長線上にあります。",en:"ReLU is f(x)=max(0,x) with derivative 1 for positive inputs and 0 for negative (0 or 1 assigned at x=0 by convention). The essence is passing gradients through unchanged in the positive region: unlike sigmoid/tanh, whose small, saturating derivatives shrink gradients layer by layer, ReLU lets gradients flow through deep stacks — a key enabler of practical deep learning. It costs a single comparison and induces sparsity by zeroing negatives. The weakness is dying ReLU: units stuck in the negative region get zero gradient forever; Leaky ReLU mitigates this. Modern transformers favor smooth GELU or gated SwiGLU, but they are philosophical descendants of ReLU."},r:{ja:["微分の形","勾配消失の緩和","計算効率とスパース性","dying ReLUと後継"],en:["Form of the derivative","Vanishing-gradient mitigation","Efficiency and sparsity","Dying ReLU and successors"]}},
{c:"llm",t:{ja:"連鎖律はLLMの勾配降下にどう適用されますか。",en:"How does the chain rule apply to gradient descent in LLMs?"},p:{ja:"逆伝播が連鎖律の体系的適用であることを、実装効率の観点も含めて説明してください。",en:"Explain backpropagation as systematic chain-rule application, including implementation efficiency."},f:{ja:"合成関数の微分則 → 深層モデル=関数の合成 → 逆伝播=出力から入力への連鎖律の再帰適用 → 計算の再利用が効率の鍵 → 勾配問題との関係。",en:"Derivative rule for compositions → deep models as function compositions → backprop as recursive chain rule from output to input → reuse of intermediate computations as the efficiency key → relation to gradient pathologies."},a:{ja:"連鎖律は合成関数の微分が各関数の微分の積になるという法則です。LLMは埋め込み→attention層×N→出力射影→損失という巨大な合成関数なので、損失の各パラメータへの勾配は、そのパラメータから損失までの経路上の局所微分の積として得られます。逆伝播はこれを出力側から入力側へ再帰的に計算するアルゴリズムで、本質は動的計画法です。各層の勾配計算で下流の結果を再利用するため、全パラメータの勾配が順伝播とほぼ同オーダーの計算量で得られます。連鎖律の「積」構造は勾配消失・爆発の原因でもあり、微分が1未満の項が積み重なれば消失、1超なら爆発します。residual接続やlayer normは、この積の構造に「勾配のバイパス」を作る対策として理解できます。",en:"The chain rule says the derivative of a composition is the product of the constituent derivatives. An LLM is one enormous composition — embeddings → N attention blocks → output projection → loss — so each parameter's gradient is the product of local derivatives along its path to the loss. Backpropagation computes this recursively from output to input; it is essentially dynamic programming, reusing downstream results so that all gradients cost roughly the same order as a forward pass. The product structure is also the root of vanishing and exploding gradients — factors below 1 compound to zero, above 1 blow up — and residual connections and layer norm are best understood as building gradient bypasses through that product."},r:{ja:["連鎖律の内容","合成関数としてのLLM","動的計画法としての効率","勾配消失/爆発との接続"],en:["The chain rule itself","LLM as a composition","Efficiency via dynamic programming","Link to vanishing/exploding gradients"]}},
{c:"llm",t:{ja:"Transformerのattentionスコアはどう計算されますか。",en:"How are attention scores calculated in transformers?"},p:{ja:"scaled dot-product attentionの式を、各ステップの意味とともに説明してください。",en:"Walk through scaled dot-product attention, explaining what each step means."},f:{ja:"X→Q,K,V射影 → QK^T/√d_k → （因果）マスク → softmax → Vとの加重和 → multi-headへ拡張。",en:"Project X → Q,K,V → QKᵀ/√d_k → (causal) masking → softmax → weighted sum with V → extend to multi-head."},a:{ja:"手順は5段階です。①入力の各トークン表現に学習済み行列を掛けてQuery・Key・Valueを作る。②QK^Tで全トークン対の関連度スコアを計算する。③√d_kで割ってスケーリングし、softmaxの飽和を防ぐ。④デコーダでは未来のトークンを見ないよう因果マスクを適用する（該当位置を−∞にしてsoftmax後に0にする）。⑤softmaxで正規化した重みでValueを加重平均し、各トークンの新しい表現を得る。式で書けばAttention(Q,K,V)=softmax(QK^T/√d_k)V です。これをmulti-headで並列に行い、結果を結合して線形変換します。面接では式の暗唱より、各ステップの「なぜ」（スケーリングの理由、マスクの理由）を語れることが重要です。",en:"Five steps: (1) multiply each token representation by learned matrices to form Query, Key, Value; (2) compute all-pairs relevance scores as QKᵀ; (3) scale by √d_k to keep softmax out of saturation; (4) in decoders, apply a causal mask (set future positions to −∞ so they become 0 after softmax) to prevent looking ahead; (5) softmax-normalize and take the weighted average of Values, yielding each token's new representation. Compactly, Attention(Q,K,V) = softmax(QKᵀ/√d_k)V, run in parallel across heads and recombined. In interviews, explaining the why of each step — the scaling, the masking — beats reciting the formula."},r:{ja:["Q/K/V射影から開始","スケーリングの理由","因果マスクの説明","加重和までの流れ"],en:["Started from Q/K/V projection","Reason for scaling","Explained causal masking","Flow through weighted sum"]}},
{c:"llm",t:{ja:"Geminiのようなモデルはマルチモーダル学習をどう最適化していますか。",en:"How do models like Gemini optimize multimodal LLM training?"},p:{ja:"後付けの結合ではなくネイティブなマルチモーダル設計、という論点を中心にしてください。",en:"Center on natively multimodal design versus bolted-together components."},f:{ja:"モダリティの統一トークン化 → 最初からの共同学習 → 共有表現空間の利点 → 学習上の課題（データバランス・干渉） → 実務含意。",en:"Unified tokenization of modalities → joint training from the start → benefits of a shared representation space → training challenges (data balance, interference) → practical implications."},a:{ja:"従来の多くのマルチモーダルシステムは、事前学習済みの視覚エンコーダと言語モデルをアダプタで後付け結合していました。Geminiに代表されるネイティブ・マルチモーダル設計は、テキスト・画像・音声・動画を統一的なトークン列に変換し、最初から単一のTransformerで共同学習します。利点は、モダリティ間の深い相互参照（図とキャプションの統合理解、動画の時間的推論）が単一の表現空間で自然に学習されることです。学習上の課題は、モダリティ間のデータ量・学習速度のバランス調整、モダリティ干渉（片方の性能が他方を劣化させる）、良質なペアデータの確保で、データミクスの設計が性能を大きく左右します。実務家としては、ネイティブ型は文書画像・図表・音声を含む業務への適用幅が広い一方、タスクによる性能の凸凹があるため用途別評価が必須、と接続できると良いです。",en:"Earlier multimodal systems bolted a pretrained vision encoder onto a language model via adapters. Natively multimodal designs, exemplified by Gemini, convert text, images, audio, and video into a unified token stream and jointly train a single transformer from the start. The benefit is deep cross-modal integration — understanding a figure with its caption, temporal reasoning over video — learned naturally in one shared representation space. Training challenges: balancing data volumes and learning rates across modalities, cross-modal interference where one modality's gains degrade another, and sourcing quality paired data — data-mix design largely determines performance. The practitioner's connection: native models widen applicability to documents, charts, and audio, but capability is uneven across tasks, so per-use-case evaluation is mandatory."},r:{ja:["後付け vs ネイティブの対比","統一トークン化と共同学習","学習上の課題","業務適用への含意"],en:["Bolted-on vs native contrast","Unified tokens and joint training","Training challenges","Business application implications"]}},
{c:"llm",t:{ja:"foundation modelにはどんな種類がありますか。",en:"What types of foundation models exist?"},p:{ja:"モダリティ・アーキテクチャ・アクセス形態など複数の軸で整理してください。",en:"Organize along multiple axes: modality, architecture, access model."},f:{ja:"定義 → モダリティ軸（言語/視覚/音声/マルチモーダル/コード・科学） → アーキテクチャ軸（encoder/decoder/両方、dense/MoE） → アクセス軸（API/オープンウェイト） → 選定の実務。",en:"Definition → modality axis (language/vision/speech/multimodal/code-science) → architecture axis (encoder/decoder/both, dense/MoE) → access axis (API/open-weight) → practical selection."},a:{ja:"foundation modelは大規模データで事前学習され、多様な下流タスクに適応できる基盤モデルの総称です。整理軸は3つあります。①モダリティ: 言語（GPT/Claude/Llama系）、視覚（画像生成の拡散モデル、視覚理解のViT系）、音声（Whisper等）、マルチモーダル、そしてコードやタンパク質構造・気象などドメイン特化型。②アーキテクチャ: 理解系のencoder型（BERT系）、生成系のdecoder型（現在の主流）、変換系のencoder-decoder型、さらにdenseかMixture-of-Expertsか。③アクセス形態: 商用API型か、オープンウェイト型（自社インフラで運用可能）か。実務の選定は「タスク要件×データ機密性×コスト×社内運用能力」の掛け算で決まり、この整理を面接で示せると、単なるモデル名の列挙より説得力があります。",en:"Foundation models are large-scale pretrained models adaptable to many downstream tasks. Three organizing axes: (1) modality — language (GPT/Claude/Llama lineages), vision (diffusion models for generation, ViT lineages for understanding), speech (Whisper), multimodal, and domain-specific models for code, protein structure, or weather; (2) architecture — encoder-only for understanding (BERT lineage), decoder-only for generation (today's mainstream), encoder-decoder for transformation, and dense versus Mixture-of-Experts; (3) access — commercial APIs versus open-weight models you can run on your own infrastructure. Practical selection multiplies task requirements × data sensitivity × cost × in-house operational capability — presenting this framework beats listing model names."},r:{ja:["定義","モダリティ軸の整理","アーキテクチャ軸の整理","アクセス形態と選定基準"],en:["Definition","Modality axis","Architecture axis","Access models and selection criteria"]}},
{c:"llm",t:{ja:"PEFTは破滅的忘却をどう軽減しますか。",en:"How does PEFT mitigate catastrophic forgetting?"},p:{ja:"parameter-efficient fine-tuningの構造的な理由を説明してください。",en:"Explain the structural reason parameter-efficient fine-tuning helps."},f:{ja:"PEFTの定義（少数パラメータのみ更新） → ベース凍結が忘却への構造的防御 → 代表手法（LoRA/adapter/prompt tuning） → 副次的利点（マルチタスク運用）。",en:"PEFT definition (update few parameters) → frozen base as structural defense → representative methods (LoRA/adapters/prompt tuning) → side benefits (multi-task serving)."},a:{ja:"PEFTは、モデル本体の重みを凍結し、全体の1%未満の追加・低ランクパラメータだけを学習する手法群（LoRA、adapter、prompt tuning等）です。破滅的忘却は事前学習で得た重みが上書きされることで起きるため、「そもそも元の重みを変えない」PEFTは構造的に忘却へ耐性があります。事前学習の知識はベースに保存されたまま、タスク適応が小さな差分に隔離され、アダプタを外せば完全に元へ戻せます。副次的な利点として、タスクごとのアダプタを1つのベースモデルに差し替え・併用でき、マルチタスクの運用コストが激減します。ただしfine-tuningデータへの過適合自体は起き得るので、汎用ベンチマークでの前後比較は依然必要です。",en:"PEFT methods (LoRA, adapters, prompt tuning) freeze the base model and train only a tiny set of added or low-rank parameters — typically under 1% of the total. Since catastrophic forgetting comes from overwriting pretrained weights, PEFT is structurally resistant: the pretrained knowledge stays intact in the frozen base, task adaptation is isolated in a small delta, and removing the adapter fully restores the original. A side benefit is serving many tasks from one base model by swapping adapters, slashing multi-task operational cost. Overfitting to the fine-tuning data can still occur, so before/after checks on general benchmarks remain necessary."},r:{ja:["PEFTの定義","凍結による構造的防御","代表手法","運用上の利点と残る注意"],en:["Defined PEFT","Structural defense via freezing","Representative methods","Operational benefits and remaining caveats"]}},
{c:"llm",t:{ja:"Retrieval-Augmented Generation（RAG）のステップを説明してください。",en:"What are the steps in Retrieval-Augmented Generation (RAG)?"},p:{ja:"インデックス構築から生成まで、各段階の設計判断も添えてください。",en:"From indexing to generation, note the design decisions at each stage."},f:{ja:"①インデックス構築（チャンク化・embedding） → ②クエリ処理 → ③検索（ベクトル/hybrid） → ④再ランキング → ⑤コンテキスト構成 → ⑥根拠付き生成 → 各段の設計判断。",en:"(1) Indexing (chunking, embeddings) → (2) query processing → (3) retrieval (vector/hybrid) → (4) re-ranking → (5) context assembly → (6) grounded generation → design decisions at each stage."},a:{ja:"RAGは6段階で整理できます。①インデックス構築: 文書をパースしてチャンクに分割し、embeddingを計算してベクトルDBに格納（チャンク設計とメタデータが品質を左右）。②クエリ処理: 質問をembedding化し、必要なら書き換え・拡張。③検索: ベクトル類似度で候補取得、実務ではBM25とのhybridが堅牢。④再ランキング: cross-encoder等で上位候補を精査し順位を改善。⑤コンテキスト構成: 選んだチャンクを出典付きでプロンプトに構造化。⑥生成: 「提供された文脈に基づいて回答し、なければ不明と述べる」制約付きでLLMが回答。各段が独立に失敗し得るため、段階別に評価指標（Recall@K、faithfulness）を持つことが運用の要諦です。利点は、知識更新が文書差し替えで済み、出典を示せて、fine-tuning不要なことです。",en:"Six stages: (1) indexing — parse documents, chunk them, compute embeddings, store in a vector DB (chunk design and metadata drive quality); (2) query processing — embed the question, optionally rewrite or expand it; (3) retrieval — vector similarity, with BM25 hybrid being the robust practical choice; (4) re-ranking — refine top candidates with a cross-encoder; (5) context assembly — structure selected chunks with citations into the prompt; (6) generation — the LLM answers under a constraint to ground in the provided context and admit ignorance otherwise. Each stage fails independently, so per-stage metrics (Recall@K, faithfulness) are the operational key. The payoff: knowledge updates by swapping documents, verifiable citations, no fine-tuning required."},r:{ja:["6段階を順序立てて","各段の設計判断","段階別評価の視点","RAGの利点"],en:["Ordered the stages","Design decisions per stage","Per-stage evaluation","Benefits of RAG"]}},
{c:"llm",t:{ja:"Mixture of Experts（MoE）はLLMのスケーラビリティをどう高めますか。",en:"How does Mixture of Experts (MoE) enhance LLM scalability?"},p:{ja:"総パラメータと活性パラメータの分離という本質を説明してください。",en:"Explain the essential decoupling of total vs active parameters."},f:{ja:"FFN層を複数の専門家に分割 → ルーターがトークンごとに少数の専門家を選択 → 容量は増えるが計算は一定 → 課題（負荷分散・メモリ・学習安定性）。",en:"Split FFN layers into experts → router selects a few experts per token → capacity grows while compute stays flat → challenges (load balancing, memory, training stability)."},a:{ja:"MoEは、Transformerの各FFN層を複数の「専門家」ネットワークに置き換え、学習されたルーターがトークンごとに上位1〜2個の専門家だけを活性化する構造です。本質は総パラメータ数（知識容量）と1トークンあたりの計算量（活性パラメータ）の分離で、例えば総数は数千億でも、各トークンが通るのはその一部だけなので、同じ推論コストで遥かに大きな容量を持てます。denseモデルと同計算量で高い性能を実現し、多くのフロンティアモデルが採用しています。課題は、①専門家間の負荷分散（特定の専門家に集中しないよう補助損失で制御）、②計算は少なくても全専門家をメモリに載せる必要がある、③ルーティングの不安定さによる学習の難しさです。「計算は疎に、知識は密に」という設計思想として説明できると良いです。",en:"MoE replaces each transformer FFN layer with multiple expert networks, with a learned router activating only the top 1-2 experts per token. The essence is decoupling total parameters (knowledge capacity) from per-token compute (active parameters): a model can hold hundreds of billions of parameters while each token traverses only a fraction, delivering far greater capacity at the same inference cost as a smaller dense model. Many frontier models use this. Challenges: load balancing across experts (auxiliary losses prevent collapse onto a few), memory — all experts must be resident even if lightly used, and training instability from routing. The design philosophy in one line: sparse compute, dense knowledge."},r:{ja:["専門家とルーターの構造","総/活性パラメータの分離","スケーリング上の利点","負荷分散等の課題"],en:["Experts and router structure","Total/active decoupling","Scaling benefit","Load balancing and other challenges"]}},
{c:"llm",t:{ja:"Chain-of-Thought（CoT）プロンプティングとは何で、推論をどう助けますか。",en:"What is Chain-of-Thought (CoT) prompting, and how does it aid reasoning?"},p:{ja:"効く理由の直感と、限界・発展形（self-consistency、reasoningモデル）も含めてください。",en:"Include the intuition for why it works, limits, and descendants (self-consistency, reasoning models)."},f:{ja:"中間ステップを書かせる → 計算を系列に展開（1トークンあたりの仕事を減らす） → 効くタスク → 限界（忠実性・誤り伝播） → self-consistency/reasoningモデルへの発展。",en:"Elicit intermediate steps → unroll computation across the sequence (less work per token) → where it helps → limits (faithfulness, error propagation) → evolution to self-consistency and reasoning models."},a:{ja:"CoTは「ステップごとに考えて」と指示したり例示したりして、最終回答の前に中間的な推論過程を生成させる技法です。効く直感は、自己回帰モデルは1トークンずつしか計算できないため、複雑な問題を一気に答えさせると計算が足りず、推論を系列として展開すれば各ステップの負荷が下がり、途中結果を「作業メモ」として参照できることです。算術、多段論理、計画立案で顕著に効きます。限界として、書かれた推論が実際の内部計算を忠実に反映している保証はなく、途中の誤りが最終回答に伝播します。発展形として、複数の推論経路をサンプリングして多数決するself-consistency、そして学習時に推論過程自体を強化学習で鍛えた推論特化モデル（o1系など）があり、後者は「CoTをプロンプト技法からモデル能力へ内在化した」流れとして説明できます。",en:"CoT elicits intermediate reasoning before the final answer, via instructions like 'think step by step' or worked examples. The intuition: an autoregressive model computes one token at a time, so demanding an immediate answer to a complex problem starves it of computation; unrolling reasoning across the sequence lowers the per-step load and gives it a scratchpad of intermediate results. Gains are largest in arithmetic, multi-step logic, and planning. Limits: the written reasoning is not guaranteed to faithfully reflect internal computation, and early errors propagate. Descendants include self-consistency (sample multiple reasoning paths, take a majority vote) and reasoning-specialized models trained with RL on the reasoning process itself (the o1 lineage) — the internalization of CoT from prompting technique into model capability."},r:{ja:["技法の説明","効く理由の直感","忠実性など限界","発展形への言及"],en:["Explained the technique","Intuition for why it works","Limits like faithfulness","Mentioned descendants"]}},
{c:"llm",t:{ja:"識別AIと生成AIはどう違いますか。",en:"How do discriminative and generative AI differ?"},p:{ja:"ビジネス文脈での使い分けまで含めて簡潔に整理してください。",en:"Organize concisely, through to business-context selection."},f:{ja:"判別（ラベル・数値の予測） vs 生成（新しいコンテンツの創出） → タスクと出力の違い → リスクプロファイルの違い → 実務での組み合わせ。",en:"Discrimination (predicting labels/values) vs generation (creating new content) → task and output differences → different risk profiles → combining them in practice."},a:{ja:"識別AIは入力に対してラベルや数値を予測します（解約予測、不正検知、画像分類）。出力は構造化され、評価は正解との比較で明確です。生成AIは新しいコンテンツ（文章、画像、コード）を作り出します。出力は自由形式で、評価は多次元的（正確性・有用性・安全性）になります。リスクの形も違い、識別AIは誤分類コストと公平性、生成AIは幻覚・著作権・ブランド毀損が主リスクです。ビジネスでは対立でなく組み合わせが実態で、例えば生成AIで顧客対応の下書きを作り、識別AIでエスカレーション判定をする、生成AIの出力を識別モデルで品質フィルタする、といった構成が増えています。「予測が要るのか、コンテンツが要るのか」が使い分けの出発点です。",en:"Discriminative AI predicts labels or values from input — churn, fraud, image classes — with structured outputs and clear-cut evaluation against ground truth. Generative AI creates new content — text, images, code — with free-form outputs and multidimensional evaluation (accuracy, usefulness, safety). Risk profiles differ too: misclassification cost and fairness for discriminative; hallucination, copyright, and brand damage for generative. In business they combine rather than compete: generative AI drafts customer responses while a discriminative model decides escalation, or discriminative filters gate generative output quality. The starting question is simply: do you need a prediction or content?"},r:{ja:["両者の定義","出力と評価の違い","リスクの違い","組み合わせの実務例"],en:["Both definitions","Output and evaluation differences","Risk differences","Combined practical examples"]}},
{c:"llm",t:{ja:"知識グラフとの統合はLLMをどう改善しますか。",en:"How does knowledge graph integration improve LLMs?"},p:{ja:"LLMの弱点（幻覚・多段推論）を構造化知識がどう補うかを説明してください。",en:"Explain how structured knowledge compensates for LLM weaknesses: hallucination and multi-hop reasoning."},f:{ja:"KG=エンティティと関係の構造化知識 → 事実の検証・グラウンディング → 多段推論の補助 → GraphRAG → 逆方向（LLMでKG構築）。",en:"KG = structured entities and relations → fact verification and grounding → multi-hop reasoning support → GraphRAG → the reverse direction (LLMs building KGs)."},a:{ja:"知識グラフはエンティティ（人・企業・製品）とその関係を明示的に構造化した知識ベースで、LLMの2つの弱点を補います。第一に幻覚対策で、LLMの生成する事実主張をKGに照合して検証したり、KGから取得した確定的な事実（役員名、製品仕様、規制関係）をコンテキストとして与えたりできます。第二に多段推論で、「AはBの子会社、BはCと提携→AとCの関係は」のような関係の連鎖はテキスト検索が苦手とするところで、グラフの探索が構造的に強い。この発想を実装したのがGraphRAGで、文書からエンティティ関係を抽出してグラフ化し、コミュニティ要約と組み合わせて「コーパス全体を俯瞰する質問」への回答を改善します。逆方向の統合も重要で、LLMを使って非構造テキストからKG自体を構築・更新するコストが劇的に下がった点は、エンタープライズのデータ戦略に直結します。",en:"Knowledge graphs are explicit structured knowledge — entities (people, companies, products) and their relations — and they compensate for two LLM weaknesses. First, hallucination: LLM factual claims can be verified against the KG, or definitive facts (executives, product specs, regulatory relationships) can be fetched from it as grounded context. Second, multi-hop reasoning: chains like 'A is a subsidiary of B, B partners with C — what links A and C?' defeat text retrieval but are natural graph traversals. GraphRAG operationalizes this: extract entity relations from documents into a graph, combine with community summaries, and improve answers to corpus-wide questions. The reverse integration matters too — LLMs have dramatically cut the cost of building and maintaining KGs from unstructured text, which feeds directly into enterprise data strategy."},r:{ja:["KGの定義","幻覚検証/グラウンディング","多段推論の補完","GraphRAGと双方向の統合"],en:["Defined KGs","Fact verification/grounding","Multi-hop complementarity","GraphRAG and bidirectional integration"]}},
