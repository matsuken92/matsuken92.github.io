{c:"causal",t:{ja:"差分の差分法（DiD）を説明し、平行トレンド仮定の確認方法を話してください。",en:"Explain difference-in-differences and how you assess the parallel trends assumption."},p:{ja:"施策を一部店舗に先行導入したケースを例に、仮定が崩れる典型パターンも含めてください。",en:"Use a staged store rollout as the example; include typical ways the assumption fails."},f:{ja:"2重の差分の直感 → 平行トレンド仮定 → 事前トレンドの可視化 → 崩れる典型例 → 補強策。",en:"Intuition of double differencing → parallel trends → visualizing pre-trends → typical failures → reinforcements."},a:{ja:"DiDは「導入群の前後差」から「非導入群の前後差」を引くことで、時期共通のショック（季節性、景気）を除去し介入効果を取り出す手法です。核心は平行トレンド仮定、つまり「介入がなければ両群は同じ推移をした」です。直接は検証できませんが、導入前の複数期間でトレンドが平行だったかを可視化し、event study形式で確認します。崩れる典型は、成長店舗を優先導入した場合（選択バイアス）、導入決定自体が下降トレンドへの対策だった場合、群間で顧客構成が大きく違い外的ショックへの感応度が異なる場合です。補強にはマッチングとの併用、群固有トレンドの許容、合成コントロールへの切り替えがあります。",en:"DiD subtracts the untreated group's before-after change from the treated group's, removing shocks common to the period (seasonality, macro conditions) to isolate the effect. The crux is parallel trends: absent treatment, both groups would have moved alike. It is untestable directly, but plot multiple pre-periods and run an event-study check. Typical failures: high-growth stores chosen for rollout first (selection), treatment adopted precisely because of a declining trend, or groups differing so much in composition that external shocks hit them differently. Reinforce with matching, group-specific trends, or switch to synthetic control."},r:{ja:["二重差分の直感","平行トレンドの意味","事前トレンドでの確認","崩れる典型例と補強"],en:["Double-difference intuition","Meaning of parallel trends","Pre-trend checks","Failure modes and reinforcements"]}},
{c:"causal",t:{ja:"傾向スコアマッチング（PSM）の仕組みと限界を説明してください。",en:"Explain propensity score matching and its limitations."},p:{ja:"「PSMで因果と言えます」という報告の危うさを指摘できるようにしてください。",en:"Be able to challenge a report claiming causality was established via PSM."},f:{ja:"傾向スコアの定義 → マッチングでバランス化 → 未観測交絡には無力 → バランス診断 → 感度分析。",en:"Propensity score definition → matching for balance → powerless against unobserved confounders → balance diagnostics → sensitivity analysis."},a:{ja:"傾向スコアは共変量から推定した「処置を受ける確率」で、これが近い処置群と対照群をマッチングして観測共変量のバランスを取り、擬似的な比較可能性を作ります。多次元のマッチングを1次元に圧縮できるのが利点です。ただし決定的な限界は、観測されている変数の交絡しか調整できないことです。「やる気のある顧客ほどプログラムに参加する」ような未観測交絡はそのまま残り、RCTの代替にはなりません。報告を見るときは、マッチング後の共変量バランス（標準化差分）、コモンサポートの確認、そして未観測交絡がどの程度あれば結論が覆るかの感度分析（E-value等）があるかをチェックします。これらがないPSM因果主張は割り引いて聞くべきです。",en:"The propensity score is the estimated probability of receiving treatment given covariates; matching treated and control units with similar scores balances observed covariates, creating pseudo-comparability and compressing multidimensional matching into one dimension. The decisive limitation: it only adjusts for observed confounders. Unobserved ones — motivated customers self-selecting into programs — remain untouched, so it is no substitute for an RCT. When reviewing such a claim, check post-matching balance (standardized differences), common support, and sensitivity analysis (e.g., E-values) showing how much hidden confounding would overturn the result. Absent those, discount the causal claim."},r:{ja:["傾向スコアの定義","バランス化の仕組み","未観測交絡の限界を明言","診断と感度分析"],en:["Defined the propensity score","Balancing mechanism","Stated unobserved-confounder limit","Diagnostics and sensitivity analysis"]}},
{c:"causal",t:{ja:"操作変数法（IV）を直感的に説明し、良い操作変数の条件を述べてください。",en:"Explain instrumental variables intuitively and the conditions for a valid instrument."},p:{ja:"実務やビジネスデータでIVが使える例と、弱い操作変数の問題に触れてください。",en:"Give business-data examples where IV applies and touch on the weak instrument problem."},f:{ja:"内生性の問題 → IVの2条件（関連性・除外制約） → 自然実験の例 → 弱IVとLATEの注意。",en:"Endogeneity problem → two conditions (relevance, exclusion) → natural experiment examples → weak IV and LATE caveats."},a:{ja:"価格と需要のように、処置と結果が互いに影響し合う・共通要因を持つ（内生性）場合、回帰係数は因果効果になりません。IVは「処置には影響するが、結果にはその経路以外で影響しない」変数を梃子に、処置の外生的な変動だけを使って効果を識別します。条件は2つ、①処置と十分相関する（関連性）、②結果への直接経路がない（除外制約、これは検証不能）。ビジネス例では、コスト変動を価格の操作変数にする、施策の段階的ロールアウトの割当順序、レコメンド枠のランダムな在庫切れなどがあります。注意点は、相関が弱い「弱IV」では推定が不安定でバイアスも残ること、IVが識別するのは操作変数に反応した層の効果（LATE）であり全体平均効果ではないことです。",en:"When treatment and outcome influence each other or share causes — price and demand — regression coefficients are not causal (endogeneity). IV leverages a variable that moves the treatment but affects the outcome only through it, using that exogenous variation to identify the effect. Two conditions: relevance (correlated with treatment) and the exclusion restriction (no direct path to the outcome — untestable). Business examples: cost shocks as instruments for price, assignment order in staged rollouts, random stockouts in recommendation slots. Caveats: weak instruments make estimates unstable and biased, and IV identifies the effect for compliers (LATE), not the population average."},r:{ja:["内生性の問題設定","2条件を正確に","実務での例","弱IV/LATEの注意"],en:["Framed endogeneity","Both conditions stated","Practical examples","Weak IV / LATE caveats"]}},
{c:"causal",t:{ja:"合成コントロール法はどんな場面で使い、どう機能しますか。",en:"When do you use synthetic control, and how does it work?"},p:{ja:"1地域だけに施策を導入した効果測定を例に、プラセボ検定まで含めて説明してください。",en:"Use a single-region rollout as the example, including placebo tests."},f:{ja:"処置ユニットが少ない問題 → 対照群の加重平均で疑似対照を構成 → 事前期間での適合 → プラセボ検定 → 限界。",en:"Few treated units problem → weighted combination of donors as synthetic counterfactual → pre-period fit → placebo tests → limitations."},a:{ja:"施策が1地域・1社にだけ導入された場合、DiDの「比較可能な対照群」が存在しないことが多い。合成コントロールは、非導入地域の加重平均で「導入前の処置地域の推移を最もよく再現する疑似対照」を作り、導入後の乖離を効果と解釈します。重みはデータから最適化され、導入前期間で実績にどれだけ適合しているかが信頼性の根拠になります。推論はプラセボ検定で行い、非導入地域それぞれに同じ手続きを適用して「処置地域の乖離が偶然分布の中でどれだけ極端か」を見ます。限界は、事前適合が悪ければ使えない、導入と同時の他イベントと区別できない、donor poolに処置の影響が波及していると崩れる点です。経営層に見せる時系列プロットの説得力が高く、コンサル案件と相性の良い手法です。",en:"When a policy hits only one region or company, no comparable control group exists for DiD. Synthetic control builds a weighted combination of untreated units that best reproduces the treated unit's pre-intervention trajectory, then reads the post-intervention gap as the effect. Weights are optimized from data, and pre-period fit is the credibility test. Inference uses placebo runs: apply the same procedure to each untreated unit and ask how extreme the treated unit's gap is within that distribution. Limits: unusable with poor pre-fit, cannot separate simultaneous events, and breaks if treatment spills over into the donor pool. The resulting trajectory plot is highly persuasive to executives, which makes it a consulting favorite."},r:{ja:["適用場面の特定","疑似対照の構成方法","プラセボ検定による推論","限界の明示"],en:["Identified the use case","Construction of the counterfactual","Placebo-based inference","Explicit limitations"]}},
{c:"causal",t:{ja:"実験での干渉（interference）・SUTVA違反とは何ですか。",en:"What are interference and SUTVA violations in experiments?"},p:{ja:"マーケットプレイスやSNSでA/Bテストが壊れる例と、対処法を説明してください。",en:"Give examples of A/B tests breaking in marketplaces or social networks, and remedies."},f:{ja:"SUTVAの内容 → 干渉の具体例（市場・ネットワーク・在庫） → 効果の過小/過大推定 → クラスタ/スイッチバック実験。",en:"What SUTVA says → concrete interference examples (marketplaces, networks, inventory) → under/overestimation → cluster / switchback designs."},a:{ja:"SUTVAは「あるユーザーの結果は自分の割当だけで決まり、他人の割当に影響されない」という仮定です。これが破れるのが干渉で、例えば配車アプリで処置群への割引がドライバー供給を奪い対照群の待ち時間を悪化させると、群間差は真の効果を過大評価します。SNSの新機能は対照群の友人にも波及して差を薄めます。在庫共有、広告オークション、営業リソースの取り合いも同様です。対処は、干渉が閉じる単位でのランダム化（都市別・クラスタ別）、同一ユニットで時間を切り替えるスイッチバック実験、ネットワークを考慮したego-cluster設計などです。「この実験のランダム化単位で干渉は閉じているか」は実験レビューで必ず問うべき質問です。",en:"SUTVA assumes each unit's outcome depends only on its own assignment, not others'. Interference breaks this: in ride-hailing, discounts for the treatment group pull driver supply away from control, worsening their wait times and overstating the effect; a social feature spills over to control users' friends and dilutes the difference. Shared inventory, ad auctions, and contested sales resources behave the same way. Remedies: randomize at a unit where interference is contained (city, cluster), switchback designs alternating treatment over time within the same unit, or network-aware ego-cluster designs. 'Is interference contained at this randomization unit?' should be a standard question in any experiment review."},r:{ja:["SUTVAを正確に説明","干渉の具体例","バイアスの方向に言及","設計上の対処"],en:["Stated SUTVA correctly","Concrete interference examples","Direction of bias","Design remedies"]}},
{c:"causal",t:{ja:"A/AテストとSRMチェックはなぜ重要ですか。",en:"Why are A/A tests and SRM checks important?"},p:{ja:"実験基盤の信頼性を担保する運用として説明してください。",en:"Frame them as operational safeguards for a trustworthy experimentation platform."},f:{ja:"A/Aで基盤と偽陽性率を検証 → SRMの定義 → SRMが示す典型的バグ → 検出時の対応。",en:"A/A validates the platform and false-positive rate → SRM definition → typical bugs SRM reveals → response when detected."},a:{ja:"A/Aテストは同一条件の2群を比較するもので、差が出ないはずの状況で5%水準の偽陽性が5%程度に収まるかを確認し、ランダム化・ログ・指標計算のパイプライン全体を検証します。導入初期の実験基盤や、指標定義を変えた際に実施すべきです。SRM（Sample Ratio Mismatch）は、50:50に割ったはずの群のサンプル数が統計的にあり得ない比率になる現象で、リダイレクトの失敗、ボットの偏り、割当後の除外処理の非対称などのバグを示す強力な煙探知機です。SRMがある実験の結果は原則として信用してはならず、原因を特定するまで意思決定に使いません。地味ですが、実験文化の信頼性はこの2つの運用で決まると言っても過言ではありません。",en:"An A/A test compares two identically treated groups: with no true difference, roughly 5% of tests should be significant at the 5% level, validating randomization, logging, and metric pipelines end to end. Run it when standing up a platform or changing metric definitions. SRM (sample ratio mismatch) is when a 50:50 split yields statistically impossible group sizes — a powerful smoke detector for redirect failures, bot skew, or asymmetric post-assignment exclusions. Results from an experiment with SRM should not be trusted or used for decisions until the cause is found. Unglamorous, but these two practices largely determine whether an experimentation culture can be trusted."},r:{ja:["A/Aの目的","SRMの定義","示唆されるバグの例","検出時の運用ルール"],en:["Purpose of A/A","Defined SRM","Example bugs revealed","Operational rule on detection"]}},
{c:"causal",t:{ja:"uplift modelingの実装と評価方法を説明してください。",en:"Explain how to implement and evaluate uplift models."},p:{ja:"T-learner/S-learner等のメタ学習器と、Qini曲線による評価を含めてください。",en:"Cover meta-learners (T-learner, S-learner, etc.) and evaluation via Qini curves."},f:{ja:"実験データが前提 → メタ学習器（S/T/X-learner、causal forest） → 個人の正解がない問題 → Qini/uplift曲線 → 運用時の注意。",en:"Experimental data as foundation → meta-learners (S/T/X-learner, causal forests) → no individual ground truth → Qini/uplift curves → operational caveats."},a:{ja:"理想はランダム化された施策データを学習に使うことです。実装はメタ学習器が実用的で、S-learnerは処置フラグを特徴量に入れた単一モデル、T-learnerは処置群・対照群で別モデルを作り予測差を取ります。X-learnerは群サイズが不均衡なとき有効で、causal forestは信頼区間も出せます。評価の難しさは「個人のupliftに正解ラベルがない」ことで、スコア上位から介入した場合の増分効果を累積プロットするQini曲線・uplift曲線を使い、ランダム介入との面積差で比較します。運用では、upliftは差分ゆえノイズが大きく再学習で順位が入れ替わりやすいこと、施策が変われば学習し直しになることを踏まえ、定期的なランダム化データの確保をパイプラインに組み込むことが重要です。",en:"Ideally train on randomized campaign data. Meta-learners are the practical implementation: S-learner uses one model with the treatment flag as a feature; T-learner fits separate treated/control models and differences their predictions; X-learner helps with unbalanced group sizes; causal forests add confidence intervals. Evaluation is tricky because no individual has an uplift ground truth — use Qini or uplift curves plotting cumulative incremental effect when targeting by score, comparing area against random targeting. Operationally, uplift is a difference and thus noisy — rankings churn across retrains, and a new offer means relearning — so build periodic randomized holdouts into the pipeline as a permanent data source."},r:{ja:["実験データの必要性","メタ学習器を複数説明","評価の難所とQini","運用上の注意"],en:["Need for experimental data","Multiple meta-learners","Evaluation challenge and Qini","Operational caveats"]}},
{c:"causal",t:{ja:"施策の長期効果を短期実験でどう見積もりますか。",en:"How do you estimate long-term effects from short-term experiments?"},p:{ja:"代理指標（surrogate）の考え方と、その危うさ・検証方法を含めてください。",en:"Cover surrogate metrics, their fragility, and how to validate them."},f:{ja:"長期実験の非現実性 → 代理指標の条件 → 過去実験からの代理性検証 → 長期ホールドアウト → 割引と外挿の注意。",en:"Infeasibility of long experiments → conditions for surrogates → validating surrogacy from past experiments → long-term holdouts → caution on extrapolation."},a:{ja:"LTVや解約への効果を直接測るには年単位の実験が必要で、事業スピードと合いません。実務では短期で動き、かつ長期成果と因果的に繋がる代理指標を使います。良い代理指標の条件は、介入の効果が代理指標を経由して長期成果に伝わること（単なる相関では不十分）です。検証には、過去の多数の実験について「短期指標の動きと長期成果の動き」の対応を分析するメタアナリシス的手法が有効で、大手テック企業はこの方法でエンゲージメント指標群を校正しています。加えて、一部ユーザーを長期間介入なしで維持する長期ホールドアウトを常設し、代理指標の外れを定期的に検出します。危うさの典型は、短期CTRを上げるが長期の信頼を毀損するクリックベイト型の施策で、代理指標が悪化方向の効果を見逃す構造がないかを必ず問います。",en:"Directly measuring LTV or churn effects takes year-long experiments, which business timelines rarely allow. Instead use surrogate metrics that move quickly and are causally linked to long-term outcomes — mere correlation is not enough; the treatment effect must flow through the surrogate. Validate surrogacy by meta-analyzing many past experiments, mapping short-term metric movements to eventual long-term outcomes — this is how large tech firms calibrate their engagement metric suites. Additionally, maintain a standing long-term holdout kept out of interventions to periodically detect surrogate drift. The classic failure is clickbait-style wins: short-term CTR up, long-term trust down — always ask whether the surrogate could be blind to that pattern."},r:{ja:["代理指標の必要性","因果的代理性の条件","過去実験での検証","長期ホールドアウトの運用"],en:["Need for surrogates","Causal surrogacy condition","Validation from past experiments","Long-term holdout practice"]}},
{c:"causal",t:{ja:"「広告を見た人の購買率が2倍」という分析の問題点を指摘してください。",en:"Critique this analysis: 'Purchase rate doubled among users who saw our ad.'"},p:{ja:"セレクションバイアスの構造と、広告効果測定の正しい設計を説明してください。",en:"Explain the selection-bias structure and the correct design for ad effectiveness measurement."},f:{ja:"曝露は無作為でない → ターゲティング自体が交絡 → ghost ads/PSA/ intent-to-treat → 増分効果（incrementality）。",en:"Exposure is not random → targeting itself confounds → ghost ads / PSA / intent-to-treat → incrementality."},a:{ja:"広告を「見た人」と「見ていない人」の比較は因果効果ではありません。配信アルゴリズムは購買しそうな人に広告を見せるよう最適化しており、ターゲティング自体が最大の交絡です。アクティブなユーザーほど広告にも接触しやすく購買もしやすい、という構造もあります。正しくは配信対象者をランダムに分け、片方には広告を出さない（またはPSA広告を出す）実験で増分効果＝incrementalityを測ります。配信機会をログに残して「出すはずだったが出さなかった」群を作るghost adsが現代的な設計です。報告すべきはROASのような相関ベースの値ではなく、「広告費1円あたりの増分売上」であり、この差はしばしば数倍あります。マーケティング分析でセレクションバイアスを見抜けるかは、コンサルDSの基礎体力です。",en:"Comparing users who saw the ad with those who did not is not a causal effect. Delivery algorithms are optimized to show ads to likely buyers — targeting itself is the biggest confounder — and active users are both more exposed and more likely to purchase. The correct design randomizes eligible users, withholding ads (or serving PSA ads) from a control group to measure incrementality. Ghost ads — logging when an ad would have served but was not — is the modern implementation. The number to report is incremental revenue per ad dollar, not correlational ROAS; the two often differ by multiples. Spotting selection bias in marketing analytics is table-stakes for a consulting data scientist."},r:{ja:["セレクションバイアスの構造","ターゲティングが交絡と指摘","実験設計を提示","増分効果の概念"],en:["Selection-bias structure","Targeting named as confounder","Proposed experimental design","Concept of incrementality"]}},
{c:"case",case:true,t:{ja:"通信会社の解約率が上昇。MLで解約を減らす仕組みを設計してください。",en:"A telecom's churn rate is rising. Design an ML system to reduce churn."},p:{ja:"最初にモデル名を言わず、意思決定問題として構造化してください。",en:"Do not name a model first — structure it as a decision problem."},f:{ja:"対象/時点/期間/介入可能性/uplift/期待利益/A-Bテスト。",en:"Target/timing/window/intervenability/uplift/expected profit/A-B testing."},a:{ja:"まず解約定義、予測時点、予測期間、介入可能顧客を定義します。目的は解約確率最大化でなく、介入による期待利益=増分解約回避確率×CLV−オファー費用の最大化です。通常のresponse modelだけでなくuplift modelを検討し、オファー容量・顧客体験・公平性を踏まえ、ランダム化実験で増分効果を測ります。加えて「なぜ解約が増えたのか」の診断（価格改定、競合、品質問題）を並行し、根本原因への打ち手も提案します。",en:"First define churn, the prediction time point, horizon, and which customers are addressable. The objective is not maximizing churn probability accuracy but expected profit: incremental save probability × CLV − offer cost. Consider uplift models beyond response models, respect offer capacity, customer experience, and fairness, and measure incremental impact via randomized experiments. In parallel, diagnose why churn rose (pricing, competitors, quality) and propose root-cause fixes, not just retention offers."},r:{ja:["問題定義から開始","期待利益を定式化","upliftに触れた","実験設計まで説明"],en:["Started from problem definition","Formalized expected profit","Mentioned uplift","Covered experiment design"]}},
{c:"case",case:true,t:{ja:"製造設備の予知保全モデルを設計してください。",en:"Design a predictive maintenance model for manufacturing equipment."},p:{ja:"故障ラベルが少なく、停止コストと点検コストが非対称な状況です。",en:"Failure labels are scarce, and downtime costs far exceed inspection costs."},f:{ja:"故障定義、予測窓、センサー粒度、異常検知、時系列分割、運用。",en:"Failure definition, prediction window, sensor granularity, anomaly detection, temporal splits, operations."},a:{ja:"故障の定義と「何時間前に警告すれば行動可能か」を決めます。ラベル希少なら教師あり分類に加え異常検知やサバイバル分析を検討します。評価はランダム分割でなく設備・時間を考慮し、FP点検コストとFN停止コストの期待損失で閾値を決めます。本番ではセンサー欠損、ドリフト、未知故障、保全担当者のワークフローを監視します。導入価値は「防げた停止時間×時間あたり損失−追加点検コスト」で経営に報告します。",en:"Define failure and the lead time at which a warning is actionable. With scarce labels, consider anomaly detection and survival analysis alongside supervised classification. Evaluate with equipment- and time-aware splits, never random, and set thresholds by expected loss from FP inspections vs FN downtime. In production, monitor sensor dropouts, drift, novel failure modes, and fit with maintenance workflows. Report value to executives as avoided downtime × cost per hour − added inspection cost."},r:{ja:["予測窓を定義","希少ラベル対策","コスト非対称評価","本番運用に触れた"],en:["Defined the prediction window","Scarce-label strategies","Cost-asymmetric evaluation","Covered production operations"]}},
{c:"case",case:true,t:{ja:"小売チェーンの需要予測と発注最適化の仕組みを設計してください。",en:"Design demand forecasting and order optimization for a retail chain."},p:{ja:"数千店舗×数万SKU、欠品と廃棄ロスの両方が経営課題という設定です。",en:"Thousands of stores × tens of thousands of SKUs; both stockouts and waste are board-level issues."},f:{ja:"意思決定（発注）から逆算 → 階層・間欠需要 → 分位点予測 → 欠品の打ち切りバイアス → 検証とロールアウト。",en:"Work back from the ordering decision → hierarchy and intermittent demand → quantile forecasts → censored demand from stockouts → validation and rollout."},a:{ja:"最終意思決定は発注量なので、点予測でなく分布（分位点）予測を出し、欠品コストと廃棄コストの比率で発注分位点を決めます（newsvendor問題）。データ面では、店舗×SKUの階層構造、間欠需要、販促・価格・天候・イベントの特徴量化、そして「欠品日は需要が観測されない」打ち切りバイアスの補正が肝です。モデルは全SKU横断のグローバルGBDT/NNが個別時系列より強いことが多い。検証は時系列バックテストで、指標はビジネスに直結する欠品率・廃棄率・粗利で測ります。導入は一部カテゴリ・店舗からのパイロットで発注担当者の納得感を作り、例外時に人が上書きできる運用と、その上書き自体をログして学習する仕組みまで設計します。",en:"The real decision is order quantity, so produce distributional (quantile) forecasts and pick the order quantile from the stockout-to-waste cost ratio — a newsvendor problem. Data challenges: store×SKU hierarchy, intermittent demand, features for promotions, price, weather, events, and correcting censored demand on stockout days. A global GBDT/NN across all SKUs usually beats per-series models. Validate with time-series backtests, measured in business terms: stockout rate, waste rate, gross margin. Roll out via pilots in selected categories/stores to earn buyer trust, keep human override capability, and log those overrides as future training signal."},r:{ja:["発注意思決定から逆算","分位点/newsvendorの定式化","打ち切りバイアスに言及","業務指標での検証とロールアウト"],en:["Worked back from the ordering decision","Quantile/newsvendor formulation","Mentioned censored demand","Business-metric validation and rollout"]}},
{c:"case",case:true,t:{ja:"アパレル小売の値引き（マークダウン）最適化を設計してください。",en:"Design markdown (clearance pricing) optimization for an apparel retailer."},p:{ja:"シーズン終わりに在庫を残さず、かつ粗利を最大化したいという要望です。",en:"The client wants to clear seasonal inventory while maximizing gross margin."},f:{ja:"目的関数（シーズン粗利＋残在庫処分価値） → 価格弾力性の推定 → 内生性の罠 → 動的最適化 → テスト設計。",en:"Objective (season margin + salvage value) → price elasticity estimation → endogeneity trap → dynamic optimization → test design."},a:{ja:"目的はシーズン累計粗利＋シーズン末残在庫の処分価値の最大化で、制約は在庫、値下げ回数・幅のルール、ブランド毀損の回避です。中核は価格弾力性の推定ですが、過去データでは「売れないから値下げした」という逆因果が混ざるため、単純な回帰は弾力性を過大に見せます。過去の価格変更のタイミング差を自然実験として使う、または一部店舗・商品で価格テストを行い外生的な変動を作ります。その上で、各商品の残り週数・在庫・弾力性から動的計画法や強化学習的な逐次値下げポリシーを構成します。効果検証は商品群を無作為に分けた実験で、粗利・完売率・値下げ深度を比較します。現場のMD（マーチャンダイザー）の直感と衝突しやすい領域なので、推奨と根拠を見せて上書き可能にする運用が成功の鍵です。",en:"The objective is cumulative season margin plus salvage value of end-of-season stock, under constraints on inventory, markdown cadence rules, and brand protection. The core is price elasticity estimation, but historical data embeds reverse causality — items were marked down because they were not selling — so naive regression overstates elasticity. Create exogenous variation via natural experiments in past markdown timing or price tests across stores/items. Then build a sequential markdown policy (dynamic programming or RL-style) from remaining weeks, stock, and elasticity. Validate with randomized item groups comparing margin, sell-through, and markdown depth. This domain collides with merchandisers' intuition, so a recommendation-with-rationale, human-overridable workflow is the adoption key."},r:{ja:["目的関数と制約を定義","弾力性の内生性を指摘","外生変動の作り方","実験検証と現場運用"],en:["Defined objective and constraints","Flagged elasticity endogeneity","How to create exogenous variation","Experimental validation and field ops"]}},
{c:"case",case:true,t:{ja:"銀行の与信スコアリングモデルを構築してください。",en:"Build a credit scoring model for a bank."},p:{ja:"規制対応・説明可能性・reject inferenceを含めて設計してください。",en:"Include regulatory requirements, explainability, and reject inference."},f:{ja:"デフォルト定義と観測期間 → 承認済みバイアス（reject inference） → 説明可能性と規制 → 公平性 → 閾値と価格設定 → モニタリング。",en:"Default definition and observation window → approved-only bias (reject inference) → explainability and regulation → fairness → thresholds and pricing → monitoring."},a:{ja:"デフォルトの定義（延滞日数）と観測期間を決め、審査時点で利用可能な情報だけで特徴量を作ります。最大の構造問題は、過去に承認された申込者のラベルしかないことで、棄却層に単純に外挿すると危険です。reject inference（棄却者への部分的貸出実験、外部信用情報の活用）で緩和します。規制面では、否決理由の説明義務があるためスコアカードや単調性制約付きGBDTなど説明可能な構造にし、性別等の保護属性の直接使用だけでなく代理変数経由の間接差別も公平性指標で監査します。閾値は承認率×デフォルト率×金利のポートフォリオ利益で最適化し、リスクベースプライシングまで繋げます。導入後はビンテージ分析とPSIで人口・性能ドリフトを監視し、景気変動での再校正を計画します。",en:"Define default (days past due) and the observation window; build features strictly from information available at application time. The structural problem: labels exist only for previously approved applicants, and extrapolating to rejected populations is dangerous — mitigate with reject inference (limited lending experiments to declined segments, external bureau data). Regulation demands adverse-action explanations, so use scorecards or monotonicity-constrained GBDTs, and audit fairness beyond direct protected-attribute exclusion, since proxies create indirect discrimination. Optimize the cutoff for portfolio profit — approval rate × default rate × pricing — extending to risk-based pricing. Post-launch, monitor vintage curves and PSI for population and performance drift, and plan recalibration across economic cycles."},r:{ja:["時点整合な特徴量設計","reject inferenceに言及","説明可能性と公平性","ポートフォリオ利益での閾値"],en:["Time-consistent features","Mentioned reject inference","Explainability and fairness","Portfolio-profit thresholding"]}},
{c:"case",case:true,t:{ja:"クレジットカードのリアルタイム不正検知システムを設計してください。",en:"Design a real-time credit card fraud detection system."},p:{ja:"ミリ秒単位の判定、極端な不均衡、敵対的な相手という制約を扱ってください。",en:"Handle millisecond decisions, extreme imbalance, and an adversarial opponent."},f:{ja:"多段防御の設計 → レイテンシ制約と特徴量 → 不均衡と検知容量 → ラベル遅延・フィードバックループ → 敵対的ドリフト対応。",en:"Layered defense design → latency constraints and features → imbalance and review capacity → label delay and feedback loops → adversarial drift response."},a:{ja:"承認フローの中でミリ秒以内に判定する必要があるため、軽量モデル＋事前計算済み特徴量（直近取引の集約、行動プロファイルとの乖離）のリアルタイム層と、より重いモデルで事後精査するバッチ層の多段構成にします。判定は承認/拒否の二値ではなく、追加認証（3Dセキュア）を挟む中間帯を設けることで顧客体験と検知のトレードオフを緩和します。極端な不均衡下ではPrecision@レビュー容量と金額加重の検知率で評価します。ラベルはチャージバック確定まで数週間遅れ、さらに「ブロックした取引の真のラベルは不明」というフィードバックループがあるため、一部取引を確率的に通すexplorationも設計します。相手は適応する敵なので、モデル更新の高頻度化、新パターンの異常検知、ルールエンジンとの併用で対応します。誤検知は正当顧客の決済を止める実害なので、FPコストを明示的に目的関数へ入れます。",en:"Decisions must land within milliseconds inside the authorization flow, so use a layered design: a lightweight real-time model with precomputed features (recent transaction aggregates, deviation from behavioral profiles) plus a heavier batch layer for post-hoc review. Make the decision three-way — approve / step-up authentication (3-D Secure) / decline — to soften the fraud-vs-friction trade-off. Under extreme imbalance, evaluate with Precision@review-capacity and value-weighted detection rates. Labels arrive weeks later via chargebacks, and blocked transactions never reveal their true label — a feedback loop — so probabilistically let some flagged transactions through as exploration. The adversary adapts: retrain frequently, run anomaly detection for novel patterns, and keep a rules engine alongside the model. False positives block legitimate customers, so put FP cost explicitly in the objective."},r:{ja:["多段構成とレイテンシ対応","中間帯（追加認証）の設計","ラベル遅延とフィードバックループ","敵対的適応への対策"],en:["Layered design under latency","Step-up authentication tier","Label delay and feedback loops","Adversarial adaptation measures"]}},
{c:"case",case:true,t:{ja:"損害保険会社の保険金請求の不正・過大請求検知を設計してください。",en:"Design fraud and inflated-claim detection for a P&C insurer."},p:{ja:"調査員のキャパシティが限られ、誤検知が顧客体験を大きく毀損する状況です。",en:"Investigator capacity is limited and false accusations severely damage customer experience."},f:{ja:"目的の定式化（調査ROI） → ラベルの質の問題 → 特徴量（ネットワーク・テキスト） → トリアージ設計 → 公平性と顧客体験。",en:"Formulate as investigation ROI → label quality issues → features (networks, text) → triage design → fairness and customer experience."},a:{ja:"目的は「限られた調査キャパシティで回収額を最大化する」トリアージ問題として定式化します。Precision@K（K=調査可能件数）と回収額期待値が主要指標です。ラベルには「過去に調査した案件しか不正と確定していない」という選択バイアスがあり、与信のreject inferenceと同型の問題として扱います。特徴量は請求内容の異常性に加え、修理業者・医療機関・関係者のネットワーク特徴（同一業者への請求集中）、請求書・事故報告テキストのNLP特徴が効きます。運用は、高スコア案件を自動で調査に回すのではなく、理由の説明付きで調査員に提示し、判断結果をラベルとして回収するhuman-in-the-loopにします。正当な請求者への調査は体験毀損と規制リスクがあるため、属性による偏りを監査し、調査対象化の基準を文書化しておきます。",en:"Formulate as a triage problem: maximize recovered value under limited investigator capacity, with Precision@K (K = investigable cases) and expected recovery as primary metrics. Labels carry selection bias — only previously investigated claims are confirmed fraud — structurally the same problem as reject inference in credit. Effective features go beyond claim anomalies: network features across repair shops, clinics, and claimants (claims concentrating on one vendor), and NLP features from claim documents and incident reports. Operate human-in-the-loop: present high-scoring cases to investigators with explanations rather than auto-escalating, and harvest their decisions as labels. Investigating legitimate claimants damages trust and invites regulatory risk, so audit for demographic skew and document escalation criteria."},r:{ja:["調査ROIとして定式化","ラベルの選択バイアス","ネットワーク/テキスト特徴","human-in-the-loopと公平性"],en:["Formulated as investigation ROI","Label selection bias","Network/text features","Human-in-the-loop and fairness"]}},
{c:"case",case:true,t:{ja:"半導体工場の歩留まり改善をデータで支援してください。",en:"Support yield improvement at a semiconductor fab with data science."},p:{ja:"数百工程・数千センサーから不良の原因工程を特定するという課題です。",en:"Identify root-cause process steps for defects across hundreds of steps and thousands of sensors."},f:{ja:"予測より原因特定が目的 → データ統合（ロット追跡） → 高次元スクリーニング → 交絡（装置×時期） → 実験計画（DoE）で確証 → 現場実装。",en:"Goal is root-causing, not prediction → data integration (lot traceability) → high-dimensional screening → confounding (tool × time) → confirm with DoE → floor implementation."},a:{ja:"目的は予測精度ではなく「どの工程・装置・条件が不良を作るか」の原因特定であることをまず確認します。ロットが数百工程のどの装置をいつ通ったかを結合したデータ基盤が前提です。分析は、まず装置間比較（同一工程で装置Aを通ったロットの不良率が高いか）や工程条件と歩留まりの関連を高次元スクリーニングし、候補を絞ります。ここで「特定装置は特定製品にしか使われない」「時期と装置が交絡する」といった観測データの罠が多いため、関連が見えたら鵜呑みにせず、条件を振った実験計画（DoE）や装置の意図的な使い分けで因果を確証します。エンジニアの物理知識との突き合わせが不可欠で、統計的シグナルを物理メカニズム仮説に翻訳できて初めて対策になります。成果は歩留まり％ではなく金額換算で経営報告します。",en:"First confirm the goal is root-cause identification — which steps, tools, and conditions create defects — not predictive accuracy. The prerequisite is integrated lot traceability: which tool each lot passed at each step, when. Screen high-dimensionally: tool-to-tool comparisons within steps, associations between process parameters and yield, narrowing candidates. Observational traps abound — certain tools only run certain products, tools confound with time periods — so treat associations as hypotheses and confirm causally via designed experiments (DoE) or deliberate tool allocation. Collaboration with process engineers is essential: statistical signals only become countermeasures once translated into physical mechanism hypotheses. Report results in currency, not yield points."},r:{ja:["原因特定と目的を再定義","データ統合の前提","観測データの交絡の罠","DoEでの確証と現場協働"],en:["Reframed goal as root-causing","Data integration prerequisite","Observational confounding traps","DoE confirmation and engineer collaboration"]}},
{c:"case",case:true,t:{ja:"グローバル製造業のサプライチェーン在庫最適化を設計してください。",en:"Design supply chain inventory optimization for a global manufacturer."},p:{ja:"多段階ネットワーク（工場→地域DC→拠点）で、欠品と運転資本の両方を改善したい状況です。",en:"A multi-echelon network (plants → regional DCs → local sites); improve both stockouts and working capital."},f:{ja:"目的関数（サービスレベルvs運転資本） → 需要とリードタイムの不確実性 → 多段階の構造 → 予測＋最適化の分離 → 段階的導入。",en:"Objective (service level vs working capital) → demand and lead-time uncertainty → multi-echelon structure → separating forecasting from optimization → phased rollout."},a:{ja:"経営目標を「サービスレベル制約下での在庫運転資本最小化」として定式化し、品目×拠点ごとにサービスレベル目標を差別化します（全品一律98%は過剰在庫の温床）。技術的には需要予測とリードタイム分布の推定（ここも不確実）を行い、その分布を入力に安全在庫・発注点を計算する「予測＋最適化」の2層に分けます。多段階ネットワークでは下流の安全在庫と上流の集約在庫の置き場所トレードオフ（リスクプーリング）が本質で、multi-echelon最適化が単拠点計算より効きます。ABC/XYZ分析で品目を層別し、予測可能な高回転品から自動化、間欠需要の低回転品は発注ルール＋人の判断とします。効果はシミュレーションで事前検証し、一部拠点でのパイロットで欠品率・在庫日数・手作業時間を測って全社展開します。計画担当者が信頼して使うかが成否を分けるため、推奨の根拠表示と上書き学習は必須です。",en:"Formulate the executive goal as minimizing inventory working capital subject to service-level constraints, differentiating targets by item×location — a flat 98% everywhere breeds excess stock. Technically, separate into two layers: forecasting demand and lead-time distributions (both uncertain), then optimizing safety stocks and reorder points from those distributions. In multi-echelon networks the essence is where to hold buffer — downstream safety stock vs upstream pooled stock (risk pooling) — so multi-echelon optimization beats site-by-site math. Stratify items via ABC/XYZ: automate predictable fast-movers; keep rule-plus-judgment for intermittent slow-movers. Validate by simulation, pilot at selected sites measuring stockouts, inventory days, and planner hours, then scale. Planner trust decides success, so show recommendation rationale and learn from overrides."},r:{ja:["制約付き最適化として定式化","予測と最適化の分離","多段階/リスクプーリングの本質","層別自動化とパイロット検証"],en:["Constrained-optimization formulation","Separated forecasting from optimization","Multi-echelon / risk pooling essence","Stratified automation and pilots"]}},
{c:"case",case:true,t:{ja:"物流会社のラストマイル配送ルート最適化を設計してください。",en:"Design last-mile delivery route optimization for a logistics company."},p:{ja:"MLと最適化（OR）の役割分担を明確にして答えてください。",en:"Be explicit about the division of labor between ML and operations research."},f:{ja:"意思決定の構造（割当→順序） → ORが主役、MLは入力の予測 → 走行時間/不在予測 → 制約の聞き取り → 現場受容性と検証。",en:"Decision structure (assignment → sequencing) → OR as the core, ML predicting inputs → travel time / absence prediction → eliciting constraints → driver acceptance and validation."},a:{ja:"これは本質的に車両ルーティング問題（VRP）で、中核は最適化ソルバーです。MLの役割はソルバーへの入力を良くすること、具体的には区間走行時間の予測（時間帯・天候・地域）、配達先の不在確率予測（再配達コスト削減のため時間帯ごと）、荷量予測です。この役割分担を最初に示すのがポイントです。制約（車両容量、時間指定、ドライバー勤務規則、スキル）を現場から聞き取り、目的関数は距離最小化ではなく「配達完了率・遅延・コスト・ドライバー負荷」の重み付けにします。評価は、過去実績ルートとの反実仮想比較はバイアスが出るため、営業所単位のA/B導入で配達生産性と残業時間を比較します。ベテランドライバーの暗黙知（駐車位置、建物の入り方）はモデル外の価値なので、ルート提案への修正をフィードバックとして取り込む設計にし、「AIが仕事を奪う」ではなく「面倒な計画を肩代わりする」という導入ナラティブを作ります。",en:"This is fundamentally a vehicle routing problem — an optimization solver is the core. ML's role is improving solver inputs: segment travel-time prediction (time of day, weather, area), recipient absence probability by time window (to cut redelivery), and volume forecasts. Stating this division of labor upfront is the key move. Elicit constraints from operations — vehicle capacity, delivery windows, labor rules, skills — and set the objective as a weighted mix of completion rate, lateness, cost, and driver workload, not raw distance. For evaluation, counterfactual comparison to historical routes is biased, so run depot-level A/B rollouts comparing productivity and overtime. Veteran drivers' tacit knowledge (parking spots, building access) lives outside the model, so capture their route edits as feedback, and frame adoption as removing tedious planning, not replacing drivers."},r:{ja:["ORとMLの役割分担","予測対象の特定","制約の聞き取りと目的関数","営業所A/Bと現場受容"],en:["OR/ML division of labor","Identified prediction targets","Constraint elicitation and objective","Depot A/B and driver acceptance"]}},
{c:"case",case:true,t:{ja:"病院の30日以内再入院リスク予測を設計してください。",en:"Design a 30-day hospital readmission risk model."},p:{ja:"臨床現場での使われ方と、医療特有のバイアス・倫理を含めてください。",en:"Cover clinical workflow integration and healthcare-specific biases and ethics."},f:{ja:"意思決定（誰に退院後支援を） → 予測時点＝退院前 → 医療データの罠 → 介入効果との区別 → 公平性 → 臨床受容。",en:"Decision (who gets post-discharge support) → prediction at discharge → healthcare data traps → distinguishing from intervention effect → fairness → clinical acceptance."},a:{ja:"目的は再入院予測自体ではなく「退院後支援プログラム（訪問看護、服薬指導）を誰に割り当てるか」の意思決定支援です。予測時点は退院判断前とし、その時点で確定している診断・検査値・入院経過・社会的要因のみを特徴量にします。医療データ特有の罠として、「医療アクセスが悪い患者は再入院ではなく悪化しても来院しない」ことで低リスクに見える構造、過去の医療費を重症度の代理にすると人種・所得バイアスを引き継ぐ問題（著名な先行事例あり）に注意し、属性別の校正を監査します。高リスク予測≠支援が効く、なので、支援プログラムの効果はRCTか段階導入で別途検証します。臨床導入では、EHRワークフローへの組み込み、アラート疲れを避けるための件数設計、医療者への説明可能性が精度以上に成否を分けます。",en:"The goal is not prediction per se but deciding who receives post-discharge support (home nursing, medication counseling). Predict before the discharge decision using only data finalized by then: diagnoses, labs, stay course, social factors. Healthcare-specific traps: patients with poor access look low-risk because they deteriorate without returning, and using past healthcare costs as a severity proxy imports racial and income bias — a famous documented failure — so audit calibration across groups. High risk does not mean the intervention works; validate the support program's effect separately via RCT or staged rollout. For clinical adoption, EHR workflow integration, alert-volume design to avoid fatigue, and explainability to clinicians matter more than another point of AUC."},r:{ja:["介入割当の意思決定として定義","時点整合な特徴量","医療特有のバイアスに言及","効果検証と臨床受容"],en:["Framed as intervention allocation","Time-consistent features","Healthcare-specific biases","Effect validation and clinical adoption"]}},
{c:"case",case:true,t:{ja:"消費財メーカーのマーケティングミックスモデリング（MMM）を設計してください。",en:"Design marketing mix modeling (MMM) for a consumer goods company."},p:{ja:"デジタル計測が制限される中で、チャネル別予算配分を最適化したい状況です。",en:"Digital tracking is restricted; the client wants channel-level budget allocation."},f:{ja:"目的（予算再配分） → MMMの構造（adstock・飽和） → 識別の弱さと対処 → 実験での校正 → 意思決定への接続。",en:"Goal (budget reallocation) → MMM structure (adstock, saturation) → weak identification and mitigations → calibration with experiments → decision integration."},a:{ja:"MMMは週次売上をチャネル別広告費・価格・販促・季節性・外部要因に回帰し、広告の残存効果（adstock）と収穫逓減（飽和曲線）をモデル化して、チャネル別の限界ROIを推定します。クッキー規制でユーザー単位のアトリビューションが崩れる中、集計データで済む点が再評価されています。ただし識別上の弱点が本質的で、広告費が売上見込みに応じて決められている内生性、チャネル間の相関、データ点の少なさから、係数は不安定になりがちです。対処として、ベイズ推定で事前分布に業界知識を入れる、そして最重要なのは地域分割実験やブランドリフト調査で主要チャネルの効果を実験的に校正し、MMMをそれに整合させることです。成果物は係数表ではなく「予算をどう動かすと売上がどう変わるか」のシミュレーターと最適配分案で、四半期ごとの実験→再校正のサイクルを運用として提案します。",en:"MMM regresses weekly sales on channel spend, price, promotions, seasonality, and externals, modeling carryover (adstock) and diminishing returns (saturation) to estimate marginal ROI per channel. As cookie restrictions break user-level attribution, its aggregate-data approach is back in favor. But identification is inherently weak: spend is set endogenously based on expected sales, channels correlate, and data points are few, so coefficients wobble. Mitigate with Bayesian priors encoding industry knowledge, and — most importantly — calibrate top channels experimentally via geo-split tests and brand lift studies, constraining the MMM to match. Deliver not a coefficient table but a budget simulator with a recommended allocation, plus an operating cadence of quarterly experiments and recalibration."},r:{ja:["MMMの構造を説明","内生性/識別の弱さ","実験による校正","シミュレーターとして納品"],en:["Explained MMM structure","Endogeneity / weak identification","Experimental calibration","Delivered as a simulator"]}},
{c:"case",case:true,t:{ja:"サブスクリプションビジネスのCLV（顧客生涯価値）を推定し、活用する仕組みを設計してください。",en:"Design CLV estimation and activation for a subscription business."},p:{ja:"推定手法だけでなく、CLVを使ってどの意思決定を変えるかまで話してください。",en:"Go beyond estimation methods — which decisions does CLV actually change?"},f:{ja:"用途の定義（獲得・維持・優遇の判断） → 生存×収益の分解 → 割引と不確実性 → セグメント別CAC上限 → 検証の難しさ。",en:"Define uses (acquisition, retention, treatment decisions) → survival × revenue decomposition → discounting and uncertainty → segment-level CAC caps → validation challenges."},a:{ja:"CLVは「残存期間×期間あたり利益」の期待値で、サブスクなら生存時間分析（解約ハザード）と将来ARPUの予測に分解し、割引率を掛けて現在価値化します。契約型なら比較的素直ですが、注意点は、①新規顧客はデータが浅く不確実性が大きい（区間で持つ）、②CLVは介入で変わる動的な量であり固定ラベルではない、③粗利ベースで計算しないと過大評価する、です。活用が本丸で、獲得側ではチャネル・キャンペーン別のCLV/CAC比で予算を再配分し、「初月CVR最適化」から「良質顧客の獲得」へ入札戦略を変えます。維持側では高CLV×高解約リスク×高upliftの顧客に維持投資を集中させます。検証は長期実績との突き合わせに時間がかかるため、短期は既知コホートでのバックテスト、以後はコホート追跡ダッシュボードで予実を監視します。",en:"CLV is the expected value of remaining lifetime × profit per period: for subscriptions, decompose into survival analysis (churn hazard) and future ARPU forecasts, discounted to present value. Contractual settings are relatively tractable, but note: new customers carry wide uncertainty (keep intervals, not points); CLV is dynamic and intervention-dependent, not a fixed label; and compute on contribution margin or you overstate it. Activation is the real point: on acquisition, reallocate budget by channel/campaign CLV-to-CAC ratios, shifting bidding from first-month conversion to quality of customers acquired; on retention, concentrate spend where CLV, churn risk, and uplift are all high. Validation against realized lifetimes takes years, so backtest on mature cohorts first, then run cohort-tracking dashboards comparing predicted vs actual."},r:{ja:["生存×収益への分解","不確実性と粗利ベース","獲得/維持の意思決定を変える","バックテストとコホート監視"],en:["Survival × revenue decomposition","Uncertainty and margin basis","Changed acquisition/retention decisions","Backtesting and cohort monitoring"]}},
{c:"case",case:true,t:{ja:"ホテルチェーンのダイナミックプライシングを設計してください。",en:"Design dynamic pricing for a hotel chain."},p:{ja:"需要予測、価格弾力性、競合、そして顧客の公平感への配慮を含めてください。",en:"Include demand forecasting, price elasticity, competition, and customer fairness perceptions."},f:{ja:"目的（RevPAR最大化） → 残室×残日数の構造 → 需要予測と弾力性推定 → 競合価格 → 制約とガードレール → 実験と組織移行。",en:"Objective (RevPAR maximization) → remaining rooms × days structure → demand forecasting and elasticity → competitor prices → constraints and guardrails → experiments and organizational transition."},a:{ja:"目的は当日単価ではなく在庫全体の収益（RevPAR）最大化で、「残り部屋数×残り日数」の状態で価格を逐次決める在庫制約付き最適化として定式化します。要素は3つ、①日付・地域イベント・曜日・リードタイム別の需要予測、②価格弾力性の推定（過去価格は需要に応じて動いており内生的なので、価格テストで外生変動を作る）、③競合価格のポジショニングです。実装は予測＋最適化を分け、booking curveの実績乖離で日々補正します。重要な運用面として、価格変動幅・変更頻度の上限、常連への急な値上がり回避といったガードレールを設け、「同じ部屋が友人の半額だった」型の公平感毀損に配慮します。効果検証はホテル単位のスイッチバックやマッチドペア実験でRevPARを比較します。レベニューマネージャーの職務を置き換えるのではなく、例外対応と戦略に集中させる再設計として提案します。",en:"The objective is total inventory revenue (RevPAR), not tonight's rate — a stock-constrained sequential pricing problem over remaining rooms × days to arrival. Three components: demand forecasting by date, local events, weekday, and lead time; price elasticity estimation (historical prices moved with demand, hence endogenous — create exogenous variation via price tests); and competitor price positioning. Separate forecasting from optimization, correcting daily against booking-curve deviations. Operationally, set guardrails — bounds on movement size and frequency, protection for loyal guests — to avoid 'my friend paid half' fairness backlash. Validate with hotel-level switchback or matched-pair experiments on RevPAR. Position it as refocusing revenue managers on exceptions and strategy, not replacing them."},r:{ja:["在庫制約付き最適化の定式化","弾力性の内生性と価格テスト","公平感のガードレール","実験検証と組織面"],en:["Stock-constrained formulation","Elasticity endogeneity and price tests","Fairness guardrails","Experimental validation and org side"]}},
{c:"case",case:true,t:{ja:"ECサイトのレコメンドシステムを設計してください。",en:"Design a recommendation system for an e-commerce site."},p:{ja:"コールドスタート、多様性、ビジネス目的（粗利・在庫）との整合を含めてください。",en:"Cover cold start, diversity, and alignment with business goals (margin, inventory)."},f:{ja:"目的の定義（クリックでなく増分価値） → 候補生成→ランキングの2段構成 → コールドスタート → 多様性/人気バイアス → ビジネスルール層 → 実験。",en:"Define the objective (incremental value, not clicks) → two-stage retrieval + ranking → cold start → diversity / popularity bias → business rule layer → experiments."},a:{ja:"まず目的を確認します。クリック最大化は近視眼で、粗利・リピートへの増分効果が真の目的です。アーキテクチャは業界標準の2段構成、すなわち協調フィルタリング/embedding近傍探索による候補生成と、文脈特徴量（閲覧セッション、時間帯、在庫、価格）を使うGBDT/NNランキングに分けます。コールドスタートは、新商品側はコンテンツ特徴（画像・テキストembedding）、新規ユーザー側は人気×文脈ベースから始めて逐次個人化します。放置すると人気商品に収束するため、多様性・新規性を明示的にランキングへ入れ、探索枠（bandit）でフィードバックループを緩和します。その上に在庫消化、粗利、出品者間の公平性などのビジネスルール層を重ねます。評価はオフライン（Recall@K）を開発の高速化に留め、最終判断はA/Bで粗利・リピート率を見ます。「レコメンド経由売上」は自然に買ったはずの分を含むため、増分（incrementality）で価値を報告します。",en:"First pin the objective: click maximization is myopic; incremental margin and repeat purchases are the real goal. Use the industry-standard two-stage architecture — candidate generation via collaborative filtering / embedding retrieval, then GBDT/NN ranking with contextual features (session, time, stock, price). Cold start: content features (image/text embeddings) for new items, popularity-times-context for new users, personalizing as data accrues. Left alone, systems converge on bestsellers, so inject diversity and novelty into ranking and keep exploration slots (bandits) to soften feedback loops. Layer business rules on top: inventory clearance, margin, seller fairness. Keep offline metrics (Recall@K) for fast iteration, but decide via A/B tests on margin and repeat rate — and report value as incrementality, since 'recommendation-attributed revenue' includes purchases that would have happened anyway."},r:{ja:["目的をビジネス価値で定義","2段アーキテクチャ","コールドスタートとフィードバックループ","増分での価値報告"],en:["Business-value objective","Two-stage architecture","Cold start and feedback loops","Incrementality-based reporting"]}},
{c:"case",case:true,t:{ja:"コールセンターの需要予測と人員配置最適化を設計してください。",en:"Design call volume forecasting and staffing optimization for a call center."},p:{ja:"サービスレベル（応答率）と人件費のトレードオフを扱ってください。",en:"Handle the trade-off between service level (answer rate) and labor cost."},f:{ja:"2層問題（予測→配置） → 間隔別・スキル別予測 → Erlang/シミュレーション → シフト制約 → 予実差の運用 → 根本原因の削減。",en:"Two-layer problem (forecast → rostering) → interval- and skill-level forecasts → Erlang / simulation → shift constraints → intraday management → reducing root-cause volume."},a:{ja:"問題は「30分単位×スキル別の呼量予測」と「その予測を満たす最小コストのシフト編成」の2層に分かれます。予測は季節性・曜日・時刻に加え、請求サイクル、キャンペーン、障害イベントをドライバーとして使い、分位点で不確実性を出します。配置側は、呼量と平均処理時間から必要席数をErlang Cやシミュレーションで求め、応答率目標（例: 20秒以内80%）を制約に、労務ルール・スキルミックスを満たすシフトを最適化します。ここでサービスレベル目標自体を意思決定変数として扱い、「応答率を1pt上げる人件費」と「放棄呼の失注・解約コスト」を突き合わせて経営と合意するのがコンサル的な付加価値です。運用では日中の予実乖離に対する呼び出し・振り替えルールを設計します。さらに一歩引いて、問い合わせの上位理由を分析してセルフサービス化で呼量自体を減らす提案まで含めると、単なる配置最適化を超えた価値になります。",en:"The problem splits into two layers: forecasting call volume by 30-minute interval and skill, then building the minimum-cost roster that meets it. Forecast with seasonality, weekday, time of day, plus drivers like billing cycles, campaigns, and outage events, expressing uncertainty as quantiles. For staffing, convert volume and handle time into required seats via Erlang C or simulation, then optimize shifts under labor rules and skill mixes against a service-level target (e.g., 80% answered in 20s). The consulting-grade move is treating the service level itself as a decision variable: price out the labor cost of one more point of answer rate against the lost-sales and churn cost of abandoned calls, and agree it with management. Design intraday rules for forecast misses (callouts, reallocation). Then step back: analyze top contact reasons and propose self-service deflection to shrink volume itself — value beyond rostering."},r:{ja:["2層に分解","不確実性込みの間隔別予測","サービスレベルを意思決定変数に","呼量削減まで提案"],en:["Decomposed into two layers","Interval forecasts with uncertainty","Service level as a decision variable","Proposed volume reduction"]}},
{c:"case",case:true,t:{ja:"B2B SaaS企業の解約早期警告システムを設計してください。",en:"Design an early-warning churn system for a B2B SaaS company."},p:{ja:"顧客数が数百社と少なく、契約更新は年次、解約は営業が事後に知る状況です。",en:"Only a few hundred accounts, annual renewals, and sales learns of churn after the fact."},f:{ja:"少データの制約 → ヘルススコアの設計 → 利用ログの特徴量 → 統計よりルール＋判断の併用 → CSワークフロー統合 → 効果測定。",en:"Small-data constraints → health score design → usage-log features → rules + judgment over pure ML → CS workflow integration → impact measurement."},a:{ja:"数百社・年次更新ではMLに必要なラベル数が根本的に不足するため、「まず複雑なモデルではなくヘルススコア」と正直に設計します。利用ログ（アクティブユーザー数の趨勢、主要機能の利用、管理者のログイン減）、サポートチケットの感情とエスカレーション、契約主担当者の退職、四半期ビジネスレビューの実施状況などを、解約事例の定性分析とCSの知見で重み付けした複合スコアにします。データが貯まればロジスティック回帰程度から始めて検証します。重要なのは予測時点で、年次更新の3〜6か月前に警告が出ないと打ち手が間に合いません。運用はCSMのワークフローに統合し、警告→プレイブック（エグゼクティブスポンサー面談、活用支援）→結果記録のループでラベルを蓄積します。効果測定は少数ゆえRCTが難しいので、警告の的中率と、警告後の介入有無での更新率比較（バイアスに留意）から始め、実績を経営に報告します。",en:"With a few hundred accounts and annual renewals, labels are fundamentally scarce — so be honest that a health score beats a complex model here. Compose it from usage logs (active-user trends, key feature adoption, admin login decay), support ticket sentiment and escalations, champion departure, and QBR cadence, weighted via qualitative churn post-mortems and CS knowledge; graduate to logistic regression as labels accumulate. The critical design choice is timing: warnings must fire 3-6 months before renewal or no play can land. Integrate into CSM workflows: alert → playbook (executive sponsor meeting, adoption support) → recorded outcome, which also accrues labels. With so few accounts an RCT is hard, so start with warning precision and renewal-rate comparisons by intervention status (noting the bias), and report realized saves to management."},r:{ja:["少データの制約を正直に扱う","複合ヘルススコアの設計","更新前リードタイムの重要性","CSワークフローとラベル蓄積"],en:["Honest about small data","Composite health score design","Lead time before renewal","CS workflow and label accrual"]}},
{c:"case",case:true,t:{ja:"広告主として、複数チャネルへの広告予算配分を最適化してください。",en:"As an advertiser, optimize budget allocation across marketing channels."},p:{ja:"アトリビューションの限界を踏まえ、実験・MMM・入札の関係を整理してください。",en:"Acknowledge attribution limits; organize the relationship among experiments, MMM, and bidding."},f:{ja:"意思決定の階層（年次配分/キャンペーン/入札） → アトリビューションの限界 → 実験＋MMMの三角測量 → 限界ROIで配分 → 継続的な実験運用。",en:"Decision hierarchy (annual allocation / campaign / bidding) → attribution limits → triangulating experiments + MMM → allocate by marginal ROI → continuous experimentation."},a:{ja:"まず意思決定を階層化します。年次のチャネル間配分、四半期のキャンペーン配分、日次の自動入札は時間軸も手法も異なります。ラストクリック型アトリビューションは検索広告など「刈り取り」チャネルを過大評価し、認知チャネルを過小評価するため、これを配分の根拠にしないことを明確にします。信頼できる根拠は、①地域分割実験やコンバージョンリフトテストによる増分効果、②それで校正したMMM、③プラットフォーム自動入札の実績、の三角測量です。配分原理は「各チャネルの限界ROIが等しくなる点」で、飽和曲線上のどこにいるかで増減を決めます。運用として、予算の一定割合（例: 10%）を常に実験に充て、四半期ごとに校正→再配分するサイクルを提案します。経営への報告は「このチャネルのROASがX」ではなく「予算を1億円動かしたときの増分売上の推定と不確実性」の形にします。",en:"First layer the decisions: annual cross-channel allocation, quarterly campaign allocation, and daily automated bidding differ in horizon and method. Last-click attribution over-credits harvesting channels like branded search and under-credits awareness channels — state explicitly that it will not drive allocation. Credible evidence comes from triangulating (1) incrementality from geo-split and conversion lift tests, (2) an MMM calibrated to those experiments, and (3) platform bidding performance. The allocation principle is equalizing marginal ROI across channels, deciding shifts by position on each saturation curve. Operationally, reserve a fixed share of budget (say 10%) for always-on experiments and recalibrate quarterly. Report to executives not 'channel X has ROAS Y' but the estimated incremental revenue and uncertainty of moving 100 million yen."},r:{ja:["意思決定の階層化","アトリビューションの限界を明言","実験×MMMの三角測量","限界ROI均等化の原理"],en:["Layered the decisions","Stated attribution limits","Experiment × MMM triangulation","Equal-marginal-ROI principle"]}},
{c:"case",case:true,t:{ja:"B2B企業の営業リードスコアリングと優先順位付けを設計してください。",en:"Design sales lead scoring and prioritization for a B2B company."},p:{ja:"営業が使ってくれない失敗が多い領域です。モデルと同じ比重で運用を設計してください。",en:"This is a domain where sales ignores the model — design adoption with the same weight as the model."},f:{ja:"目的（成約×案件規模の期待値） → ファネル段階別のモデル → セルフフルフィリングバイアス → 営業ワークフロー統合 → 理由の提示 → 効果検証。",en:"Objective (expected value = win rate × deal size) → models per funnel stage → self-fulfilling bias → sales workflow integration → reason codes → impact validation."},a:{ja:"目的を「成約確率」ではなく「成約確率×想定案件規模＝期待値」での優先順位付けとし、営業リソースという制約資源の配分問題として定式化します。データは企業属性（業種・規模・技術スタック）、行動シグナル（資料DL、価格ページ閲覧、デモ依頼）、過去の商談履歴で、ファネル段階ごとに別モデル（新規リードの初回接触優先度、商談の受注確率）を作ります。この領域特有の罠は、営業が高スコアリードばかり追うことでスコアが自己成就し、低スコア帯の真の成約率が観測できなくなることです。一部リードのランダム割当を残して校正します。導入の成否は運用で決まります。CRMに理由コード付きで表示し（「過去30日で価格ページ3回閲覧」）、営業会議のパイプラインレビューに組み込み、スコアと営業の直感が割れたケースを毎月レビューして改善します。効果はスコア導入チームと非導入チームの成約率・営業生産性の比較で示します。",en:"Frame the objective as prioritization by expected value — win probability × deal size — an allocation problem for the scarce resource of sales time. Use firmographics (industry, size, tech stack), behavioral signals (content downloads, pricing page visits, demo requests), and historical opportunity data, with separate models per funnel stage (initial outreach priority for new leads, win probability for open opportunities). The domain-specific trap is self-fulfilling scores: reps chase high scores, so low-score conversion is never observed — keep a slice of randomly assigned leads for calibration. Adoption decides success: surface scores in the CRM with reason codes ('viewed pricing 3 times in 30 days'), embed them in pipeline reviews, and hold monthly sessions on cases where score and rep intuition disagreed. Prove impact by comparing win rates and productivity between teams using the score and matched teams not yet onboarded."},r:{ja:["期待値での定式化","段階別モデル","自己成就バイアスと校正","理由コードと営業プロセス統合"],en:["Expected-value formulation","Stage-specific models","Self-fulfilling bias and calibration","Reason codes and sales process integration"]}},
{c:"case",case:true,t:{ja:"小売銀行の顧客セグメンテーションを、施策に繋がる形で設計してください。",en:"Design customer segmentation for a retail bank that actually drives action."},p:{ja:"「クラスタリングして終わり」にしない設計を問われています。",en:"The challenge: avoid 'we clustered, the end.'"},f:{ja:"用途の確認（何の施策を変えるか） → 軸の設計（価値・ニーズ・行動） → 手法よりも解釈可能性 → セグメント別戦略 → 配信と効果測定 → 更新運用。",en:"Confirm the use (which decisions change) → axis design (value, needs, behavior) → interpretability over method → per-segment strategy → activation and measurement → refresh cadence."},a:{ja:"最初に「セグメントで何の意思決定を変えるのか」（商品提案、チャネル戦略、料金体系）を確認します。用途が決まれば軸が決まります。例えば収益性（現在価値と将来性）、ライフステージ・ニーズ（資産形成、住宅、退職）、行動（デジタル/店舗、取引頻度）です。手法はk-meansでも潜在クラスモデルでも良く、それより「各セグメントが名前を付けられ、担当役員が自分の言葉で語れるか」が重要です。統計的な最適クラスタ数より、施策を打ち分けられる5〜8個に整えます。各セグメントにサイズ・収益・代表ペルソナ・推奨アクション・目標KPIを紐づけた「セグメント戦略シート」を作り、CRMに配信してキャンペーンをセグメント別に出し分け、効果をA/Bで測ります。顧客は移動するため、セグメント間の遷移を追跡し、四半期での再スコアリングと年次での定義見直しを運用に組み込みます。",en:"Start by confirming which decisions the segments will change — product offers, channel strategy, pricing. The use dictates the axes: profitability (current and potential), life stage and needs (wealth building, housing, retirement), and behavior (digital vs branch, transaction patterns). The algorithm (k-means, latent class) matters less than whether each segment can be named and retold by an executive in their own words; favor 5-8 actionable segments over the statistically optimal number. Produce a segment strategy sheet per segment — size, profit, persona, recommended actions, target KPIs — push assignments into the CRM, differentiate campaigns by segment, and measure with A/B tests. Customers migrate, so track transitions, re-score quarterly, and revisit definitions annually."},r:{ja:["用途から軸を設計","解釈可能性を優先","施策・KPIへの紐付け","遷移追跡と更新運用"],en:["Axes from the use case","Prioritized interpretability","Tied to actions and KPIs","Transition tracking and refresh"]}},
{c:"case",case:true,t:{ja:"外食チェーンの新規出店の立地評価モデルを設計してください。",en:"Design a site selection model for a restaurant chain's new locations."},p:{ja:"出店判断は不可逆で高額、かつ過去データは「選ばれた立地」しかない状況です。",en:"Openings are costly and irreversible, and history contains only sites that were chosen."},f:{ja:"意思決定の構造（候補評価と売上予測） → データ（商圏・人流・競合） → 選択バイアス → 類似店舗アプローチ → 不確実性の提示 → 事後検証ループ。",en:"Decision structure (candidate evaluation, revenue forecast) → data (trade area, mobility, competition) → selection bias → analog store approach → uncertainty communication → post-opening validation loop."},a:{ja:"目的は候補物件の初年度〜3年売上予測と、それに基づく出店可否・賃料上限の判断支援です。データは商圏人口・昼夜間人口、人流データ、競合密度、視認性・接道、テナントミックス、既存店の実績です。中核手法は「類似店舗法」のモデル化で、既存店の立地特徴と売上の関係を学習し候補地に適用します。ここで最大の罠は選択バイアスです。過去データは審査を通った立地だけで構成され、「悪い立地の売上」が観測されていないため、モデルは楽観に歪みがちです。不振で閉店した店舗のデータを必ず含め、予測の適用範囲（既存店と似た商圏か）を明示します。出店判断は不可逆なので、点予測でなく予測区間と主要リスク要因（例: 近隣に競合出店計画）を添え、最終判断は人間の委員会に残します。開店後の予実差を体系的に記録し、モデルを毎年再校正するループが長期的な精度を作ります。カニバリゼーション（自社近隣店の売上減）も出店影響として同時に推定します。",en:"The goal is forecasting years 1-3 revenue for candidate sites to support go/no-go and rent ceiling decisions. Data: trade-area demographics, daytime/nighttime population, mobility data, competitor density, visibility and access, tenant mix, and existing store performance. The core method is a modeled analog approach: learn the location-to-revenue relationship from existing stores, apply to candidates. The biggest trap is selection bias — history contains only sites that passed screening, so 'bad site revenue' is unobserved and models skew optimistic. Include closed underperformers, and flag when a candidate falls outside the model's applicable domain. Since openings are irreversible, present prediction intervals and key risk factors (e.g., a planned competitor nearby), keeping the final call with a human committee. Systematically record forecast vs actual after opening and recalibrate annually. Estimate cannibalization of nearby own stores as part of the same decision."},r:{ja:["意思決定支援として定式化","選択バイアスを指摘","区間と適用範囲の明示","予実検証ループとカニバリ"],en:["Framed as decision support","Flagged selection bias","Intervals and applicability domain","Validation loop and cannibalization"]}},
{c:"case",case:true,t:{ja:"電力会社の電力需要予測システムを設計してください。",en:"Design an electricity demand forecasting system for a utility."},p:{ja:"予測誤差が需給運用コストに直結する、時間粒度の異なる複数の予測が必要な状況です。",en:"Forecast errors translate directly into balancing costs; multiple horizons and granularities are needed."},f:{ja:"用途別の予測階層（翌日・当日・長期） → ドライバー（気象・カレンダー） → 誤差の非対称コスト → 異常日対応 → アンサンブルと人間の関与 → 検証。",en:"Forecast hierarchy by use (day-ahead, intraday, long-term) → drivers (weather, calendar) → asymmetric error costs → abnormal days → ensembles and human oversight → validation."},a:{ja:"まず用途を分解します。翌日30分単位の需給計画、当日の逐次補正、月次〜年次の設備・調達計画では、要求精度も手法も異なります。短期予測の支配的ドライバーは気象（気温・湿度・日射）で、気温と需要の非線形関係（冷暖房の閾値）を捉えることが精度の核心です。カレンダー効果（曜日、祝日、連休の中日）、特異日（大規模イベント、年末年始）も重要で、気象予報自体の誤差が伝播するため、複数の気象シナリオでの予測分布を出します。誤差コストは非対称（不足時の調達価格スパイク）なので、分位点予測で運用者が安全側を選べるようにします。太陽光の普及で「見かけ需要」が天候に強く依存するようになった点も現代的な論点です。実装は複数モデルのアンサンブルに、異常日を検知したら運用者が介入できるworkflowを組み合わせ、検証は季節・気象条件別のバックテストでMAPEだけでなく需給運用コスト換算で報告します。",en:"First decompose by use: day-ahead half-hourly scheduling, intraday correction, and monthly-to-annual capacity and procurement planning demand different accuracy and methods. Weather dominates short-term forecasts — temperature, humidity, solar radiation — and capturing the nonlinear temperature-demand relationship (heating/cooling thresholds) is the core of accuracy. Calendar effects (weekdays, holidays, bridge days) and special days (major events, year-end) matter, and since weather forecast errors propagate, produce forecast distributions across weather scenarios. Error costs are asymmetric (shortage triggers price spikes), so provide quantile forecasts letting operators choose the safe side. Rooftop solar making 'apparent demand' weather-dependent is the modern twist. Implement as a model ensemble with an operator-intervention workflow for detected abnormal days, and validate with backtests by season and weather regime, reported not just as MAPE but converted into balancing cost."},r:{ja:["用途別に予測を分解","気象の非線形性","非対称コストと分位点","異常日運用とコスト換算検証"],en:["Decomposed by use case","Weather nonlinearity","Asymmetric costs and quantiles","Abnormal-day ops and cost-based validation"]}},
{c:"case",case:true,t:{ja:"人材サービス企業の求人×求職者マッチングを改善してください。",en:"Improve job-candidate matching for a staffing company."},p:{ja:"双方向マーケットプレイスであること、公平性の制約を含めて設計してください。",en:"Design for a two-sided marketplace, including fairness constraints."},f:{ja:"双方向の目的（応募×採用×定着） → 候補生成＋ランキング → 容量制約（応募集中の回避） → テキスト/embeddingマッチ → 公平性・法規制 → 実験。",en:"Two-sided objective (apply × hire × retention) → retrieval + ranking → capacity constraints (avoiding application pile-up) → text/embedding matching → fairness and regulation → experiments."},a:{ja:"目的を片側でなく「応募率×採用率×定着」の連鎖で定義します。求職者に魅力的でも採用に至らない推薦、採用されてもすぐ辞めるマッチは価値が低い。技術的には候補生成（スキル・職種・勤務地のembedding近傍）とランキング（応募・採用・定着の多段階予測）の2段構成で、職務経歴書と求人票のテキストマッチングにLLM/embeddingが効きます。マーケットプレイス特有の論点は容量制約で、人気求人に応募を集中させると企業側は捌けず、他の求人は埋まらないため、露出を分散させるマッチング理論的な調整が必要です。公平性は法的要請でもあり、性別・年齢等での不当な偏りを推薦段階で監査し、過去の採用バイアスの学習・増幅を防ぎます。評価は、推薦経由の応募だけでなくマッチ成立数と早期離職率をA/Bで測り、市場全体の厚みが増したか（充足率）をマーケットレベルで確認します。",en:"Define the objective as the chain apply × hire × retention, not one side alone — recommendations candidates love but employers reject, or hires who quit in a month, create little value. Technically, two stages: retrieval (embedding neighborhoods over skills, roles, locations) and ranking (multi-stage predictions of apply, hire, retention), with LLM/embedding text matching between resumes and job posts doing heavy lifting. The marketplace-specific issue is capacity: piling applications onto popular postings overwhelms those employers while other jobs go unfilled, so spread exposure with matching-theoretic adjustments. Fairness is also a legal requirement — audit recommendations for unjustified skew by gender or age, preventing amplification of historical hiring bias. Evaluate via A/B on completed matches and early attrition, not just applications, and confirm market-level fill rates improved."},r:{ja:["双方向の目的連鎖","2段構成とテキストマッチ","容量制約への対処","公平性監査と市場レベル評価"],en:["Two-sided objective chain","Two-stage with text matching","Capacity constraint handling","Fairness audit and market-level evaluation"]}},
{c:"genai",t:{ja:"Retrieval hit rateが高いのにRAG回答精度が低い原因は何ですか。",en:"Retrieval hit rate is high but RAG answer quality is low — what are the causes?"},p:{ja:"retrievalとgenerationを分離して診断してください。",en:"Diagnose by separating retrieval from generation."},f:{ja:"chunk、ranking、権限、コンテキスト圧迫、プロンプト、faithfulness。",en:"Chunks, ranking, permissions, context crowding, prompting, faithfulness."},a:{ja:"ヒット率が高くても、チャンクが大きすぎる、根拠が下位に埋もれる、質問に必要な複数文書の統合ができない、プロンプトが根拠制約を強制していない、権限フィルタで重要文書が落ちる、コンテキストが長すぎて無視される等があります。まずretrievalのRecall@K/MRRとgenerationのfaithfulness/answer relevanceを別々に評価します。切り分けができれば、前者はチャンク設計・re-ranking、後者はプロンプト・モデル変更と、対策が明確になります。",en:"Even with high hit rates: chunks may be too large, evidence buried low in the ranking, multi-document synthesis failing, prompts not enforcing grounding, permission filters dropping key documents, or overlong context being ignored. First evaluate retrieval (Recall@K, MRR) and generation (faithfulness, answer relevance) separately. Once separated, remedies become clear: chunking and re-ranking for the former, prompting and model changes for the latter."},r:{ja:["検索と生成を分離","複数原因を提示","評価指標を提示","改善策につなげた"],en:["Separated retrieval and generation","Multiple causes offered","Named evaluation metrics","Connected to fixes"]}},
{c:"genai",case:true,t:{ja:"企業の社内ナレッジQAシステムをRAGで設計してください。",en:"Design an enterprise internal knowledge QA system with RAG."},p:{ja:"技術構成だけでなく、権限管理・鮮度・評価・運用まで含めてください。",en:"Cover not just architecture but permissions, freshness, evaluation, and operations."},f:{ja:"ユースケースと成功指標 → 取り込みパイプライン → 検索設計（hybrid＋re-rank） → 権限・鮮度 → 生成の根拠制約 → 評価と改善ループ。",en:"Use case and success metrics → ingestion pipeline → retrieval design (hybrid + re-rank) → permissions and freshness → grounded generation → evaluation and improvement loop."},a:{ja:"まず対象ユースケース（人事規程、技術文書、営業ナレッジ等）と成功指標（自己解決率、検索時間削減）を定義します。構成は、①文書取り込み: パース・チャンク化・メタデータ付与・embedding化のパイプライン、②検索: ベクトル＋BM25のhybrid検索にre-rankerを重ねる、③生成: 取得文書に根拠を限定し、出典を引用させ、確信が持てない場合は「わからない」と答えさせるプロンプト設計です。企業導入で差がつくのは、アクセス権限の検索時フィルタ（見てはいけない文書が回答に混ざる事故の防止）、文書更新への追従（鮮度管理と再インデックス）、そして評価です。代表質問セットでretrievalとgenerationを分けて評価し、本番ではユーザーフィードバックと未回答質問ログから改善ループを回します。PoCは動きますが、この運用設計がないと本番で信頼を失います。",en:"First define target use cases (HR policies, technical docs, sales knowledge) and success metrics (self-service rate, search time saved). Architecture: (1) ingestion — parsing, chunking, metadata, embeddings; (2) retrieval — hybrid vector+BM25 with a re-ranker; (3) generation — grounded strictly in retrieved documents, citing sources, and saying 'I don't know' when unsure. What separates enterprise-grade from demo: permission-aware filtering at query time (preventing answers leaking documents the user cannot see), freshness management with re-indexing on updates, and evaluation — a curated question set scoring retrieval and generation separately, plus production loops from user feedback and unanswered-question logs. PoCs work easily; without this operational layer, trust collapses in production."},r:{ja:["ユースケースと指標の定義","hybrid検索＋re-rank","権限・鮮度への対応","評価と改善ループ"],en:["Defined use cases and metrics","Hybrid retrieval + re-ranking","Permissions and freshness","Evaluation and improvement loop"]}},
{c:"genai",t:{ja:"RAGのチャンク戦略をどう設計しますか。",en:"How do you design a chunking strategy for RAG?"},p:{ja:"固定長分割の問題点と、文書構造・ユースケースに応じた設計を説明してください。",en:"Explain the problems with fixed-size splitting and how design follows document structure and use case."},f:{ja:"チャンクの役割（検索単位と根拠単位） → 固定長の問題 → 構造ベース分割 → サイズのトレードオフ → parent-child等の工夫 → 実験で決める。",en:"Chunk roles (retrieval unit vs evidence unit) → fixed-size problems → structure-aware splitting → size trade-offs → parent-child retrieval → decide empirically."},a:{ja:"チャンクは「検索でマッチさせる単位」と「LLMに渡す根拠の単位」の2役を担い、この分離が設計の出発点です。固定長分割は文や表の途中で切れて意味が壊れ、規程文書の条項参照や表データで特に失敗します。基本は文書構造（見出し・段落・条項）に沿った分割で、小さいチャンクは検索精度が上がる一方文脈が欠け、大きいチャンクは文脈が残る一方ノイズが増えrecallが落ちます。実務で有効なのは、検索は小チャンクで行い、生成時にはその親セクションを渡すparent-child方式や、チャンクに文書タイトル・セクション名をメタデータとして付与する方法です。表・図はテキスト化やLLM要約を別途設計します。最適解は文書とクエリの性質に依存するため、評価セットでチャンクサイズ・オーバーラップをパラメータとして実験し決めるのが正攻法です。",en:"A chunk plays two roles — the unit of retrieval matching and the unit of evidence handed to the LLM — and separating these is the starting point. Fixed-size splitting cuts through sentences and tables, failing especially on clause references in policy documents and tabular data. Prefer structure-aware splitting along headings, paragraphs, and clauses. Small chunks retrieve precisely but lose context; large chunks keep context but add noise and hurt recall. Practical wins: parent-child retrieval (search small chunks, feed their parent section to generation) and enriching chunks with document title and section metadata. Tables and figures need separate handling (textualization or LLM summaries). Since the optimum depends on documents and queries, treat chunk size and overlap as parameters tuned against your evaluation set."},r:{ja:["チャンクの2つの役割","固定長の失敗例","サイズのトレードオフ","parent-child等の実務手法"],en:["Two roles of a chunk","Fixed-size failure cases","Size trade-offs","Parent-child and practical techniques"]}},
{c:"genai",t:{ja:"embeddingモデルの選定と評価をどう行いますか。",en:"How do you select and evaluate an embedding model?"},p:{ja:"公開ベンチマークだけに頼らない、自社データでの評価方法を含めてください。",en:"Include evaluation on your own data, not just public benchmarks."},f:{ja:"要件整理（言語・ドメイン・レイテンシ・コスト） → MTEB等は参考まで → 自社評価セットでRecall@K → fine-tuningの選択肢 → 次元・運用コスト。",en:"Requirements (language, domain, latency, cost) → public benchmarks as reference only → in-house eval set with Recall@K → fine-tuning options → dimensions and operating cost."},a:{ja:"まず要件を整理します。対象言語（日本語性能は英語ベンチと乖離する）、ドメイン（法務・医療・社内用語）、レイテンシ、コスト、そしてセキュリティ要件（API可か、self-host必須か）です。MTEB等の公開ベンチマークは候補の絞り込みには使えますが、自社ドメインの性能は保証しません。核心は自社評価セットの構築で、実際のクエリと正解文書のペアを数百件作り（既存のFAQ、検索ログ、LLMによる合成＋人手確認で効率化）、Recall@K・MRRで比較します。ドメイン特化用語で精度が不足する場合、対照学習でのfine-tuningや、検索を語彙ベース（BM25）とのhybridにする選択肢があります。埋め込み次元はストレージ・検索速度に直結するため、精度と運用コストのトレードオフとして評価し、モデル更新時の全文書再embedding費用も見込んでおきます。",en:"First set requirements: language (Japanese performance diverges from English benchmarks), domain (legal, medical, internal jargon), latency, cost, and security (API allowed or self-host required). Public benchmarks like MTEB shortlist candidates but do not guarantee your domain. The core is an in-house evaluation set: several hundred real query-to-relevant-document pairs (bootstrapped from FAQs, search logs, or LLM synthesis with human review), compared on Recall@K and MRR. If domain terminology underperforms, options include contrastive fine-tuning or hybrid retrieval with BM25. Embedding dimensionality drives storage and search speed, so evaluate accuracy against operating cost — and budget for re-embedding the corpus when you swap models."},r:{ja:["要件の整理","公開ベンチの限界","自社評価セットの構築","fine-tune/hybrid/コストの選択肢"],en:["Organized requirements","Limits of public benchmarks","Built an in-house eval set","Fine-tune / hybrid / cost options"]}},
{c:"genai",t:{ja:"LLMのhallucinationにどう対処しますか。",en:"How do you mitigate LLM hallucinations?"},p:{ja:"単一の対策ではなく、多層的な防御と「ゼロにはならない」前提の設計を説明してください。",en:"Describe layered defenses and design under the premise that hallucination never reaches zero."},f:{ja:"原因の理解 → grounding（RAG・根拠制約） → 出典明示と検証 → 不確実性の表明 → 用途別のリスク設計 → 人間の関与。",en:"Understand the cause → grounding (RAG, evidence constraints) → citations and verification → uncertainty expression → risk design by use case → human oversight."},a:{ja:"hallucinationはLLMが「もっともらしい続き」を生成する仕組みの本質的な副産物であり、ゼロにはできない前提で設計します。防御は多層で、①grounding: RAGで根拠を与え、「提供文脈のみから回答し、なければ不明と答える」制約をかける、②出典明示: 回答に引用を付けさせ、ユーザーが検証可能にする、③検証層: 別プロセスで回答と根拠の整合性をチェック（NLI/LLM検証器）、数値・固有名詞は決定的システムから取得、④不確実性の表明を促す、⑤UX設計: 下書き支援として人間の確認を挟む、重要度に応じて自動化レベルを変える、です。最も重要なのはユースケースのリスク階層化で、社内ブレストなら許容、顧客向け・規制文書なら人間レビュー必須、といった業務設計こそが本質的な対策です。",en:"Hallucination is an intrinsic byproduct of generating plausible continuations — design assuming it never hits zero. Defend in layers: (1) grounding — RAG plus instructions to answer only from provided context and say 'unknown' otherwise; (2) citations so users can verify; (3) a verification layer — NLI or LLM-based consistency checks between answer and evidence, with numbers and named facts fetched from deterministic systems; (4) encouraging expressed uncertainty; (5) UX design — position output as drafts with human confirmation, varying automation by stakes. The most important lever is risk-tiering use cases: acceptable for internal brainstorming, mandatory human review for customer-facing or regulated content. That workflow design is the real mitigation."},r:{ja:["ゼロにならない前提","grounding/出典/検証の多層","決定的システムとの併用","用途別リスク階層化"],en:["Premise: never zero","Layers of grounding/citation/verification","Deterministic systems alongside","Risk tiering by use case"]}},
{c:"genai",t:{ja:"RAGシステムの評価フレームワークを設計してください。",en:"Design an evaluation framework for a RAG system."},p:{ja:"開発時のオフライン評価と本番の継続評価の両方を含めてください。",en:"Include offline evaluation during development and continuous evaluation in production."},f:{ja:"コンポーネント分解（retrieval/generation） → 指標（Recall@K, faithfulness, relevance） → 評価セット構築 → LLM-as-judgeの活用と検証 → 本番モニタリング。",en:"Component decomposition (retrieval/generation) → metrics (Recall@K, faithfulness, relevance) → building eval sets → LLM-as-judge with validation → production monitoring."},a:{ja:"評価はretrievalとgenerationに分解します。retrievalはクエリ・正解文書ペアでRecall@K・MRR・nDCGを測り、generationはfaithfulness（回答が根拠に忠実か）、answer relevance（質問に答えているか）、completeness（必要情報を網羅したか）を測ります。評価セットは実ユーザーの質問ログから代表性を持たせて作り、エッジケース（答えが存在しない質問、複数文書統合が必要な質問、時点依存の質問）を意図的に含めます。スケールのためLLM-as-judgeを使いますが、人間評価とのagreementを最初に検証し、判定プロンプトをバージョン管理します。本番では、ユーザーフィードバック（👍👎）、引用クリック率、未回答率、faithfulnessの自動サンプリング監査を継続的に見て、リグレッションテストとしてリリース前に評価セットを必ず通します。「評価セットがプロダクトの品質を定義する」という思想で、評価自体を資産として育てます。",en:"Decompose into retrieval and generation. Retrieval: Recall@K, MRR, nDCG over query-relevant-document pairs. Generation: faithfulness (grounded in evidence), answer relevance, and completeness. Build the eval set representatively from real user query logs, deliberately including edge cases — unanswerable questions, multi-document synthesis, time-sensitive queries. Use LLM-as-judge for scale, but first validate agreement against human ratings and version-control the judging prompts. In production, monitor user feedback, citation click-through, unanswered rate, and sampled faithfulness audits, and gate releases on the eval set as a regression test. Treat the eval set as an asset that defines product quality and keeps compounding."},r:{ja:["コンポーネント分解","指標の具体化","評価セットの作り方","LLM-judge検証と本番監視"],en:["Component decomposition","Concrete metrics","Eval set construction","Judge validation and production monitoring"]}},
{c:"genai",t:{ja:"プロンプトエンジニアリング、RAG、fine-tuningをどう使い分けますか。",en:"How do you choose among prompt engineering, RAG, and fine-tuning?"},p:{ja:"「知識の注入」と「振る舞いの変更」という軸で整理し、コストと組み合わせにも触れてください。",en:"Organize along 'injecting knowledge' vs 'changing behavior,' touching cost and combinations."},f:{ja:"まずプロンプトで限界確認 → 知識の問題ならRAG → 振る舞い・形式の問題ならfine-tuning → コスト/更新頻度 → 組み合わせが実務解。",en:"Prompt first to find the ceiling → RAG for knowledge problems → fine-tuning for behavior/format problems → cost and update frequency → combinations as the practical answer."},a:{ja:"原則は「常にプロンプトエンジニアリングから始める」です。最も安く速く、few-shot例示だけで解決する問題は多い。それで不足する場合、不足の種類で分岐します。モデルが知らない・古い・社内固有の知識が問題ならRAGです。知識の更新が文書の差し替えで済み、出典も示せます。一方、口調・出力形式・ドメイン特有の推論パターンなど「振る舞い」の問題ならfine-tuning（実務ではLoRA等のPEFT）が有効です。fine-tuningは知識の注入には非効率で幻覚も防げない、という誤解の訂正は面接でも重要です。コスト構造も異なり、RAGは検索基盤の運用費、fine-tuningは学習データ整備と再学習の費用が掛かります。実務の最適解は多くの場合組み合わせで、例えば「RAGで知識を与え、fine-tuningで出力形式と拒否挙動を安定させる」形です。",en:"The rule: always start with prompt engineering — cheapest, fastest, and few-shot examples solve more than expected. When it falls short, branch on the type of gap. If the model lacks knowledge — recent, proprietary, domain-specific — use RAG: knowledge updates by swapping documents, with citations. If the gap is behavior — tone, output format, domain reasoning patterns — fine-tune (practically PEFT/LoRA). Correcting the common misconception matters in interviews: fine-tuning is inefficient for injecting knowledge and does not prevent hallucination. Cost structures differ too: RAG carries retrieval infrastructure costs; fine-tuning carries data curation and retraining costs. The practical optimum is usually a combination — RAG for knowledge, fine-tuning for stable format and refusal behavior."},r:{ja:["プロンプト優先の原則","知識vs振る舞いの軸","fine-tuning誤解の訂正","コストと組み合わせ"],en:["Prompt-first principle","Knowledge vs behavior axis","Corrected fine-tuning misconception","Costs and combinations"]}},
{c:"genai",t:{ja:"LLM-as-a-judge評価の設計と落とし穴を説明してください。",en:"Explain designing LLM-as-a-judge evaluation and its pitfalls."},p:{ja:"どんなバイアスがあり、人間評価とどう組み合わせるかを含めてください。",en:"Cover known biases and how to combine with human evaluation."},f:{ja:"用途（スケールする評価） → 判定設計（基準・ルーブリック） → 既知バイアス → 人間評価との校正 → 運用（バージョン管理・監査）。",en:"Purpose (scalable evaluation) → judge design (criteria, rubrics) → known biases → calibration against humans → operations (versioning, audits)."},a:{ja:"LLM-as-judgeは人間評価をスケールさせる手段で、回答の品質・忠実性・安全性を別のLLMに採点させます。設計の要点は、漠然と「良いか」を聞かず、評価基準を分解した明示的ルーブリックで1基準ずつ判定させ、判定理由を先に書かせることです。既知のバイアスとして、位置バイアス（ペア比較で先に出た方を好む→順序入替で対称化）、長さバイアス（長い回答を過大評価）、自己選好バイアス（自分と同系のモデルの出力を好む）、スタイルへの過大評価があります。導入時は必ず人間評価とのagreementを測り、乖離が大きい領域は人間に残します。運用では判定プロンプトとモデルをバージョン管理し、judge自体の変更で指標が動く事故を防ぎ、定期的に人間監査でドリフトを検出します。「judgeの精度を検証せずにjudgeで意思決定する」ことが最大の落とし穴です。",en:"LLM-as-a-judge scales human evaluation by having another LLM score quality, faithfulness, and safety. Design essentials: never ask a vague 'is this good' — decompose criteria into explicit rubrics judged one at a time, with reasoning written before the verdict. Known biases: position bias in pairwise comparisons (mitigate by swapping order), length bias (overrating longer answers), self-preference (favoring outputs from similar models), and style over substance. At adoption, measure agreement with human raters and keep humans on the areas of divergence. Operationally, version-control judge prompts and models so metric shifts are not artifacts of judge changes, and run periodic human audits for drift. The biggest pitfall: making decisions with a judge whose accuracy you never validated."},r:{ja:["ルーブリック分解の設計","バイアスを複数列挙","人間評価との校正","バージョン管理と監査"],en:["Rubric-decomposed design","Listed multiple biases","Calibration with humans","Versioning and audits"]}},
{c:"genai",t:{ja:"LLMエージェントを導入すべきか、単純なワークフローで済ませるべきかをどう判断しますか。",en:"How do you decide between an LLM agent and a simple workflow?"},p:{ja:"エージェントの自律性がもたらす価値とリスクをトレードオフとして説明してください。",en:"Frame agent autonomy as a value-risk trade-off."},f:{ja:"定義（ループ＋ツール＋自律判断） → ワークフローで足りる条件 → エージェントが要る条件 → 信頼性の課題 → 段階的な自律性拡大。",en:"Definition (loop + tools + autonomous decisions) → when workflows suffice → when agents earn their keep → reliability challenges → graduated autonomy."},a:{ja:"エージェントは「LLMがツールを使いながら、次に何をすべきか自律的に判断してループする」構成です。原則は、タスクの手順が事前に決められるなら固定ワークフロー（プロンプトチェーン）で作るべき、です。決定的で、デバッグ可能で、安価だからです。エージェントが価値を持つのは、経路が入力によって大きく変わり事前に列挙できないタスク、例えば調査・複数システム横断のトラブルシューティング・コード修正です。代償は信頼性で、ステップ数が増えるほどエラーが複利で効き、コストとレイテンシも読めなくなります。実務では、①ツールの権限を最小化し破壊的操作は確認を挟む、②ステップ数・コストの上限を設ける、③実行トレースを記録して評価可能にする、④まず人間承認付きの半自律から始め、実績に応じて自律範囲を広げる、という段階設計を提案します。「エージェントにしたい」はしばしば手段の目的化なので、ワークフローとの比較ベースラインを必ず取ります。",en:"An agent is an LLM in a loop, using tools and autonomously deciding what to do next. The principle: if the procedure can be specified in advance, build a fixed workflow (prompt chain) — deterministic, debuggable, cheap. Agents earn their keep when the path varies too much with input to enumerate: research, cross-system troubleshooting, code fixing. The price is reliability — errors compound with step count, and cost and latency become unpredictable. In practice: minimize tool permissions with confirmation on destructive actions; cap steps and spend; log execution traces for evaluation; and start semi-autonomous with human approval, expanding autonomy with track record. 'We want agents' is often means-become-end — always benchmark against a workflow baseline."},r:{ja:["定義と対比","ワークフロー優先の原則","エージェントの適用条件","信頼性ガードレールと段階導入"],en:["Definition and contrast","Workflow-first principle","Conditions favoring agents","Reliability guardrails and gradual rollout"]}},
{c:"genai",t:{ja:"プロンプトインジェクションとLLMアプリのセキュリティ対策を説明してください。",en:"Explain prompt injection and security measures for LLM applications."},p:{ja:"RAGやツール使用を持つシステムでの間接インジェクションを含めてください。",en:"Include indirect injection in systems with RAG or tool use."},f:{ja:"直接/間接インジェクションの構造 → 完全防御は未解決 → 多層緩和（権限最小化・分離・検証） → 出力側のリスク → 運用（red team・監視）。",en:"Direct vs indirect injection structure → no complete defense exists → layered mitigation (least privilege, separation, validation) → output-side risks → operations (red teaming, monitoring)."},a:{ja:"プロンプトインジェクションは、攻撃者が指示をデータに紛れ込ませてLLMの挙動を乗っ取る攻撃です。ユーザー入力による直接型に加え、RAGが取り込む文書やWebページ、メールに指示を埋め込む間接型が深刻で、ツールを持つエージェントでは「文書を読んだ結果、データを外部送信する」ような実害に繋がります。重要な前提は、現状これを完全に防ぐ方法はないことです。したがって緩和の多層化で、①権限の最小化: ツールのスコープを絞り、破壊的・外部送信系の操作には人間確認を挟む、②信頼境界の分離: 信頼できない内容を指示と区別して扱い、システムプロンプトで優先順位を明示、③入出力の検証: インジェクションパターンの検知器、出力のフィルタリング、④機密データへの同時アクセスと外部通信を同一コンテキストで許さない設計です。加えてred teamテストを繰り返し、本番の異常挙動を監視します。セキュリティレビューをLLM機能の出荷条件に組み込むことが組織的な対策です。",en:"Prompt injection smuggles instructions into data to hijack LLM behavior. Beyond direct injection via user input, indirect injection — instructions embedded in RAG documents, web pages, or emails — is the serious one: an agent with tools can be induced to exfiltrate data after merely reading a document. The key premise: no complete defense currently exists. So mitigate in layers: (1) least privilege — narrow tool scopes, human confirmation for destructive or outbound actions; (2) trust boundaries — treat untrusted content as data, not instructions, with explicit precedence in system prompts; (3) input/output validation — injection detectors, output filtering; (4) never combine access to sensitive data with external communication in one context. Add recurring red-team exercises and production anomaly monitoring, and make security review a launch requirement for LLM features."},r:{ja:["直接/間接の区別","完全防御不可の前提","多層緩和策を列挙","ツール権限とred team"],en:["Direct vs indirect distinction","Premise of no complete defense","Layered mitigations","Tool permissions and red teaming"]}},
{c:"genai",t:{ja:"LLMアプリケーションのコストとレイテンシをどう最適化しますか。",en:"How do you optimize cost and latency of an LLM application?"},p:{ja:"品質を維持しながら1桁下げる、という依頼への体系的なアプローチを示してください。",en:"Give a systematic approach to cutting costs by an order of magnitude while holding quality."},f:{ja:"計測から開始 → モデルルーティング → プロンプト/コンテキスト削減 → キャッシュ → バッチ/ストリーミング → 蒸留・self-host判断。",en:"Measure first → model routing → prompt/context reduction → caching → batching/streaming → distillation and self-hosting decisions."},a:{ja:"まずリクエスト種類別のトークン量・頻度・品質要件を計測し、コストの内訳を見える化します。効果の大きい順に、①モデルルーティング: 全リクエストに最上位モデルを使わず、簡単なタスクは小型モデルに振り分け、難しいものだけ上位へエスカレーション、②プロンプト削減: 冗長なsystem promptの圧縮、RAGの取得文書数・チャンクサイズの見直し、会話履歴の要約化、③キャッシュ: 同一・類似クエリの応答キャッシュと、プロンプト先頭の共通部分のprompt caching、④非同期化: リアルタイム性が不要な処理のバッチAPI利用（大幅割引が一般的）、体感速度にはストリーミング、⑤大量・定型ならば上位モデルの出力で小型モデルを蒸留する選択肢、です。各施策は品質評価セットでリグレッションを確認しながら進めます。レイテンシは出力トークン数に支配されるため、出力を短く構造化する指示だけでも大きく効きます。",en:"First measure token volumes, frequency, and quality requirements per request type to expose the cost breakdown. In rough order of impact: (1) model routing — stop sending everything to the top model; route easy tasks to small models and escalate only hard ones; (2) prompt reduction — compress bloated system prompts, revisit RAG document counts and chunk sizes, summarize conversation history; (3) caching — response caches for identical/similar queries and prompt caching for shared prefixes; (4) async — batch APIs for non-real-time work (typically heavily discounted), streaming for perceived speed; (5) for high-volume repetitive tasks, distill a small model on the large model's outputs. Gate each step on your quality eval set for regressions. Latency is dominated by output tokens, so simply instructing shorter, structured outputs is a large lever."},r:{ja:["計測からの開始","ルーティングとキャッシュ","プロンプト/出力の削減","品質評価とセットで進める"],en:["Started from measurement","Routing and caching","Prompt/output reduction","Paired with quality evaluation"]}},
