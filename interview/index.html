{c:"consult",t:{ja:"80/20の精神で、分析の「十分な精度」をどう判断しますか。",en:"In the spirit of 80/20, how do you decide when an analysis is 'good enough'?"},p:{ja:"完璧主義とスピードのトレードオフを、意思決定の観点から規律化してください。",en:"Discipline the perfectionism-speed trade-off from the standpoint of the decision."},f:{ja:"基準は「意思決定が変わるか」 → 追加分析の限界価値 → 誤りの非対称コスト → 段階的な精緻化 → 未検証部分の明示。",en:"The criterion: would the decision change? → marginal value of further analysis → asymmetric error costs → staged refinement → flagging the unverified."},a:{ja:"判断基準は精度そのものでなく「追加の分析で意思決定が変わる確率と、変わった場合の価値」です。投資判断が「効果は年10億円か15億円か」の精度で既に成立するなら、12.3億円まで詰める価値はありません。逆に、閾値をまたぐ可能性がある（10億円ならGO、5億円ならNO-GOで、レンジが4〜11億円）なら、追加分析に価値があります。規律としては、①最初に「この意思決定は何で、どの精度が要るか」を確認する、②誤りのコストが非対称な部分（結論を覆しうるリーク、データ品質）には妥協せず、対称で小さい部分（微小な精度改善、資料の網羅性）を削る、③粗い全体像を早く出し、重要と分かった部分だけ深掘る段階的精緻化、④省いた部分は「未検証」と明示し、隠れた品質低下にしない、です。「完璧な分析が遅れて意思決定に間に合わないことこそ、最大の品質問題」という価値観を添えます。",en:"The criterion is not accuracy itself but the probability that further analysis changes the decision, times the value if it does. If an investment call already stands at 'the benefit is 10 or 15 hundred million yen,' refining to 12.3 adds nothing. If the range straddles a threshold — GO at 10, NO-GO at 5, and your range is 4-11 — refinement has real value. Disciplines: (1) first confirm what the decision is and what precision it needs; (2) never compromise where error costs are asymmetric (leakage or data-quality issues that could flip the conclusion), and cut where they are small and symmetric (marginal accuracy, exhaustive slides); (3) ship a rough full picture early, then deepen only what proves to matter; (4) label what you skipped as unverified — never let it become silent quality loss. Close with the value: the perfect analysis that arrives after the decision is the biggest quality failure of all."},r:{ja:["意思決定変化を基準に","限界価値の考え方","非対称コストで守る場所を選ぶ","未検証の明示"],en:["Decision-change criterion","Marginal-value thinking","Protect by asymmetric cost","Flagged the unverified"]}},
{c:"consult",t:{ja:"クライアントのデータが想定より汚い・足りないと着任後に判明しました。どう進めますか。",en:"You arrive at the client and the data is far dirtier and scarcer than assumed. What now?"},p:{ja:"案件を止めずに価値を出しながら、期待値を再調整するプロセスを示してください。",en:"Show delivering value while re-calibrating expectations, without stalling the engagement."},f:{ja:"影響の迅速な評価 → 早期の期待値調整（隠さない） → 代替パスの設計（できることから） → データ問題自体を成果物に → スコープ・計画の再合意。",en:"Rapid impact assessment → early expectation reset (no hiding) → alternative paths (start with what is possible) → turning the data problem itself into a deliverable → re-agreed scope and plan."},a:{ja:"最初の1週間で「当初計画のうち何ができ、何ができないか」を具体的に評価し、悪いニュースほど早く伝えます。着任1か月後の報告会で初めて明かすのは最悪手です。その上で3つの動きを並行させます。①できることから価値を出す: データが揃う一部領域での先行分析、定性ヒアリングとの組み合わせ、外部データでの補完で、勢いを保つ。②データ問題自体を成果物化する: どのデータがなぜ使えないか、業務・システムのどこで品質が壊れているか、直すには何が要るかを構造化した「データ課題マップ」は、それ自体がクライアントの資産になり、多くの場合データ基盤整備という次の仕事の起点になります。③スコープの再交渉: 当初の問いに答える別ルート（簡易実験、パイロット店舗での新規データ取得）や、フェーズ分割を提案し、計画を再合意します。「データが悪いので出来ません」でなく「現状で出せる価値と、フルの価値への道筋」を示すことが、コンサルタントとしての信頼を守ります。",en:"Within the first week, assess concretely what of the original plan is and is not possible — and deliver bad news early; revealing it at the one-month readout is the worst move. Then run three tracks in parallel. (1) Create value from what exists: early analysis on the subset with usable data, combining qualitative interviews, supplementing with external data — keep momentum. (2) Turn the data problem into a deliverable: a structured map of which data fails and why, where in processes and systems quality breaks, and what fixing it requires — a genuine client asset that often seeds the next engagement on data foundations. (3) Renegotiate scope: alternative routes to the original question (quick experiments, new data collection in pilot stores) or phasing, and re-agree the plan. Not 'the data is bad so we cannot' but 'here is the value available now, and the path to full value' — that is what protects your credibility."},r:{ja:["早期の悪いニュース伝達","並行して価値を出す","データ課題の成果物化","スコープ再合意"],en:["Early bad news","Parallel value delivery","Data issues as a deliverable","Scope re-agreement"]}},
{c:"consult",t:{ja:"「売上が落ちている。原因を分析して」という依頼をissue treeで分解してみてください。",en:"'Sales are declining — analyze why.' Decompose this with an issue tree."},p:{ja:"MECEな分解と、データでの検証順序への接続を実演してください。",en:"Demonstrate a MECE decomposition connected to a data-driven testing order."},f:{ja:"定義の確認（何の売上がいつから） → MECEな分解（例: 客数×客単価、獲得/維持、外部/内部） → 各枝に検証データを対応付け → 影響度で検証順序を決定 → 深掘りの再帰。",en:"Clarify definitions (which sales, since when) → MECE decomposition (e.g., customers × spend, acquisition/retention, external/internal) → map data tests to each branch → order tests by likely impact → recurse into what matters."},a:{ja:"まず問題を定義します: どの事業・地域・チャネルの売上が、いつから、どの程度落ちているか。全社一様の低下と特定セグメントの急落では、木の形が変わります。分解の例として、売上＝顧客数×購買頻度×購買単価と定義し、顧客数を新規獲得と既存維持（解約）に、単価を数量とミックスに分けます。各枝に検証を対応付けます: 解約率のコホート推移、新規獲得のチャネル別推移、購買頻度の分布変化、価格改定・値引率の履歴。並行して外部要因（市場全体の縮小、競合の動き、季節性）と内部要因（品揃え、在庫切れ、サービス品質）の軸でも確認し、見落としを防ぎます。検証は「影響が大きそうで、データがすぐある枝」から着手し、数字で枝を刈り込みながら、生き残った枝を再帰的に深掘ります。面接では、木の美しさより、定義確認→MECE→データ対応→優先順位、という思考の運びを声に出して見せることが評価されます。",en:"First define the problem: which business, region, and channel, declining since when, by how much — a uniform decline and a segment-specific crash produce different trees. One decomposition: sales = customers × frequency × basket value; split customers into new acquisition and retention (churn), and basket into volume and mix. Attach tests to each branch: churn by cohort, acquisition by channel, frequency distribution shifts, pricing and discount history. In parallel, sweep an external/internal axis — market contraction, competitor moves, seasonality versus assortment, stockouts, service quality — to avoid blind spots. Test branches in order of likely impact and data availability, prune with numbers, and recurse into survivors. In the interview, what scores is not the tree's elegance but the visible sequence: define → MECE → data mapping → prioritization, narrated aloud."},r:{ja:["定義の確認から開始","MECEな分解","枝へのデータ対応付け","優先順位と刈り込み"],en:["Started with definitions","MECE decomposition","Data mapped to branches","Prioritization and pruning"]}},
{c:"consult",t:{ja:"納品したモデル・分析をクライアントが自走できるようにする移転（capability transfer）をどう設計しますか。",en:"How do you design capability transfer so the client can run your models and analyses themselves?"},p:{ja:"成果物を渡すだけで終わらない、人・プロセス・技術の移転を説明してください。",en:"Explain transferring people, process, and technology — not just handing over artifacts."},f:{ja:"移転のゴール定義（何を自走とするか） → 技術（コード・文書・環境） → 人（併走・ペア作業・研修） → プロセス（運用手順・意思決定権限） → 段階的な手離れと事後サポート。",en:"Define the goal (what does self-sufficiency mean) → technology (code, docs, environment) → people (working side-by-side, pairing, training) → process (runbooks, decision rights) → staged disengagement and aftercare."},a:{ja:"移転の失敗パターンは「ドキュメントと研修をやって終わり」で、半年後に誰も触れないモデルが残ります。設計は3層です。技術層では、クライアント環境で動くコードとパイプライン、実行手順書に加え、「なぜこの設計か」の意思決定記録を残します（変更時に判断を再現できるように）。人の層が最重要で、プロジェクト初日からクライアント側メンバーをチームに入れ、観察者でなく作業者として併走させます。後半は役割を逆転し、クライアントが手を動かし自分たちはレビューに回ります。「教える」より「一緒にやって徐々に手を離す」が定着します。プロセス層では、モデルの監視・再学習・障害対応の運用手順、判断基準（いつ再学習するか、いつ止めるか）、責任者を明確にします。最後に手離れを段階設計し、完全撤収でなく定期レビューや相談窓口を残すと、定着率が大きく上がります。移転の成功指標は「納品物の質」でなく「6か月後もクライアントだけで運用・改善が回っているか」です。",en:"The failure pattern is 'documentation plus a training session,' leaving a model nobody touches six months later. Design in three layers. Technology: code and pipelines that run in the client's environment, runbooks, and — crucially — decision records explaining why the design is what it is, so future changes can reconstruct the judgment. People, the most important layer: embed client members in the team from day one as workers, not observers; in the second half, reverse roles — they drive, you review. Doing together and gradually letting go beats teaching. Process: operational procedures for monitoring, retraining, and incidents, decision criteria (when to retrain, when to stop), and named owners. Finally, stage the disengagement — periodic reviews and an escalation channel rather than a hard exit measurably improve stickiness. The success metric is not deliverable quality but whether the client alone is still operating and improving it six months on."},r:{ja:["3層での設計","併走と役割逆転","運用の判断基準まで移転","6か月後の自走という成功指標"],en:["Three-layer design","Side-by-side then role reversal","Transferred decision criteria too","Six-month self-sufficiency metric"]}},
{c:"consult",t:{ja:"提案に強硬に反対するクライアント側の幹部がいます。どう巻き込みますか。",en:"A senior client executive is firmly opposed to your recommendation. How do you bring them along?"},p:{ja:"正面突破ではない、組織力学を踏まえたアプローチを示してください。",en:"Show an approach grounded in organizational dynamics, not frontal assault."},f:{ja:"反対の理由の診断（合理/利害/感情/情報） → 1対1での傾聴 → 提案への取り込み（共同設計） → 周辺からの支持形成 → それでも動かない場合の判断。",en:"Diagnose the opposition (rational/interest/emotional/informational) → one-on-one listening → incorporating them (co-design) → building surrounding support → judgment when they still will not move."},a:{ja:"まず反対の種類を診断します。①合理的反対（提案に実際の欠陥やリスクを見ている）、②利害の反対（自部門の予算・人員・立場が脅かされる）、③感情的反対（外部者への不信、過去のコンサルへの悪印象）、④情報の欠如、では処方箋が異なります。最初の動きは大人数の会議ではなく1対1の場で、説得でなく傾聴です。特に合理的反対には価値があり、その幹部が現場を最も知っていることも多い。懸念を提案に取り込み、「反対者」を「共同設計者」に変えるのが最善手です。利害の反対には、その幹部にとっての利得（新しい役割、成功の帰属）を設計します。並行して、その幹部が信頼する人物や現場の支持を形成し、孤立した説得戦にしないこと。それでも動かない場合は、スポンサー（依頼主の経営層）と相談し、その幹部の合意が必須か、限定的な合意（パイロットの黙認）で進められるかを判断します。全会一致は不要なことも多く、実績が最終的に最強の説得材料になります。",en:"First diagnose the opposition type: rational (they see real flaws or risks), interest-based (their budget, people, or standing is threatened), emotional (distrust of outsiders, bad past experience with consultants), or informational — each has a different prescription. The first move is a one-on-one, listening rather than persuading. Rational opposition is valuable — that executive often knows the operation best; incorporate their concerns and convert the opponent into a co-designer, the strongest play. For interest-based opposition, design their upside: a new role, ownership of the success. In parallel, build support among people they trust and in the field, so it never becomes an isolated persuasion duel. If they still will not move, confer with your sponsor on whether their agreement is truly required, or whether limited acquiescence (tolerating a pilot) suffices. Unanimity is often unnecessary — and results ultimately persuade better than arguments."},r:{ja:["反対の種類の診断","1対1での傾聴","共同設計者への転換","スポンサーとの進め方判断"],en:["Diagnosed the opposition type","One-on-one listening","Converted to co-designer","Sponsor-aligned path decision"]}},
{c:"dist",t:{ja:"100個あるAIユースケースをどう優先順位付けしますか。",en:"How do you prioritize 100 candidate AI use cases?"},p:{ja:"経営価値、実現性、リスク、再利用性の観点で答えてください。",en:"Answer through business value, feasibility, risk, and reusability."},f:{ja:"Value × feasibility × risk × strategic fit、portfolio、platform leverage。",en:"Value × feasibility × risk × strategic fit, portfolio thinking, platform leverage."},a:{ja:"各ユースケースを事業価値、実現性、データ準備度、導入先の業務変革難易度、リスク/規制、再利用可能な能力構築で評価します。短期ROIのquick winと、共通基盤を作るstrategic betをポートフォリオ化します。CFOには利益・コスト・採用率・スケール条件・不確実性をレンジで説明します。個別の積み上げでなく「共通のデータ・プラットフォーム・人材で複数ユースケースが安くなる」構造を作ることが、100個時代の本質的な優先順位付けです。",en:"Score each use case on business value, feasibility, data readiness, difficulty of workflow change at the destination, risk/regulation, and reusable capability building. Portfolio quick wins with near-term ROI alongside strategic bets that build shared foundations. For the CFO, present profit, cost, adoption rates, scaling conditions, and uncertainty as ranges. The essential move at 100-use-case scale is structural: shared data, platforms, and talent that make each subsequent use case cheaper, rather than evaluating each in isolation."},r:{ja:["価値と実現性","リスク/規制","再利用性","ポートフォリオ思考"],en:["Value and feasibility","Risk/regulation","Reusability","Portfolio thinking"]}},
{c:"dist",t:{ja:"AI・ML能力のbuild（内製）/buy（購入）/partner（提携）をどう判断しますか。",en:"How do you decide whether to build, buy, or partner for AI/ML capabilities?"},p:{ja:"判断フレームワークと、よくある失敗パターンを含めてください。",en:"Include a decision framework and common failure patterns."},f:{ja:"差別化の源泉か（コア/コンテキスト） → 市場成熟度と要件適合 → 総保有コストと速度 → データ・知財の主導権 → ハイブリッドの設計 → 失敗パターン。",en:"Source of differentiation (core vs context) → market maturity and requirement fit → TCO and speed → control of data and IP → hybrid designs → failure patterns."},a:{ja:"第一の判断軸は「その能力が競争差別化の源泉か」です。差別化のコア（例: 小売の需要予測ロジック、独自データを活かすモデル）は内製で主導権を持ち、コモディティ（OCR、汎用チャット、MLプラットフォームの土台）は買う。中間は提携やカスタマイズです。第二に市場の成熟度と、自社要件への適合度（購入製品が業務の8割をカバーするか）。第三に総保有コストと速度で、内製は初期が遅く継続コストが人材に依存し、購入は速いがカスタマイズ限界とベンダーロックインがあります。第四にデータと知財の主導権で、自社データで学習した資産が誰のものになるかは長期の競争力を左右します。よくある失敗は、①差別化にならない領域を「技術的に面白いから」内製して保守に沈む、②コアをベンダーに丸投げして社内に判断能力が残らない、③buyでも「評価・統合・運用の内製力」は必要なことを見落とす、です。buyする場合も賢い買い手であるための最小限の内製能力が要る、という非対称性を語れると強いです。",en:"The first axis: is this capability a source of competitive differentiation? Own the core (a retailer's demand forecasting logic, models leveraging proprietary data) by building; buy commodities (OCR, generic chat, ML platform plumbing); partner or customize in between. Second, market maturity and fit — does a product cover 80% of your requirements? Third, TCO and speed: building is slow upfront with talent-dependent ongoing costs; buying is fast but hits customization ceilings and vendor lock-in. Fourth, control of data and IP — who owns the asset trained on your data shapes long-term competitiveness. Common failures: building non-differentiating capabilities because they are technically interesting, then drowning in maintenance; outsourcing the core until no internal judgment remains; and forgetting that even buying requires in-house capability for evaluation, integration, and operations. The strong closing note is that asymmetry: being a smart buyer itself demands a minimum internal capability."},r:{ja:["コア/コモディティの軸","TCOと速度の比較","データ・知財の主導権","失敗パターンの列挙"],en:["Core vs commodity axis","TCO and speed comparison","Data/IP control","Failure patterns"]}},
{c:"dist",t:{ja:"全社データ戦略をゼロから設計するとしたら、何から始めますか。",en:"Designing an enterprise data strategy from scratch — where do you start?"},p:{ja:"技術基盤の話に閉じず、事業戦略との接続とガバナンスを含めてください。",en:"Do not stay in platform tech — include the link to business strategy and governance."},f:{ja:"事業戦略からの逆算（データが効く意思決定はどこか） → 現状評価（データ・人材・文化） → ドメイン優先順位 → 基盤・ガバナンスの設計原則 → 価値実証と並行した構築 → 測定。",en:"Work back from business strategy (which decisions data can improve) → current-state assessment (data, talent, culture) → domain priorities → platform and governance principles → build in parallel with value proofs → measurement."},a:{ja:"出発点は技術でなく事業戦略です。「今後3年の事業の勝ち筋はどこで、どの意思決定がデータで改善されると最も価値が出るか」を経営と特定し、そこから必要なデータ・基盤・人材を逆算します。次に現状評価: 重要データの品質と分断状況、人材の分布、そして「データより声の大きい人が勝つ」文化かどうか。設計では、①優先ドメインを2〜3に絞り、全社一律の基盤構築から入らない、②基盤は「使われるデータから順に整備する」需要駆動とし、データレイクを作ってから用途を探す供給駆動の失敗を避ける、③ガバナンスは品質・オーナーシップ・アクセス権限・プライバシーを、統制と利活用のバランスで設計する（統制過剰は死蔵を生む）、④四半期ごとに事業価値を実証しながら基盤投資を正当化し続ける、という原則を置きます。成功指標は基盤の完成度でなく、「データに基づいて変わった意思決定の数と価値」で測ります。データ戦略は一度作る文書でなく、経営会議で毎四半期更新される生きた計画であるべきです。",en:"Start from business strategy, not technology. With executives, identify where the business intends to win over three years and which decisions would gain most from data — then work backward to the required data, platforms, and people. Next, assess the current state: quality and fragmentation of critical data, talent distribution, and whether the culture lets the loudest voice beat the data. Design principles: (1) focus on two or three priority domains rather than a company-wide platform build; (2) make platform work demand-driven — curate the data people actually use, avoiding the build-a-lake-then-seek-uses failure; (3) design governance (quality, ownership, access, privacy) balancing control with usage — over-control breeds dead data; (4) justify platform investment continuously with quarterly value proofs. Measure success not by platform completeness but by the number and value of decisions that changed because of data. A data strategy is not a document written once but a living plan refreshed quarterly at the executive table."},r:{ja:["事業戦略からの逆算","需要駆動の基盤整備","ガバナンスのバランス設計","意思決定の変化で測定"],en:["Worked back from strategy","Demand-driven platform","Balanced governance","Measured by changed decisions"]}},
{c:"dist",t:{ja:"企業のDS組織はCoE（中央集約）とembedded（事業部配属）のどちらにすべきですか。",en:"Should a company's DS organization be a central CoE or embedded in business units?"},p:{ja:"それぞれの失敗モードと、成熟度に応じた進化を含めて答えてください。",en:"Include each model's failure modes and how the answer evolves with maturity."},f:{ja:"CoEの強み/失敗（基準・共有 vs 現場との距離） → embeddedの強み/失敗（密着 vs 孤立・バラバラ） → ハブ&スポーク → 成熟度による進化 → 構造より運用が決める。",en:"CoE strengths/failures (standards, sharing vs distance from business) → embedded strengths/failures (proximity vs isolation, fragmentation) → hub-and-spoke → evolution with maturity → operations matter more than structure."},a:{ja:"教科書的な答えはハブ&スポークですが、重要なのは各モデルの失敗モードを理解した設計です。CoE（中央集約）は、技術標準・キャリアパス・知見共有・希少人材の有効活用に強い一方、事業から遠くなり「依頼を受けて分析を返す下請け」化し、現場に定着しない成果物を量産する失敗が典型です。embedded（事業部配属）は業務密着と実装力に優れる一方、1〜2人ずつ孤立してレビューも成長機会もなく、ツールと品質が部署ごとにバラバラになり、全社の再利用が効かない失敗に陥ります。ハブ&スポークは、中央が基盤・標準・採用・育成を持ち、DSは事業部に長期配属されつつ中央のコミュニティに属する形で、両者の失敗を打ち消し合います。成熟度によっても最適解は動き、立ち上げ期は希少人材を中央に集めて灯台となる成功事例を作り、規模拡大期にスポークへ分散、成熟期には事業部が自前で抱えて中央はプラットフォームと標準に特化する、という進化が自然です。最後に、構造そのものより「評価・異動・知見共有の運用」が実際の成否を決める、と締めると実務感が出ます。",en:"The textbook answer is hub-and-spoke, but the real skill is designing around each model's failure modes. A central CoE excels at standards, career paths, knowledge sharing, and leveraging scarce talent — but drifts from the business into a ticket-taking service bureau producing deliverables that never stick. Embedded teams excel at business intimacy and implementation — but individuals end up isolated without review or growth, tooling and quality fragment by department, and nothing is reused. Hub-and-spoke cancels the failures: the center owns platform, standards, hiring, and development; data scientists sit long-term in business units while belonging to the central community. Maturity moves the answer: at the start, concentrate scarce talent centrally to build lighthouse wins; during scale-up, distribute into spokes; at maturity, business units own their teams while the center specializes in platform and standards. Close with the practitioner's truth: operations — evaluation, rotation, knowledge sharing — determine success more than the org chart."},r:{ja:["両モデルの失敗モード","ハブ&スポークの設計","成熟度による進化","運用が決めるという視点"],en:["Both failure modes","Hub-and-spoke design","Evolution with maturity","Operations over structure"]}},
{c:"dist",t:{ja:"ML/データ領域の技術的負債を、経営にどう説明し、投資判断につなげますか。",en:"How do you explain ML/data technical debt to executives and turn it into an investment decision?"},p:{ja:"「リファクタリングさせてください」で終わらない、事業リスク・機会費用の言語化を示してください。",en:"Show translating it into business risk and opportunity cost — beyond 'please let us refactor.'"},f:{ja:"ML特有の負債の型 → 事業言語への翻訳（速度低下・障害リスク・機会費用） → 定量化 → 「利子」の概念 → 投資の選択肢と優先順位 → 継続的な返済の仕組み。",en:"ML-specific debt types → translation into business language (velocity loss, incident risk, opportunity cost) → quantification → the interest metaphor → investment options and priorities → continuous repayment mechanisms."},a:{ja:"ML の技術的負債は、コードに加えて、検証されないデータ依存、再現できない学習パイプライン、監視のないモデル、一人しか触れない属人化などの形を取ります。経営への説明は「品質が悪い」ではなく事業影響に翻訳します: ①速度: 新モデルの投入に競合の3倍の時間が掛かっており、その差は広がる、②リスク: 監視のない与信モデルが静かに劣化した場合の想定損失と規制リスク、③機会費用: チームの70%が保守に取られ、新規の価値創出に30%しか使えていない。負債は「借金の利子」として語ると伝わります。毎月×人日を余計に払い続けており、返済すれば恒久的に浮く、という構造です。投資判断としては、全面刷新でなく、リスクと利子の大きい負債から返す優先順位表を示し、機能開発と返済の比率（例: 8:2）を恒常ルール化する、新規開発の「負債を作らない基準」（再現性・監視・ドキュメントのDefinition of Done）をセットで提案します。負債ゼロは目標にせず、「意図的に借り、計画的に返す」ポートフォリオ管理として語れると、経営と同じ言語になります。",en:"ML technical debt takes forms beyond code: unvalidated data dependencies, unreproducible training pipelines, unmonitored models, and bus-factor-one systems. Translate for executives into business impact, not 'poor quality': velocity — new models take three times longer to ship than competitors, and the gap compounds; risk — the expected loss and regulatory exposure if an unmonitored credit model degrades silently; opportunity cost — 70% of the team's capacity goes to maintenance, leaving 30% for new value. The interest metaphor lands: we pay X extra person-days every month, and repayment removes that charge permanently. For the decision, avoid proposing a rewrite; present a priority table repaying the highest-interest, highest-risk debts first, institutionalize a standing ratio of feature work to repayment (say 8:2), and pair it with a no-new-debt Definition of Done (reproducibility, monitoring, documentation). Do not target zero debt — frame it as portfolio management: borrow deliberately, repay on schedule. That is the language executives already speak."},r:{ja:["ML特有の負債の型","事業影響への翻訳と定量化","利子のメタファー","恒常的な返済ルールの提案"],en:["ML-specific debt types","Business translation and quantification","Interest metaphor","Standing repayment rules"]}},
{c:"dist",t:{ja:"再利用可能なMLプラットフォームへの投資を、個別案件の積み上げとどう天秤にかけますか。",en:"How do you weigh investing in a reusable ML platform against just delivering individual projects?"},p:{ja:"プラットフォーム投資のタイミングと、作りすぎの失敗を避ける規律を示してください。",en:"Show the timing for platform investment and the discipline against overbuilding."},f:{ja:"個別最適の限界（重複・品質バラつき・スケール不能） → 早すぎる基盤投資の失敗 → 「3回ルール」等の抽出規律 → プラットフォームの価値計測 → 段階的な構築。",en:"Limits of project-by-project work (duplication, uneven quality, no scaling) → the premature-platform failure → extraction disciplines like the rule of three → measuring platform value → incremental build."},a:{ja:"両極に失敗があります。個別案件の積み上げだけでは、特徴量・パイプライン・監視が案件ごとに重複開発され、品質がばらつき、モデル数が増えた時点で運用が破綻します。逆に、利用実績のない段階で「将来のための基盤」を大きく作ると、実需とズレた過剰設計になり、使われないプラットフォームが最大の技術的負債になります。規律としては、①最初の2〜3案件は個別に作り切り、価値を実証する、②同じものを3回作ったら共通化する「3回ルール」で、実需から抽象を抽出する、③プラットフォームは一括構築でなく、最も痛い共通課題（例: デプロイと監視）から段階的に積む、④プラットフォームチームには「社内顧客の採用率・案件立ち上げ時間の短縮・運用コスト」というプロダクト指標を持たせ、作ること自体を成果にしない、です。経営への説明は「N件目までは個別が速いが、それ以降は基盤がある方が1件あたりコストが下がる」という損益分岐の構造で行い、自社の計画モデル数から投資タイミングを導きます。",en:"There are failures at both poles. Pure project-by-project delivery duplicates features, pipelines, and monitoring per engagement, produces uneven quality, and collapses operationally as model count grows. But building a big 'platform for the future' before real usage produces over-engineered abstractions misaligned with actual demand — an unused platform is the worst technical debt of all. Disciplines: deliver the first two or three projects individually and prove value; apply the rule of three — extract shared components only after building the same thing three times, so abstractions come from real demand; build the platform incrementally starting from the most painful shared problem (often deployment and monitoring); and give the platform team product metrics — internal adoption, time-to-first-model, operating cost — so building is never its own success. For executives, frame it as a break-even structure: individual delivery is faster up to N models, beyond which per-model cost favors the platform — and derive the investment timing from your own model pipeline."},r:{ja:["両極の失敗モード","3回ルール等の抽出規律","段階的構築","採用率などプロダクト指標"],en:["Failure modes at both poles","Rule-of-three discipline","Incremental build","Product metrics like adoption"]}},
{c:"dist",t:{ja:"責任あるAI（Responsible AI）の体制を企業にどう根付かせますか。",en:"How do you make Responsible AI take root in an enterprise?"},p:{ja:"原則の掲示で終わらせず、開発プロセスと意思決定に組み込む方法を答えてください。",en:"Go beyond posting principles — embed it in development processes and decision-making."},f:{ja:"原則だけでは動かない → リスク階層化 → 開発プロセスへの組み込み（ゲート・チェックリスト・レビュー委員会） → 計測（公平性・説明可能性の監査） → 役割と権限 → 文化とインセンティブ。",en:"Principles alone change nothing → risk tiering → embedding in the SDLC (gates, checklists, review boards) → measurement (fairness and explainability audits) → roles and authority → culture and incentives."},a:{ja:"多くの企業がAI倫理原則を掲げますが、原則と現場の間の「実装ギャップ」で止まります。根付かせる設計は、①リスク階層化: 全ユースケースを影響度（人の権利・安全・金銭への影響）で分類し、統制の厚さを比例させる。低リスクまで重い審査を課すと、現場が統制を迂回し始めます。②プロセス組み込み: 企画段階でのリスクアセスメント、開発中の公平性・プライバシーチェックリスト、高リスク案件のリリース前レビュー委員会、という開発ライフサイクルのゲートにする。③計測可能化: 「公平に」でなく、属性別の性能差・校正差を測る具体的な指標と閾値を定め、本番でも監査を継続する。④役割と権限: レビュー委員会に出荷を止める実権を与え、事業側の責任者を明確にする（AI倫理チームだけの責任にしない）。⑤インセンティブ: リスク発見・報告を評価し、issueを挙げた人が損をしない文化を作る。規制対応（EU AI Act等）を「コンプライアンスコスト」でなく「信頼という競争優位への投資」として経営に位置づけ直すことも、定着の推進力になります。",en:"Most companies post AI ethics principles and stall at the implementation gap between principles and practice. The design that takes root: (1) risk tiering — classify every use case by impact on rights, safety, and money, and scale controls proportionally; heavyweight review on low-risk work teaches teams to route around governance. (2) Process embedding — risk assessment at intake, fairness and privacy checklists during development, and a pre-release review board for high-risk cases, all as gates in the development lifecycle. (3) Measurability — replace 'be fair' with concrete metrics and thresholds for performance and calibration gaps across groups, audited continuously in production. (4) Roles and authority — give the review board real power to block launches, and put accountability on business owners, not only an AI ethics team. (5) Incentives — reward finding and reporting risks so raising an issue never hurts the raiser. Reframing regulation (like the EU AI Act) for executives as investment in trust as competitive advantage, rather than compliance cost, powers the adoption."},r:{ja:["リスク階層化と比例原則","開発ゲートへの組み込み","計測可能な公平性指標","権限とインセンティブ設計"],en:["Risk tiering and proportionality","Gates in the SDLC","Measurable fairness metrics","Authority and incentive design"]}},
{c:"dist",t:{ja:"GenAI時代に、企業のデータサイエンス組織・人材をどう再設計しますか。",en:"How do you redesign a company's data science organization and talent for the GenAI era?"},p:{ja:"「DSは不要になるか」という問いへの答えを含め、役割の再定義を語ってください。",en:"Include your answer to 'will DS become obsolete?' and the redefinition of roles."},f:{ja:"変化の本質（実装コスト低下・非専門家の参入） → 価値の移動先（問題設定・評価・因果・統合） → 役割の再定義 → スキル転換の設計 → 変わらない基礎の明確化。",en:"The essential shift (falling implementation cost, non-experts entering) → where value moves (problem framing, evaluation, causality, integration) → role redefinition → reskilling design → what fundamentals do not change."},a:{ja:"GenAIで変わったのは、実装の限界コストです。コード作成・定型分析・プロトタイピングは劇的に速くなり、非専門家もLLM経由で「分析らしきこと」ができるようになりました。しかしDSが不要になるのではなく、価値の重心が移動します。上がる価値は、①問題設定: 何を解くべきか、どのKPIに効くのかの定義、②評価: LLM出力を含む「正解のない出力」の品質を測る設計能力、③因果と実験: 生成が容易になるほど「本当に効いたのか」の検証が希少能力になる、④統合: モデルを業務・システム・組織に埋め込み切る力です。下がる価値は、定型的なモデル構築・可視化の手作業です。組織再設計としては、DSの役割を「分析の実行者」から「問題の定義者・品質の保証者・実装の推進者」へ再定義し、全社員のAIリテラシー向上（セルフサービス化）と並行して、DSにはLLM評価・因果推論・エンジニアリングの再教育を投資します。「基礎（統計・因果・実験・データの疑い方）は価値が上がりこそすれ下がらない。変わるのは道具だ」というメッセージを、組織と個人のキャリア設計の軸に据えます。",en:"What GenAI changed is the marginal cost of implementation: coding, routine analysis, and prototyping accelerated dramatically, and non-experts can now do analysis-shaped work through LLMs. DS does not become obsolete — the center of value moves. Rising: problem framing (what should be solved, which KPI it moves); evaluation (designing quality measurement for outputs with no ground truth, LLM outputs included); causality and experimentation (the easier generation gets, the scarcer the ability to verify what actually worked); and integration (embedding models into workflows, systems, and organizations). Falling: routine model building and manual visualization. Redesign the organization by recasting DS from analysis executors to problem definers, quality guarantors, and implementation drivers — while raising company-wide AI literacy for self-service, and reskilling DS in LLM evaluation, causal inference, and engineering. The organizing message for both org and careers: the fundamentals — statistics, causality, experimentation, healthy suspicion of data — appreciate rather than depreciate; only the tools change."},r:{ja:["変化の本質の特定","価値の移動先を具体化","役割の再定義","変わらない基礎の明確化"],en:["Identified the essential shift","Where value moves","Role redefinition","Durable fundamentals"]}},
{c:"focus",t:{ja:"あなたのプロダクトによる「事故50%減」が本当にあなたの解決策の効果だと、どう示しますか。",en:"How would you show that your product's '50% accident reduction' was truly caused by your solution?"},p:{ja:"因果主張の強さ、代替説明、測定設計を整理してください。自身の代表実績を題材に準備しておく質問です。",en:"Organize causal claim strength, alternative explanations, and measurement design. Prepare this against your own flagship achievement."},f:{ja:"RCT/段階導入/DiD、交絡、季節性、曝露、利用率、主張範囲。",en:"RCT / staged rollout / DiD, confounding, seasonality, exposure, usage rates, claim scope."},a:{ja:"最も強いのはランダム化または段階導入を使い、導入群と非導入群の事故率差を比較することです。難しければ導入前後だけでなく類似拠点・車両を対照にしたDiDで、季節性・走行距離・車種・ドライバー構成を調整します。利用率やアラート対応率も測り、「導入した」と「実際に使われて行動が変わった」を区別します。その上で、50%減のうちどこまでを因果的に主張でき、どこからは相関に留まるかを明確にし、主張範囲を限定した誠実な報告をします。自身の実績を語る際も、この構造で「効果の証明の限界」まで言えると信頼されます。",en:"The strongest evidence comes from randomization or staged rollout, comparing accident rates between adopting and non-adopting groups. Failing that, use DiD with comparable sites and vehicles as controls — not just before/after — adjusting for seasonality, mileage, vehicle types, and driver composition. Measure usage and alert-response rates to separate 'deployed' from 'actually used and behavior changed.' Then state clearly how much of the 50% you can claim causally and where it remains correlational, limiting the claim honestly. When presenting your own track record, being able to articulate the limits of your effect evidence is precisely what earns trust."},r:{ja:["因果デザインを提示","交絡を列挙","利用/曝露を測る","主張範囲を限定"],en:["Offered causal designs","Listed confounders","Measured usage/exposure","Limited the claim scope"]}}
];
let lang=localStorage.dsLang||"ja";
let state=JSON.parse(localStorage.dsTrainer_v2||"{}");
let current=0;
const $=id=>document.getElementById(id);
const L=x=>x[lang];
function applyLang(){
document.documentElement.lang=lang;
langJa.classList.toggle("active",lang==="ja");
langEn.classList.toggle("active",lang==="en");
heroTitle.textContent=L(UI.title);heroLead.textContent=L(UI.lead);
pillrow.innerHTML=UI.pills[lang].map(p=>`<span class="pill">${p}</span>`).join("");
settingsH.textContent=L(UI.settings);
catLabel.textContent=L(UI.category);modeLabel.textContent=L(UI.mode);searchLabel.textContent=L(UI.search);
search.placeholder=L(UI.searchPh);
const mv=mode.value||"all";
mode.innerHTML=`<option value="all">${L(UI.modeAll)}</option><option value="weak">${L(UI.modeWeak)}</option><option value="case">${L(UI.modeCase)}</option><option value="random">${L(UI.modeRandom)}</option>`;
mode.value=mv;
const cv=category.value||"all";
category.innerHTML=`<option value="all">${L(UI.all)}</option>`+Object.keys(CATS).map(k=>`<option value="${k}">${CATS[k][lang]}</option>`).join("");
category.value=cv;
tabs.innerHTML=[["all",L(UI.all)],...Object.keys(CATS).map(k=>[k,CATS[k][lang]])].map(([k,n])=>`<button class="tab ${k===cv?"active":""}" data-c="${k}">${n}</button>`).join("");
nextBtn.textContent=L(UI.next);resetBtn.textContent=L(UI.reset);
doneLabel.textContent=L(UI.done);avgLabel.textContent=L(UI.avg);streakLabel.textContent=L(UI.streak);totalLabel.textContent=L(UI.total);
tip.textContent=L(UI.tip);
notesLabel.textContent=L(UI.notes);notes.placeholder=L(UI.notesPh);
showBtn.textContent=L(UI.show);saveBtn.textContent=L(UI.save);
rubricH.textContent=L(UI.rubric);gradeBtn.textContent=L(UI.grade);drillBtn.textContent=L(UI.drill);
credit.textContent=L(UI.credit);
}
function setLang(l){lang=l;localStorage.dsLang=l;applyLang();render()}
function init(){
langJa.onclick=()=>setLang("ja");langEn.onclick=()=>setLang("en");
tabs.onclick=e=>{if(e.target.dataset.c){category.value=e.target.dataset.c;document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("active",b.dataset.c===category.value));pick(0)}};
["category","mode","search"].forEach(id=>$(id).oninput=()=>pick(0));
category.onchange=()=>{document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("active",b.dataset.c===category.value));pick(0)};
nextBtn.onclick=()=>pick(1);
showBtn.onclick=()=>answer.style.display="block";
saveBtn.onclick=save;
gradeBtn.onclick=()=>{grade();pick(1)};
drillBtn.onclick=()=>{mode.value="weak";pick(0)};
resetBtn.onclick=()=>{if(confirm(L(UI.confirmReset))){state={};localStorage.removeItem("dsTrainer_v2");render()}};
applyLang();pick(0);
}
function pool(){
let p=BANK.map((q,i)=>({...q,i}));
let c=category.value;
if(c&&c!=="all")p=p.filter(q=>q.c===c);
let s=search.value.trim().toLowerCase();
if(s)p=p.filter(q=>(q.t.ja+q.t.en+q.p.ja+q.p.en+q.f.ja+q.f.en+q.a.ja+q.a.en+CATS[q.c].ja+CATS[q.c].en).toLowerCase().includes(s));
if(mode.value==="case")p=p.filter(q=>q.case);
if(mode.value==="weak")p=p.filter(q=>(state[q.i]?.score||0)<75);
return p.length?p:BANK.map((q,i)=>({...q,i}))
}
function pick(step){let p=pool();if(mode.value==="random")current=p[Math.floor(Math.random()*p.length)].i;else{let pos=p.findIndex(q=>q.i===current);current=p[(Math.max(0,pos)+step+p.length)%p.length].i}render()}
function render(){
let q=BANK[current],rec=state[current]||{};
meta.textContent=CATS[q.c][lang]+(q.case?L(UI.caseTag):"");
counter.textContent=`${current+1} / ${BANK.length}`;
qtitle.textContent=L(q.t);$("prompt").textContent=L(q.p);
caseBox.textContent=q.case?L(UI.caseTip):"";caseBox.style.display=q.case?"block":"none";
framework.innerHTML=`<b>${L(UI.frame)}:</b> `+L(q.f);
notes.value=rec.notes||"";
answer.style.display="none";answer.innerHTML=`<b>${L(UI.model)}:</b> `+L(q.a);
rubric.innerHTML=q.r[lang].map((x,i)=>`<label><input type="checkbox" ${rec.checks?.[i]?"checked":""}>${x}</label>`).join("");
mainCard.classList.add("flash");setTimeout(()=>mainCard.classList.remove("flash"),450);
stats()
}
function save(){let checks=[...rubric.querySelectorAll("input")].map(x=>x.checked);state[current]={notes:notes.value,checks,score:Math.round(checks.filter(Boolean).length/checks.length*100),ts:Date.now()};localStorage.dsTrainer_v2=JSON.stringify(state);stats()}
function grade(){save();state.streak=(state.streak||0)+1;localStorage.dsTrainer_v2=JSON.stringify(state)}
function stats(){let vals=Object.keys(state).filter(k=>!isNaN(k)).map(k=>state[k]);done.textContent=vals.length;total.textContent=BANK.length;avg.textContent=(vals.length?Math.round(vals.reduce((s,x)=>s+(x.score||0),0)/vals.length):0)+"%";streak.textContent=state.streak||0;bar.style.width=Math.round(vals.length/BANK.length*100)+"%"}
init();
</script>
</body>
</html>
