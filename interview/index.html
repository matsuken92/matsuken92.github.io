<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>データサイエンティスト面接トレーナー</title>
  <style>
    :root{--bg:#09111f;--panel:#111c31;--panel2:#16243d;--text:#eef5ff;--muted:#a9b7d0;--accent:#6ee7f9;--accent2:#a78bfa;--good:#34d399;--warn:#fbbf24;--bad:#fb7185;--line:#2a3a5f}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:radial-gradient(circle at top left,#1a2d55 0,#09111f 45%,#060a12 100%);color:var(--text)}.wrap{max-width:1200px;margin:0 auto;padding:28px}header{display:grid;gap:14px;margin-bottom:18px}.hero{background:linear-gradient(135deg,rgba(110,231,249,.18),rgba(167,139,250,.14));border:1px solid rgba(110,231,249,.28);border-radius:24px;padding:24px;box-shadow:0 24px 80px rgba(0,0,0,.25)}h1{font-size:clamp(28px,4vw,48px);margin:0 0 8px}.lead{font-size:17px;line-height:1.8;color:var(--muted);max-width:900px}.grid{display:grid;grid-template-columns:320px 1fr;gap:18px}.card{background:rgba(17,28,49,.88);border:1px solid var(--line);border-radius:18px;padding:18px;backdrop-filter:blur(10px)}.sticky{position:sticky;top:16px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}.stat{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:12px}.stat b{display:block;font-size:24px}.stat span{color:var(--muted);font-size:12px}.controls{display:grid;gap:10px}label{font-size:13px;color:#c9d7ef;font-weight:700}select,input,textarea,button{width:100%;border-radius:12px;border:1px solid #34476f;background:#0c1628;color:var(--text);padding:11px 12px;font:inherit}textarea{min-height:180px;resize:vertical;line-height:1.7}.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}.btn{cursor:pointer;font-weight:800;background:linear-gradient(135deg,#0891b2,#7c3aed);border:0}.btn.secondary{background:#182842;border:1px solid #38527e}.btn.good{background:linear-gradient(135deg,#059669,#0891b2)}.btn.warn{background:linear-gradient(135deg,#d97706,#be123c)}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.tab{width:auto;padding:9px 12px;background:#101b31;border:1px solid var(--line);color:var(--muted);border-radius:999px;cursor:pointer}.tab.active{color:#06111f;background:var(--accent);border-color:var(--accent)}.langrow{display:flex;gap:8px;margin-bottom:12px}.lang{width:auto;flex:1;padding:9px;background:#101b31;border:1px solid var(--line);color:var(--muted);border-radius:12px;cursor:pointer;font-weight:800}.lang.active{color:#06111f;background:var(--accent);border-color:var(--accent)}.question-head{display:flex;gap:12px;align-items:flex-start;justify-content:space-between}.badge{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);background:#0d1729;color:#cfe1ff;border-radius:999px;padding:6px 10px;font-size:12px}.qtitle{font-size:25px;margin:10px 0}.prompt{font-size:18px;line-height:1.8;color:#eaf2ff}.hint,.answer,.casebox{border-left:4px solid var(--accent);background:#0c1729;border-radius:12px;padding:14px;margin:14px 0;color:#cbd8ee;line-height:1.75}.answer{border-left-color:var(--good);display:none}.casebox{border-left-color:var(--accent2)}.rubric{display:grid;gap:10px;margin-top:14px}.rubric label{display:flex;gap:10px;align-items:flex-start;background:#0c1729;border:1px solid var(--line);border-radius:12px;padding:12px;color:var(--text);font-weight:500}.rubric input{width:auto;margin-top:4px}.progress{height:12px;background:#0c1729;border-radius:999px;overflow:hidden;border:1px solid var(--line)}.bar{height:100%;width:0;background:linear-gradient(90deg,var(--good),var(--accent));transition:.25s}.small{color:var(--muted);font-size:13px;line-height:1.6}.pillrow{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.pill{border:1px solid #39537d;background:#0c1729;color:#cfe1ff;border-radius:999px;padding:6px 10px;font-size:12px}.credit{color:var(--muted);font-size:12px;line-height:1.6;margin-top:18px;text-align:center}.credit a{color:var(--accent)}.flash{animation:flash .45s}@keyframes flash{50%{transform:scale(1.01);box-shadow:0 0 0 4px rgba(110,231,249,.18)}}@media(max-width:850px){.grid{grid-template-columns:1fr}.sticky{position:static}.question-head{display:block}.btns{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <div class="wrap">
    <header class="hero">
      <h1 id="heroTitle"></h1>
      <div class="lead" id="heroLead"></div>
      <div class="pillrow" id="pillrow"></div>
    </header>
    <div class="grid">
      <aside class="card sticky">
        <div class="langrow"><button class="lang" id="langJa">日本語</button><button class="lang" id="langEn">English</button></div>
        <h2 id="settingsH"></h2>
        <div class="controls">
          <label><span id="catLabel"></span><select id="category"></select></label>
          <label><span id="modeLabel"></span><select id="mode"></select></label>
          <label><span id="searchLabel"></span><input id="search" /></label>
          <div class="btns"><button class="btn" id="nextBtn"></button><button class="btn secondary" id="resetBtn"></button></div>
        </div>
        <div class="stats"><div class="stat"><b id="done">0</b><span id="doneLabel"></span></div><div class="stat"><b id="avg">0%</b><span id="avgLabel"></span></div><div class="stat"><b id="streak">0</b><span id="streakLabel"></span></div><div class="stat"><b id="total">0</b><span id="totalLabel"></span></div></div>
        <div class="progress"><div class="bar" id="bar"></div></div><p class="small" id="tip"></p>
      </aside>
      <main class="card" id="mainCard">
        <div class="tabs" id="tabs"></div>
        <div class="question-head"><span class="badge" id="meta"></span><span class="badge" id="counter"></span></div>
        <h2 class="qtitle" id="qtitle"></h2>
        <div class="prompt" id="prompt"></div>
        <div class="casebox" id="caseBox"></div>
        <div class="hint" id="framework"></div>
        <label><span id="notesLabel"></span><textarea id="notes"></textarea></label>
        <div class="btns"><button class="btn good" id="showBtn"></button><button class="btn secondary" id="saveBtn"></button></div>
        <div class="answer" id="answer"></div>
        <h3 id="rubricH"></h3><div class="rubric" id="rubric"></div>
        <div class="btns" style="margin-top:14px"><button class="btn" id="gradeBtn"></button><button class="btn warn" id="drillBtn"></button></div>
      </main>
    </div>
    <div class="credit" id="credit"></div>
  </div>
<script>
const CATS={
ml:{ja:"ML基礎",en:"ML Fundamentals"},
stats:{ja:"統計・確率",en:"Statistics & Probability"},
eval:{ja:"評価・検証",en:"Evaluation & Validation"},

llm:{ja:"LLM技術基礎",en:"LLM Technical Foundations"},

dist:{ja:"技術戦略・Distinguished級",en:"Tech Strategy / Distinguished"},

};
const UI={
title:{ja:"シニアDS面接トレーナー",en:"Strategy Consulting Senior DS Interview Trainer"},
lead:{ja:"ML・統計基礎、LLM技術、DSケース、因果推論、GenAI/RAG、MLOps、行動面接、技術戦略までを、音読・構造化回答・自己採点で反復練習する単一HTMLアプリです。言語スイッチで英語面接の練習もできます。",en:"A single-file HTML app for drilling ML & statistics fundamentals, LLM internals, DS cases, causal inference, GenAI/RAG, MLOps, behavioral interviews, and tech strategy through spoken practice, structured answers, and self-scoring. Switch languages to rehearse for English interviews."},
pills:{ja:["定義暗記ではなく判断理由を訓練","STAR / Issue Tree / ROIで回答","日英切替対応","ローカル保存対応"],en:["Train judgment, not definitions","Answer with STAR / issue trees / ROI","Japanese-English toggle","Progress saved locally"]},
settings:{ja:"練習設定",en:"Practice Settings"},
category:{ja:"カテゴリ",en:"Category"},
mode:{ja:"モード",en:"Mode"},
modeAll:{ja:"全問",en:"All questions"},
modeWeak:{ja:"未達・未回答を優先",en:"Weak / unanswered first"},
modeCase:{ja:"ケース問題のみ",en:"Case questions only"},
modeRandom:{ja:"ランダム",en:"Random"},
search:{ja:"検索",en:"Search"},
searchPh:{ja:"例: RAG, Precision, 因果",en:"e.g. RAG, precision, causal"},
next:{ja:"次の問題",en:"Next question"},
reset:{ja:"記録リセット",en:"Reset records"},
done:{ja:"回答済み",en:"Answered"},
avg:{ja:"平均スコア",en:"Avg score"},
streak:{ja:"連続練習",en:"Streak"},
total:{ja:"問題数",en:"Questions"},
tip:{ja:"自己採点は「面接で言えたか」で判定してください。満点回答より、前提・トレードオフ・ビジネス価値まで言語化できることが重要です。",en:"Score yourself on whether you could actually say it in the interview. Verbalizing assumptions, trade-offs, and business value matters more than a perfect answer."},
all:{ja:"すべて",en:"All"},
caseTag:{ja:" ・ケース",en:" · Case"},
caseTip:{ja:"ケース面接では、①目的関数 ②データ/ラベル ③検証 ④導入 ⑤リスクの順で話してください。",en:"In case interviews, structure your answer as: (1) objective function, (2) data & labels, (3) validation, (4) deployment, (5) risks."},
frame:{ja:"回答フレーム",en:"Answer frame"},
model:{ja:"模範観点",en:"Model answer points"},
notes:{ja:"自分の回答メモ",en:"Your answer notes"},
notesPh:{ja:"ここに30〜90秒で話す回答の骨子を書いてください",en:"Sketch the backbone of a 30-90 second spoken answer here"},
show:{ja:"模範観点を表示",en:"Show model answer"},
save:{ja:"回答を保存",en:"Save answer"},
rubric:{ja:"自己採点ルーブリック",en:"Self-scoring rubric"},
grade:{ja:"採点して次へ",en:"Grade & next"},
drill:{ja:"弱点ドリル",en:"Weakness drill"},
confirmReset:{ja:"練習記録を削除しますか？",en:"Delete all practice records?"},
credit:{ja:"「LLM技術基礎」の質問リスト出典: Hao Hoang, \"Top 50 Large Language Model (LLM) Interview Questions\" (CC BY 4.0)。回答は本アプリ向けに独自執筆。",en:"Question list for \"LLM Technical Foundations\" from: Hao Hoang, \"Top 50 Large Language Model (LLM) Interview Questions\" (CC BY 4.0). Answers written independently for this app."}
};
const BANK=[
{c:"ml",t:{ja:"バイアス・バリアンスのトレードオフを説明してください。",en:"Explain the bias-variance trade-off."},p:{ja:"数式の暗唱ではなく、モデル選定や正則化の実務判断にどう効くかまで話してください。",en:"Go beyond reciting formulas — explain how it drives practical decisions on model selection and regularization."},f:{ja:"誤差分解 → 高バイアス/高バリアンスの症状 → 学習曲線での診断 → 対策の使い分け。",en:"Error decomposition → symptoms of high bias vs variance → diagnosis via learning curves → matching remedies."},a:{ja:"汎化誤差はバイアス（モデルが単純すぎて構造を捉えられない）、バリアンス（学習データの揺らぎに過敏）、除去不能なノイズに分解できます。学習曲線で診断し、高バイアスなら特徴量追加やモデル複雑化、高バリアンスなら正則化・データ追加・アンサンブルを検討します。実務では「検証誤差を最小にする複雑さ」を探す作業であり、データ量が増えるほど複雑なモデルが正当化される、という感覚まで話せると良いです。",en:"Generalization error decomposes into bias (model too simple to capture structure), variance (over-sensitivity to training data fluctuations), and irreducible noise. Diagnose with learning curves: high bias calls for richer features or more capacity; high variance calls for regularization, more data, or ensembling. In practice it is a search for the complexity that minimizes validation error, and more data justifies more complex models."},r:{ja:["誤差の分解を説明","学習曲線などで診断法を提示","高バイアス/高バリアンス別の対策","実務のモデル選定に接続"],en:["Explained the error decomposition","Gave a diagnosis method (learning curves)","Remedies for high bias vs high variance","Connected it to practical model selection"]}},
{c:"ml",t:{ja:"L1正則化とL2正則化の違いと使い分けを説明してください。",en:"Compare L1 and L2 regularization and when to use each."},p:{ja:"スパース性が生まれる幾何学的直感と、elastic netを選ぶ状況にも触れてください。",en:"Include the geometric intuition for sparsity and when you would choose elastic net."},f:{ja:"ペナルティの形 → スパース性の直感 → 相関特徴量での挙動 → elastic net → 実務の使い分け。",en:"Penalty shapes → sparsity intuition → behavior with correlated features → elastic net → practical selection."},a:{ja:"L1は係数の絶対値和、L2は二乗和をペナルティにします。L1の制約領域は角を持つため解が軸上に乗りやすく、係数がゼロになり特徴量選択として機能します。L2は係数を滑らかに縮小し、相関の強い特徴量群に重みを分散させるため安定的です。L1は相関特徴量から恣意的に1つを選ぶ不安定さがあるので、特徴量が多く相関もある場合はelastic netを使います。深層学習ではweight decay（L2相当）が標準です。",en:"L1 penalizes the sum of absolute coefficients, L2 the sum of squares. The L1 constraint region has corners, so solutions land on axes and coefficients become exactly zero — built-in feature selection. L2 shrinks smoothly and spreads weight across correlated features, which is more stable. L1 picks arbitrarily among correlated features, so with many correlated predictors elastic net is preferred. In deep learning, weight decay (essentially L2) is the default."},r:{ja:["ペナルティの違いを説明","スパース性の直感を説明","相関特徴量での挙動差","elastic net等の使い分け"],en:["Explained the penalty difference","Gave the sparsity intuition","Behavior under correlated features","When to use elastic net etc."]}},
{c:"ml",t:{ja:"線形モデル・木系アンサンブル・ニューラルネットをどう使い分けますか。",en:"How do you choose among linear models, tree ensembles, and neural networks?"},p:{ja:"表形式データのコンサル案件を想定し、精度以外の判断軸も含めてください。",en:"Assume tabular data in a consulting engagement; include decision criteria beyond accuracy."},f:{ja:"データ量/型 → ベースライン → 精度 vs 解釈性 vs 運用コスト → クライアント引き渡し。",en:"Data size/type → baseline → accuracy vs interpretability vs operational cost → client handover."},a:{ja:"まず線形モデルをベースラインにします。高速で解釈しやすく、効果があるかの下限が分かります。表形式ではGBDT（LightGBM/XGBoost）が精度・開発速度・欠損耐性の点でまず勝つことが多く、私のデフォルト候補です。NNは画像・テキスト・大規模データ・embeddingが必要な場合や、マルチタスク・逐次学習が要る場合に選びます。判断軸は精度だけでなく、規制上の説明責任、推論レイテンシ、クライアント側チームが保守できるか、再学習コストです。",en:"Start with a linear baseline: fast, interpretable, and it establishes a floor. On tabular data, gradient-boosted trees (LightGBM/XGBoost) usually win on accuracy, development speed, and handling of missing values, so they are my default candidate. Neural nets earn their place with images, text, very large data, learned embeddings, or multi-task needs. The decision axes go beyond accuracy: regulatory explainability, inference latency, whether the client team can maintain it, and retraining cost."},r:{ja:["ベースラインから始める","表形式でのGBDT優位に言及","NNを選ぶ条件を明示","精度以外の判断軸を複数"],en:["Starts from a baseline","Noted GBDT strength on tabular data","Clear conditions for choosing NNs","Multiple non-accuracy criteria"]}},
{c:"ml",t:{ja:"勾配ブースティングの内部動作を説明してください。",en:"Explain how gradient boosting works internally."},p:{ja:"「残差に木を当てる」の一段深く、勾配・学習率・主要な正則化の役割まで話してください。",en:"Go one level deeper than 'fit trees to residuals' — cover gradients, learning rate, and key regularization."},f:{ja:"関数空間の勾配降下 → 損失の勾配に木をフィット → shrinkage → 木の正則化 → LightGBM/XGBoostの工夫。",en:"Gradient descent in function space → trees fit to loss gradients → shrinkage → tree regularization → LightGBM/XGBoost innovations."},a:{ja:"勾配ブースティングは関数空間での勾配降下です。現在のアンサンブルの予測に対する損失関数の負の勾配（二乗誤差なら残差に一致）を計算し、それを近似する木を追加し、学習率を掛けて足し込みます。任意の微分可能な損失に使えるのが強みです。過学習制御は学習率、木の深さ/葉数、subsample、L1/L2、early stoppingで行います。XGBoostは二次勾配と正則化項付きの目的関数、LightGBMはヒストグラム化とleaf-wise成長で高速化しています。",en:"Gradient boosting is gradient descent in function space. At each step you compute the negative gradient of the loss with respect to current predictions (which equals residuals for squared error), fit a tree to approximate it, and add it scaled by a learning rate. It works with any differentiable loss. Overfitting is controlled via learning rate, tree depth/leaves, subsampling, L1/L2 penalties, and early stopping. XGBoost adds second-order gradients and a regularized objective; LightGBM speeds things up with histogram binning and leaf-wise growth."},r:{ja:["関数空間の勾配降下と説明","勾配と残差の関係","学習率・正則化の役割","実装の工夫に言及"],en:["Framed as functional gradient descent","Gradient-residual relationship","Role of learning rate and regularization","Mentioned implementation innovations"]}},
{c:"ml",t:{ja:"不均衡データ（陽性0.1%など）にどう対処しますか。",en:"How do you handle heavily imbalanced data (e.g., 0.1% positives)?"},p:{ja:"リサンプリング以外の選択肢と、評価・閾値・確率補正の注意点まで含めてください。",en:"Cover options beyond resampling, plus caveats on evaluation, thresholds, and probability calibration."},f:{ja:"まず評価指標 → class weight / リサンプリング → 閾値最適化 → calibration → ビジネスコスト。",en:"Metrics first → class weights / resampling → threshold optimization → calibration → business costs."},a:{ja:"最初にやるべきは指標の是正で、accuracyではなくPR-AUCやPrecision@K、期待コストで評価します。多くの場合、class weightや適切な閾値調整だけで十分で、SMOTE等の合成オーバーサンプリングが本当に効く場面は限定的です。undersamplingやweightingは予測確率を歪めるので、コスト計算に確率を使うならcalibration（Platt/isotonic）で補正します。最終的な閾値はFP/FNの業務コストと処理容量から決め、そもそもラベル定義や特徴量で分離性を上げる方が効くことも多いと添えます。",en:"Fix the metric first: evaluate with PR-AUC, Precision@K, or expected cost, never accuracy. Class weights plus proper threshold tuning are often sufficient; synthetic oversampling like SMOTE helps less often than advertised. Undersampling and weighting distort predicted probabilities, so if you use probabilities for cost decisions, recalibrate (Platt/isotonic). Set the final threshold from FP/FN business costs and operational capacity — and often improving label definitions and features beats any resampling trick."},r:{ja:["評価指標の是正から開始","複数の対処法と限界","確率の歪みとcalibration","ビジネスコストで閾値決定"],en:["Started by fixing the metric","Multiple remedies with limits","Probability distortion and calibration","Threshold from business costs"]}},
{c:"ml",t:{ja:"欠損値をどう扱いますか。",en:"How do you handle missing values?"},p:{ja:"欠損メカニズム（MCAR/MAR/MNAR）と、欠損自体が情報になるケースに触れてください。",en:"Address missingness mechanisms (MCAR/MAR/MNAR) and cases where missingness itself is informative."},f:{ja:"欠損の原因調査 → MCAR/MAR/MNAR → 手法選択 → 欠損フラグ → 本番での再現性。",en:"Investigate causes → MCAR/MAR/MNAR → method choice → missing indicators → production consistency."},a:{ja:"まず「なぜ欠損したか」を調べます。ランダム欠損（MCAR）なら単純な補完や削除も許されますが、実務の欠損は大抵MAR/MNARで、例えば「収入欄の空欄は高所得者に多い」なら欠損自体が信号です。実務では欠損フラグ列を追加し、GBDTなら欠損をそのまま扱わせるのが強力です。線形モデルなら多重代入やモデルベース補完を検討します。重要なのは、補完ロジックを学習時と本番で完全に一致させること、そして補完で分布を歪めて因果解釈を壊さないことです。",en:"First ask why data is missing. Under MCAR simple imputation or deletion is defensible, but real-world missingness is usually MAR/MNAR — e.g., blank income fields skewing toward high earners means missingness itself is signal. Practically, add missing-indicator features, and let GBDTs handle NaNs natively, which is remarkably effective. For linear models consider multiple imputation. Crucially, the imputation logic must be identical between training and production, and beware of distorting distributions in ways that break causal interpretation."},r:{ja:["欠損メカニズムに言及","欠損が情報になる例","手法をモデル別に使い分け","本番との一貫性に言及"],en:["Mentioned missingness mechanisms","Example of informative missingness","Methods matched to model type","Train/production consistency"]}},
{c:"ml",t:{ja:"高カーディナリティなカテゴリ変数をどうエンコードしますか。",en:"How do you encode high-cardinality categorical variables?"},p:{ja:"target encodingのリーク問題と対策を必ず含めてください。",en:"You must cover target-encoding leakage and its mitigations."},f:{ja:"one-hotの限界 → target/frequency encoding → リーク対策（out-of-fold, smoothing） → embedding。",en:"One-hot limits → target/frequency encoding → leakage control (out-of-fold, smoothing) → embeddings."},a:{ja:"数千水準の変数をone-hotにすると次元爆発と過学習を招きます。頻度エンコーディングは安全で意外に効きます。target encodingは強力ですが、自分のラベルが自分の特徴量に混ざるリークが起きるため、必ずout-of-fold計算にし、低頻度カテゴリは全体平均へ縮めるsmoothingを入れます。時系列なら「過去データのみ」で計算します。NNならentity embeddingで類似カテゴリの構造も学習できます。新規カテゴリの本番時の扱い（デフォルト値）も先に設計しておきます。",en:"One-hot encoding thousands of levels causes dimension explosion and overfitting. Frequency encoding is safe and surprisingly effective. Target encoding is powerful but leaks the row's own label into its feature, so compute it out-of-fold and shrink rare categories toward the global mean (smoothing); in time series, use only past data. With neural nets, entity embeddings also learn similarity structure between categories. Design upfront how unseen categories are handled in production."},r:{ja:["one-hotの限界を説明","target encodingのリークを説明","out-of-fold/smoothing対策","新規カテゴリの本番対応"],en:["Explained one-hot limitations","Explained target-encoding leakage","Out-of-fold / smoothing fixes","Handling unseen categories in prod"]}},
{c:"ml",t:{ja:"特徴量エンジニアリングをどう進めますか。",en:"How do you approach feature engineering?"},p:{ja:"ドメイン知識の取り込み方と、特徴量が増えすぎたときの選択方法も話してください。",en:"Include how you incorporate domain knowledge and how you select features when they proliferate."},f:{ja:"業務理解 → 仮説ドリブンに生成 → 集約/比率/ラグ → リーク確認 → 重要度で選択 → 保守性。",en:"Business understanding → hypothesis-driven creation → aggregates/ratios/lags → leakage checks → importance-based selection → maintainability."},a:{ja:"最も効くのはドメイン専門家との対話から仮説ドリブンに作る特徴量です。「熟練者は何を見て判断しているか」を、比率・差分・ラグ・集約・経過時間などに翻訳します。各特徴量には「予測時点で入手可能か」というリークチェックを必ずかけます。選択はpermutation importanceやSHAPで行い、相関の塊は代表1本に絞ります。最後に、本番パイプラインで安定して計算できるか、保守コストに見合うかで刈り込みます。特徴量の数より「意思決定の物理・業務構造を写した特徴量」が価値を生みます。",en:"The highest-value features come from hypothesis-driven work with domain experts — translating 'what does an expert look at?' into ratios, differences, lags, aggregations, and elapsed times. Every feature gets a leakage check: is it available at prediction time? Select with permutation importance or SHAP, collapsing correlated clusters to one representative. Finally prune by whether the production pipeline can compute it reliably and whether it justifies maintenance cost. Features that mirror the business mechanics beat sheer quantity."},r:{ja:["ドメイン仮説から生成","代表的な変換パターンを列挙","リークチェックを明示","選択と保守性の観点"],en:["Hypothesis-driven from domain knowledge","Listed typical transformations","Explicit leakage checks","Selection and maintainability"]}},
{c:"ml",t:{ja:"PCAとUMAP/t-SNEの違いと使いどころを説明してください。",en:"Compare PCA with UMAP/t-SNE and their use cases."},p:{ja:"可視化用と前処理用の区別、非線形手法の解釈の罠に触れてください。",en:"Distinguish visualization vs preprocessing use, and the interpretation pitfalls of nonlinear methods."},f:{ja:"線形 vs 非線形 → 大域構造 vs 局所構造 → 前処理適性 → 可視化の罠。",en:"Linear vs nonlinear → global vs local structure → suitability as preprocessing → visualization pitfalls."},a:{ja:"PCAは分散を最大化する線形射影で、決定的・高速・逆変換可能なため、次元削減の前処理やノイズ除去に向きます。UMAP/t-SNEは局所的な近傍関係を保つ非線形埋め込みで、クラスタ構造の可視化に優れますが、クラスタ間距離や密度は信用できず、ハイパーパラメータで見た目が大きく変わります。よって「t-SNEで離れて見えるから別グループ」という報告は危険です。新データへの適用もPCAは自然ですが、t-SNEは基本的に再学習が必要です。可視化はUMAP、モデル前処理はPCAかそのままGBDT、が実務の目安です。",en:"PCA is a linear projection maximizing variance — deterministic, fast, invertible — making it suitable for preprocessing and denoising. UMAP/t-SNE are nonlinear embeddings preserving local neighborhoods, excellent for visualizing cluster structure, but between-cluster distances and densities are not trustworthy and hyperparameters reshape the picture. So 'they look separate in t-SNE, hence distinct groups' is a dangerous claim. PCA naturally transforms new data; t-SNE essentially requires refitting. Rule of thumb: UMAP for visualization, PCA (or nothing, with GBDTs) for preprocessing."},r:{ja:["線形/非線形の違い","局所構造保持と距離の罠","前処理と可視化の使い分け","新データへの適用性"],en:["Linear vs nonlinear distinction","Local structure and distance pitfalls","Preprocessing vs visualization roles","Applicability to new data"]}},
{c:"ml",t:{ja:"クラスタリング手法をどう選び、クラスタ数をどう決めますか。",en:"How do you choose a clustering method and the number of clusters?"},p:{ja:"k-means/階層/DBSCAN/GMMの前提の違いと、ビジネスでの「良いクラスタ」の基準を含めてください。",en:"Cover the differing assumptions of k-means/hierarchical/DBSCAN/GMM and what makes clusters 'good' for business."},f:{ja:"目的の明確化 → 手法の前提（形状・密度・ノイズ） → k選定（elbow/silhouette/安定性） → 業務解釈性。",en:"Clarify the goal → method assumptions (shape, density, noise) → choosing k (elbow/silhouette/stability) → business interpretability."},a:{ja:"まず「クラスタを何に使うか」を確認します。k-meansは球状・同程度サイズを仮定し高速、GMMは楕円と所属確率を扱え、DBSCANは任意形状とノイズ点を許容、階層型は粒度を後から選べます。スケーリングと距離定義が結果を支配する点も重要です。kはelbowやsilhouetteに加え、サブサンプルでの安定性で確認します。ただしビジネスでは統計的最適より「各クラスタに別のアクションが打てるか、施策担当者が名前を付けられるか」が良いクラスタの基準で、最終的には解釈性と実行可能性で決めます。",en:"First clarify what the clusters are for. K-means assumes spherical, similar-sized clusters and is fast; GMM handles ellipsoids and soft membership; DBSCAN allows arbitrary shapes and noise points; hierarchical lets you pick granularity afterward. Feature scaling and the distance definition dominate results. Choose k with elbow/silhouette plus stability under subsampling. But in business, the real criterion is whether each cluster supports a distinct action and whether stakeholders can name it — interpretability and actionability decide, not statistical optimality alone."},r:{ja:["目的の確認から開始","手法の前提の違い","kの決め方を複数","業務上の良さの基準"],en:["Started from the purpose","Differing method assumptions","Multiple ways to choose k","Business criteria for quality"]}},
{c:"ml",t:{ja:"アンサンブル学習（bagging/boosting/stacking）を整理して説明してください。",en:"Explain ensemble methods: bagging, boosting, and stacking."},p:{ja:"それぞれが何を減らすか、stackingのリーク防止、実務で使う場面を含めてください。",en:"Cover what each reduces, leakage prevention in stacking, and when you actually use them."},f:{ja:"分散低減 vs バイアス低減 → 多様性が鍵 → stackingのout-of-fold → 実務での費用対効果。",en:"Variance vs bias reduction → diversity is key → out-of-fold stacking → practical cost-benefit."},a:{ja:"baggingは独立に学習した多数のモデルの平均で分散を減らし（RF）、boostingは前のモデルの誤りを逐次補正してバイアスを減らします（GBDT）。stackingは複数モデルの予測をメタモデルで結合しますが、メタ特徴量は必ずout-of-fold予測で作らないとリークします。アンサンブルの効果は個々のモデルの多様性（異なるアルゴリズム・特徴量・シード）に依存します。実務ではコンペと違い、精度向上分と推論コスト・保守複雑性を天秤にかけ、単一GBDT＋シード平均程度に留めることが多いです。",en:"Bagging averages independently trained models to reduce variance (Random Forest); boosting sequentially corrects predecessors' errors to reduce bias (GBDT); stacking combines model predictions with a meta-model, where meta-features must be built from out-of-fold predictions to avoid leakage. Ensemble gains depend on diversity — different algorithms, features, seeds. In production, unlike competitions, weigh the accuracy gain against inference cost and maintenance complexity; often a single GBDT with seed averaging is the right stopping point."},r:{ja:["bagging/boostingの目的の違い","多様性の重要性","stackingのリーク防止","実務での費用対効果判断"],en:["Bagging vs boosting purposes","Importance of diversity","Stacking leakage prevention","Production cost-benefit judgment"]}},
{c:"ml",t:{ja:"ハイパーパラメータ探索をどう設計しますか。",en:"How do you design hyperparameter search?"},p:{ja:"grid/random/Bayesianの使い分けと、探索より先にやるべきことを含めてください。",en:"Cover grid vs random vs Bayesian search, and what should come before tuning at all."},f:{ja:"チューニングの期待効果を見積もる → 重要パラメータ優先 → random/Bayesian → early stopping → 検証設計との整合。",en:"Estimate expected gains first → prioritize impactful params → random/Bayesian → early stopping → consistency with validation design."},a:{ja:"まず順序として、特徴量とデータ品質の改善の方がチューニングより効くことが多いと伝えます。探索するなら、gridは低次元のみで、高次元ではrandom searchが理論的にも効率的です。評価が高価な場合はOptuna等のBayesian最適化＋枝刈りを使います。GBDTなら学習率と木の数はearly stoppingで自動化し、深さ・葉数・サンプリング率など影響の大きいものに絞ります。重要なのは探索がCV設計に従うこと（時系列なら時系列CV）で、テストセットで探索するのはリークです。最後にチューニング前後の差分を報告し、費用対効果を明示します。",en:"First, feature and data-quality work usually beats tuning — say so. When you do tune: grid search only for low dimensions; random search is provably more efficient in high dimensions; Bayesian optimization (e.g., Optuna with pruning) when evaluations are expensive. For GBDTs, automate learning rate/number of trees with early stopping and focus on high-impact parameters like depth, leaves, and sampling rates. Critically, the search must respect the validation design (time-series CV for temporal data) — tuning on the test set is leakage. Report the before/after delta to show the effort was worth it."},r:{ja:["チューニングの優先度を相対化","手法の使い分け","検証設計との整合/リーク回避","費用対効果の報告"],en:["Put tuning in perspective","Method selection logic","Consistency with validation / no leakage","Reported cost-effectiveness"]}},
{c:"ml",t:{ja:"勾配降下法の種類と、Adamが広く使われる理由を説明してください。",en:"Explain gradient descent variants and why Adam is so widely used."},p:{ja:"batch/mini-batch/SGD、momentum、学習率スケジュールにも触れてください。",en:"Touch on batch/mini-batch/SGD, momentum, and learning-rate schedules."},f:{ja:"batch vs mini-batch vs SGD → momentum → 適応的学習率（Adam） → スケジュール/warmup。",en:"Batch vs mini-batch vs SGD → momentum → adaptive rates (Adam) → schedules/warmup."},a:{ja:"バッチ勾配降下は全データで勾配を計算し安定ですが大規模では高価、SGDは1サンプルで高速だがノイジー、実務は両者の折衷のmini-batchです。momentumは勾配の移動平均で振動を抑え谷を進みやすくします。Adamはmomentum（一次モーメント）と勾配二乗の移動平均（二次モーメント）でパラメータごとに学習率を適応させるため、チューニングが少なくても安定して収束しやすく、デファクトになっています。大規模学習ではwarmup付きcosineスケジュールやAdamW（weight decayの分離）が標準的です。",en:"Batch gradient descent uses all data per step — stable but expensive; SGD uses one sample — fast but noisy; mini-batch is the practical middle ground. Momentum smooths updates with a moving average of gradients, damping oscillation. Adam combines momentum (first moment) with a moving average of squared gradients (second moment) to adapt the learning rate per parameter, converging reliably with little tuning — hence its dominance. For large-scale training, cosine schedules with warmup and AdamW (decoupled weight decay) are standard."},r:{ja:["3種の勾配降下の違い","momentumの役割","Adamの仕組みと利点","スケジュール/warmupに言及"],en:["Three GD variants distinguished","Role of momentum","How Adam works and why it wins","Mentioned schedules/warmup"]}},
{c:"ml",t:{ja:"ニューラルネットの学習を安定させる要素（活性化関数・正規化・dropout）を説明してください。",en:"Explain what stabilizes neural network training: activations, normalization, dropout."},p:{ja:"勾配消失との関係と、それぞれ「いつ効くか」を整理してください。",en:"Relate them to vanishing gradients and organize when each one helps."},f:{ja:"勾配消失問題 → ReLU系 → batch/layer norm → dropout → residual接続 → 初期化。",en:"Vanishing gradients → ReLU family → batch/layer norm → dropout → residual connections → initialization."},a:{ja:"sigmoidやtanhは飽和領域で勾配がほぼゼロになり、深い網では勾配消失を起こします。ReLUは正領域で勾配1を保ち、これを大きく緩和しました（dying ReLU対策にLeakyReLU/GELU）。batch normは各層の入力分布を正規化して学習を速く安定にし、系列やLLMではlayer normを使います。dropoutは学習時にユニットをランダムに落とす正則化で、過学習抑制に効きますが、BNとの併用や畳み込みでは効果が限定的です。residual接続は勾配のバイパスを作り、超深層を可能にしました。適切な初期化（He/Xavier）も含め「勾配が流れる設計」として一貫して説明できると良いです。",en:"Sigmoid/tanh saturate, so gradients vanish in deep stacks. ReLU keeps gradient 1 in the positive region, largely fixing this (LeakyReLU/GELU address dying units). Batch norm normalizes layer inputs to speed and stabilize training; layer norm replaces it for sequences and LLMs. Dropout randomly zeroes units during training as regularization — useful against overfitting, though less so with BN or in convolutions. Residual connections create gradient shortcuts enabling very deep networks. Framed together with proper initialization (He/Xavier), it is all one theme: designing so gradients can flow."},r:{ja:["勾配消失を軸に説明","ReLU系の効果","BN/LNの使い分け","dropout/residualの役割"],en:["Framed around vanishing gradients","Effect of ReLU family","BN vs LN usage","Roles of dropout/residuals"]}},
{c:"ml",t:{ja:"転移学習とfine-tuningをどう活用しますか。",en:"How do you leverage transfer learning and fine-tuning?"},p:{ja:"データが少ないクライアント案件を想定し、層の凍結や過学習リスクにも触れてください。",en:"Assume a data-scarce client engagement; touch on layer freezing and overfitting risks."},f:{ja:"事前学習表現の再利用 → feature extraction vs fine-tuning → データ量による使い分け → ドメインギャップ。",en:"Reusing pretrained representations → feature extraction vs fine-tuning → choice by data volume → domain gap."},a:{ja:"転移学習は大規模データで事前学習した表現を流用する手法で、データの少ないクライアント案件では標準手段です。データが極少なら事前学習モデルを特徴抽出器として凍結し、最終層のみ学習します。数千件以上あれば上位層から徐々に解凍して低学習率でfine-tuningします。事前学習ドメインと対象ドメインのギャップが大きい場合（例: 自然画像→工場のX線画像）は中間的なドメイン適応や追加事前学習を検討します。少データでの全層fine-tuningは過学習と破滅的忘却を招くため、augmentationとearly stoppingを併用します。LLMではこの構図がprompt/RAG/PEFTの選択に対応します。",en:"Transfer learning reuses representations pretrained on large corpora — the default move in data-scarce engagements. With very little data, freeze the pretrained model as a feature extractor and train only the head. With thousands of examples, unfreeze top layers gradually and fine-tune at low learning rates. If the domain gap is large (natural images → factory X-rays), consider domain-adaptive or continued pretraining. Full fine-tuning on small data invites overfitting and catastrophic forgetting, so pair with augmentation and early stopping. In LLMs, the same logic maps onto prompt vs RAG vs PEFT choices."},r:{ja:["データ量に応じた戦略","凍結/解凍の使い分け","ドメインギャップへの言及","過学習/忘却リスクと対策"],en:["Strategy by data volume","Freeze/unfreeze decisions","Addressed domain gap","Overfitting/forgetting risks and fixes"]}},
{c:"ml",t:{ja:"SHAPなどのモデル解釈手法をどう使い、どこに注意しますか。",en:"How do you use model explanation methods like SHAP, and what are the caveats?"},p:{ja:"「重要度が高い＝因果」ではない点と、クライアント報告での使い方を含めてください。",en:"Include why importance is not causation, and how you use explanations in client reporting."},f:{ja:"global vs local説明 → SHAP/permutationの仕組み → 相関特徴量の罠 → 因果との区別 → 報告での使い方。",en:"Global vs local explanations → SHAP/permutation mechanics → correlated-feature pitfalls → distinction from causality → use in reporting."},a:{ja:"SHAPは各予測への特徴量の寄与を協力ゲーム理論のShapley値で配分するもので、個別予測の説明（local）と全体傾向（global）の両方に使えます。注意点は3つ。第一に相関する特徴量間では寄与配分が不安定になること。第二にSHAPは「モデルがどう予測しているか」の説明であり、「その特徴量を動かせば結果が変わる」という因果主張ではないこと。クライアントは必ず因果に読み替えるので、施策提案に繋げる際は明確に線を引き、必要なら因果分析を別途行います。第三にリークした特徴量ほど重要度が高く出るため、解釈はリーク検査としても有効です。",en:"SHAP attributes each prediction to features using Shapley values from cooperative game theory, supporting both local (per-prediction) and global explanations. Three caveats: attribution becomes unstable among correlated features; SHAP explains how the model predicts, not what happens if you intervene — clients will read it causally, so draw that line explicitly and run separate causal analysis before recommending actions; and leaked features show up with suspiciously high importance, which makes explanation a useful leakage audit."},r:{ja:["local/globalの区別","仕組みの説明","相関特徴量の不安定さ","因果との区別を明言"],en:["Local vs global distinction","Explained the mechanism","Instability under correlation","Explicitly separated from causality"]}},
{c:"ml",t:{ja:"回帰問題で損失関数・評価指標をどう選びますか。",en:"How do you choose loss functions and metrics for regression problems?"},p:{ja:"RMSE/MAE/quantile lossの使い分けを、需要予測の在庫判断のような業務例で説明してください。",en:"Distinguish RMSE/MAE/quantile loss using a business example like inventory decisions in demand forecasting."},f:{ja:"誤差の非対称コスト → RMSE（大誤差重視/平均） vs MAE（中央値/頑健） → quantile loss → 業務KPIへの接続。",en:"Asymmetric error costs → RMSE (penalizes large errors/mean) vs MAE (median/robust) → quantile loss → link to business KPIs."},a:{ja:"損失関数の選択は「どの誤りが高くつくか」の業務判断です。RMSEは大きな誤差を強く罰し条件付き平均を、MAEは外れ値に頑健で条件付き中央値を推定します。需要予測では欠品コストと在庫コストが非対称なことが多く、その場合は点予測ではなくquantile loss（pinball loss）で例えば90%分位を予測し、サービスレベルに直結させます。MAPEはゼロ近傍で破綻し低需要を過度に重視する罠があります。最終的には「予測誤差1単位が利益に与える影響」で指標を選び、モデル比較用の統計指標と経営報告用のKPIを分けて設計します。",en:"Choosing a loss is a business judgment about which errors cost more. RMSE heavily penalizes large errors and estimates the conditional mean; MAE is outlier-robust and estimates the median. In demand forecasting, stockout and holding costs are asymmetric, so instead of a point forecast, use quantile (pinball) loss to predict, say, the 90th percentile, tying directly to service levels. MAPE breaks down near zero and over-weights low-demand items. Ultimately pick metrics by the profit impact of one unit of error, and keep model-comparison metrics separate from executive-reporting KPIs."},r:{ja:["非対称コストの視点","RMSE/MAEの性質の違い","quantile lossの業務接続","MAPE等の罠に言及"],en:["Asymmetric-cost framing","RMSE vs MAE properties","Quantile loss tied to business","Noted MAPE pitfalls"]}},
{c:"ml",t:{ja:"SVM・カーネル法の直感と、現在の実務での位置づけを説明してください。",en:"Explain the intuition of SVMs and kernel methods, and where they stand in practice today."},p:{ja:"マージン最大化とカーネルトリックを平易に説明し、GBDT/NN時代に使う場面があるかも述べてください。",en:"Explain margin maximization and the kernel trick simply, and whether they still have a place in the GBDT/NN era."},f:{ja:"マージン最大化 → ソフトマージン → カーネルトリック → 計算量の限界 → 現在の使いどころ。",en:"Margin maximization → soft margin → kernel trick → computational limits → where they fit today."},a:{ja:"SVMはクラス間のマージンを最大化する境界を引く手法で、境界付近のサポートベクトルだけが解を決めます。ソフトマージンで誤分類を許容し、正則化とのバランスをCで制御します。カーネルトリックは、データを明示的に高次元へ写像せず内積計算だけで非線形境界を得る工夫です。ただし学習がサンプル数に対しておおよそ二乗以上でスケールし、大規模データではGBDTやNNに取って代わられました。現在の出番は、サンプルが少なく特徴量が多い場面（例: バイオ系）、テキストの線形SVMベースライン、異常検知のOne-Class SVMなどに限られますが、マージンや正則化の考え方自体はMLの基礎教養として重要です。",en:"An SVM draws the boundary that maximizes the margin between classes, determined only by the support vectors near it. Soft margins tolerate misclassification, balanced by C. The kernel trick obtains nonlinear boundaries via inner products alone, without explicit high-dimensional mapping. But training scales roughly quadratically or worse with samples, so GBDTs and NNs displaced SVMs at scale. Remaining niches: small-n large-p problems (e.g., bioinformatics), linear-SVM text baselines, and One-Class SVM for anomaly detection. The concepts of margin and regularization remain core ML literacy."},r:{ja:["マージン最大化の直感","カーネルトリックの説明","スケーラビリティの限界","現在の使いどころ"],en:["Margin-maximization intuition","Explained the kernel trick","Scalability limits","Where it is still used"]}},
{c:"ml",t:{ja:"過学習をどう検出し、どう対処しますか。",en:"How do you detect and address overfitting?"},p:{ja:"単なる定義ではなく、検証設計・原因分解・対策の副作用まで説明してください。",en:"Go beyond the definition — cover validation design, root-cause decomposition, and the side effects of each remedy."},f:{ja:"Train/validation gap → leakage確認 → 容量/正則化/データ/特徴量 → 本番分布差。",en:"Train/validation gap → check for leakage → capacity/regularization/data/features → production distribution shift."},a:{ja:"過学習は学習データには適合するが未知データで性能が落ちる状態。CVや時系列分割で汎化ギャップを見ます。対策は正則化、モデル単純化、早期終了、データ拡張、特徴量削減、リーク除去。重要なのは「評価設計が本番意思決定を再現しているか」を先に確認することです。ギャップが小さくても本番で劣化するなら、それは過学習ではなく分布シフトやリークの問題です。",en:"Overfitting means fitting the training data while degrading on unseen data. Measure the generalization gap with CV or temporal splits. Remedies: regularization, simpler models, early stopping, data augmentation, feature reduction, leakage removal. The key is to first confirm the evaluation design reproduces the production decision. If the gap is small yet production degrades, the problem is distribution shift or leakage, not overfitting."},r:{ja:["検出方法を説明","データリークや分割の確認に触れた","対策を複数提示","副作用やビジネスKPIに触れた"],en:["Explained detection methods","Checked leakage and split design","Multiple remedies offered","Touched side effects / business KPIs"]}},
{c:"ml",t:{ja:"Random ForestとGradient Boostingの違いを説明してください。",en:"Explain the differences between Random Forest and Gradient Boosting."},p:{ja:"精度、解釈性、チューニング、外れ値、並列性の観点を含めてください。",en:"Include accuracy, interpretability, tuning burden, outlier sensitivity, and parallelism."},f:{ja:"Bagging vs boosting、分散低減 vs バイアス低減、逐次学習、過学習制御。",en:"Bagging vs boosting, variance vs bias reduction, sequential learning, overfitting control."},a:{ja:"RFは多数の木を独立に作るbaggingで分散を下げ、並列化しやすく頑健。GBDTは弱学習器を逐次的に残差へ当てるため高精度になりやすい一方、学習率・深さ・正則化に敏感です。表形式ではLightGBM/XGBoostが強いが、リークや時系列分割の誤りはどちらでも致命的です。RFはチューニングが少なくて済むため、素早いベースラインや不安定なデータに向きます。",en:"Random Forest builds many independent trees (bagging) to reduce variance — parallelizable and robust. GBDT fits weak learners sequentially to residuals, typically achieving higher accuracy but sensitive to learning rate, depth, and regularization. On tabular data LightGBM/XGBoost dominate, but leakage or wrong temporal splits are fatal for either. RF needs little tuning, making it good for quick baselines and noisy data."},r:{ja:["学習方式の違い","バイアス/分散に触れた","運用上の違い","選択基準を説明"],en:["Training paradigm difference","Touched bias/variance","Operational differences","Selection criteria explained"]}},
{c:"stats",t:{ja:"p値とは何か、何ではないかを説明してください。",en:"Explain what a p-value is — and what it is not."},p:{ja:"よくある誤解（帰無仮説が正しい確率、効果の大きさ等）を否定しながら正しく説明してください。",en:"Correct the common misinterpretations (probability the null is true, effect size, etc.) while explaining it properly."},f:{ja:"定義（帰無仮説下でのデータの極端さ） → 3つの誤解の否定 → 効果量・信頼区間との併用 → 実務での使い方。",en:"Definition (extremeness of data under the null) → refute three misconceptions → pair with effect sizes/CIs → practical use."},a:{ja:"p値は「帰無仮説が正しいと仮定したとき、観測データ以上に極端な結果が得られる確率」です。誤解が3つあり、①帰無仮説が正しい確率ではない、②効果の大きさや重要性を示さない（大サンプルでは微小効果でも有意になる）、③p=0.05は「5%の確率で間違い」という意味ではない。実務では効果量と信頼区間を必ず併記し、「統計的に有意か」より「ビジネス的に意味のある大きさか、意思決定を変えるか」を軸に報告します。",en:"A p-value is the probability of observing data at least as extreme as what we saw, assuming the null hypothesis is true. Three misconceptions to refute: it is not the probability the null is true; it says nothing about effect size or importance (huge samples make trivial effects significant); and p=0.05 does not mean a 5% chance of being wrong. In practice, always report effect sizes and confidence intervals, and frame findings around whether the effect is large enough to change the business decision."},r:{ja:["正しい定義を述べた","誤解を複数否定","効果量/信頼区間に言及","意思決定への接続"],en:["Stated the correct definition","Refuted multiple misconceptions","Mentioned effect sizes/CIs","Connected to decision-making"]}},
{c:"stats",t:{ja:"信頼区間を非専門家のクライアントにどう説明しますか。",en:"How would you explain a confidence interval to a non-technical client?"},p:{ja:"厳密な頻度論的定義と、実務で許容される平易な言い換えの両方を用意してください。",en:"Prepare both the rigorous frequentist definition and a plain-language version acceptable in practice."},f:{ja:"平易な言い換え → 厳密な定義 → よくある誤解 → 区間幅が意思決定に与える示唆。",en:"Plain phrasing → rigorous definition → common misreading → what the width implies for decisions."},a:{ja:"クライアントには「同じ調査を何度も繰り返したら、この作り方の区間の95%が真の値を含みます。実務上は『真の値はおおむねこの範囲にある』と考えて意思決定して問題ありません」と伝えます。厳密には「特定の1つの区間が95%の確率で真値を含む」とは言えないのが頻度論ですが、その哲学論争をクライアントに持ち込むより、区間の幅が示す「不確実性の大きさ」が意思決定に耐えるかを議論する方が価値があります。区間が広すぎて判断できないなら、サンプル追加のコストと意思決定の価値を比較します。",en:"To a client: 'If we repeated this study many times, 95% of intervals built this way would contain the true value — practically, treat the truth as likely within this range.' Strictly, frequentism does not let you say a specific interval contains the truth with 95% probability, but rather than importing that philosophical debate, focus the client on whether the width — the amount of uncertainty — supports the decision at hand. If the interval is too wide to decide, weigh the cost of more data against the value of the decision."},r:{ja:["平易な説明を提示","厳密な定義も言える","誤解への注意","区間幅と意思決定の接続"],en:["Gave a plain explanation","Can state the rigorous definition","Flagged the misreading","Linked width to decisions"]}},
{c:"stats",t:{ja:"検出力とサンプルサイズ設計を説明してください。",en:"Explain statistical power and sample size design."},p:{ja:"A/Bテストの設計で、MDE・有意水準・検出力の関係と実務的な決め方を含めてください。",en:"In an A/B test context, cover the relationship among MDE, significance level, and power, and how to set them in practice."},f:{ja:"検出力の定義 → α/β/MDE/nの関係 → MDEをビジネスから決める → 過小検出力の実害。",en:"Definition of power → interplay of alpha/beta/MDE/n → derive MDE from business → harms of underpowered tests."},a:{ja:"検出力は「真に効果があるとき、それを検出できる確率」で、慣習的に80%以上を狙います。サンプルサイズは有意水準α、検出力、検出したい最小効果量（MDE）、分散から決まります。実務の出発点はMDEで、「施策コストを回収できる最小の効果はいくつか」からビジネス的に逆算します。検出力不足の実験は、効果を見逃すだけでなく、有意になった場合に効果を過大推定する（winner's curse）ため、走らせる価値自体が疑わしい。必要nが非現実的なら、指標の分散削減（CUPED等）、より感度の高い代理指標、対象セグメントの絞り込みを検討します。",en:"Power is the probability of detecting an effect when it truly exists — conventionally 80%+. Sample size follows from the significance level, power, minimum detectable effect (MDE), and variance. Start from the MDE, reverse-engineered from business: what is the smallest effect that pays back the intervention cost? Underpowered tests not only miss effects but overestimate them when they do reach significance (winner's curse), so they may not be worth running. If required n is unrealistic, consider variance reduction (e.g., CUPED), more sensitive proxy metrics, or narrowing the target segment."},r:{ja:["検出力の定義","4要素の関係","MDEをビジネスから導出","過小検出力の害に言及"],en:["Defined power","Relationship of the four inputs","MDE derived from business","Harms of underpowering"]}},
{c:"stats",t:{ja:"多重比較の問題と対処法を説明してください。",en:"Explain the multiple comparisons problem and how to handle it."},p:{ja:"多数のセグメント分析やA/Bテストの指標が多い場合を例に、FWERとFDRの使い分けを含めてください。",en:"Use many-segment analyses or multi-metric A/B tests as examples; distinguish FWER vs FDR control."},f:{ja:"偽陽性の膨張 → Bonferroni/FWER → BH法/FDR → 事前登録と探索/検証の分離。",en:"False-positive inflation → Bonferroni/FWER → Benjamini-Hochberg/FDR → preregistration and exploratory/confirmatory separation."},a:{ja:"検定を20回行えば、真に効果ゼロでも約1回は5%水準で有意になります。セグメントを切り刻んだ分析や指標が多いA/Bテストで「効いたセグメントだけ報告する」のは典型的なp-hackingです。対処は、家族全体の偽陽性を抑えるBonferroni等のFWER制御（保守的、確証的な少数の検定向け）と、発見のうち偽の割合を抑えるBH法等のFDR制御（探索的な多数の検定向け）の使い分けです。実務ではさらに、主要指標と仮説を事前に登録し、探索的発見は「仮説生成」と明示して次の実験で検証する、という運用が最も効きます。",en:"Run 20 tests and you expect one significant result at the 5% level even with zero true effects. Slicing into many segments or metrics and reporting only the winners is classic p-hacking. Remedies: FWER control like Bonferroni (conservative; for a few confirmatory tests) versus FDR control like Benjamini-Hochberg (for many exploratory tests, bounding the share of false discoveries). Operationally, the strongest fix is preregistering primary metrics and hypotheses, and labeling exploratory findings as hypothesis-generating, to be confirmed in a follow-up experiment."},r:{ja:["偽陽性膨張を定量的に説明","FWERとFDRの使い分け","p-hackingの実例","事前登録/検証分離の運用"],en:["Quantified false-positive inflation","FWER vs FDR usage","Concrete p-hacking example","Preregistration / confirmation workflow"]}},
{c:"stats",t:{ja:"ベイズ統計と頻度論の違い、実務でベイズを選ぶ場面を説明してください。",en:"Contrast Bayesian and frequentist statistics; when do you choose Bayesian methods in practice?"},p:{ja:"哲学論争ではなく、意思決定・少データ・逐次更新など実務上の利点で語ってください。",en:"Frame it around practical benefits — decision-making, small data, sequential updating — not philosophy."},f:{ja:"確率の解釈の違い → 事前分布と更新 → 実務で効く場面3つ → 計算コスト/事前分布の説明責任。",en:"Interpretation of probability → priors and updating → three practical sweet spots → computational cost and prior justification."},a:{ja:"頻度論はパラメータを固定値とみなしデータの繰り返しで確率を定義し、ベイズはパラメータ自体に確率分布を置き、事前分布をデータで更新します。実務でベイズが効くのは、①「施策Aが優る確率は92%」のように意思決定に直結する表現ができる、②少データでもドメイン知識を事前分布として注入できる（新店舗の売上予測など）、③逐次更新やbanditと相性が良い、④階層モデルで店舗別・地域別のような多層構造を自然に扱える場面です。代償は計算コストと事前分布の説明責任で、クライアントに事前分布の感度分析を示せるようにしておきます。",en:"Frequentists treat parameters as fixed and define probability via repeated sampling; Bayesians place distributions on parameters and update priors with data. Bayesian methods earn their keep when: (1) you need decision-ready statements like 'there is a 92% probability A beats B'; (2) data is scarce and domain knowledge can enter as a prior (e.g., forecasting a new store); (3) you want sequential updating or bandits; (4) hierarchical models naturally handle store/region structure. The costs are computation and accountability for the prior — be ready to show clients a prior sensitivity analysis."},r:{ja:["解釈の違いを説明","実務上の利点を複数","具体的なユースケース","事前分布の説明責任"],en:["Explained the interpretive difference","Multiple practical advantages","Concrete use cases","Accountability for priors"]}},
{c:"stats",t:{ja:"中心極限定理を説明し、実務でどこに効いているか話してください。",en:"Explain the Central Limit Theorem and where it matters in practice."},p:{ja:"定理の内容と、成り立たない/危うい場面（裾の重い分布、少サンプル）も含めてください。",en:"State the theorem and also where it fails or gets shaky (heavy tails, small samples)."},f:{ja:"定理の内容 → A/Bテストや区間推定での役割 → 破れる場面 → 対処（ブートストラップ、変換）。",en:"The theorem → its role in A/B testing and interval estimation → failure modes → remedies (bootstrap, transforms)."},a:{ja:"CLTは、独立同分布の確率変数の標本平均が、元の分布形によらずサンプルサイズが大きくなると正規分布に近づくという定理です。A/Bテストで売上のような歪んだ指標でも平均差にz検定が使えるのはこのおかげです。ただし、収益データのような裾の重い分布では収束が遅く、n=数千でも正規近似が危ういことがあります。外れ値1件が平均を支配するようなケースでは、ブートストラップで分布を直接確認する、中央値やwinsorized meanを使う、対数変換する、といった対処をします。「CLTがあるから大丈夫」と言う前に、指標の分布を実際に見る習慣が重要です。",en:"The CLT says the sample mean of i.i.d. variables approaches normality as n grows, regardless of the underlying distribution. It is why z-tests on mean differences work in A/B tests even for skewed metrics like revenue. But convergence is slow for heavy-tailed distributions — normal approximations can be shaky even at thousands of samples when one outlier dominates the mean. Remedies: bootstrap the sampling distribution directly, use medians or winsorized means, or log-transform. Before saying 'the CLT covers us,' actually look at the metric's distribution."},r:{ja:["定理を正確に述べた","実務での役割","破れる場面を指摘","対処法を提示"],en:["Stated the theorem correctly","Practical role","Where it breaks","Offered remedies"]}},
{c:"stats",t:{ja:"線形回帰の主要な仮定と、破れたときの診断・対処を説明してください。",en:"Explain the key assumptions of linear regression and how to diagnose and address violations."},p:{ja:"予測目的と推論（係数解釈）目的で、仮定の重要度が変わる点にも触れてください。",en:"Note how the importance of each assumption differs between prediction and inference (coefficient interpretation)."},f:{ja:"線形性/独立性/等分散性/正規性 → 残差診断 → 対処 → 予測vs推論での重要度差。",en:"Linearity/independence/homoscedasticity/normality → residual diagnostics → remedies → prediction vs inference."},a:{ja:"主要な仮定は、関係の線形性、誤差の独立性、等分散性、（推論には）誤差の正規性、そして多重共線性がないことです。診断は残差プロットが基本で、パターンがあれば線形性違反、扇形なら不等分散、時系列の自己相関はDurbin-Watson等で見ます。対処は変数変換・交互作用追加、頑健標準誤差、クラスタ標準誤差、GLSなどです。重要なのは目的による優先度の違いで、予測目的なら正規性はほぼ不要で線形性と汎化が主眼、係数を解釈して施策提言する推論目的なら、独立性・標準誤差の妥当性、そして省略変数バイアスが最重要になります。後者は統計というより因果推論の問題です。",en:"Key assumptions: linearity, independent errors, homoscedasticity, normality of errors (for inference), and no severe multicollinearity. Diagnose mainly with residual plots — patterns signal nonlinearity, funnels signal heteroscedasticity; use Durbin-Watson for autocorrelation. Remedies include transformations, interactions, robust or clustered standard errors, and GLS. Critically, priorities depend on the goal: for prediction, normality barely matters and generalization dominates; for inference driving recommendations, valid standard errors and — above all — omitted variable bias matter most, which is really a causal question."},r:{ja:["主要仮定を列挙","残差診断の方法","対処法を提示","予測/推論での違い"],en:["Listed key assumptions","Residual diagnostics","Offered remedies","Prediction vs inference distinction"]}},
{c:"stats",t:{ja:"多重共線性は何が問題で、どう検出・対処しますか。",en:"Why is multicollinearity a problem, and how do you detect and address it?"},p:{ja:"予測にはあまり害がなく係数解釈に害がある、という非対称性を明確にしてください。",en:"Make clear the asymmetry: it barely hurts prediction but badly hurts coefficient interpretation."},f:{ja:"係数の不安定化 → VIF/相関で検出 → 対処（削除・統合・正則化） → 予測vs解釈の非対称性。",en:"Coefficient instability → detect via VIF/correlations → remedies (drop, combine, regularize) → prediction vs interpretation asymmetry."},a:{ja:"説明変数同士が強く相関すると、個々の係数の推定が不安定になり、標準誤差が膨らみ、符号が直感と逆転することもあります。検出はVIF（目安10以上、厳しめなら5）や相関行列です。重要なのは、多重共線性は予測精度をほとんど損なわない一方、「この変数を1単位動かすと」という係数解釈を壊す点です。クライアントに係数で施策を語る場面では致命的なので、変数の削除・合成（主成分やインデックス化）、リッジ回帰、そもそもドメイン知識でどちらが原因側かを整理する、といった対処をします。逆に予測だけが目的なら過度に気にしないと割り切ります。",en:"When predictors are highly correlated, individual coefficient estimates become unstable, standard errors inflate, and signs can flip against intuition. Detect with VIF (rule of thumb >10, stricter >5) or correlation matrices. The key point is the asymmetry: multicollinearity barely hurts predictive accuracy, but it wrecks the 'move this variable by one unit' interpretation. That is fatal when clients act on coefficients, so drop or combine variables (PCA, indices), use ridge regression, or use domain knowledge to sort out which variable is causally upstream. If prediction is the only goal, deliberately worry less."},r:{ja:["問題の本質を説明","VIF等の検出法","対処法を複数","予測/解釈の非対称性"],en:["Explained the core problem","Detection via VIF etc.","Multiple remedies","Prediction vs interpretation asymmetry"]}},
{c:"stats",t:{ja:"シンプソンのパラドックスを例で説明し、実務での防ぎ方を話してください。",en:"Explain Simpson's paradox with an example and how to guard against it in practice."},p:{ja:"集計の向きが逆転する具体例と、どの層別が「正しい」かを決める基準に触れてください。",en:"Give a concrete example of aggregation reversal and the criterion for deciding which stratification is 'correct'."},f:{ja:"具体例 → 交絡変数の混入 → どちらの集計を信じるかは因果構造次第 → 実務チェック。",en:"Concrete example → confounder at work → which aggregation to trust depends on causal structure → practical checks."},a:{ja:"全体では治療Aの方が治癒率が高いのに、重症・軽症に分けるとどちらの層でもBが上回る、というように集計方向で結論が逆転する現象です。原因は層（重症度）が治療選択と結果の両方に影響する交絡で、Aが軽症患者に多く割り当てられていた、という構造です。重要なのは「常に層別が正しい」わけではなく、どちらを信じるかは因果構造（その変数が交絡なのか、媒介なのか）で決まる点です。実務では、セグメント別とoverallの両方を必ず確認する、割当がランダムでないデータでは割当メカニズムを問う、DAGを描いて調整すべき変数を決める、という習慣で防ぎます。",en:"It is the reversal of a conclusion across aggregation levels: treatment A looks better overall, yet B wins within both severe and mild strata. The cause is confounding — severity influences both treatment assignment and outcome, e.g., A was given mostly to mild cases. Crucially, stratified views are not automatically correct: which one to trust depends on the causal structure (is the variable a confounder or a mediator?). In practice: always inspect both overall and segmented results, interrogate the assignment mechanism in observational data, and draw the DAG to decide what to adjust for."},r:{ja:["逆転の具体例","交絡の構造を説明","層別が常に正しいわけではない","実務での防止習慣"],en:["Concrete reversal example","Explained the confounding structure","Stratification not always right","Practical prevention habits"]}},
{c:"stats",t:{ja:"生存時間分析はどんな場面で使い、通常の回帰と何が違いますか。",en:"When do you use survival analysis, and how does it differ from ordinary regression?"},p:{ja:"打ち切り（censoring）の概念と、解約・故障予測での使いどころを含めてください。",en:"Cover censoring and applications to churn and failure prediction."},f:{ja:"打ち切りデータの問題 → ハザード/生存関数 → Kaplan-Meier/Cox → 解約・故障での利点。",en:"The censoring problem → hazard/survival functions → Kaplan-Meier/Cox → advantages for churn and failures."},a:{ja:"「イベントまでの時間」を扱う手法で、観察終了時点でまだイベントが起きていない打ち切りデータを正しく活かせるのが本質です。解約していない現役顧客を除外しても0埋めしてもバイアスになりますが、生存時間分析は「少なくともT日は生存した」という情報として使います。Kaplan-Meierで生存曲線を推定し、Cox比例ハザードで共変量の効果を解釈し、機械学習系なら勾配ブースティングのサバイバル版やDeepSurvもあります。解約・機器故障・債務不履行など「いつ起きるか」が問いになる場面では、二値分類より情報量が多く、介入タイミングの設計に直結します。",en:"Survival analysis models time-to-event data, and its essence is correctly using censored observations — subjects who have not yet had the event by the end of observation. Excluding active customers or zero-filling them biases churn analysis; survival methods use 'survived at least T days' as information. Estimate curves with Kaplan-Meier, interpret covariates with Cox proportional hazards, or use ML variants (gradient-boosted survival, DeepSurv). For churn, equipment failure, or default — where 'when' matters — it is richer than binary classification and directly informs intervention timing."},r:{ja:["打ち切りの概念を説明","主要手法を提示","二値分類との違い","業務での使いどころ"],en:["Explained censoring","Named the main methods","Contrast with binary classification","Business applications"]}},
{c:"stats",t:{ja:"ブートストラップとは何で、いつ使いますか。",en:"What is the bootstrap, and when do you use it?"},p:{ja:"解析的に標準誤差が出しにくい統計量の例と、失敗するケースにも触れてください。",en:"Give examples of statistics with intractable standard errors, and cases where the bootstrap fails."},f:{ja:"復元抽出による再標本化 → 任意の統計量の不確実性 → 実務例 → 失敗するケース。",en:"Resampling with replacement → uncertainty of arbitrary statistics → practical examples → failure cases."},a:{ja:"ブートストラップは、観測データから復元抽出で疑似標本を大量に作り、統計量の分布を経験的に推定する方法です。中央値、分位点、比率の比、モデル性能指標（AUCの信頼区間）など、解析的に標準誤差が出しにくい統計量に威力を発揮します。分布の仮定がほぼ不要で、クライアント報告の「この数字はどれくらい確かか」に汎用的に答えられます。ただし万能ではなく、時系列の依存構造（ブロックブートストラップが必要）、最大値のような極値統計、標本サイズが極端に小さい場合には失敗します。A/Bテストの複雑な指標（セッション単位とユーザー単位が混ざるratio metrics）でも実務でよく使います。",en:"The bootstrap creates many pseudo-samples by resampling with replacement and empirically estimates a statistic's sampling distribution. It shines for statistics with intractable standard errors: medians, quantiles, ratios, model metrics like an AUC confidence interval. Nearly assumption-free, it is a general-purpose answer to 'how certain is this number?'. It fails, though, for dependent data like time series (block bootstrap needed), extreme-value statistics like maxima, and very small samples. It is also the practical workhorse for ratio metrics in A/B tests where session- and user-level units mix."},r:{ja:["仕組みを説明","有効な統計量の例","仮定の少なさに言及","失敗ケースを指摘"],en:["Explained the mechanism","Examples of suitable statistics","Noted minimal assumptions","Pointed out failure cases"]}},
{c:"stats",t:{ja:"外れ値をどう検出し、削除すべきかをどう判断しますか。",en:"How do you detect outliers, and how do you decide whether to remove them?"},p:{ja:"「外れ値＝削除」ではない判断基準と、頑健な手法の選択肢を含めてください。",en:"Include why outlier does not mean delete, and robust alternatives."},f:{ja:"検出（IQR/zスコア/Isolation Forest） → 原因の分類（エラーか真の現象か） → 対処の選択肢 → 感度分析。",en:"Detection (IQR/z-score/Isolation Forest) → classify the cause (error vs real phenomenon) → treatment options → sensitivity analysis."},a:{ja:"検出は単変量ならIQRや頑健zスコア（中央値とMAD）、多変量ならIsolation ForestやMahalanobis距離を使います。重要なのは検出後の判断で、まず「測定・入力エラーか、真の現象か」を業務側と確認します。エラーなら修正か削除、真の現象なら削除は情報の破壊です。不正検知ならば外れ値こそが標的ですし、収益分析ならヘビーユーザーの1件が結論を支配するのは事実として受け止めるべきかもしれません。対処は削除のほかwinsorizing、対数変換、頑健な損失（Huber）やモデル（quantile回帰）があり、いずれにせよ「外れ値を含む/除く両方の結果」を感度分析として示すのが誠実な報告です。",en:"Detect with IQR or robust z-scores (median/MAD) univariately, Isolation Forest or Mahalanobis distance multivariately. The real work is the decision afterward: first determine with the business whether it is a measurement error or a genuine phenomenon. Errors get fixed or removed; genuine extremes carry information — in fraud detection the outliers are the target, and in revenue analysis one whale may legitimately dominate. Options beyond deletion: winsorizing, log transforms, robust losses (Huber), quantile regression. Either way, honest reporting shows results with and without the outliers as a sensitivity analysis."},r:{ja:["検出手法を複数","エラーか現象かの切り分け","削除以外の選択肢","感度分析の提示"],en:["Multiple detection methods","Error vs phenomenon triage","Alternatives to deletion","Sensitivity analysis"]}},
{c:"stats",t:{ja:"検査精度99%の病気検査で陽性が出たとき、実際に病気である確率はどう考えますか。",en:"A disease test is 99% accurate and you test positive — how do you reason about the probability you actually have the disease?"},p:{ja:"ベイズの定理と基準率の無視（base rate neglect）を、面接で口頭計算できる形で説明してください。",en:"Explain Bayes' theorem and base rate neglect in a form you can compute aloud in an interview."},f:{ja:"事前確率（有病率）の確認 → 自然頻度で口頭計算 → 事後確率 → 実務への含意（不正検知等）。",en:"Ask for the prior (prevalence) → compute aloud with natural frequencies → posterior → practical implications (e.g., fraud)."},a:{ja:"鍵は有病率です。有病率0.1%なら、10万人中、病気は100人でうち99人が正しく陽性、健康な99,900人のうち約1%の999人が偽陽性。陽性者約1,098人のうち本当に病気なのは99人、つまり約9%に過ぎません。検査精度99%でも事後確率が低いのは、事前確率が極めて低いためです。この構造は不正検知や異常検知アラートと同じで、稀な事象に対する高精度モデルでもアラートの大半が偽陽性になり得る、というPrecisionの直感につながります。自然頻度（人数）で語ると非専門家にも伝わります。",en:"The key is prevalence. At 0.1% prevalence, out of 100,000 people, 100 are sick and 99 test true positive; of the 99,900 healthy, about 1% — 999 — test false positive. So of roughly 1,098 positives, only 99 are truly sick: about 9%. Even a 99% accurate test yields a low posterior because the prior is tiny. The same structure explains fraud and anomaly detection: with rare events, most alerts from even accurate models can be false positives — the precision intuition. Speaking in natural frequencies (counts of people) makes this land with non-experts."},r:{ja:["有病率を最初に問うた","自然頻度で計算","事後確率を正しく導出","業務への一般化"],en:["Asked for prevalence first","Computed with natural frequencies","Correct posterior","Generalized to business"]}},
{c:"stats",t:{ja:"「相関係数が0.8だから強い関係がある」という報告の何を確認しますか。",en:"A report claims 'correlation of 0.8, so a strong relationship.' What do you check?"},p:{ja:"相関の落とし穴（非線形、外れ値、範囲制限、疑似相関）を体系的に挙げてください。",en:"Systematically list correlation pitfalls: nonlinearity, outliers, range restriction, spurious correlation."},f:{ja:"散布図を見る → 外れ値/非線形 → 集計単位・範囲制限 → 交絡/時間トレンド → 因果ではない。",en:"Look at the scatterplot → outliers/nonlinearity → aggregation level and range restriction → confounding/time trends → not causation."},a:{ja:"まず散布図を見ます。Anscombeの例の通り、同じ相関係数でも実態は全く異なり得ます。確認点は、①外れ値1点が作った相関ではないか、②非線形関係を見逃していないか（Pearsonは線形のみ、Spearmanで補完）、③集計データの相関か個人レベルか（生態学的誤謬）、④範囲制限で相関が薄まって/濃くなっていないか、⑤両変数が時間トレンドを持つだけの疑似相関ではないか、⑥交絡変数の存在。そして最後に、相関が本物でも因果ではないため、意思決定に使うなら因果構造の検討が別途必要と報告します。",en:"First, look at the scatterplot — Anscombe's quartet shows identical correlations with wildly different realities. Check: (1) is one outlier manufacturing the correlation; (2) is the relationship nonlinear (Pearson captures only linear; complement with Spearman); (3) is it aggregate-level correlation being read as individual-level (ecological fallacy); (4) has range restriction inflated or deflated it; (5) is it spurious — two variables sharing a time trend; (6) confounders. Finally, even a genuine correlation is not causation, so decisions require separate causal reasoning."},r:{ja:["散布図の確認を最初に","落とし穴を体系的に列挙","集計単位/範囲制限に言及","因果との区別"],en:["Scatterplot first","Systematic pitfall list","Aggregation/range restriction","Separated from causation"]}},
{c:"eval",t:{ja:"PrecisionとRecallのどちらを優先しますか。",en:"Precision or recall — which do you prioritize?"},p:{ja:"不正検知、医療、解約施策などで判断が変わる理由を説明してください。",en:"Explain how the answer changes across fraud detection, healthcare, and churn interventions."},f:{ja:"FP/FNコスト、介入容量、期待損失、閾値最適化。",en:"FP/FN costs, intervention capacity, expected loss, threshold optimization."},a:{ja:"優先順位は誤分類コストと業務制約で決めます。不正レビューの人員が限られるならPrecision@K、見逃しが高コストならRecallも重視します。最終的には確率をcalibrateし、閾値別の期待利益/損失で決め、A/Bテストで実効KPIを確認します。「どちらか」ではなく、業務の意思決定関数に合わせて閾値を連続的に設計する、と答えるのがシニアの回答です。",en:"The priority follows misclassification costs and operational constraints. With limited fraud-review capacity, optimize Precision@K; when misses are costly, weight recall. Ultimately, calibrate probabilities, choose thresholds by expected profit/loss per threshold, and confirm the real KPI in an A/B test. The senior answer is not 'either/or' but designing the threshold continuously against the business decision function."},r:{ja:["FP/FNコストで判断","業務容量に触れた","閾値/期待値に触れた","実験で検証"],en:["Judged by FP/FN costs","Mentioned operational capacity","Thresholds / expected value","Validated by experiment"]}},
{c:"eval",t:{ja:"時系列データでランダム分割してはいけないのはなぜですか。",en:"Why must you not randomly split time-series data?"},p:{ja:"需要予測や故障予測を例に説明してください。",en:"Explain using demand forecasting or failure prediction as examples."},f:{ja:"未来情報、自己相関、運用時点再現、rolling/blocked split。",en:"Future information, autocorrelation, reproducing the operational time point, rolling/blocked splits."},a:{ja:"ランダム分割は未来の季節性、価格、故障直前パターンを学習側へ混ぜ、実運用より楽な評価になります。時系列では予測時点で入手可能な情報だけを使い、過去で学習して未来で検証するrolling/blocked splitにします。SKUや設備単位のリークもGroup分割で防ぎます。特徴量生成（移動平均等）も分割前に全期間で計算するとリークするため、パイプライン全体を時点整合させます。",en:"Random splits mix future seasonality, prices, and pre-failure patterns into training, making evaluation easier than reality. Use only information available at prediction time: train on the past, validate on the future with rolling/blocked splits. Prevent SKU- or equipment-level leakage with grouped splits. Feature engineering (e.g., moving averages) computed over the full period before splitting also leaks, so the entire pipeline must be time-consistent."},r:{ja:["未来情報リークを説明","運用時点を再現","適切な分割方法","グループリークに触れた"],en:["Explained future-information leakage","Reproduced the operational time point","Correct splitting methods","Mentioned group leakage"]}},
{c:"eval",t:{ja:"ROC-AUCとPR-AUCの違いと使い分けを説明してください。",en:"Explain ROC-AUC vs PR-AUC and when to use each."},p:{ja:"不均衡データでROC-AUCが楽観的に見える理由を含めてください。",en:"Include why ROC-AUC looks optimistic on imbalanced data."},f:{ja:"軸の違い → 不均衡でのFPRの鈍感さ → PR-AUCが陽性側に焦点 → ベースラインの違い → 使い分け。",en:"Different axes → FPR insensitivity under imbalance → PR-AUC focuses on positives → different baselines → selection rule."},a:{ja:"ROCはTPR対FPR、PRはPrecision対Recallを描きます。陰性が圧倒的に多い不均衡データでは、偽陽性が大量に増えてもFPRの分母（全陰性数）が巨大なためROC曲線はほとんど動かず、AUC0.95でもアラートの大半が偽陽性ということが起きます。PR-AUCはPrecisionを直接見るため、陽性クラスの検出品質に敏感で、不正検知や希少疾患のような場面で実態を映します。またROC-AUCのランダム基準は常に0.5ですが、PR-AUCの基準は陽性率そのものなので、比較時は基準値を添えます。ランキング能力全般の評価はROC、稀な陽性を精度良く見つける業務ではPR、と使い分けます。",en:"ROC plots TPR vs FPR; PR plots precision vs recall. On heavily imbalanced data, even a flood of false positives barely moves FPR because its denominator (all negatives) is huge — so you can have AUC 0.95 while most alerts are false. PR-AUC watches precision directly, making it sensitive to positive-class quality, which matches fraud or rare-disease settings. Also, ROC's random baseline is always 0.5, while PR's baseline equals the positive rate, so quote the baseline when comparing. Use ROC for general ranking ability, PR when the job is finding rare positives precisely."},r:{ja:["軸の違いを説明","不均衡での楽観性の理由","ベースラインの違い","業務での使い分け"],en:["Explained the axes","Why ROC is optimistic under imbalance","Different baselines","Business-based selection"]}},
{c:"eval",t:{ja:"確率のキャリブレーションとは何で、なぜ重要ですか。",en:"What is probability calibration and why does it matter?"},p:{ja:"AUCが高くてもcalibrationが悪い場合に何が起きるか、業務例で説明してください。",en:"Explain, with a business example, what goes wrong when AUC is high but calibration is poor."},f:{ja:"定義（予測確率＝実際の頻度） → 判別と校正は別物 → 崩れる原因 → 診断（reliability curve） → 補正手法。",en:"Definition (predicted probability = observed frequency) → discrimination vs calibration → causes of miscalibration → diagnosis (reliability curves) → correction methods."},a:{ja:"calibrationは「0.7と予測した集団の実際の陽性率が70%になっているか」という性質です。AUCは順位付けの正しさしか測らないため、AUCが高くても確率が全体的に過大・過小ということは普通に起きます。期待損失計算、閾値の期待値設計、CLV×解約確率のような掛け算、価格・与信判断など、確率を「数値として」使う意思決定では校正不良が直接損失になります。崩れる原因はundersampling、class weight、boosting系の傾向などで、reliability curveとBrier scoreで診断し、Platt scaling（ロジスティック）やisotonic回帰をホールドアウトで学習して補正します。校正は判別性能とは独立にチェックすべき項目です。",en:"Calibration asks whether the group predicted at 0.7 actually turns positive 70% of the time. AUC measures ranking only, so high AUC with systematically inflated or deflated probabilities is common. Whenever probabilities are used as numbers — expected-loss calculations, threshold economics, CLV times churn probability, pricing, credit — miscalibration translates directly into losses. Causes include undersampling, class weights, and boosting tendencies. Diagnose with reliability curves and Brier score; fix with Platt scaling or isotonic regression fit on held-out data. Check calibration independently of discrimination."},r:{ja:["定義を正しく説明","判別との独立性","業務での実害の例","診断と補正手法"],en:["Correct definition","Independence from discrimination","Concrete business harm","Diagnosis and correction methods"]}},
{c:"eval",t:{ja:"データリークの類型を挙げ、どう検出しますか。",en:"What types of data leakage exist, and how do you detect them?"},p:{ja:"「精度が高すぎる」以外の検出シグナルと、コンサル案件でリークが起きやすい箇所を含めてください。",en:"Include detection signals beyond 'accuracy too good' and where leakage typically creeps into consulting engagements."},f:{ja:"類型（ターゲット/時間/グループ/前処理） → 検出シグナル → 特徴量監査 → 本番シミュレーションでの確認。",en:"Types (target/temporal/group/preprocessing) → detection signals → feature audits → confirming via production simulation."},a:{ja:"主な類型は4つ。①ターゲットリーク: 結果の後に確定する情報（解約処理フラグ、請求後の項目）が特徴量に混入。②時間リーク: 未来の情報で過去を予測、全期間で計算した集約特徴量。③グループリーク: 同一顧客・設備が学習とテストに跨る。④前処理リーク: 全データでスケーリングやtarget encodingを計算。検出シグナルは、不自然に高い精度、特徴量重要度の1本異常な突出、本番投入後の急落です。実務では特徴量ごとに「予測時点で物理的に取得可能か」をデータ生成プロセスまで遡って監査し、最終確認として過去のある時点のデータだけで予測を再現するバックテストを行います。クライアントのDWHはETLのタイムスタンプが曖昧なことが多く、そこが最頻出の落とし穴です。",en:"Four main types: (1) target leakage — features finalized after the outcome (churn-processing flags, post-billing fields); (2) temporal leakage — future information or aggregates computed over the full period; (3) group leakage — the same customer or machine spanning train and test; (4) preprocessing leakage — scaling or target encoding fit on all data. Signals: implausibly high accuracy, one feature towering in importance, or a cliff after deployment. Audit each feature by tracing the data-generating process — was it physically available at prediction time? — and backtest by reproducing predictions using only data as of a past date. Client warehouses with fuzzy ETL timestamps are the most common trap."},r:{ja:["類型を体系的に列挙","検出シグナルを複数","データ生成過程まで遡る監査","バックテストでの確認"],en:["Systematic typology","Multiple detection signals","Audit tracing data generation","Backtest confirmation"]}},
{c:"eval",t:{ja:"交差検証の設計をどう決めますか（k-fold、stratified、nested等）。",en:"How do you design cross-validation (k-fold, stratified, nested, etc.)?"},p:{ja:"「とりあえず5-fold」ではなく、データ構造と目的から設計する考え方を示してください。",en:"Show how the design follows from data structure and purpose, not a default 5-fold."},f:{ja:"本番の予測単位を再現 → 層化/グループ/時系列の選択 → nested CVの使いどころ → foldの分散も報告。",en:"Reproduce the production prediction unit → choose stratified/grouped/temporal → when nested CV → report fold variance."},a:{ja:"原則は「CVの各foldが本番の予測状況を小さく再現していること」です。そこから、不均衡分類ならstratified、同一顧客・患者・店舗の複数行があるならGroupKFold（本番は新規顧客への予測なのか同一顧客の将来なのかで決める）、時間依存があれば時系列分割、と決まります。ハイパーパラメータ探索と汎化性能推定を同じCVでやると楽観バイアスが出るため、モデル選択の評価が重要な場面ではnested CVを使います。kは5〜10が標準で、報告時はfold間の分散も添えて「性能差がfoldのばらつきに埋もれていないか」を示します。最後にCVとは別のホールドアウトを最終確認に残すのが安全です。",en:"The principle: each fold should be a miniature of the production prediction scenario. From there — stratify for imbalance; GroupKFold when multiple rows share a customer/patient/store (decide by whether production predicts new customers or future behavior of known ones); temporal splits when time matters. Tuning and estimating generalization on the same CV is optimistically biased, so use nested CV when model-selection evidence matters. k of 5-10 is standard; report between-fold variance so differences are not drowned in fold noise. Keep a final untouched holdout as the last checkpoint."},r:{ja:["本番再現の原則","データ構造別の選択","nested CVの理由","fold分散の報告"],en:["Production-mirroring principle","Choice by data structure","Rationale for nested CV","Reporting fold variance"]}},
{c:"eval",t:{ja:"オフライン評価は良いのに本番KPIが改善しない場合、何を疑いますか。",en:"Offline metrics improved but the production KPI did not — what do you suspect?"},p:{ja:"モデル劣化以外の原因も含め、切り分けの順序を示してください。",en:"Include causes beyond model degradation and give a triage order."},f:{ja:"オフライン指標とKPIの因果ギャップ → 分布シフト/リーク → 介入側の問題（実行率・UX） → フィードバックループ → 実験で検証。",en:"Causal gap between offline metric and KPI → shift/leakage → intervention-side issues (execution, UX) → feedback loops → verify by experiment."},a:{ja:"まず「オフライン指標の改善が本番KPIを動かす」という仮定自体を疑います。AUC改善が利益に繋がる保証はなく、指標と意思決定が繋がっていなければ何も起きません。次に技術面で、学習データと本番の分布差、リークによる過大評価、特徴量のサービング時の欠損を確認します。第三に介入側で、スコアは出ているが現場が使っていない、オファーが実行されていない、UXが変わって行動が変化した、を見ます。第四に、予測に基づく介入が結果自体を変えるフィードバックループ（解約予測→引き留め→ラベル汚染）の可能性。切り分けの最終手段はランダム化で、モデルあり/なしを実験比較すれば、モデルの寄与と実行の問題を分離できます。",en:"First question the assumption that the offline metric moves the KPI at all — better AUC does not guarantee profit if the metric is not wired to a decision. Second, check the technical layer: train/production distribution gaps, leakage inflating offline results, features missing at serving time. Third, the intervention layer: scores generated but unused by the field, offers not executed, UX changes shifting behavior. Fourth, feedback loops where acting on predictions contaminates labels (churn prediction → retention action → polluted outcomes). The definitive triage is randomization: comparing model-on vs model-off separates the model's contribution from execution problems."},r:{ja:["指標とKPIの接続自体を疑う","技術的原因の確認","実行・現場側の確認","実験による切り分け"],en:["Questioned metric-KPI link itself","Checked technical causes","Checked execution side","Triaged via experiment"]}},
{c:"eval",t:{ja:"レコメンドやランキングモデルの評価をどう設計しますか。",en:"How do you design evaluation for recommendation or ranking models?"},p:{ja:"NDCG等のオフライン指標の限界と、オンライン評価・バイアスの問題を含めてください。",en:"Cover offline metrics like NDCG, their limits, and online evaluation plus bias issues."},f:{ja:"オフライン指標（NDCG/MAP/Recall@K） → ログの選択バイアス → 多様性・カバレッジ → オンラインA/B → 長期指標。",en:"Offline metrics (NDCG/MAP/Recall@K) → selection bias in logs → diversity/coverage → online A/B → long-term metrics."},a:{ja:"オフラインではNDCG（順位を減衰重み付け）、MAP、Recall@Kで過去ログへの適合を測りますが、ログは既存モデルが見せたものしか含まない選択バイアスがあり、「過去の自分を模倣するモデル」が高評価になりがちです。off-policy評価やランダム露出データの確保で緩和します。また精度系だけでなく多様性、新規性、カタログカバレッジ、人気バイアスも測らないと、売れ筋ばかり薦めるモデルに収束します。最終判断はオンラインA/Bで、CTRのような近視眼的指標だけでなく、セッション継続、リピート率、長期エンゲージメントを見ます。CTR最適化がクリックベイト化を招くような指標ゲーミングにも注意します。",en:"Offline, use NDCG (rank-discounted gains), MAP, and Recall@K against logged interactions — but logs contain only what previous models exposed, a selection bias that rewards models imitating the past. Mitigate with off-policy evaluation or reserved random-exposure traffic. Beyond accuracy, measure diversity, novelty, catalog coverage, and popularity bias, or you converge on recommending bestsellers. The final verdict is an online A/B test, watching not just myopic CTR but session depth, repeat rates, and long-term engagement — mindful that optimizing CTR alone invites clickbait-style metric gaming."},r:{ja:["オフライン指標を説明","ログの選択バイアス","多様性等の副次指標","オンライン/長期指標への接続"],en:["Explained offline metrics","Selection bias in logs","Secondary metrics like diversity","Online / long-term metrics"]}},
{c:"eval",t:{ja:"回帰モデルの精度をクライアントにどう報告しますか。",en:"How do you report regression model accuracy to a client?"},p:{ja:"RMSE単体の報告がなぜ不親切か、意思決定に使える報告の形を説明してください。",en:"Explain why RMSE alone is unhelpful and what a decision-ready report looks like."},f:{ja:"ベースライン比較 → 業務単位への翻訳 → セグメント別誤差 → 予測区間 → 意思決定への含意。",en:"Baseline comparison → translate into business units → segment-level errors → prediction intervals → decision implications."},a:{ja:"「RMSE=120」だけでは判断できません。第一にベースライン（前年同週、単純移動平均）との比較で改善幅を示します。第二に誤差を業務単位に翻訳し、「発注単位で平均±8%、金額にして週あたり約X百万円の過剰在庫削減に相当」のように語ります。第三に全体平均は誤差の偏在を隠すため、カテゴリ別・店舗別・需要水準別に分解し、どこで外すかを明示します。第四に点予測だけでなく予測区間を示し、在庫や人員のバッファ設計に使える形にします。優れた報告は「モデルの精度」ではなく「この精度ならどの意思決定を自動化でき、どこに人の判断を残すべきか」を提示するものです。",en:"'RMSE = 120' supports no decision. First, compare against baselines (same week last year, naive moving average) to show the lift. Second, translate error into business units: 'about ±8% per order line, worth roughly X million yen per week in avoided overstock.' Third, averages hide where errors concentrate — decompose by category, store, and demand level and be explicit about where the model misses. Fourth, provide prediction intervals, not just points, so buffers for inventory or staffing can be designed. The best report states not 'model accuracy' but which decisions can now be automated and where human judgment should remain."},r:{ja:["ベースライン比較","業務単位への翻訳","セグメント分解","区間と意思決定への接続"],en:["Baseline comparison","Business-unit translation","Segment decomposition","Intervals and decision link"]}},
{c:"eval",t:{ja:"2つのモデルの性能差が「本物」かどうかをどう確認しますか。",en:"How do you confirm that a performance difference between two models is real?"},p:{ja:"1回のホールドアウト比較の危うさと、統計的・実務的な確認方法を説明してください。",en:"Explain the fragility of a single holdout comparison and statistical plus practical confirmation methods."},f:{ja:"単一分割の分散 → 繰り返しCV/シードの分散 → 対応のある検定/ブートストラップ → 実務的有意性 → セグメント別の逆転確認。",en:"Variance of a single split → repeated CV / seed variance → paired tests / bootstrap → practical significance → checking segment-level reversals."},a:{ja:"単一のホールドアウトでの0.5%の差は、分割の運やシードで簡単にひっくり返ります。まず繰り返しCVや複数シードで性能分布を出し、差がfold間分散に対して十分大きいかを見ます。統計的には同一foldでの対応を活かした比較や、テスト予測のブートストラップで差の信頼区間を出します。次に実務的有意性で、その差がビジネス価値（追加利益）と移行コスト（再実装、再学習、複雑性）に見合うかを問います。さらに全体では勝っていてもセグメント別に逆転していないか、推論コストや安定性が悪化していないかを確認します。「統計的に有意で、かつ移行コストを回収できる差か」が最終判断基準です。",en:"A 0.5% gap on one holdout flips easily with split luck or seeds. First, get a distribution of performance via repeated CV or multiple seeds and check the gap against fold variance. Statistically, use paired comparisons on shared folds or bootstrap the test predictions for a confidence interval on the difference. Then apply practical significance: does the gap justify the business value against migration costs — reimplementation, retraining, added complexity? Also check for segment-level reversals beneath the overall win, and for regressions in inference cost or stability. The final bar: statistically real and worth the switching cost."},r:{ja:["単一分割の危うさ","分散を伴う比較","統計的検定/ブートストラップ","実務的有意性と移行コスト"],en:["Fragility of one split","Comparison with variance","Tests / bootstrap","Practical significance vs switching cost"]}},
{c:"causal",t:{ja:"解約しそうな顧客にクーポンを送るだけではなぜ不十分ですか。",en:"Why is it not enough to just send coupons to customers likely to churn?"},p:{ja:"予測モデルと因果/upliftの違いを説明してください。",en:"Explain the difference between predictive modeling and causal/uplift modeling."},f:{ja:"高リスク≠介入効果、反実仮想、treatment/control、incremental lift。",en:"High risk ≠ treatment effect, counterfactuals, treatment/control, incremental lift."},a:{ja:"高い解約確率は「介入すれば救える」ことを意味しません。自然に残る顧客へ割引すると利益を毀損し、絶対に離脱する顧客へ送っても無駄です。必要なのは介入あり/なしの反実仮想差、つまりupliftです。RCTが理想で、難しければDiDやPSMなど仮定を明示した準実験で検証します。顧客は「説得可能」「無反応」「離脱確定」「介入逆効果」の4タイプに分かれ、狙うべきは説得可能層だけです。",en:"A high churn probability does not mean the customer can be saved by intervening. Discounting customers who would stay anyway destroys margin; targeting those who will leave regardless is wasted spend. What you need is the counterfactual difference between treated and untreated — uplift. An RCT is ideal; otherwise use quasi-experiments like DiD or PSM with explicit assumptions. Customers split into persuadables, sure things, lost causes, and sleeping dogs — only persuadables are worth targeting."},r:{ja:["予測と因果の違い","反実仮想を説明","利益毀損に触れた","検証方法を提示"],en:["Prediction vs causation","Explained counterfactuals","Touched margin destruction","Offered validation methods"]}},
{c:"causal",t:{ja:"A/Bテストを設計する際のステップを説明してください。",en:"Walk through the steps of designing an A/B test."},p:{ja:"指標選定からサンプルサイズ、ガードレール指標、停止基準まで通しで話してください。",en:"Cover metric selection through sample size, guardrail metrics, and stopping rules end to end."},f:{ja:"仮説と主要指標 → ランダム化単位 → MDEとサンプルサイズ → ガードレール → 期間/停止基準 → 分析計画の事前固定。",en:"Hypothesis and primary metric → randomization unit → MDE and sample size → guardrails → duration/stopping rules → pre-specified analysis plan."},a:{ja:"まず仮説を「何をどう変えるとどの指標がなぜ動くか」の形で明文化し、主要指標を1つに絞ります。ランダム化単位（ユーザー/店舗/地域）は介入の性質と干渉の有無で決めます。ビジネス的に意味のある最小効果（MDE）からサンプルサイズと実験期間を逆算し、曜日・給料日周期を跨ぐ長さにします。売上を上げても解約や苦情が増えては困るのでガードレール指標を設定します。実験開始後の覗き見による早期停止はp値を歪めるため、停止基準と分析計画（指標定義、除外規則、セグメント）を事前に固定します。開始後はSRM（群間サンプル比の崩れ）をまず確認します。",en:"First write the hypothesis explicitly — what change moves which metric and why — and commit to one primary metric. Choose the randomization unit (user/store/region) by the nature of the intervention and interference risks. Derive sample size and duration from a business-meaningful MDE, spanning weekly and payday cycles. Set guardrail metrics so a revenue win does not hide rising churn or complaints. Peeking-based early stops distort p-values, so pre-specify stopping rules and the analysis plan (metric definitions, exclusion rules, segments). Once live, check for sample ratio mismatch (SRM) first."},r:{ja:["仮説と主要指標の明確化","ランダム化単位の議論","MDEからの逆算","ガードレール/停止基準/SRM"],en:["Clear hypothesis and primary metric","Discussed randomization unit","Worked back from MDE","Guardrails / stopping rules / SRM"]}},
{c:"causal",t:{ja:"A/Bテストができない場合、どの準実験手法をどう選びますか。",en:"When you cannot run an A/B test, how do you choose among quasi-experimental methods?"},p:{ja:"DiD・PSM・IV・合成コントロール・RDDを、利用可能なデータ構造で使い分けてください。",en:"Map DiD, PSM, IV, synthetic control, and RDD to the data structures that enable them."},f:{ja:"なぜRCT不可かの確認 → データ構造で手法を選択 → 各手法の識別仮定 → 頑健性チェック → 主張の強さの限定。",en:"Confirm why RCT is infeasible → choose method by data structure → each method's identifying assumptions → robustness checks → qualify claim strength."},a:{ja:"選択はデータ構造で決まります。介入群と非介入群の前後データがあればDiD（平行トレンド仮定）。介入が少数ユニット（1地域だけ導入等）なら合成コントロール。処置が閾値で決まる（スコア○点以上に融資等）ならRDD。観測できる交絡だけで割当が説明できると信じられるならPSMや回帰調整ですが、この仮定は強い。割当に影響するが結果に直接影響しない変数があればIV。いずれも識別仮定は検証不能な部分を含むため、プラセボテストや事前トレンドの確認などの頑健性チェックを添え、「この仮定の下での推定」と主張の強さを限定して報告するのがシニアの作法です。",en:"The data structure picks the method. Pre/post data for treated and untreated groups → DiD (parallel trends). Treatment hitting only a few units (one region) → synthetic control. Assignment by a threshold (loans above a score cutoff) → RDD. If you can credibly claim observables explain assignment → PSM or regression adjustment, though that is a strong assumption. A variable that shifts assignment but not outcomes directly → IV. All identifying assumptions are partly untestable, so attach robustness checks — placebo tests, pre-trend inspection — and report estimates explicitly conditioned on their assumptions, qualifying how strong a causal claim you make."},r:{ja:["データ構造から手法選択","各手法の仮定を明示","頑健性チェック","主張の強さを限定"],en:["Method chosen from data structure","Stated each method's assumptions","Robustness checks","Qualified the causal claim"]}},
