<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2-5-1 トレーニング</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
            background-color: #f3f4f6;
        }
        .fade-in {
            animation: fadeIn 0.2s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }
        /* スクロールバーの非表示（見た目をスッキリさせるため） */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center py-8 px-4">

    <div class="max-w-md w-full bg-white rounded-2xl shadow-lg overflow-hidden flex flex-col">
        <!-- ヘッダー -->
        <div class="bg-indigo-600 p-4 text-center shrink-0">
            <h1 class="text-xl font-bold text-white tracking-wider">2-5-1 TRAINING</h1>
            <p class="text-indigo-200 text-xs mt-1">スッと弾けるまで繰り返そう</p>
        </div>

        <!-- メイン画面（問題・解答エリア） -->
        <div class="p-8 flex flex-col items-center min-h-[250px] justify-center text-center fade-in shrink-0" id="display-area">
            
            <!-- 問題表示時 -->
            <div id="question-container" class="w-full">
                <p class="text-gray-500 text-sm font-semibold mb-2">Key of</p>
                <div id="key-display" class="text-6xl font-extrabold text-gray-800 mb-4">C</div>
            </div>

            <!-- 解答表示時（初期は非表示） -->
            <div id="answer-container" class="w-full hidden">
                <p class="text-gray-500 text-sm font-semibold mb-2">Key of <span id="answer-key">C</span></p>
                <div class="flex flex-col gap-3 mt-4">
                    <div class="bg-indigo-50 rounded-lg py-3 px-4 border border-indigo-100 flex justify-between items-center">
                        <span class="text-indigo-400 font-bold text-sm w-8">II</span>
                        <span id="chord-ii" class="text-2xl font-bold text-gray-800">Dm7</span>
                        <span class="w-8"></span>
                    </div>
                    <div class="bg-indigo-50 rounded-lg py-3 px-4 border border-indigo-100 flex justify-between items-center">
                        <span class="text-indigo-400 font-bold text-sm w-8">V</span>
                        <span id="chord-v" class="text-2xl font-bold text-gray-800">G7</span>
                        <span class="w-8"></span>
                    </div>
                    <div class="bg-indigo-50 rounded-lg py-3 px-4 border border-indigo-100 flex justify-between items-center">
                        <span class="text-indigo-400 font-bold text-sm w-8">I</span>
                        <span id="chord-i" class="text-2xl font-bold text-gray-800">Cmaj7</span>
                        <span class="w-8"></span>
                    </div>
                </div>
            </div>
        </div>

        <!-- コントロールボタン -->
        <div class="p-6 bg-gray-50 border-t border-b border-gray-100 flex flex-col gap-3 shrink-0" id="controls">
            <!-- 状態1: 答えを見るボタン -->
            <button id="btn-show" class="w-full py-4 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl font-bold text-lg shadow-md transition-colors active:scale-95">
                正解を見る
            </button>

            <!-- 状態2: 次へ進む（自己評価）ボタン群 -->
            <div id="btn-next-group" class="w-full flex gap-3 hidden">
                <button id="btn-bad" class="flex-1 py-4 bg-orange-100 hover:bg-orange-200 text-orange-700 rounded-xl font-bold transition-colors active:scale-95 flex flex-col items-center justify-center leading-tight">
                    <span>もたついた</span>
                </button>
                <button id="btn-good" class="flex-1 py-4 bg-emerald-500 hover:bg-emerald-600 text-white rounded-xl font-bold transition-colors shadow-md active:scale-95 flex flex-col items-center justify-center leading-tight">
                    <span>スッと弾けた</span>
                </button>
            </div>
        </div>
        
        <!-- 学習成績リスト -->
        <div class="bg-white shrink-0">
            <div class="bg-gray-100 px-4 py-2 flex justify-between items-center">
                <h2 class="text-sm font-bold text-gray-600">学習成績</h2>
                <span class="text-xs text-gray-500">※均等に出題されます</span>
            </div>
            <!-- 高さが伸びすぎないようにスクロール領域を設定 -->
            <div class="overflow-y-auto no-scrollbar max-h-[300px]">
                <table class="w-full text-sm text-left">
                    <thead class="text-xs text-gray-400 uppercase bg-white sticky top-0 shadow-sm">
                        <tr>
                            <th class="px-4 py-2 font-medium">Key</th>
                            <th class="px-2 py-2 text-center font-medium">出題</th>
                            <th class="px-2 py-2 text-center font-medium">正解</th>
                            <th class="px-4 py-2 text-right font-medium">正解率</th>
                        </tr>
                    </thead>
                    <tbody id="stats-tbody" class="divide-y divide-gray-50">
                        <!-- JSで動的に生成されます -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // 12キーのデータ (出題数と正解数を記録するプロパティを追加)
        const keysData = [
            { name: 'C',  ii: 'Dm7',   v: 'G7',   i: 'Cmaj7',  presented: 0, correct: 0 },
            { name: 'F',  ii: 'Gm7',   v: 'C7',   i: 'Fmaj7',  presented: 0, correct: 0 },
            { name: 'B♭', ii: 'Cm7',   v: 'F7',   i: 'B♭maj7', presented: 0, correct: 0 },
            { name: 'E♭', ii: 'Fm7',   v: 'B♭7',  i: 'E♭maj7', presented: 0, correct: 0 },
            { name: 'A♭', ii: 'B♭m7',  v: 'E♭7',  i: 'A♭maj7', presented: 0, correct: 0 },
            { name: 'D♭', ii: 'E♭m7',  v: 'A♭7',  i: 'D♭maj7', presented: 0, correct: 0 },
            { name: 'G♭', ii: 'A♭m7',  v: 'D♭7',  i: 'G♭maj7', presented: 0, correct: 0 },
            { name: 'B',  ii: 'C#m7',  v: 'F#7',  i: 'Bmaj7',  presented: 0, correct: 0 },
            { name: 'E',  ii: 'F#m7',  v: 'B7',   i: 'Emaj7',  presented: 0, correct: 0 },
            { name: 'A',  ii: 'Bm7',   v: 'E7',   i: 'Amaj7',  presented: 0, correct: 0 },
            { name: 'D',  ii: 'Em7',   v: 'A7',   i: 'Dmaj7',  presented: 0, correct: 0 },
            { name: 'G',  ii: 'Am7',   v: 'D7',   i: 'Gmaj7',  presented: 0, correct: 0 }
        ];

        let currentKey = null;
        let lastKey = null; // 連続出題を防ぐため保持

        // DOM要素
        const displayArea = document.getElementById('display-area');
        const questionContainer = document.getElementById('question-container');
        const answerContainer = document.getElementById('answer-container');
        const keyDisplay = document.getElementById('key-display');
        const answerKey = document.getElementById('answer-key');
        const chordIi = document.getElementById('chord-ii');
        const chordV = document.getElementById('chord-v');
        const chordI = document.getElementById('chord-i');
        
        const btnShow = document.getElementById('btn-show');
        const btnNextGroup = document.getElementById('btn-next-group');
        const btnGood = document.getElementById('btn-good');
        const btnBad = document.getElementById('btn-bad');
        const statsTbody = document.getElementById('stats-tbody');

        // アニメーションをリセットするユーティリティ
        function triggerAnimation() {
            displayArea.classList.remove('fade-in');
            void displayArea.offsetWidth; // リフローを強制
            displayArea.classList.add('fade-in');
        }

        // 次の問題を選ぶアルゴリズム（★均等出題を保証するロジック）
        function pickNextKey() {
            // 1. 直前のキーを除外（連続出題の禁止）
            const availableKeys = keysData.filter(k => k.name !== (lastKey ? lastKey.name : null));
            
            // 2. 現在の「最小出題数」を調べる
            const minPresented = Math.min(...availableKeys.map(k => k.presented));
            
            // 3. 最小出題数のキーだけを抽出（これにより、全キーが1回ずつ出るまで次の周回に行かない）
            const candidates = availableKeys.filter(k => k.presented === minPresented);
            
            // 4. 候補の中からランダムに選択
            const randomIndex = Math.floor(Math.random() * candidates.length);
            return candidates[randomIndex];
        }

        // 成績リストの描画更新
        function renderStats() {
            statsTbody.innerHTML = '';
            
            // 元の配列の順序（五度圏など）を維持して表示
            keysData.forEach(k => {
                const tr = document.createElement('tr');
                
                // 正解率の計算
                let rateText = '-';
                let rateColorClass = 'text-gray-400';
                
                if (k.presented > 0) {
                    const rate = (k.correct / k.presented) * 100;
                    rateText = rate.toFixed(0) + '%';
                    
                    // 正解率に応じて色を変える視覚的フィードバック
                    if (rate === 100) rateColorClass = 'text-emerald-600 font-bold';
                    else if (rate >= 70) rateColorClass = 'text-indigo-600';
                    else if (rate < 50) rateColorClass = 'text-orange-600 font-bold';
                    else rateColorClass = 'text-gray-700';
                }

                // 現在出題中のKeyの行は背景色を少し変える（ハイライト）
                if (currentKey && k.name === currentKey.name) {
                    tr.classList.add('bg-indigo-50/50');
                }

                tr.innerHTML = `
                    <td class="px-4 py-2 font-bold text-gray-700">${k.name}</td>
                    <td class="px-2 py-2 text-center text-gray-600">${k.presented}</td>
                    <td class="px-2 py-2 text-center text-gray-600">${k.correct}</td>
                    <td class="px-4 py-2 text-right ${rateColorClass}">${rateText}</td>
                `;
                statsTbody.appendChild(tr);
            });
        }

        // 問題の表示
        function showQuestion() {
            currentKey = pickNextKey();
            lastKey = currentKey;

            keyDisplay.textContent = currentKey.name;
            
            // UIを問題表示状態に切り替え
            questionContainer.classList.remove('hidden');
            answerContainer.classList.add('hidden');
            btnShow.classList.remove('hidden');
            btnNextGroup.classList.add('hidden');
            
            triggerAnimation();
            renderStats(); // 出題タイミングでハイライトを更新
        }

        // 解答の表示
        function showAnswer() {
            answerKey.textContent = currentKey.name;
            chordIi.textContent = currentKey.ii;
            chordV.textContent = currentKey.v;
            chordI.textContent = currentKey.i;

            // UIを解答表示状態に切り替え
            questionContainer.classList.add('hidden');
            answerContainer.classList.remove('hidden');
            btnShow.classList.add('hidden');
            btnNextGroup.classList.remove('hidden');
            
            triggerAnimation();
        }

        // 結果の記録
        function recordResult(isSuccess) {
            currentKey.presented++;
            if (isSuccess) {
                currentKey.correct++;
            }
        }

        // イベントリスナー
        btnShow.addEventListener('click', showAnswer);

        btnGood.addEventListener('click', () => {
            recordResult(true);
            showQuestion();
        });

        btnBad.addEventListener('click', () => {
            recordResult(false);
            showQuestion();
        });

        // キーボード操作対応 (スペースキーで開く/スッと弾けた判定)
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault();
                if (!btnShow.classList.contains('hidden')) {
                    btnShow.click();
                } else {
                    btnGood.click(); // スペース連打の場合は「Good」扱いとする
                }
            }
        });

        // 初期化
        renderStats(); // 最初に出題数0のリストを描画
        showQuestion();

    </script>
</body>
</html>
