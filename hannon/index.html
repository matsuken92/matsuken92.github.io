<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ハノン フレーズ暗記 (全調対応)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans JP', sans-serif;
            background-color: #f3f4f6;
            touch-action: manipulation;
        }
        .note-card {
            transition: all 0.3s ease;
        }
        .fade-in {
            animation: fadeIn 0.3s ease-in;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .custom-checkbox:checked + div {
            background-color: #4f46e5;
            color: white;
            border-color: #4f46e5;
        }
        
        /* 変化記号の装飾スタイル */
        .acc-flat {
            border-bottom: 3px solid #9333ea; /* 紫の下線 */
            padding-bottom: 1px;
            color: #6b21a8; /* 文字色も少し紫に */
        }
        .acc-sharp {
            border-top: 3px solid #2563eb; /* 青の上線 */
            padding-top: 1px;
            color: #1e40af; /* 文字色も少し青に */
            display: inline-block; /* border-topを綺麗に出すため */
            line-height: 1.2;
        }
        
        /* セレクトボックスのスタイル */
        select {
            background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 20 20'%3e%3cpath stroke='%236b7280' stroke-linecap='round' stroke-linejoin='round' stroke-width='1.5' d='M6 8l4 4 4-4'/%3e%3c/svg%3e");
            background-position: right 0.5rem center;
            background-repeat: no-repeat;
            background-size: 1.5em 1.5em;
            padding-right: 2.5rem;
            -webkit-appearance: none;
            appearance: none;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center py-8 px-4 text-gray-800">

    <!-- ヘッダー -->
    <header class="mb-6 text-center">
        <h1 class="text-3xl font-bold text-indigo-700 mb-2">🎹 ハノン暗記クイズ</h1>
        <p class="text-sm text-gray-600">全12キー対応版</p>
    </header>

    <div class="w-full max-w-lg bg-white rounded-xl shadow-lg p-6 mb-6">
        
        <!-- 共通設定エリア -->
        <div class="mb-6 border-b border-gray-100 pb-4">
            <h2 class="text-xs font-bold text-gray-400 uppercase tracking-wide mb-2">共通設定</h2>
            
            <!-- キー選択 (新規追加) -->
            <div class="mb-4">
                <label class="block text-xs font-bold text-gray-500 mb-1">Key (調)</label>
                <select id="key-select" class="w-full bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-indigo-500 focus:border-indigo-500 block p-2.5 font-bold">
                    <option value="C" selected>C (ハ長調)</option>
                    <option value="Db">D♭ (変ニ長調)</option>
                    <option value="D">D (ニ長調)</option>
                    <option value="Eb">E♭ (変ホ長調)</option>
                    <option value="E">E (ホ長調)</option>
                    <option value="F">F (ヘ長調)</option>
                    <option value="Gb">G♭ / F♯ (変ト長調)</option>
                    <option value="G">G (ト長調)</option>
                    <option value="Ab">A♭ (変イ長調)</option>
                    <option value="A">A (イ長調)</option>
                    <option value="Bb">B♭ (変ロ長調)</option>
                    <option value="B">B (ロ長調)</option>
                </select>
            </div>

            <!-- 練習番号 -->
            <div class="flex gap-2 mb-3">
                <label class="flex-1 cursor-pointer">
                    <input type="radio" name="exercise" value="hanon1" class="peer sr-only">
                    <div class="text-center py-2 px-2 rounded-lg border border-gray-200 bg-gray-50 peer-checked:bg-indigo-600 peer-checked:text-white peer-checked:border-indigo-600 transition-colors text-sm font-bold">
                        ハノン1
                    </div>
                </label>
                <label class="flex-1 cursor-pointer">
                    <input type="radio" name="exercise" value="hanon2" class="peer sr-only" checked>
                    <div class="text-center py-2 px-2 rounded-lg border border-gray-200 bg-gray-50 peer-checked:bg-indigo-600 peer-checked:text-white peer-checked:border-indigo-600 transition-colors text-sm font-bold">
                        ハノン2
                    </div>
                </label>
            </div>

            <!-- パターン選択 -->
            <div class="flex gap-2">
                <label class="flex-1 cursor-pointer">
                    <input type="radio" name="direction" value="ascending" class="peer sr-only" checked>
                    <div class="text-center py-2 px-2 rounded-lg border border-gray-200 bg-gray-50 peer-checked:bg-indigo-600 peer-checked:text-white peer-checked:border-indigo-600 transition-colors text-xs sm:text-sm">
                        上昇のみ
                    </div>
                </label>
                <label class="flex-1 cursor-pointer">
                    <input type="radio" name="direction" value="descending" class="peer sr-only">
                    <div class="text-center py-2 px-2 rounded-lg border border-gray-200 bg-gray-50 peer-checked:bg-indigo-600 peer-checked:text-white peer-checked:border-indigo-600 transition-colors text-xs sm:text-sm">
                        下降のみ
                    </div>
                </label>
                <label class="flex-1 cursor-pointer">
                    <input type="radio" name="direction" value="both" class="peer sr-only">
                    <div class="text-center py-2 px-2 rounded-lg border border-gray-200 bg-gray-50 peer-checked:bg-indigo-600 peer-checked:text-white peer-checked:border-indigo-600 transition-colors text-xs sm:text-sm">
                        両方
                    </div>
                </label>
            </div>
        </div>

        <!-- モード切替タブ -->
        <div class="flex border-b border-gray-200 mb-6">
            <button id="tab-random" class="flex-1 py-2 text-sm font-bold text-indigo-600 border-b-2 border-indigo-600 focus:outline-none transition-colors">
                ランダム出題
            </button>
            <button id="tab-manual" class="flex-1 py-2 text-sm font-medium text-gray-500 hover:text-indigo-600 border-b-2 border-transparent hover:border-gray-300 focus:outline-none transition-colors">
                指定トレーニング
            </button>
        </div>

        <!-- タブコンテンツ: ランダム設定 -->
        <div id="panel-random" class="mb-6">
            <h2 class="text-sm font-bold text-gray-500 uppercase tracking-wide mb-3">出題パターン (第n音から開始)</h2>
            <div class="grid grid-cols-4 sm:grid-cols-7 gap-2 mb-4">
                <label class="cursor-pointer">
                    <input type="checkbox" name="notes" value="0" class="custom-checkbox sr-only" checked>
                    <div class="text-center py-2 rounded border border-gray-300 font-bold transition-colors text-sm">ド</div>
                </label>
                <label class="cursor-pointer">
                    <input type="checkbox" name="notes" value="1" class="custom-checkbox sr-only" checked>
                    <div class="text-center py-2 rounded border border-gray-300 font-bold transition-colors text-sm">レ</div>
                </label>
                <label class="cursor-pointer">
                    <input type="checkbox" name="notes" value="2" class="custom-checkbox sr-only" checked>
                    <div class="text-center py-2 rounded border border-gray-300 font-bold transition-colors text-sm">ミ</div>
                </label>
                <label class="cursor-pointer">
                    <input type="checkbox" name="notes" value="3" class="custom-checkbox sr-only">
                    <div class="text-center py-2 rounded border border-gray-300 font-bold transition-colors text-sm">ファ</div>
                </label>
                <label class="cursor-pointer">
                    <input type="checkbox" name="notes" value="4" class="custom-checkbox sr-only">
                    <div class="text-center py-2 rounded border border-gray-300 font-bold transition-colors text-sm">ソ</div>
                </label>
                <label class="cursor-pointer">
                    <input type="checkbox" name="notes" value="5" class="custom-checkbox sr-only">
                    <div class="text-center py-2 rounded border border-gray-300 font-bold transition-colors text-sm">ラ</div>
                </label>
                <label class="cursor-pointer">
                    <input type="checkbox" name="notes" value="6" class="custom-checkbox sr-only">
                    <div class="text-center py-2 rounded border border-gray-300 font-bold transition-colors text-sm">シ</div>
                </label>
            </div>
            
            <div class="text-xs text-gray-400 mb-2 flex items-center justify-between">
                <span>※全パターンが均等に出題されます</span>
                <span id="pool-status" class="bg-gray-100 px-2 py-1 rounded">残り: -</span>
            </div>

            <button id="apply-settings-btn" class="w-full bg-gray-800 hover:bg-gray-900 text-white font-bold py-3 px-6 rounded-lg shadow transition-transform active:scale-95 text-sm">
                ランダム設定反映・リセット
            </button>
        </div>

        <!-- タブコンテンツ: 指定トレーニング -->
        <div id="panel-manual" class="hidden mb-6">
            <div class="flex justify-between items-center mb-3">
                <h2 class="text-sm font-bold text-gray-500 uppercase tracking-wide">パターンを選んで出題</h2>
                <label class="inline-flex items-center cursor-pointer">
                    <input type="checkbox" id="instant-check" class="sr-only peer">
                    <div class="relative w-9 h-5 bg-gray-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full rtl:peer-checked:after:-translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:start-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-indigo-600"></div>
                    <span class="ms-2 text-xs font-bold text-gray-700">即時答え合わせ</span>
                </label>
            </div>
            
            <div class="grid grid-cols-4 sm:grid-cols-7 gap-2">
                <button onclick="manualQuestion(0)" class="bg-indigo-50 hover:bg-indigo-100 text-indigo-700 font-bold py-3 rounded border border-indigo-200 active:scale-95 transition-all">ド</button>
                <button onclick="manualQuestion(1)" class="bg-indigo-50 hover:bg-indigo-100 text-indigo-700 font-bold py-3 rounded border border-indigo-200 active:scale-95 transition-all">レ</button>
                <button onclick="manualQuestion(2)" class="bg-indigo-50 hover:bg-indigo-100 text-indigo-700 font-bold py-3 rounded border border-indigo-200 active:scale-95 transition-all">ミ</button>
                <button onclick="manualQuestion(3)" class="bg-indigo-50 hover:bg-indigo-100 text-indigo-700 font-bold py-3 rounded border border-indigo-200 active:scale-95 transition-all">ファ</button>
                <button onclick="manualQuestion(4)" class="bg-indigo-50 hover:bg-indigo-100 text-indigo-700 font-bold py-3 rounded border border-indigo-200 active:scale-95 transition-all">ソ</button>
                <button onclick="manualQuestion(5)" class="bg-indigo-50 hover:bg-indigo-100 text-indigo-700 font-bold py-3 rounded border border-indigo-200 active:scale-95 transition-all">ラ</button>
                <button onclick="manualQuestion(6)" class="bg-indigo-50 hover:bg-indigo-100 text-indigo-700 font-bold py-3 rounded border border-indigo-200 active:scale-95 transition-all">シ</button>
            </div>
            <p class="text-xs text-gray-400 mt-2 text-center">※ド=第1音、レ=第2音...として出題されます</p>
        </div>

        <!-- クイズエリア -->
        <div id="quiz-area" class="text-center relative min-h-[250px] flex flex-col justify-center">
            
            <!-- 問題表示 -->
            <div id="question-container">
                <div class="mb-2 space-x-1">
                    <span id="key-badge" class="inline-block px-3 py-1 rounded-full text-xs font-bold bg-purple-100 text-purple-700">
                        Key: C
                    </span>
                    <span id="exercise-badge" class="inline-block px-3 py-1 rounded-full text-xs font-bold bg-indigo-100 text-indigo-700">
                        ハノン2
                    </span>
                    <span id="direction-badge" class="inline-block px-3 py-1 rounded-full text-xs font-bold bg-gray-200 text-gray-700">
                        パターン
                    </span>
                </div>
                <div class="text-gray-500 text-sm mb-1">開始音</div>
                <div id="start-note" class="text-5xl sm:text-6xl font-black text-indigo-900 mb-6 min-h-[1.2em] flex items-center justify-center">?</div>
            </div>

            <!-- アクションボタン -->
            <button id="show-answer-btn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-4 px-6 rounded-lg shadow transition-transform active:scale-95 text-lg">
                正解を見る
            </button>

            <!-- 答え表示 (最初は非表示) -->
            <div id="answer-container" class="hidden mt-6 bg-indigo-50 p-4 sm:p-6 rounded-lg border-2 border-indigo-100 fade-in">
                <p class="text-xs text-indigo-500 font-bold mb-2 uppercase">Phrase</p>
                <div id="phrase-text" class="text-xl sm:text-2xl font-bold text-gray-800 leading-relaxed tracking-wider">
                    <!-- ここに答えが入る -->
                </div>
                
                <button id="next-btn" class="mt-6 w-full bg-white hover:bg-gray-50 text-indigo-600 border-2 border-indigo-600 font-bold py-3 px-6 rounded-lg transition-transform active:scale-95">
                    次の問題へ
                </button>

                <!-- 記号の凡例 (移動) -->
                <div class="mt-4 pt-4 border-t border-indigo-100 text-xs text-gray-500 flex items-center justify-center gap-4">
                    <span class="flex items-center"><span class="acc-flat font-bold mr-1">音</span> : ♭(フラット)</span>
                    <span class="flex items-center"><span class="acc-sharp font-bold mr-1">音</span> : ♯(シャープ)</span>
                </div>
            </div>

            <!-- エラーメッセージ用 -->
            <div id="error-message" class="hidden text-red-500 font-bold mt-4">
                少なくとも1つの音符を選択してください。
            </div>
        </div>
    </div>

    <footer class="text-gray-400 text-xs mt-auto mb-4">
        Hanon Exercise Quiz - Multi Key Support
    </footer>

    <script>
        // 音階定義（12キー）
        // notes: そのキーの [第1音, 第2音, ..., 第7音]
        // a: accidental (flat/sharp/null)
        const keys = {
            'C': { name: 'C', notes: [
                {t:'ド', a:null}, {t:'レ', a:null}, {t:'ミ', a:null}, {t:'ファ', a:null}, {t:'ソ', a:null}, {t:'ラ', a:null}, {t:'シ', a:null}
            ]},
            'Db': { name: 'D♭', notes: [
                {t:'レ', a:'flat'}, {t:'ミ', a:'flat'}, {t:'ファ', a:null}, {t:'ソ', a:'flat'}, {t:'ラ', a:'flat'}, {t:'シ', a:'flat'}, {t:'ド', a:null}
            ]},
            'D': { name: 'D', notes: [
                {t:'レ', a:null}, {t:'ミ', a:null}, {t:'ファ', a:'sharp'}, {t:'ソ', a:null}, {t:'ラ', a:null}, {t:'シ', a:null}, {t:'ド', a:'sharp'}
            ]},
            'Eb': { name: 'E♭', notes: [
                {t:'ミ', a:'flat'}, {t:'ファ', a:null}, {t:'ソ', a:null}, {t:'ラ', a:'flat'}, {t:'シ', a:'flat'}, {t:'ド', a:null}, {t:'レ', a:null}
            ]},
            'E': { name: 'E', notes: [
                {t:'ミ', a:null}, {t:'ファ', a:'sharp'}, {t:'ソ', a:'sharp'}, {t:'ラ', a:null}, {t:'シ', a:null}, {t:'ド', a:'sharp'}, {t:'レ', a:'sharp'}
            ]},
            'F': { name: 'F', notes: [
                {t:'ファ', a:null}, {t:'ソ', a:null}, {t:'ラ', a:null}, {t:'シ', a:'flat'}, {t:'ド', a:null}, {t:'レ', a:null}, {t:'ミ', a:null}
            ]},
            'Gb': { name: 'G♭', notes: [
                {t:'ソ', a:'flat'}, {t:'ラ', a:'flat'}, {t:'シ', a:'flat'}, {t:'ド', a:'flat'}, {t:'レ', a:'flat'}, {t:'ミ', a:'flat'}, {t:'ファ', a:null}
            ]},
            'G': { name: 'G', notes: [
                {t:'ソ', a:null}, {t:'ラ', a:null}, {t:'シ', a:null}, {t:'ド', a:null}, {t:'レ', a:null}, {t:'ミ', a:null}, {t:'ファ', a:'sharp'}
            ]},
            'Ab': { name: 'A♭', notes: [
                {t:'ラ', a:'flat'}, {t:'シ', a:'flat'}, {t:'ド', a:null}, {t:'レ', a:'flat'}, {t:'ミ', a:'flat'}, {t:'ファ', a:null}, {t:'ソ', a:null}
            ]},
            'A': { name: 'A', notes: [
                {t:'ラ', a:null}, {t:'シ', a:null}, {t:'ド', a:'sharp'}, {t:'レ', a:null}, {t:'ミ', a:null}, {t:'ファ', a:'sharp'}, {t:'ソ', a:'sharp'}
            ]},
            'Bb': { name: 'B♭', notes: [
                {t:'シ', a:'flat'}, {t:'ド', a:null}, {t:'レ', a:null}, {t:'ミ', a:'flat'}, {t:'ファ', a:null}, {t:'ソ', a:null}, {t:'ラ', a:null}
            ]},
            'B': { name: 'B', notes: [
                {t:'シ', a:null}, {t:'ド', a:'sharp'}, {t:'レ', a:'sharp'}, {t:'ミ', a:null}, {t:'ファ', a:'sharp'}, {t:'ソ', a:'sharp'}, {t:'ラ', a:'sharp'}
            ]}
        };

        // ハノンのパターン定義 (度数: 0=第1音, 1=第2音... 6=第7音)
        // 配列の値は、そのフレーズの相対的な動きを表す
        const patterns = {
            hanon1: {
                name: 'ハノン1',
                // 上昇: 1-3-4-5 6-5-4-3 (ドミファソ ラソファミ) -> Base=0, Index=[0, 2, 3, 4, 5, 4, 3, 2]
                asc: [0, 2, 3, 4, 5, 4, 3, 2],
                // 下降: 5-3-2-1 7-1-2-3 (ソミレド シドレミ) 
                // 開始音オフセット: +4 (ドに対してソ)
                // パターン: 開始音からの相対 [0, -2, -3, -4, -5, -4, -3, -2]
                desc: [0, -2, -3, -4, -5, -4, -3, -2],
                descOffset: 4
            },
            hanon2: {
                name: 'ハノン2',
                // 上昇: 1-3-6-5 4-5-4-3 (ドミラソ ファソファミ) -> Base=0, Index=[0, 2, 5, 4, 3, 4, 3, 2]
                asc: [0, 2, 5, 4, 3, 4, 3, 2],
                // 下降: 5-2-7-1 2-1-2-3 (ソレシド レドレミ)
                // 開始音オフセット: +4 (ドに対してソ)
                // パターン: 開始音からの相対 [0, -3, -5, -4, -3, -4, -3, -2]
                desc: [0, -3, -5, -4, -3, -4, -3, -2],
                descOffset: 4
            }
        };

        // DOM要素
        const keySelect = document.getElementById('key-select');
        const keyBadgeEl = document.getElementById('key-badge');
        const startNoteEl = document.getElementById('start-note');
        const directionBadgeEl = document.getElementById('direction-badge');
        const exerciseBadgeEl = document.getElementById('exercise-badge');
        const showAnswerBtn = document.getElementById('show-answer-btn');
        const nextBtn = document.getElementById('next-btn');
        const applySettingsBtn = document.getElementById('apply-settings-btn');
        const answerContainer = document.getElementById('answer-container');
        const phraseTextEl = document.getElementById('phrase-text');
        const questionContainer = document.getElementById('question-container');
        const errorMessageEl = document.getElementById('error-message');
        const poolStatusEl = document.getElementById('pool-status');
        const instantCheckEl = document.getElementById('instant-check');
        
        // タブ要素
        const tabRandom = document.getElementById('tab-random');
        const tabManual = document.getElementById('tab-manual');
        const panelRandom = document.getElementById('panel-random');
        const panelManual = document.getElementById('panel-manual');

        // 設定入力要素
        const exerciseRadios = document.getElementsByName('exercise');
        const directionRadios = document.getElementsByName('direction');
        const noteCheckboxes = document.getElementsByName('notes');

        // 状態管理
        let currentQuestion = null;
        let currentMode = 'random'; // 'random' or 'manual'
        let questionPool = []; 
        let lastSettingsJSON = ''; 

        // 初期化
        function init() {
            showAnswerBtn.addEventListener('click', showAnswer);
            nextBtn.addEventListener('click', handleNextQuestion);
            applySettingsBtn.addEventListener('click', forceResetRandom);
            
            // タブ切り替え
            tabRandom.addEventListener('click', () => switchMode('random'));
            tabManual.addEventListener('click', () => switchMode('manual'));

            // 設定変更監視
            const commonInputs = [...exerciseRadios, ...directionRadios, keySelect];
            commonInputs.forEach(input => {
                input.addEventListener('change', () => {
                    if (currentMode === 'random') {
                        forceResetRandom();
                    }
                    // manualモード時は何もしない
                });
            });

            // 初回ロード
            forceResetRandom();
        }

        // シャッフル
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        // HTML生成ヘルパー: 音符と装飾
        function getNoteHTML(keyKey, scaleIndex) {
            // scaleIndexは 0-6の範囲に正規化する
            // 負の値や7以上が来てもループするように
            const normalizedIndex = ((scaleIndex % 7) + 7) % 7;
            const noteData = keys[keyKey].notes[normalizedIndex];
            
            let html = noteData.t;
            if (noteData.a === 'flat') {
                html = `<span class="acc-flat">${html}</span>`;
            } else if (noteData.a === 'sharp') {
                html = `<span class="acc-sharp">${html}</span>`;
            }
            return html;
        }

        // 設定取得
        function getAllSettings() {
            const key = keySelect.value;
            let exercise = 'hanon2'; 
            for (const radio of exerciseRadios) {
                if (radio.checked) {
                    exercise = radio.value;
                    break;
                }
            }

            let direction = 'ascending';
            for (const radio of directionRadios) {
                if (radio.checked) {
                    direction = radio.value;
                    break;
                }
            }

            const selectedNotes = []; // ここにはインデックス(0-6)が入る
            for (const cb of noteCheckboxes) {
                if (cb.checked) {
                    selectedNotes.push(parseInt(cb.value));
                }
            }

            return { key, exercise, direction, selectedNotes };
        }

        // フレーズ生成ロジック
        function generatePhraseData(settings, noteIndex, type) {
            const exerciseData = patterns[settings.exercise];
            const patternArr = (type === 'ascending') ? exerciseData.asc : exerciseData.desc;
            
            // 開始音の決定
            // 上昇: 選択した音そのもの (noteIndex)
            // 下降: 選択した音 + オフセット (noteIndex + offset)
            let startIndex = noteIndex;
            if (type === 'descending') {
                startIndex = (noteIndex + exerciseData.descOffset) % 7;
            }

            // フレーズHTML配列の生成
            const phraseParts = patternArr.map(relative => {
                const targetIndex = startIndex + relative;
                return getNoteHTML(settings.key, targetIndex);
            });

            // 表示用に分割 (前半4音、後半4音)
            const firstHalf = phraseParts.slice(0, 4).join('');
            const secondHalf = phraseParts.slice(4).join('');

            return {
                exerciseName: exerciseData.name,
                keyName: keys[settings.key].name,
                keyKey: settings.key,
                type: type,
                startNoteHTML: getNoteHTML(settings.key, startIndex),
                phraseHTML: `<div class="flex flex-wrap justify-center items-center gap-2 sm:gap-3">
                                <span class="whitespace-nowrap font-bold text-lg sm:text-2xl">${firstHalf}</span>
                                <span class="text-indigo-400 font-bold">⇒</span>
                                <span class="whitespace-nowrap font-bold text-lg sm:text-2xl">${secondHalf}</span>
                            </div>`,
                label: type === 'ascending' ? '上昇パターン' : '下降パターン'
            };
        }

        // プール生成
        function createQuestionPool(settings) {
            let newPool = [];

            if (settings.direction === 'ascending' || settings.direction === 'both') {
                settings.selectedNotes.forEach(noteIdx => {
                    newPool.push(generatePhraseData(settings, noteIdx, 'ascending'));
                });
            }

            if (settings.direction === 'descending' || settings.direction === 'both') {
                settings.selectedNotes.forEach(noteIdx => {
                    newPool.push(generatePhraseData(settings, noteIdx, 'descending'));
                });
            }
            return newPool;
        }

        function handleNextQuestion() {
            generateRandomQuestion(false);
        }

        function forceResetRandom() {
            generateRandomQuestion(true);
        }

        // ランダム出題
        function generateRandomQuestion(forceReset = false) {
            const settings = getAllSettings();
            const currentSettingsJSON = JSON.stringify(settings);

            if (forceReset || currentSettingsJSON !== lastSettingsJSON) {
                questionPool = [];
                lastSettingsJSON = currentSettingsJSON;
            }

            if (settings.selectedNotes.length === 0) {
                errorMessageEl.classList.remove('hidden');
                questionContainer.classList.add('opacity-50');
                showAnswerBtn.disabled = true;
                poolStatusEl.textContent = "設定エラー";
                return;
            } else {
                errorMessageEl.classList.add('hidden');
                questionContainer.classList.remove('opacity-50');
                showAnswerBtn.disabled = false;
                showAnswerBtn.textContent = '正解を見る';
            }

            if (questionPool.length === 0) {
                questionPool = createQuestionPool(settings);
                shuffleArray(questionPool);
            }

            if (questionPool.length > 0) {
                currentQuestion = questionPool.pop();
                poolStatusEl.textContent = `プール残り: ${questionPool.length}`;
                renderQuestion();
            } else {
                errorMessageEl.textContent = "該当する問題がありません。";
                errorMessageEl.classList.remove('hidden');
            }
        }

        // 手動出題 (noteIndex: 0-6)
        window.manualQuestion = function(noteIndex) {
            const settings = getAllSettings();
            
            let targetDirection = settings.direction;
            if (settings.direction === 'both') {
                targetDirection = Math.random() < 0.5 ? 'ascending' : 'descending';
            }

            const questionData = generatePhraseData(settings, noteIndex, targetDirection);
            
            currentQuestion = questionData;
            showAnswerBtn.disabled = false;
            showAnswerBtn.textContent = '正解を見る';
            renderQuestion();

            if (instantCheckEl.checked) {
                showAnswer();
            }
        };

        // 描画
        function renderQuestion() {
            if (!currentQuestion) return;

            answerContainer.classList.add('hidden');
            showAnswerBtn.classList.remove('hidden');

            startNoteEl.innerHTML = currentQuestion.startNoteHTML;
            exerciseBadgeEl.textContent = currentQuestion.exerciseName;
            keyBadgeEl.textContent = `Key: ${currentQuestion.keyName}`;
            
            directionBadgeEl.textContent = currentQuestion.label;
            if (currentQuestion.type === 'ascending') {
                directionBadgeEl.className = 'inline-block px-3 py-1 rounded-full text-xs font-bold bg-blue-100 text-blue-700';
            } else {
                directionBadgeEl.className = 'inline-block px-3 py-1 rounded-full text-xs font-bold bg-orange-100 text-orange-700';
            }
        }

        // 正解表示
        function showAnswer() {
            if (!currentQuestion) return;

            phraseTextEl.innerHTML = currentQuestion.phraseHTML;

            showAnswerBtn.classList.add('hidden');
            answerContainer.classList.remove('hidden');
            
            if (currentMode === 'manual') {
                nextBtn.classList.add('hidden');
            } else {
                nextBtn.classList.remove('hidden');
            }
        }

        // モード切替
        function switchMode(mode) {
            currentMode = mode;
            if (mode === 'random') {
                tabRandom.classList.add('text-indigo-600', 'border-indigo-600', 'font-bold');
                tabRandom.classList.remove('text-gray-500', 'border-transparent', 'font-medium');
                tabManual.classList.remove('text-indigo-600', 'border-indigo-600', 'font-bold');
                tabManual.classList.add('text-gray-500', 'border-transparent', 'font-medium');
                
                panelRandom.classList.remove('hidden');
                panelManual.classList.add('hidden');
                forceResetRandom();
            } else {
                tabManual.classList.add('text-indigo-600', 'border-indigo-600', 'font-bold');
                tabManual.classList.remove('text-gray-500', 'border-transparent', 'font-medium');
                tabRandom.classList.remove('text-indigo-600', 'border-indigo-600', 'font-bold');
                tabRandom.classList.add('text-gray-500', 'border-transparent', 'font-medium');

                panelManual.classList.remove('hidden');
                panelRandom.classList.add('hidden');
                
                currentQuestion = null;
                startNoteEl.textContent = '-';
                answerContainer.classList.add('hidden');
                showAnswerBtn.classList.remove('hidden');
                showAnswerBtn.disabled = true;
                showAnswerBtn.textContent = '音を選んでください';
            }
        }

        init();

    </script>
</body>
</html>
