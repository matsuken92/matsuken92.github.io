<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ハノン フレーズ暗記</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans JP', sans-serif;
            background-color: #f3f4f6;
            touch-action: manipulation; /* スマホでの操作性向上 */
        }
        .note-card {
            transition: all 0.3s ease;
        }
        .fade-in {
            animation: fadeIn 0.3s ease-in;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        /* チェックボックスのカスタムスタイル */
        .custom-checkbox:checked + div {
            background-color: #4f46e5;
            color: white;
            border-color: #4f46e5;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center py-8 px-4 text-gray-800">

    <!-- ヘッダー -->
    <header class="mb-8 text-center">
        <h1 class="text-3xl font-bold text-indigo-700 mb-2">🎹 ハノン暗記クイズ</h1>
        <p class="text-sm text-gray-600">フレーズの最初の音から全体を思い出そう</p>
    </header>

    <div class="w-full max-w-lg bg-white rounded-xl shadow-lg p-6 mb-6">
        
        <!-- 共通設定エリア -->
        <div class="mb-6 border-b border-gray-100 pb-4">
            <h2 class="text-xs font-bold text-gray-400 uppercase tracking-wide mb-2">共通設定</h2>
            
            <!-- 練習番号 -->
            <div class="flex gap-2 mb-3">
                <label class="flex-1 cursor-pointer">
                    <input type="radio" name="exercise" value="hanon1" class="peer sr-only">
                    <div class="text-center py-2 px-2 rounded-lg border border-gray-200 bg-gray-50 peer-checked:bg-indigo-600 peer-checked:text-white peer-checked:border-indigo-600 transition-colors text-sm font-bold">
                        ハノン1
                    </div>
                </label>
                <label class="flex-1 cursor-pointer">
                    <input type="radio" name="exercise" value="hanon2" class="peer sr-only" checked>
                    <div class="text-center py-2 px-2 rounded-lg border border-gray-200 bg-gray-50 peer-checked:bg-indigo-600 peer-checked:text-white peer-checked:border-indigo-600 transition-colors text-sm font-bold">
                        ハノン2
                    </div>
                </label>
            </div>

            <!-- パターン選択 -->
            <div class="flex gap-2">
                <label class="flex-1 cursor-pointer">
                    <input type="radio" name="direction" value="ascending" class="peer sr-only" checked>
                    <div class="text-center py-2 px-2 rounded-lg border border-gray-200 bg-gray-50 peer-checked:bg-indigo-600 peer-checked:text-white peer-checked:border-indigo-600 transition-colors text-xs sm:text-sm">
                        上昇のみ
                    </div>
                </label>
                <label class="flex-1 cursor-pointer">
                    <input type="radio" name="direction" value="descending" class="peer sr-only">
                    <div class="text-center py-2 px-2 rounded-lg border border-gray-200 bg-gray-50 peer-checked:bg-indigo-600 peer-checked:text-white peer-checked:border-indigo-600 transition-colors text-xs sm:text-sm">
                        下降のみ
                    </div>
                </label>
                <label class="flex-1 cursor-pointer">
                    <input type="radio" name="direction" value="both" class="peer sr-only">
                    <div class="text-center py-2 px-2 rounded-lg border border-gray-200 bg-gray-50 peer-checked:bg-indigo-600 peer-checked:text-white peer-checked:border-indigo-600 transition-colors text-xs sm:text-sm">
                        両方
                    </div>
                </label>
            </div>
        </div>

        <!-- モード切替タブ -->
        <div class="flex border-b border-gray-200 mb-6">
            <button id="tab-random" class="flex-1 py-2 text-sm font-bold text-indigo-600 border-b-2 border-indigo-600 focus:outline-none transition-colors">
                ランダム出題
            </button>
            <button id="tab-manual" class="flex-1 py-2 text-sm font-medium text-gray-500 hover:text-indigo-600 border-b-2 border-transparent hover:border-gray-300 focus:outline-none transition-colors">
                指定トレーニング
            </button>
        </div>

        <!-- タブコンテンツ: ランダム設定 -->
        <div id="panel-random" class="mb-6">
            <h2 class="text-sm font-bold text-gray-500 uppercase tracking-wide mb-3">出題する音 (ランダム対象)</h2>
            <div class="grid grid-cols-4 sm:grid-cols-7 gap-2 mb-4">
                <label class="cursor-pointer">
                    <input type="checkbox" name="notes" value="ド" class="custom-checkbox sr-only" checked>
                    <div class="text-center py-2 rounded border border-gray-300 font-bold transition-colors text-sm">ド</div>
                </label>
                <label class="cursor-pointer">
                    <input type="checkbox" name="notes" value="レ" class="custom-checkbox sr-only" checked>
                    <div class="text-center py-2 rounded border border-gray-300 font-bold transition-colors text-sm">レ</div>
                </label>
                <label class="cursor-pointer">
                    <input type="checkbox" name="notes" value="ミ" class="custom-checkbox sr-only" checked>
                    <div class="text-center py-2 rounded border border-gray-300 font-bold transition-colors text-sm">ミ</div>
                </label>
                <label class="cursor-pointer">
                    <input type="checkbox" name="notes" value="ファ" class="custom-checkbox sr-only">
                    <div class="text-center py-2 rounded border border-gray-300 font-bold transition-colors text-sm">ファ</div>
                </label>
                <label class="cursor-pointer">
                    <input type="checkbox" name="notes" value="ソ" class="custom-checkbox sr-only">
                    <div class="text-center py-2 rounded border border-gray-300 font-bold transition-colors text-sm">ソ</div>
                </label>
                <label class="cursor-pointer">
                    <input type="checkbox" name="notes" value="ラ" class="custom-checkbox sr-only">
                    <div class="text-center py-2 rounded border border-gray-300 font-bold transition-colors text-sm">ラ</div>
                </label>
                <label class="cursor-pointer">
                    <input type="checkbox" name="notes" value="シ" class="custom-checkbox sr-only">
                    <div class="text-center py-2 rounded border border-gray-300 font-bold transition-colors text-sm">シ</div>
                </label>
            </div>
            <button id="apply-settings-btn" class="w-full bg-gray-800 hover:bg-gray-900 text-white font-bold py-3 px-6 rounded-lg shadow transition-transform active:scale-95 text-sm">
                ランダムに出題する
            </button>
        </div>

        <!-- タブコンテンツ: 指定トレーニング -->
        <div id="panel-manual" class="hidden mb-6">
            <h2 class="text-sm font-bold text-gray-500 uppercase tracking-wide mb-3">音を選んで出題</h2>
            <div class="grid grid-cols-4 sm:grid-cols-7 gap-2">
                <button onclick="manualQuestion('ド')" class="bg-indigo-50 hover:bg-indigo-100 text-indigo-700 font-bold py-3 rounded border border-indigo-200 active:scale-95 transition-all">ド</button>
                <button onclick="manualQuestion('レ')" class="bg-indigo-50 hover:bg-indigo-100 text-indigo-700 font-bold py-3 rounded border border-indigo-200 active:scale-95 transition-all">レ</button>
                <button onclick="manualQuestion('ミ')" class="bg-indigo-50 hover:bg-indigo-100 text-indigo-700 font-bold py-3 rounded border border-indigo-200 active:scale-95 transition-all">ミ</button>
                <button onclick="manualQuestion('ファ')" class="bg-indigo-50 hover:bg-indigo-100 text-indigo-700 font-bold py-3 rounded border border-indigo-200 active:scale-95 transition-all">ファ</button>
                <button onclick="manualQuestion('ソ')" class="bg-indigo-50 hover:bg-indigo-100 text-indigo-700 font-bold py-3 rounded border border-indigo-200 active:scale-95 transition-all">ソ</button>
                <button onclick="manualQuestion('ラ')" class="bg-indigo-50 hover:bg-indigo-100 text-indigo-700 font-bold py-3 rounded border border-indigo-200 active:scale-95 transition-all">ラ</button>
                <button onclick="manualQuestion('シ')" class="bg-indigo-50 hover:bg-indigo-100 text-indigo-700 font-bold py-3 rounded border border-indigo-200 active:scale-95 transition-all">シ</button>
            </div>
            <p class="text-xs text-gray-400 mt-2 text-center">ボタンを押すと、その音の問題がすぐに出題されます</p>
        </div>

        <!-- クイズエリア -->
        <div id="quiz-area" class="text-center relative min-h-[250px] flex flex-col justify-center">
            
            <!-- 問題表示 -->
            <div id="question-container">
                <div class="mb-2 space-x-2">
                    <span id="exercise-badge" class="inline-block px-3 py-1 rounded-full text-xs font-bold bg-indigo-100 text-indigo-700">
                        ハノン2
                    </span>
                    <span id="direction-badge" class="inline-block px-3 py-1 rounded-full text-xs font-bold bg-gray-200 text-gray-700">
                        パターン
                    </span>
                </div>
                <div class="text-gray-500 text-sm mb-1">開始音</div>
                <div id="start-note" class="text-6xl font-black text-indigo-900 mb-6">?</div>
            </div>

            <!-- アクションボタン -->
            <button id="show-answer-btn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-4 px-6 rounded-lg shadow transition-transform active:scale-95 text-lg">
                正解を見る
            </button>

            <!-- 答え表示 (最初は非表示) -->
            <div id="answer-container" class="hidden mt-6 bg-indigo-50 p-6 rounded-lg border-2 border-indigo-100 fade-in">
                <p class="text-xs text-indigo-500 font-bold mb-2 uppercase">Phrase</p>
                <div id="phrase-text" class="text-2xl font-bold text-gray-800 leading-relaxed tracking-wider">
                    <!-- ここに答えが入る -->
                </div>
                
                <button id="next-btn" class="mt-6 w-full bg-white hover:bg-gray-50 text-indigo-600 border-2 border-indigo-600 font-bold py-3 px-6 rounded-lg transition-transform active:scale-95">
                    次の問題へ
                </button>
            </div>

            <!-- エラーメッセージ用 -->
            <div id="error-message" class="hidden text-red-500 font-bold mt-4">
                少なくとも1つの音符を選択してください。
            </div>
        </div>
    </div>

    <footer class="text-gray-400 text-xs mt-auto">
        Hanon Exercise Quiz
    </footer>

    <script>
        // データ定義
        const exercises = {
            hanon1: {
                name: 'ハノン1',
                ascending: {
                    'ド': 'ドミファソ　ラソファミ',
                    'レ': 'レファソラ　シラソファ',
                    'ミ': 'ミソラシ　ドシラソ',
                    'ファ': 'ファラシド　レドシラ',
                    'ソ': 'ソシドレ　ミレドシ',
                    'ラ': 'ラドレミ　ファミレド',
                    'シ': 'シレミファ　ソファミレ'
                },
                descending: {
                    'ソ': 'ソミレド　シドレミ',
                    'ファ': 'ファレドシ　ラシドレ',
                    'ミ': 'ミドシラ　ソラシド',
                    'レ': 'レシラソ　ファソラシ',
                    'ド': 'ドラソファ　ミファソラ',
                    'シ': 'シソファミ　レミファソ',
                    'ラ': 'ラファミレ　ドレミファ'
                }
            },
            hanon2: {
                name: 'ハノン2',
                ascending: {
                    'ド': 'ドミラソ ファソファミ',
                    'レ': 'レファシラ ソラソファ',
                    'ミ': 'ミソドシ ラシラソ',
                    'ファ': 'ファラレド シドシラ',
                    'ソ': 'ソシミレ ドレドシ',
                    'ラ': 'ラドファミ レミレド',
                    'シ': 'シレソファ ミファミレ'
                },
                descending: {
                    'ソ': 'ソレシド レドレミ',
                    'ファ': 'ファドラシ ドシドレ',
                    'ミ': 'ミシソラ シラシド',
                    'レ': 'レラファソ ラソラシ',
                    'ド': 'ドソミファ ソファソラ',
                    'シ': 'シファレミ ファミファソ',
                    'ラ': 'ラミドレ ミレミファ'
                }
            }
        };

        // DOM要素
        const startNoteEl = document.getElementById('start-note');
        const directionBadgeEl = document.getElementById('direction-badge');
        const exerciseBadgeEl = document.getElementById('exercise-badge');
        const showAnswerBtn = document.getElementById('show-answer-btn');
        const nextBtn = document.getElementById('next-btn');
        const applySettingsBtn = document.getElementById('apply-settings-btn');
        const answerContainer = document.getElementById('answer-container');
        const phraseTextEl = document.getElementById('phrase-text');
        const questionContainer = document.getElementById('question-container');
        const errorMessageEl = document.getElementById('error-message');
        
        // タブ要素
        const tabRandom = document.getElementById('tab-random');
        const tabManual = document.getElementById('tab-manual');
        const panelRandom = document.getElementById('panel-random');
        const panelManual = document.getElementById('panel-manual');

        // 設定入力要素
        const exerciseRadios = document.getElementsByName('exercise');
        const directionRadios = document.getElementsByName('direction');
        const noteCheckboxes = document.getElementsByName('notes');

        // 状態管理
        let currentQuestion = null;
        let currentMode = 'random'; // 'random' or 'manual'

        // 初期化
        function init() {
            showAnswerBtn.addEventListener('click', showAnswer);
            nextBtn.addEventListener('click', generateRandomQuestion);
            applySettingsBtn.addEventListener('click', generateRandomQuestion);
            
            // タブ切り替え
            tabRandom.addEventListener('click', () => switchMode('random'));
            tabManual.addEventListener('click', () => switchMode('manual'));

            // 設定変更の監視（両方のモードに影響）
            const allRadios = [...exerciseRadios, ...directionRadios];
            allRadios.forEach(radio => {
                radio.addEventListener('change', () => {
                    if (currentMode === 'random') {
                        generateRandomQuestion();
                    }
                    // manualモード時は何もしない（ユーザーがボタンを押すのを待つ）
                });
            });

            // 初回ロード
            generateRandomQuestion();
        }

        // モード切替
        function switchMode(mode) {
            currentMode = mode;
            if (mode === 'random') {
                tabRandom.classList.add('text-indigo-600', 'border-indigo-600', 'font-bold');
                tabRandom.classList.remove('text-gray-500', 'border-transparent', 'font-medium');
                tabManual.classList.remove('text-indigo-600', 'border-indigo-600', 'font-bold');
                tabManual.classList.add('text-gray-500', 'border-transparent', 'font-medium');
                
                panelRandom.classList.remove('hidden');
                panelManual.classList.add('hidden');
                
                // モード切替時にランダム問題を出す
                generateRandomQuestion();
            } else {
                tabManual.classList.add('text-indigo-600', 'border-indigo-600', 'font-bold');
                tabManual.classList.remove('text-gray-500', 'border-transparent', 'font-medium');
                tabRandom.classList.remove('text-indigo-600', 'border-indigo-600', 'font-bold');
                tabRandom.classList.add('text-gray-500', 'border-transparent', 'font-medium');

                panelManual.classList.remove('hidden');
                panelRandom.classList.add('hidden');
                
                // 指定モードに入った直後は、前の問題を消すか、そのまま残すか
                // わかりやすくリセットする
                currentQuestion = null;
                startNoteEl.textContent = '-';
                exerciseBadgeEl.textContent = 'Wait';
                directionBadgeEl.textContent = '選択待機中';
                directionBadgeEl.className = 'inline-block px-3 py-1 rounded-full text-xs font-bold bg-gray-200 text-gray-700';
                
                answerContainer.classList.add('hidden');
                showAnswerBtn.classList.remove('hidden');
                showAnswerBtn.disabled = true; // 音を選ぶまで押せない
                showAnswerBtn.textContent = '音を選んでください';
                errorMessageEl.classList.add('hidden');
            }
        }

        // 現在の設定を取得 (共通設定部分)
        function getCommonSettings() {
            let exercise = 'hanon2'; 
            for (const radio of exerciseRadios) {
                if (radio.checked) {
                    exercise = radio.value;
                    break;
                }
            }

            let direction = 'ascending';
            for (const radio of directionRadios) {
                if (radio.checked) {
                    direction = radio.value;
                    break;
                }
            }
            return { exercise, direction };
        }

        // ランダム出題ロジック
        function generateRandomQuestion() {
            const { exercise, direction } = getCommonSettings();
            const currentExerciseData = exercises[exercise];

            // ランダム用チェックボックス取得
            const selectedNotes = [];
            for (const cb of noteCheckboxes) {
                if (cb.checked) {
                    selectedNotes.push(cb.value);
                }
            }

            if (selectedNotes.length === 0) {
                errorMessageEl.classList.remove('hidden');
                questionContainer.classList.add('opacity-50');
                showAnswerBtn.disabled = true;
                return;
            } else {
                errorMessageEl.classList.add('hidden');
                questionContainer.classList.remove('opacity-50');
                showAnswerBtn.disabled = false;
                showAnswerBtn.textContent = '正解を見る';
            }

            // 問題プールを作成
            let pool = [];

            if (direction === 'ascending' || direction === 'both') {
                selectedNotes.forEach(note => {
                    if (currentExerciseData.ascending[note]) {
                        pool.push({
                            exerciseName: currentExerciseData.name,
                            type: 'ascending',
                            startNote: note,
                            phrase: currentExerciseData.ascending[note],
                            label: '上昇パターン'
                        });
                    }
                });
            }

            if (direction === 'descending' || direction === 'both') {
                selectedNotes.forEach(note => {
                    if (currentExerciseData.descending[note]) {
                        pool.push({
                            exerciseName: currentExerciseData.name,
                            type: 'descending',
                            startNote: note,
                            phrase: currentExerciseData.descending[note],
                            label: '下降パターン'
                        });
                    }
                });
            }

            if (pool.length > 0) {
                const randomIndex = Math.floor(Math.random() * pool.length);
                currentQuestion = pool[randomIndex];
                renderQuestion();
            }
        }

        // 手動出題ロジック (HTMLから呼ばれる)
        window.manualQuestion = function(note) {
            const { exercise, direction } = getCommonSettings();
            const currentExerciseData = exercises[exercise];
            
            let targetDirection = direction;
            
            // "両方"が選ばれている場合はランダムに決定
            if (direction === 'both') {
                targetDirection = Math.random() < 0.5 ? 'ascending' : 'descending';
            }

            // データの存在確認と取得
            let questionData = null;
            if (targetDirection === 'ascending' && currentExerciseData.ascending[note]) {
                questionData = {
                    exerciseName: currentExerciseData.name,
                    type: 'ascending',
                    startNote: note,
                    phrase: currentExerciseData.ascending[note],
                    label: '上昇パターン'
                };
            } else if (targetDirection === 'descending' && currentExerciseData.descending[note]) {
                questionData = {
                    exerciseName: currentExerciseData.name,
                    type: 'descending',
                    startNote: note,
                    phrase: currentExerciseData.descending[note],
                    label: '下降パターン'
                };
            } else {
                // 指定した方向のデータがない場合（下降のみでドを選んだが下降データがない等）
                // 逆を探すか、エラーにするか。ハノンでは全音あるはずだが念のため
                if (currentExerciseData.ascending[note]) {
                     questionData = {
                        exerciseName: currentExerciseData.name,
                        type: 'ascending',
                        startNote: note,
                        phrase: currentExerciseData.ascending[note],
                        label: '上昇パターン (自動補完)'
                    };
                } else if (currentExerciseData.descending[note]) {
                    questionData = {
                        exerciseName: currentExerciseData.name,
                        type: 'descending',
                        startNote: note,
                        phrase: currentExerciseData.descending[note],
                        label: '下降パターン (自動補完)'
                    };
                }
            }

            if (questionData) {
                currentQuestion = questionData;
                showAnswerBtn.disabled = false;
                showAnswerBtn.textContent = '正解を見る';
                renderQuestion();
            }
        };

        // 問題表示
        function renderQuestion() {
            if (!currentQuestion) return;

            // UIリセット
            answerContainer.classList.add('hidden');
            showAnswerBtn.classList.remove('hidden');

            startNoteEl.textContent = currentQuestion.startNote;
            exerciseBadgeEl.textContent = currentQuestion.exerciseName;
            
            directionBadgeEl.textContent = currentQuestion.label;
            if (currentQuestion.type === 'ascending') {
                directionBadgeEl.className = 'inline-block px-3 py-1 rounded-full text-xs font-bold bg-blue-100 text-blue-700';
            } else {
                directionBadgeEl.className = 'inline-block px-3 py-1 rounded-full text-xs font-bold bg-orange-100 text-orange-700';
            }
        }

        // 正解表示
        function showAnswer() {
            if (!currentQuestion) return;

            // フレーズを見やすく整形
            const parts = currentQuestion.phrase.split(/[\s　]+/);
            
            if (parts.length === 2) {
                phraseTextEl.innerHTML = `
                    <div class="flex flex-wrap justify-center items-center gap-2 sm:gap-3">
                        <span class="whitespace-nowrap">${parts[0]}</span>
                        <span class="text-indigo-400 font-bold">⇒</span>
                        <span class="whitespace-nowrap">${parts[1]}</span>
                    </div>
                `;
            } else {
                phraseTextEl.textContent = currentQuestion.phrase;
            }

            showAnswerBtn.classList.add('hidden');
            answerContainer.classList.remove('hidden');
            
            // 指定モードの場合は「次の問題へ」ボタンを隠す
            if (currentMode === 'manual') {
                nextBtn.classList.add('hidden');
            } else {
                nextBtn.classList.remove('hidden');
            }
        }

        // スタート
        init();

    </script>
</body>
</html>
