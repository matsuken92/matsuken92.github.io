<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>四和音フラッシュカード</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Noto Sans JP', sans-serif;
      background-color: #f8fafc; /* Very light gray/blue background */
    }
    .card-shadow {
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
    }
    /* Smooth fade in for answer */
    .fade-in {
      animation: fadeIn 0.3s ease-in-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(5px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center py-8 px-4 text-slate-700">

  <main class="w-full max-w-md bg-white rounded-2xl card-shadow overflow-hidden">
    
    <!-- Header Area -->
    <header class="bg-white border-b border-slate-100 p-6 text-center">
      <h1 class="text-xl font-bold text-slate-800 tracking-wide">四和音フラッシュカード</h1>
      <div class="mt-4 text-left bg-blue-50 text-blue-800 p-4 rounded-lg text-sm leading-relaxed">
        <p class="font-bold mb-1 border-b border-blue-200 pb-1">トレーニング手順</p>
        <ol class="list-decimal list-inside space-y-1 text-slate-700">
          <li>コード名を言う</li>
          <li>調号の数と場所を言う</li>
          <li><strong class="text-blue-900 bg-blue-100 px-1 rounded">重要</strong> コードの音名を言う</li>
          <li>両手で抑える（薬指を使わない）</li>
        </ol>
      </div>
    </header>

    <!-- Controls -->
    <div class="px-6 py-4 bg-slate-50 border-b border-slate-100 flex justify-center">
      <label class="inline-flex items-center cursor-pointer select-none group">
        <div class="relative">
          <input type="checkbox" id="orderedMode" onchange="resetOrder()" class="sr-only peer">
          <div class="w-11 h-6 bg-gray-200 peer-focus:outline-none peer-focus:ring-4 peer-focus:ring-blue-100 rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-blue-600"></div>
        </div>
        <span class="ml-3 text-sm font-medium text-slate-600 group-hover:text-slate-800 transition-colors">順番指定モード (C→G♭→G)</span>
      </label>
    </div>

    <!-- Card Display -->
    <div class="p-8 text-center flex flex-col items-center justify-center min-h-[200px]">
      <div id="card" class="text-6xl font-bold text-slate-800 tracking-tight my-4">
        <!-- JS inserts chord here -->
      </div>
    </div>

    <!-- Answer Section -->
    <div class="px-6 pb-6 text-center space-y-4">
      <button onclick="showAnswer()" id="showAnswerBtn" class="w-full bg-slate-800 hover:bg-slate-700 text-white font-medium py-3 px-4 rounded-xl transition-colors shadow-sm active:scale-[0.98] transform duration-100">
        回答を表示
      </button>

      <div id="answerArea" class="hidden space-y-4">
        <div class="bg-slate-50 rounded-xl p-5 border border-slate-100 fade-in">
          <div class="mb-3">
            <span class="text-xs font-bold text-slate-400 uppercase tracking-wider">構成音</span>
            <div id="answer" class="text-2xl font-bold text-slate-800 mt-1"></div>
          </div>
          <div>
            <span class="text-xs font-bold text-slate-400 uppercase tracking-wider">調号</span>
            <div id="keySignature" class="text-lg text-slate-700 mt-1"></div>
          </div>
        </div>

        <!-- Self Assessment Buttons -->
        <div id="selfAssessment" class="grid grid-cols-2 gap-3 fade-in">
          <button onclick="markAnswer(true)" class="bg-blue-100 hover:bg-blue-200 text-blue-700 font-bold py-3 px-4 rounded-xl transition-colors">
            正解
          </button>
          <button onclick="markAnswer(false)" class="bg-red-50 hover:bg-red-100 text-red-600 font-bold py-3 px-4 rounded-xl transition-colors">
            不正解
          </button>
        </div>
      </div>
    </div>

    <!-- Stats Section -->
    <div class="bg-slate-50 border-t border-slate-100 p-6">
      <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-3 text-center">学習ステータス</h3>
      <div id="stats" class="grid grid-cols-2 gap-2 text-sm">
        <!-- JS inserts stats here -->
      </div>
    </div>
  </main>

  <script>
    const chords = [
      { name: "CM7", notes: ["ド", "ミ", "ソ", "シ"], keySig: "なし" },
      { name: "DM7", notes: ["レ", "ファ#", "ラ", "ド#"], keySig: "♯2つ（ファド）" },
      { name: "EM7", notes: ["ミ", "ソ#", "シ", "レ#"], keySig: "♯4つ（ファソドレ）" },
      { name: "FM7", notes: ["ファ", "ラ", "ド", "ミ"], keySig: "♭1つ（シ）" },
      { name: "GM7", notes: ["ソ", "シ", "レ", "ファ#"], keySig: "♯1つ（ファ）" },
      { name: "AM7", notes: ["ラ", "ド#", "ミ", "ソ#"], keySig: "♯3つ（ドファソ）" },
      { name: "BM7", notes: ["シ", "レ#", "ファ#", "ラ#"], keySig: "♯5つ（-(シミ)）" },
      { name: "B♭M7", notes: ["シ♭", "レ", "ファ", "ラ"], keySig: "♭2つ（シミ）" },
      { name: "E♭M7", notes: ["ミ♭", "ソ", "シ♭", "レ"], keySig: "♭3つ（ミラシ）" },
      { name: "A♭M7", notes: ["ラ♭", "ド", "ミ♭", "ソ"], keySig: "♭4つ（ラシレミ）" },
      { name: "D♭M7", notes: ["レ♭", "ファ", "ラ♭", "ド"], keySig: "♭5つ（-(ドファ)）" },
      { name: "G♭M7", notes: ["ソ♭", "シ♭", "レ♭", "ファ"], keySig: "♭6つ（-(-ファ)）" },
    ];

    const order = ["CM7", "FM7", "B♭M7", "E♭M7", "A♭M7", "D♭M7", "G♭M7", "BM7", "EM7", "AM7", "DM7", "GM7"];
    let orderedIndex = 0;
    let previous = null;
    let current = null;

    let stats = Object.fromEntries(chords.map(c => [c.name, { correct: 0, total: 0 }]));

    function resetOrder() {
      orderedIndex = 0;
      nextCard();
    }

    function weightedRandom() {
      let weights = chords.map(c => {
        const s = stats[c.name];
        // 正解率が高いほど出にくくする重み付け
        return 1 - (s.correct / (s.total || 1));
      });
      const sum = weights.reduce((a, b) => a + b, 0);
      let r = Math.random() * sum;
      for (let i = 0; i < chords.length; i++) {
        if (chords[i].name === previous) continue;
        if (r < weights[i]) return chords[i];
        r -= weights[i];
      }
      return chords.find(c => c.name !== previous) || chords[0];
    }

    function nextCard() {
      // UI Reset
      document.getElementById('answerArea').classList.add('hidden');
      document.getElementById('showAnswerBtn').style.display = 'block'; // ボタンを再表示
      
      document.getElementById('answer').textContent = "";
      document.getElementById('keySignature').textContent = "";
      
      const isOrdered = document.getElementById('orderedMode').checked;
      if (isOrdered) {
        current = chords.find(c => c.name === order[orderedIndex]);
        orderedIndex = (orderedIndex + 1) % order.length;
      } else {
        current = weightedRandom();
        // 万が一同じカードが連続する場合の再抽選（データ数が少ない場合のガード）
        let attempts = 0;
        while (current.name === previous && attempts < 10) {
          current = weightedRandom();
          attempts++;
        }
      }

      previous = current.name;
      document.getElementById('card').textContent = current.name;
    }

    function showAnswer() {
      document.getElementById('answer').textContent = current.notes.join("・");
      document.getElementById('keySignature').textContent = current.keySig; // ラベルはHTML側にあるので値だけセット
      
      document.getElementById('showAnswerBtn').style.display = 'none'; // 回答ボタンを隠す
      document.getElementById('answerArea').classList.remove('hidden');
    }

    function markAnswer(correct) {
      const s = stats[current.name];
      if (correct) s.correct++;
      s.total++;
      updateStats();
      nextCard();
    }

    function updateStats() {
      const div = document.getElementById('stats');
      // デザインに合わせてHTML生成を変更
      div.innerHTML = chords.map(c => {
        const s = stats[c.name];
        const percent = s.total === 0 ? 0 : Math.round((s.correct / s.total) * 100);
        // 正解率によって色を変える
        const colorClass = percent === 100 ? 'text-blue-600' : (s.total > 0 ? 'text-slate-600' : 'text-slate-400');
        
        return `
          <div class="flex justify-between items-center bg-white px-3 py-2 rounded border border-slate-100">
            <span class="font-medium text-slate-700">${c.name}</span>
            <span class="text-xs ${colorClass} font-mono">
              ${s.correct}/${s.total}
            </span>
          </div>
        `;
      }).join("");
    }

    // 初期化
    updateStats();
    nextCard();
  </script>
</body>
</html>
