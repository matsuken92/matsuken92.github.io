<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex,nofollow,noarchive" />
  <meta name="referrer" content="no-referrer" />
  <title>パスワード保護: 東京の小学校マップ</title>
  <style>
    :root { --bg:#0f172a; --panel:rgba(255,255,255,.96); --ink:#111827; --muted:#6b7280; --line:#e5e7eb; --accent:#2563eb; --err:#b91c1c; --ok:#047857; }
    * { box-sizing:border-box; }
    html,body { height:100%; }
    body { margin:0; font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; background:radial-gradient(circle at 20% 10%, rgba(59,130,246,.26), transparent 28rem), radial-gradient(circle at 80% 20%, rgba(16,185,129,.18), transparent 24rem), linear-gradient(135deg,#0f172a,#111827); color:var(--ink); display:grid; place-items:center; padding:24px; }
    .card { width:min(560px,100%); background:var(--panel); border:1px solid rgba(255,255,255,.55); border-radius:20px; box-shadow:0 30px 90px rgba(0,0,0,.35); padding:28px; }
    h1 { margin:0 0 8px; font-size:22px; line-height:1.35; }
    p { margin:0; color:var(--muted); line-height:1.65; font-size:14px; }
    form { margin-top:22px; display:grid; gap:12px; }
    label { font-weight:700; font-size:14px; }
    input[type="password"] { width:100%; border:1px solid var(--line); border-radius:12px; padding:13px 14px; font:inherit; background:#fff; outline:none; }
    input[type="password"]:focus { border-color:#93c5fd; box-shadow:0 0 0 4px rgba(37,99,235,.12); }
    button { border:0; border-radius:12px; padding:12px 14px; font:inherit; font-weight:700; background:var(--accent); color:#fff; cursor:pointer; }
    button:disabled { opacity:.62; cursor:wait; }
    .status { min-height:1.5em; margin-top:10px; font-size:13px; color:var(--muted); }
    .status.error { color:var(--err); font-weight:700; }
    .status.ok { color:var(--ok); font-weight:700; }
    .note { margin-top:18px; padding:12px; border:1px solid var(--line); border-radius:14px; background:#f9fafb; font-size:12px; color:#4b5563; line-height:1.6; }
    code { font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono",monospace; background:#eef2ff; padding:1px 5px; border-radius:6px; }
  </style>
</head>
<body>
  <main class="card" aria-labelledby="title">
    <h1 id="title">東京の小学校マップ</h1>
    <p>このHTMLはパスワードで暗号化されています。正しいパスワードを入力すると、地図と学校データを復号して表示します。</p>
    <form id="unlockForm" autocomplete="off">
      <div>
        <label for="password">パスワード</label>
        <input id="password" name="password" type="password" inputmode="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" autofocus required />
      </div>
      <button id="unlockButton" type="submit">表示する</button>
    </form>
    <div id="status" class="status" aria-live="polite"></div>
    <div class="note">HTML内には平文のパスワードや学校データを入れず、本文全体を <code>AES-GCM</code> で暗号化しています。鍵は入力パスワードから <code>PBKDF2-SHA-256</code> で導出します。ただし、単一HTMLのクライアントサイド保護は、サーバー認証ほど強固ではありません。</div>
  </main>

    const $ = id => document.getElementById(id);
    function b64ToBytes(b64) {
      const clean = String(b64).replace(/\s+/g, "");
      const bin = atob(clean);
      const bytes = new Uint8Array(bin.length);
      for (let i=0; i<bin.length; i++) bytes[i] = bin.charCodeAt(i);
      return bytes;
    }
    async function deriveKey(password) {
      const enc = new TextEncoder();
      const baseKey = await crypto.subtle.importKey("raw", enc.encode(password), CONFIG.kdf, false, ["deriveKey"]);
      return crypto.subtle.deriveKey({ name:CONFIG.kdf, salt:b64ToBytes(CONFIG.saltB64), iterations:CONFIG.iterations, hash:CONFIG.hash }, baseKey, { name:CONFIG.cipher, length:CONFIG.keyLengthBits }, false, ["decrypt"]);
    }
    function sleep(ms) { return new Promise(resolve => setTimeout(resolve, ms)); }
    async function unlock(password) {
      const key = await deriveKey(password);
      const decrypted = await crypto.subtle.decrypt({ name:CONFIG.cipher, iv:b64ToBytes(CONFIG.ivB64) }, key, b64ToBytes(CIPHERTEXT_B64));
      return new TextDecoder().decode(decrypted);
    }
    $("unlockForm").addEventListener("submit", async ev => {
      ev.preventDefault();
      const button = $("unlockButton");
      const status = $("status");
      button.disabled = true;
      status.className = "status";
      status.textContent = "復号しています...";
      try {
        const html = await unlock($("password").value.trim());
        status.className = "status ok";
        status.textContent = "復号しました。表示を切り替えます。";
        await sleep(80);
        document.open();
        document.write(html);
        document.close();
      } catch (e) {
        await sleep(700);
        status.className = "status error";
        status.textContent = "パスワードが違うか、ファイルが破損しています。";
        button.disabled = false;
        $("password").focus();
      }
    });
  })();
