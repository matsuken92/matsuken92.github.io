<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Music Note Practice</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Noto+Sans+JP:wght@400;500;700&family=Noto+Sans+Symbols&display=swap');
        
        body {
            font-family: 'Inter', 'Noto Sans JP', sans-serif;
            background-color: #f3f4f6;
            touch-action: pan-x pan-y;
            -webkit-tap-highlight-color: transparent;
        }

        .note-enter { animation: fadeIn 0.3s ease-out; }
        .note-current { fill: #3b82f6; stroke: #3b82f6; }
        .note-correct { fill: #22c55e !important; stroke: #22c55e !important; transition: fill 0.2s; }
        .note-wrong { fill: #ef4444 !important; stroke: #ef4444 !important; transition: fill 0.2s; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .score-bg {
            background-color: #fff;
            background-image: radial-gradient(#e5e7eb 1px, transparent 1px);
            background-size: 20px 20px;
        }

        .pop-mark {
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        @keyframes popIn {
            0% { opacity: 0; transform: scale(0.5) translateY(10px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }

        /* Piano Styles */
        .key-white {
            fill: white;
            stroke: #cbd5e1;
            stroke-width: 1px;
            transition: fill 0.1s;
        }
        .key-white.active { fill: #e2e8f0; }
        .key-white.correct { fill: #dcfce7 !important; }
        .key-white.wrong { fill: #fee2e2 !important; }
        .key-white.answer { fill: #facc15 !important; }

        .key-black {
            fill: #1e293b;
            stroke: #0f172a;
            stroke-width: 1px;
            transition: fill 0.1s;
        }
        .key-black.active { fill: #475569; }
        .key-black.correct { fill: #166534 !important; }
        .key-black.wrong { fill: #991b1b !important; }
        .key-black.answer { fill: #eab308 !important; }

        /* Button Styles */
        .piano-btn {
            transition: all 0.1s ease;
            box-shadow: 0 4px 0 #cbd5e1;
        }
        .piano-btn:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 #cbd5e1;
        }
        .piano-btn.answer {
            background-color: #facc15 !important;
            border-color: #eab308 !important;
            color: #713f12 !important;
        }

        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="text-slate-800 min-h-screen flex flex-col items-center py-4 px-2 md:py-6">

    <header class="w-full max-w-3xl mb-4 text-center">
        <h1 class="text-2xl md:text-3xl font-bold text-slate-900">Music Note Practice</h1>
    </header>

    <main class="w-full max-w-3xl bg-white rounded-2xl shadow-xl overflow-hidden flex flex-col">
        
        <!-- Key Selector (Always Visible) -->
        <div class="bg-blue-50 p-4 border-b border-blue-100">
            <label class="block text-blue-800 mb-1 font-bold text-sm uppercase tracking-wide">
                🔑 Key Signature / 出題キー
            </label>
            <select id="setting-key" class="w-full p-3 border border-blue-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none bg-white text-lg font-medium shadow-sm">
                <option value="C">C Major (ハ長調) [Default]</option>
                <option value="RANDOM">🎲 Random (ランダム)</option>
                <optgroup label="Sharps (♯)">
                    <option value="G">G Major (ト長調) - 1♯</option>
                    <option value="D">D Major (ニ長調) - 2♯</option>
                    <option value="A">A Major (イ長調) - 3♯</option>
                    <option value="E">E Major (ホ長調) - 4♯</option>
                    <option value="B">B Major (ロ長調) - 5♯</option>
                    <option value="F#">F# Major (嬰ヘ長調) - 6♯</option>
                </optgroup>
                <optgroup label="Flats (♭)">
                    <option value="F">F Major (ヘ長調) - 1♭</option>
                    <option value="Bb">Bb Major (変ロ長調) - 2♭</option>
                    <option value="Eb">Eb Major (変ホ長調) - 3♭</option>
                    <option value="Ab">Ab Major (変イ長調) - 4♭</option>
                    <option value="Db">Db Major (変ニ長調) - 5♭</option>
                    <option value="Gb">Gb Major (変ト長調) - 6♭</option>
                </optgroup>
            </select>
        </div>

        <!-- Settings Accordion -->
        <div class="border-b border-slate-100">
            <button id="settings-toggle" class="w-full flex items-center justify-between p-4 bg-slate-50 hover:bg-slate-100 transition-colors text-slate-700 font-semibold">
                <span>⚙️ その他設定 / Other Settings</span>
                <span id="settings-arrow" class="transform transition-transform">▼</span>
            </button>
            
            <div id="settings-panel" class="hidden p-6 bg-slate-50 space-y-4 text-sm border-t border-slate-200">
                
                <!-- MIDI & Language -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-slate-600 mb-1 font-medium flex items-center gap-2">
                            <span>🎹 MIDI入力デバイス</span>
                            <span id="midi-status-dot" class="w-2 h-2 rounded-full bg-slate-300"></span>
                        </label>
                        <select id="setting-midi-device" class="w-full p-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none bg-white">
                            <option value="">未接続 (No Device Found)</option>
                        </select>
                        <p class="text-xs text-slate-400 mt-1">※MIDIキーボードを接続してリロード、または再接続してください。</p>
                    </div>
                    <div>
                        <label class="block text-slate-600 mb-1 font-medium">表記 / Language</label>
                        <select id="setting-lang" class="w-full p-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                            <option value="DOREMI" selected>イタリア語 (ド レ ミ)</option>
                            <option value="CDE">英語 (C D E)</option>
                            <option value="JAPANESE">日本語 (ハ ニ ホ)</option>
                        </select>
                    </div>
                </div>

                <!-- Clef -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-slate-600 mb-1 font-medium">音部記号 / Clef</label>
                        <select id="setting-clef" class="w-full p-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                            <option value="treble">ト音記号 (Treble Clef)</option>
                            <option value="bass">ヘ音記号 (Bass Clef)</option>
                        </select>
                    </div>
                    <!-- Empty slot or move something here if needed -->
                </div>

                <!-- Range & Count -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-slate-600 mb-1 font-medium">音域 / Note Range</label>
                        <div class="flex items-center space-x-2">
                            <select id="setting-range-min" class="w-1/2 p-2 border border-slate-300 rounded-lg"></select>
                            <span class="text-slate-400">-</span>
                            <select id="setting-range-max" class="w-1/2 p-2 border border-slate-300 rounded-lg"></select>
                        </div>
                    </div>
                    <div>
                        <label class="block text-slate-600 mb-1 font-medium">問題数 / Notes</label>
                        <select id="setting-count" class="w-full p-2 border border-slate-300 rounded-lg">
                            <option value="4">4</option>
                            <option value="8" selected>8</option>
                            <option value="12">12</option>
                            <option value="16">16</option>
                            <option value="999">無限 (Endless)</option>
                        </select>
                    </div>
                </div>

                <div class="pt-2">
                    <button id="btn-generate" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl shadow-lg transition-transform active:scale-95 flex items-center justify-center space-x-2">
                        <span>🔄 設定を適用してリセット</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- Score Wrapper -->
        <div class="relative w-full h-48 md:h-72 score-bg border-b border-slate-200">
            
            <div id="float-feedback" class="absolute top-2 left-0 right-0 z-20 pointer-events-none flex justify-center opacity-0 h-16">
                <span id="float-text" class="text-5xl font-bold drop-shadow-sm"></span>
            </div>

            <!-- Current Key Display (Still useful to see inside Random mode) -->
            <div id="current-key-display" class="absolute top-2 left-2 text-xs font-bold text-slate-400 border border-slate-200 bg-white px-2 py-1 rounded">
                Key: C
            </div>

            <div id="score-container" class="w-full h-full overflow-x-auto overflow-y-hidden flex items-center scrollbar-hide">
                <svg id="score-svg" class="h-full" style="min-width: 100%;" viewBox="0 0 600 260" preserveAspectRatio="xMinYMid meet"></svg>
            </div>
            
            <div id="feedback-overlay" class="absolute inset-0 z-30 flex items-center justify-center pointer-events-none opacity-0 bg-white/80 transition-opacity duration-300 backdrop-blur-sm">
                <span id="feedback-text" class="text-4xl md:text-6xl font-bold drop-shadow-md transform transition-transform duration-200 text-center px-4"></span>
            </div>
        </div>

        <div class="w-full bg-slate-200 h-1.5">
            <div id="progress-bar" class="bg-blue-500 h-1.5 transition-all duration-300" style="width: 0%"></div>
        </div>

        <!-- Input Mode Switcher -->
        <div class="w-full bg-slate-50 border-t border-slate-200 flex justify-center py-3">
            <div class="bg-slate-200/80 p-1 rounded-xl flex relative">
                <button id="sw-piano" class="px-6 py-2 rounded-lg text-sm font-bold transition-all shadow-sm bg-white text-blue-600">
                    🎹 ピアノ (Piano)
                </button>
                <button id="sw-buttons" class="px-6 py-2 rounded-lg text-sm font-medium text-slate-500 hover:text-slate-700 transition-all">
                    🎵 ボタン (Buttons)
                </button>
            </div>
        </div>

        <!-- Input Area -->
        <div class="w-full bg-slate-50 relative min-h-[160px] flex flex-col justify-center">
            
            <div id="input-piano-container" class="w-full overflow-x-auto pb-4 pt-2 px-2 hidden">
                <div id="keyboard-wrapper" class="mx-auto"></div>
                <div class="absolute top-0 left-0 bottom-0 w-6 bg-gradient-to-r from-slate-50 to-transparent pointer-events-none"></div>
                <div class="absolute top-0 right-0 bottom-0 w-6 bg-gradient-to-l from-slate-50 to-transparent pointer-events-none"></div>
            </div>

            <div id="input-buttons-container" class="w-full p-4 hidden">
                <div id="buttons-wrapper" class="grid grid-cols-7 gap-1 md:gap-3 max-w-2xl mx-auto"></div>
            </div>

            <div class="text-center pb-2 text-xs text-slate-400">
                ※MIDIキーボードを接続して入力することも可能です。
            </div>
        </div>

        <div class="bg-white p-3 border-t border-slate-100 flex justify-between items-center text-sm text-slate-500">
            <span>Score: <strong id="score-val" class="text-slate-800">0</strong></span>
            <span>残り: <strong id="remaining-val" class="text-slate-800">8</strong></span>
        </div>

    </main>

    <script>
        /**
         * Constants & State
         */
        const KEYS = {
            'C':  { sharps: 0, flats: 0, scale: [0, 2, 4, 5, 7, 9, 11], map: {0:0, 2:1, 4:2, 5:3, 7:4, 9:5, 11:6}, names: {0:"C", 2:"D", 4:"E", 5:"F", 7:"G", 9:"A", 11:"B"} },
            'G':  { sharps: 1, flats: 0, scale: [7, 9, 11, 0, 2, 4, 6], map: {7:4, 9:5, 11:6, 0:0, 2:1, 4:2, 6:3}, names: {7:"G", 9:"A", 11:"B", 0:"C", 2:"D", 4:"E", 6:"F♯"} },
            'D':  { sharps: 2, flats: 0, scale: [2, 4, 6, 7, 9, 11, 1], map: {2:1, 4:2, 6:3, 7:4, 9:5, 11:6, 1:0}, names: {2:"D", 4:"E", 6:"F♯", 7:"G", 9:"A", 11:"B", 1:"C♯"} },
            'A':  { sharps: 3, flats: 0, scale: [9, 11, 1, 2, 4, 6, 8], map: {9:5, 11:6, 1:0, 2:1, 4:2, 6:3, 8:4}, names: {9:"A", 11:"B", 1:"C♯", 2:"D", 4:"E", 6:"F♯", 8:"G♯"} },
            'E':  { sharps: 4, flats: 0, scale: [4, 6, 8, 9, 11, 1, 3], map: {4:2, 6:3, 8:4, 9:5, 11:6, 1:0, 3:1}, names: {4:"E", 6:"F♯", 8:"G♯", 9:"A", 11:"B", 1:"C♯", 3:"D♯"} },
            'B':  { sharps: 5, flats: 0, scale: [11, 1, 3, 4, 6, 8, 10], map: {11:6, 1:0, 3:1, 4:2, 6:3, 8:4, 10:5}, names: {11:"B", 1:"C♯", 3:"D♯", 4:"E", 6:"F♯", 8:"G♯", 10:"A♯"} },
            'F#': { sharps: 6, flats: 0, scale: [6, 8, 10, 11, 1, 3, 5], map: {6:3, 8:4, 10:5, 11:6, 1:0, 3:1, 5:2}, names: {6:"F♯", 8:"G♯", 10:"A♯", 11:"B", 1:"C♯", 3:"D♯", 5:"E♯"} },
            'F':  { sharps: 0, flats: 1, scale: [5, 7, 9, 10, 0, 2, 4], map: {5:3, 7:4, 9:5, 10:6, 0:0, 2:1, 4:2}, names: {5:"F", 7:"G", 9:"A", 10:"B♭", 0:"C", 2:"D", 4:"E"} },
            'Bb': { sharps: 0, flats: 2, scale: [10, 0, 2, 3, 5, 7, 9], map: {10:6, 0:0, 2:1, 3:2, 5:3, 7:4, 9:5}, names: {10:"B♭", 0:"C", 2:"D", 3:"E♭", 5:"F", 7:"G", 9:"A"} },
            'Eb': { sharps: 0, flats: 3, scale: [3, 5, 7, 8, 10, 0, 2], map: {3:2, 5:3, 7:4, 8:5, 10:6, 0:0, 2:1}, names: {3:"E♭", 5:"F", 7:"G", 8:"A♭", 10:"B♭", 0:"C", 2:"D"} },
            'Ab': { sharps: 0, flats: 4, scale: [8, 10, 0, 1, 3, 5, 7], map: {8:5, 10:6, 0:0, 1:1, 3:2, 5:3, 7:4}, names: {8:"A♭", 10:"B♭", 0:"C", 1:"D♭", 3:"E♭", 5:"F", 7:"G"} },
            'Db': { sharps: 0, flats: 5, scale: [1, 3, 5, 6, 8, 10, 0], map: {1:1, 3:2, 5:3, 6:4, 8:5, 10:6, 0:0}, names: {1:"D♭", 3:"E♭", 5:"F", 6:"G♭", 8:"A♭", 10:"B♭", 0:"C"} },
            'Gb': { sharps: 0, flats: 6, scale: [6, 8, 10, 11, 1, 3, 5], map: {6:4, 8:5, 10:6, 11:0, 1:1, 3:2, 5:3}, names: {6:"G♭", 8:"A♭", 10:"B♭", 11:"C♭", 1:"D♭", 3:"E♭", 5:"F"} }
        };

        const KEY_SIG_POSITIONS = {
            treble_sharps: [0, 1.5, -0.5, 1, 2.5, 0.5], 
            treble_flats:  [2, 0.5, 2.5, 1, 3, 1.5],
            bass_sharps:   [1, 2.5, 0.5, 2, 3.5, 1.5],
            bass_flats:    [3, 1.5, 3.5, 2, 4, 2.5] 
        };

        const NOTES = ['C', 'D', 'E', 'F', 'G', 'A', 'B'];
        const NOTE_LABELS = {
            'CDE': ['C', 'D', 'E', 'F', 'G', 'A', 'B'],
            'DOREMI': ['ド', 'レ', 'ミ', 'ファ', 'ソ', 'ラ', 'シ'],
            'JAPANESE': ['ハ', 'ニ', 'ホ', 'ヘ', 'ト', 'イ', 'ロ']
        };

        const STATE = {
            config: {
                mode: 'piano', 
                lang: 'DOREMI',
                clef: 'treble',
                rangeMin: 48,
                rangeMax: 83, 
                count: 8,
                keySetting: 'C', 
                currentKey: 'C'  
            },
            currentSequence: [],
            currentIndex: 0,
            score: 0,
            isFinished: false,
            midiAccess: null,
            midiInput: null,
            currentNoteAttempts: 0 
        };

        const AudioContext = window.AudioContext || window.webkitAudioContext;
        const audioCtx = new AudioContext();

        function playTone(midiNote, type = 'sine', duration = 0.5) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            const freq = 440 * Math.pow(2, (midiNote - 69) / 12);
            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.01, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.2, audioCtx.currentTime + 0.05);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }

        function playFeedbackSound(isCorrect) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = isCorrect ? 'triangle' : 'sawtooth';
            if (isCorrect) {
                osc.frequency.setValueAtTime(880, audioCtx.currentTime); 
                osc.frequency.exponentialRampToValueAtTime(1760, audioCtx.currentTime + 0.1);
            } else {
                osc.frequency.setValueAtTime(200, audioCtx.currentTime);
                osc.frequency.linearRampToValueAtTime(150, audioCtx.currentTime + 0.2);
            }
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.3);
        }

        /**
         * Initialization
         */
        window.addEventListener('DOMContentLoaded', () => {
            initSettingsUI();
            setupModeSwitcher(); 
            initMidi(); 
            generateNewGame();
            
            document.getElementById('settings-toggle').addEventListener('click', toggleSettings);
            document.getElementById('btn-generate').addEventListener('click', () => {
                applySettings();
                generateNewGame();
                toggleSettings();
            });
            document.getElementById('setting-lang').addEventListener('change', (e) => {
                STATE.config.lang = e.target.value;
                if(STATE.config.mode === 'buttons') renderInputUI();
            });
            document.getElementById('setting-midi-device').addEventListener('change', (e) => {
                changeMidiInput(e.target.value);
            });
            // Update Key instantly
            document.getElementById('setting-key').addEventListener('change', (e) => {
                STATE.config.keySetting = e.target.value;
                generateNewGame();
            });
        });

        // --- Mode Switcher ---
        function setupModeSwitcher() {
            const btnPiano = document.getElementById('sw-piano');
            const btnButtons = document.getElementById('sw-buttons');

            const setMode = (mode) => {
                STATE.config.mode = mode;
                if(mode === 'piano') {
                    btnPiano.className = "px-6 py-2 rounded-lg text-sm font-bold transition-all shadow-sm bg-white text-blue-600";
                    btnButtons.className = "px-6 py-2 rounded-lg text-sm font-medium text-slate-500 hover:text-slate-700 transition-all";
                } else {
                    btnPiano.className = "px-6 py-2 rounded-lg text-sm font-medium text-slate-500 hover:text-slate-700 transition-all";
                    btnButtons.className = "px-6 py-2 rounded-lg text-sm font-bold transition-all shadow-sm bg-white text-blue-600";
                }
                renderInputUI();
            };

            btnPiano.addEventListener('click', () => setMode('piano'));
            btnButtons.addEventListener('click', () => setMode('buttons'));
        }

        // --- MIDI Handling ---
        function initMidi() {
            if (navigator.requestMIDIAccess) {
                navigator.requestMIDIAccess().then(onMidiSuccess, onMidiFailure);
            } else {
                updateMidiStatus(false);
            }
        }

        function onMidiSuccess(midiAccess) {
            STATE.midiAccess = midiAccess;
            updateMidiDeviceList();
            midiAccess.onstatechange = updateMidiDeviceList; 
        }

        function onMidiFailure(msg) {
            updateMidiStatus(false);
        }

        function updateMidiDeviceList() {
            const select = document.getElementById('setting-midi-device');
            const inputs = STATE.midiAccess.inputs;
            const previousValue = select.value;
            
            select.innerHTML = '<option value="">未接続 (No Device Found)</option>';
            let hasDevice = false;

            inputs.forEach((input) => {
                const opt = document.createElement('option');
                opt.value = input.id;
                opt.text = input.name || `MIDI Input ${input.id}`;
                select.appendChild(opt);
                hasDevice = true;
            });

            if (hasDevice) {
                if ([...select.options].some(o => o.value === previousValue)) {
                    select.value = previousValue;
                } else {
                    select.selectedIndex = 1; 
                }
                changeMidiInput(select.value); 
            } else {
                changeMidiInput("");
            }
            
            updateMidiStatus(hasDevice);
        }

        function changeMidiInput(id) {
            if (STATE.midiInput) {
                STATE.midiInput.onmidimessage = null;
            }

            if (!id || !STATE.midiAccess) {
                STATE.midiInput = null;
                return;
            }

            const input = STATE.midiAccess.inputs.get(id);
            if (input) {
                STATE.midiInput = input;
                input.onmidimessage = onMidiMessage;
            }
        }

        function updateMidiStatus(connected) {
            const dot = document.getElementById('midi-status-dot');
            if (connected) {
                dot.className = "w-2 h-2 rounded-full bg-green-500 shadow-[0_0_5px_rgba(34,197,94,0.8)]";
            } else {
                dot.className = "w-2 h-2 rounded-full bg-slate-300";
            }
        }

        function onMidiMessage(event) {
            const [command, note, velocity] = event.data;
            if ((command & 0xF0) === 0x90 && velocity > 0) {
                if (!STATE.isFinished) {
                    handleInput(note, 'midi');
                    const keyEl = document.getElementById(`key-${note}`);
                    if (keyEl) {
                        keyEl.classList.add('active');
                        setTimeout(() => keyEl.classList.remove('active'), 150);
                    }
                }
            }
        }
        // ---------------------

        function toggleSettings() {
            const panel = document.getElementById('settings-panel');
            const arrow = document.getElementById('settings-arrow');
            panel.classList.toggle('hidden');
            arrow.style.transform = panel.classList.contains('hidden') ? 'rotate(0deg)' : 'rotate(180deg)';
        }

        function getNoteName(midi) {
            const names = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
            return names[midi % 12];
        }

        function initSettingsUI() {
            const minSel = document.getElementById('setting-range-min');
            const maxSel = document.getElementById('setting-range-max');
            const ranges = [];
            for(let i=36; i<=95; i++) {
                const noteName = getNoteName(i);
                const octave = Math.floor(i / 12) - 1;
                ranges.push({ val: i, label: `${noteName}${octave}` });
            }
            const populate = (sel, defaultVal) => {
                ranges.forEach(r => {
                    const opt = document.createElement('option');
                    opt.value = r.val;
                    opt.text = r.label;
                    if(r.val === defaultVal) opt.selected = true;
                    sel.appendChild(opt);
                });
            };
            populate(minSel, 48); // C3
            populate(maxSel, 83); // B5
        }

        function applySettings() {
            // STATE.config.mode is handled by switcher, no need to read from settings panel
            STATE.config.lang = document.getElementById('setting-lang').value;
            STATE.config.clef = document.getElementById('setting-clef').value;
            STATE.config.rangeMin = parseInt(document.getElementById('setting-range-min').value);
            STATE.config.rangeMax = parseInt(document.getElementById('setting-range-max').value);
            STATE.config.count = parseInt(document.getElementById('setting-count').value);
            STATE.config.keySetting = document.getElementById('setting-key').value;
        }

        /**
         * Game Logic
         */
        function generateNewGame() {
            document.getElementById('feedback-overlay').style.opacity = '0';
            STATE.currentSequence = [];
            STATE.currentIndex = 0;
            STATE.score = 0;
            STATE.isFinished = false;
            STATE.currentNoteAttempts = 0; 

            if (STATE.config.keySetting === 'RANDOM') {
                const keys = Object.keys(KEYS);
                STATE.config.currentKey = keys[Math.floor(Math.random() * keys.length)];
            } else {
                STATE.config.currentKey = STATE.config.keySetting;
            }
            
            document.getElementById('current-key-display').innerText = `Key: ${STATE.config.currentKey}`;
            updateScoreUI();

            const keyData = KEYS[STATE.config.currentKey];
            const validNotes = [];
            for (let m = STATE.config.rangeMin; m <= STATE.config.rangeMax; m++) {
                const noteIndex = m % 12;
                if (keyData.scale.includes(noteIndex)) {
                    validNotes.push(m);
                }
            }
            
            if(validNotes.length === 0) validNotes.push(60); 

            const history = [];

            for (let i = 0; i < STATE.config.count; i++) {
                let note;
                let attempts = 0;
                let pool = validNotes.filter(n => !history.includes(n));
                if (pool.length === 0) pool = [...validNotes];

                do {
                    attempts++;
                    const currentPool = (attempts < 10 && pool.length > 0) ? pool : validNotes;
                    note = currentPool[Math.floor(Math.random() * currentPool.length)];

                    if (history.length > 0) {
                        const last = history[history.length - 1];
                        if (Math.abs(note - last) > 12 && attempts < 20) continue;
                        if (last === note && attempts < 20) continue;
                    }
                    break; 
                } while (true);

                STATE.currentSequence.push(note);
                history.push(note);
            }

            renderScore();
            renderInputUI();
        }

        function handleInput(inputVal, type) {
            if (STATE.isFinished) return;

            const targetMidi = STATE.currentSequence[STATE.currentIndex];
            let isCorrect = false;

            if (type === 'midi') {
                isCorrect = (inputVal === targetMidi);
                const keyEl = document.getElementById(`key-${inputVal}`);
                if(keyEl) {
                    keyEl.classList.add(isCorrect ? 'correct' : 'wrong');
                    setTimeout(() => keyEl.classList.remove('correct', 'wrong'), 300);
                }
                playTone(inputVal, isCorrect ? 'triangle' : 'sawtooth', 0.3);

            } else {
                // Button Mode
                const keyData = KEYS[STATE.config.currentKey];
                const targetNoteIndex = keyData.map[targetMidi % 12];
                isCorrect = (inputVal === targetNoteIndex);
                
                if(isCorrect) playTone(targetMidi, 'triangle', 0.3);
                else playFeedbackSound(false);
            }

            const noteGroup = document.getElementById(`note-group-${STATE.currentIndex}`);
            const noteHead = noteGroup.querySelector('ellipse');
            const noteStem = noteGroup.querySelector('line');

            if (isCorrect) {
                // Correct
                STATE.currentNoteAttempts = 0; // Reset for next
                noteHead.classList.add('note-correct');
                if(noteStem) noteStem.style.stroke = '#22c55e';
                STATE.score++;
                showFloatFeedback('⭕', true);
                
                moveToNext();

            } else {
                // Wrong
                STATE.currentNoteAttempts++;
                noteHead.classList.add('note-wrong');
                if(noteStem) noteStem.style.stroke = '#ef4444';
                showFloatFeedback('❌', false);
                
                // 3 Strikes Logic
                if(STATE.currentNoteAttempts >= 3) {
                    showAnswerAndSkip(targetMidi);
                } else {
                    setTimeout(() => {
                        noteHead.classList.remove('note-wrong');
                        if(noteStem) noteStem.style.stroke = 'black';
                        noteHead.classList.add('note-current');
                    }, 500);
                }
            }
        }

        function moveToNext() {
            STATE.currentIndex++;
            updateScoreUI();

            if (STATE.currentIndex >= STATE.currentSequence.length && STATE.config.count !== 999) {
                finishGame();
            } else if (STATE.config.count === 999) {
                 if (STATE.currentIndex >= STATE.currentSequence.length) generateNewGame();
                 else highlightCurrentNote();
            } else {
                highlightCurrentNote();
            }
        }

        function getAccurateNoteLabel(midi, key) {
            const keyData = KEYS[key];
            const noteIndex = midi % 12;
            const noteName = keyData.names[noteIndex] || "?"; 
            
            let octave = Math.floor(midi / 12) - 1;
            
            if (noteName.startsWith("C♭")) octave += 1;
            if (noteName.startsWith("B♯")) octave -= 1;

            return `${noteName}${octave}`;
        }

        function showAnswerAndSkip(targetMidi) {
             playTone(targetMidi, 'triangle', 0.5);

             const label = getAccurateNoteLabel(targetMidi, STATE.config.currentKey);

             const overlay = document.getElementById('feedback-overlay');
             const text = document.getElementById('feedback-text');
             
             // Answer Display
             text.innerText = `Answer: ${label}`;
             text.className = "text-5xl md:text-6xl font-bold text-yellow-500 drop-shadow-md"; 
             overlay.style.opacity = '1';

             // Highlight & Auto-Scroll
             if (STATE.config.mode === 'piano') {
                 const keyEl = document.getElementById(`key-${targetMidi}`);
                 if(keyEl) {
                     keyEl.classList.add('answer');
                     autoScrollToKey(targetMidi); // SCROLL
                 }
             } else {
                 const keyData = KEYS[STATE.config.currentKey];
                 const targetNoteIndex = keyData.map[targetMidi % 12];
                 const btnEl = document.getElementById(`btn-note-${targetNoteIndex}`);
                 if(btnEl) btnEl.classList.add('answer');
             }

             setTimeout(() => {
                 if (STATE.config.mode === 'piano') {
                     const keyEl = document.getElementById(`key-${targetMidi}`);
                     if(keyEl) keyEl.classList.remove('answer');
                 } else {
                     const keyData = KEYS[STATE.config.currentKey];
                     const targetNoteIndex = keyData.map[targetMidi % 12];
                     const btnEl = document.getElementById(`btn-note-${targetNoteIndex}`);
                     if(btnEl) btnEl.classList.remove('answer');
                 }
                 overlay.style.opacity = '0';
                 STATE.currentNoteAttempts = 0;
                 moveToNext();
             }, 2000); 
        }

        function autoScrollToKey(midi) {
            const container = document.getElementById('input-piano-container');
            const keyEl = document.getElementById(`key-${midi}`);
            
            if (container && keyEl) {
                const xVal = parseInt(keyEl.getAttribute('x'));
                const widthVal = parseInt(keyEl.getAttribute('width'));
                const containerWidth = container.clientWidth;
                const scrollTarget = xVal - (containerWidth / 2) + (widthVal / 2);
                
                container.scrollTo({
                    left: Math.max(0, scrollTarget),
                    behavior: 'smooth'
                });
            }
        }
        
        function getVisualStepsFromC4(midi, key) {
            let oct = Math.floor(midi / 12);
            const noteVal = midi % 12;
            const keyData = KEYS[key];
            const noteIndex = keyData.map[noteVal]; 

            if (noteVal === 11 && noteIndex === 0) {
                oct += 1;
            }

            if (noteVal === 0 && noteIndex === 6) {
                oct -= 1;
            }

            const absStep = (oct * 7) + noteIndex;
            const c4Step = (5 * 7) + 0; 
            return absStep - c4Step;
        }

        function finishGame() {
            STATE.isFinished = true;
            const overlay = document.getElementById('feedback-overlay');
            const text = document.getElementById('feedback-text');
            text.innerText = "Good Job! 🎉";
            text.className = "text-5xl md:text-6xl font-bold text-blue-600 drop-shadow-md";
            overlay.style.opacity = '1';
            setTimeout(() => { generateNewGame(); }, 1000); 
        }

        function showFloatFeedback(text, good) {
            const el = document.getElementById('float-text');
            const container = document.getElementById('float-feedback');
            el.innerText = text;
            el.className = good ? "text-5xl font-bold text-green-500 drop-shadow-sm" : "text-5xl font-bold text-red-500 drop-shadow-sm";
            container.classList.remove('pop-mark');
            void container.offsetWidth;
            container.style.opacity = '1';
            container.classList.add('pop-mark');
            setTimeout(() => {
                container.style.opacity = '0';
                container.classList.remove('pop-mark');
            }, 500);
        }

        function updateScoreUI() {
            document.getElementById('score-val').innerText = STATE.score;
            let remaining = STATE.config.count - STATE.currentIndex;
            if (STATE.config.count === 999) remaining = "∞";
            document.getElementById('remaining-val').innerText = remaining;
            const progress = (STATE.currentIndex / STATE.config.count) * 100;
            document.getElementById('progress-bar').style.width = `${progress}%`;
        }

        /**
         * SVG Score Rendering
         */
        function renderScore() {
            const svg = document.getElementById('score-svg');
            svg.innerHTML = ''; 

            const totalNotes = STATE.config.count;
            const noteSpacing = 60;
            const startX = 160; 
            const calculatedWidth = startX + (totalNotes * noteSpacing) + 50;
            const svgWidth = Math.max(600, calculatedWidth);

            svg.setAttribute("viewBox", `0 0 ${svgWidth} 260`);
            svg.style.width = `${svgWidth}px`; 

            const staffY = 80;
            const lineSpacing = 15;
            
            for (let i = 0; i < 5; i++) {
                const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
                line.setAttribute("x1", "20");
                line.setAttribute("y1", staffY + (i * lineSpacing));
                line.setAttribute("x2", svgWidth - 20);
                line.setAttribute("y2", staffY + (i * lineSpacing));
                line.setAttribute("stroke", "#94a3b8");
                line.setAttribute("stroke-width", "1.5");
                svg.appendChild(line);
            }

            const clefGroup = document.createElementNS("http://www.w3.org/2000/svg", "text");
            clefGroup.setAttribute("font-family", "'Noto Sans Symbols', sans-serif");
            
            if (STATE.config.clef === 'treble') {
                clefGroup.textContent = "𝄞";
                clefGroup.setAttribute("x", "30");
                clefGroup.setAttribute("y", staffY + (lineSpacing * 3) + 7);
                clefGroup.setAttribute("font-size", "90");
            } else {
                clefGroup.textContent = "𝄢";
                clefGroup.setAttribute("x", "30");
                clefGroup.setAttribute("y", staffY + (lineSpacing * 1) + 5); 
                clefGroup.setAttribute("font-size", "70");
            }
            svg.appendChild(clefGroup);

            drawKeySignature(svg, staffY, lineSpacing);

            STATE.currentSequence.forEach((midi, index) => {
                const noteGroup = createNoteSVG(midi, startX + (index * noteSpacing), staffY, lineSpacing);
                noteGroup.setAttribute("id", `note-group-${index}`);
                noteGroup.classList.add("note-enter");
                noteGroup.style.animationDelay = `${index * 0.05}s`;
                svg.appendChild(noteGroup);
            });

            setTimeout(highlightCurrentNote, 0);
        }

        function drawKeySignature(svg, staffY, spacing) {
            const key = STATE.config.currentKey;
            const data = KEYS[key];
            if (!data) return;

            const isSharps = data.sharps > 0;
            const count = isSharps ? data.sharps : data.flats;
            if (count === 0) return;

            const symbol = isSharps ? '♯' : '♭';
            const clefType = STATE.config.clef;
            
            let posArray;
            if (clefType === 'treble') {
                posArray = isSharps ? KEY_SIG_POSITIONS.treble_sharps : KEY_SIG_POSITIONS.treble_flats;
            } else {
                posArray = isSharps ? KEY_SIG_POSITIONS.bass_sharps : KEY_SIG_POSITIONS.bass_flats;
            }

            let startX = 85; 
            const stepX = 14; 

            for(let i=0; i<count; i++) {
                const yOffset = posArray[i]; 
                const y = staffY + (yOffset * spacing);
                
                const txt = document.createElementNS("http://www.w3.org/2000/svg", "text");
                txt.textContent = symbol;
                txt.setAttribute("x", startX + (i * stepX));
                const yAdjust = isSharps ? (spacing/2) - 1 : (spacing/2) - 2;
                txt.setAttribute("y", y + yAdjust); 
                txt.setAttribute("font-size", "28");
                txt.setAttribute("font-family", "'Noto Sans Symbols', sans-serif");
                svg.appendChild(txt);
            }
        }

        function createNoteSVG(midi, cx, staffTopY, spacing) {
            const group = document.createElementNS("http://www.w3.org/2000/svg", "g");
            const stepsFromC4 = getVisualStepsFromC4(midi, STATE.config.currentKey);
            
            let c4Y;
            if (STATE.config.clef === 'treble') {
                c4Y = staffTopY + (10 * (spacing / 2));
            } else {
                c4Y = staffTopY - (2 * (spacing / 2));
            }

            const yPos = c4Y - (stepsFromC4 * (spacing / 2));
            const middleLineY = staffTopY + (2 * spacing);
            const stemDirection = yPos < middleLineY ? 'down' : 'up';

            const drawLedger = (y) => {
                 const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
                 line.setAttribute("x1", cx - 12);
                 line.setAttribute("x2", cx + 12);
                 line.setAttribute("y1", y);
                 line.setAttribute("y2", y);
                 line.setAttribute("stroke", "#94a3b8");
                 line.setAttribute("stroke-width", "1.5");
                 group.appendChild(line);
            };

            for (let ly = staffTopY - spacing; ly >= yPos; ly -= spacing) drawLedger(ly);
            for (let ly = staffTopY + 5*spacing; ly <= yPos; ly += spacing) drawLedger(ly);

            const ellipse = document.createElementNS("http://www.w3.org/2000/svg", "ellipse");
            ellipse.setAttribute("cx", cx);
            ellipse.setAttribute("cy", yPos);
            ellipse.setAttribute("rx", 7);
            ellipse.setAttribute("ry", 5);
            ellipse.setAttribute("fill", "black"); 
            ellipse.setAttribute("transform", `rotate(-20 ${cx} ${yPos})`); 
            group.appendChild(ellipse);

            const stemHeight = 35;
            const stem = document.createElementNS("http://www.w3.org/2000/svg", "line");
            if (stemDirection === 'up') {
                stem.setAttribute("x1", cx + 6);
                stem.setAttribute("y1", yPos);
                stem.setAttribute("x2", cx + 6);
                stem.setAttribute("y2", yPos - stemHeight);
            } else {
                stem.setAttribute("x1", cx - 6);
                stem.setAttribute("y1", yPos);
                stem.setAttribute("x2", cx - 6);
                stem.setAttribute("y2", yPos + stemHeight);
            }
            stem.setAttribute("stroke", "black");
            stem.setAttribute("stroke-width", "1.5");
            group.appendChild(stem);
            return group;
        }

        function highlightCurrentNote() {
            document.querySelectorAll('ellipse').forEach(el => {
                if(!el.classList.contains('note-correct') && !el.classList.contains('note-wrong')) {
                    el.style.fill = 'black';
                    el.style.stroke = 'none';
                }
            });

            if(STATE.currentIndex < STATE.currentSequence.length) {
                const group = document.getElementById(`note-group-${STATE.currentIndex}`);
                if(group) {
                    const head = group.querySelector('ellipse');
                    if(head) head.classList.add('note-current');
                    
                    const container = document.getElementById('score-container');
                    const noteX = 160 + (STATE.currentIndex * 60);
                    const containerWidth = container.clientWidth;
                    const scrollPos = noteX - (containerWidth / 2);
                    container.scrollTo({ left: scrollPos, behavior: 'smooth' });
                }
            }
        }

        function renderInputUI() {
            const pianoContainer = document.getElementById('input-piano-container');
            const buttonsContainer = document.getElementById('input-buttons-container');

            if (STATE.config.mode === 'piano') {
                buttonsContainer.classList.add('hidden');
                pianoContainer.classList.remove('hidden');
                renderPianoKeyboard();
            } else {
                pianoContainer.classList.add('hidden');
                buttonsContainer.classList.remove('hidden');
                renderButtonKeyboard();
            }
        }

        function renderButtonKeyboard() {
            const wrapper = document.getElementById('buttons-wrapper');
            wrapper.innerHTML = '';
            
            const labels = NOTE_LABELS[STATE.config.lang];
            
            NOTES.forEach((note, index) => {
                const btn = document.createElement('button');
                btn.className = "piano-btn w-full aspect-square bg-white border border-slate-200 rounded-xl flex items-center justify-center text-lg md:text-2xl font-bold text-slate-700 hover:bg-blue-50 hover:text-blue-600 focus:outline-none focus:ring-2 focus:ring-blue-400 select-none";
                btn.innerText = labels[index];
                btn.id = `btn-note-${index}`; // Add ID for referencing
                
                const action = (e) => {
                    e.preventDefault();
                    btn.style.transform = "translateY(4px)";
                    btn.style.boxShadow = "none";
                    setTimeout(() => {
                        btn.style.transform = "";
                        btn.style.boxShadow = "";
                    }, 100);
                    handleInput(index, 'index');
                };

                btn.addEventListener('mousedown', action);
                btn.addEventListener('touchstart', action);
                wrapper.appendChild(btn);
            });
        }

        function renderPianoKeyboard() {
            const wrapper = document.getElementById('keyboard-wrapper');
            wrapper.innerHTML = '';

            const startMidi = Math.floor(STATE.config.rangeMin / 12) * 12; 
            let endMidi = Math.ceil((STATE.config.rangeMax + 1) / 12) * 12;
            if (endMidi < STATE.config.rangeMax) endMidi += 12;

            const whiteKeyWidth = 48;
            const whiteKeyHeight = 140;
            const blackKeyWidth = 28;
            const blackKeyHeight = 90;

            let whiteKeyCount = 0;
            for(let m=startMidi; m<endMidi; m++) {
                const n = m % 12;
                if([0,2,4,5,7,9,11].includes(n)) whiteKeyCount++;
            }
            const totalWidth = whiteKeyCount * whiteKeyWidth;

            const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
            svg.setAttribute("width", totalWidth);
            svg.setAttribute("height", whiteKeyHeight);
            svg.setAttribute("class", "block select-none");
            wrapper.style.width = `${totalWidth}px`;

            const gWhite = document.createElementNS("http://www.w3.org/2000/svg", "g");
            const gBlack = document.createElementNS("http://www.w3.org/2000/svg", "g");
            const gLabels = document.createElementNS("http://www.w3.org/2000/svg", "g");
            
            svg.appendChild(gWhite);
            svg.appendChild(gLabels);
            svg.appendChild(gBlack);

            let currentX = 0;

            for (let m = startMidi; m < endMidi; m++) {
                const noteIndex = m % 12;
                const isWhite = [0, 2, 4, 5, 7, 9, 11].includes(noteIndex);
                
                if (isWhite) {
                    const rect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
                    rect.setAttribute("x", currentX);
                    rect.setAttribute("y", 0);
                    rect.setAttribute("width", whiteKeyWidth);
                    rect.setAttribute("height", whiteKeyHeight);
                    rect.setAttribute("class", "key-white cursor-pointer");
                    rect.setAttribute("id", `key-${m}`);
                    rect.setAttribute("rx", 4); 
                    
                    addPianoKeyInteraction(rect, m);
                    gWhite.appendChild(rect);

                    if (noteIndex === 0) {
                        const octave = (m / 12) - 1;
                        const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
                        text.textContent = `C${octave}`;
                        text.setAttribute("x", currentX + (whiteKeyWidth/2));
                        text.setAttribute("y", whiteKeyHeight - 10);
                        text.setAttribute("text-anchor", "middle");
                        text.setAttribute("fill", "#94a3b8");
                        text.setAttribute("font-size", "14");
                        text.setAttribute("font-weight", "bold");
                        text.setAttribute("pointer-events", "none");
                        gLabels.appendChild(text);
                    }
                    currentX += whiteKeyWidth;
                } else {
                    const bX = currentX - (blackKeyWidth / 2);
                    const rect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
                    rect.setAttribute("x", bX);
                    rect.setAttribute("y", 0);
                    rect.setAttribute("width", blackKeyWidth);
                    rect.setAttribute("height", blackKeyHeight);
                    rect.setAttribute("class", "key-black cursor-pointer");
                    rect.setAttribute("id", `key-${m}`);
                    rect.setAttribute("rx", 2);
                    addPianoKeyInteraction(rect, m);
                    gBlack.appendChild(rect);
                }
            }
            wrapper.appendChild(svg);

            const startScrollMidi = STATE.config.rangeMin;
            let offsetKeys = 0;
             for(let m=startMidi; m<startScrollMidi; m++) {
                if([0,2,4,5,7,9,11].includes(m%12)) offsetKeys++;
            }
            const scrollX = offsetKeys * whiteKeyWidth;
            const container = document.getElementById('input-piano-container');
            setTimeout(() => {
                container.scrollLeft = Math.max(0, scrollX - 50);
            }, 100);
        }

        function addPianoKeyInteraction(rect, midi) {
            rect.addEventListener('click', (e) => {
                e.preventDefault();
                rect.classList.add('active');
                setTimeout(() => rect.classList.remove('active'), 150);
                handleInput(midi, 'midi');
            });
        }
    </script>
